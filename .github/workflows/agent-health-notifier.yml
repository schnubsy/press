# Agent health notifier — the WATCHER OF THE WATCHER (arc marquee-wings-monitor, slice 4).
#
# Primary alerting is server-side now: pg_cron fires the `agent-watch` Edge Function every 15 minutes; it reads
# press_agent_monitor_public (status from REAL work against each agent's schedule, all apps) and sends a
# Pushover push + Gmail email on every state change. This hourly-ish workflow is the INDEPENDENT check on that
# watcher (GitHub's scheduler drifts — that is fine for a secondary check). It runs
# .github/scripts/agent-health-check.mjs, which:
#   * FAILS the run (GitHub emails the owner — that failure email IS the notification) when the status service is
#     unreachable, when agent-watch has not run for > 45 minutes, or when the watcher saw a problem but could not
#     deliver the alert (push and email both failed);
#   * passes, listing late/failed agents the watcher ALREADY alerted on as ::warning:: lines — so a known problem
#     does not email you again every hour;
#   * with the manual input `strict: true`, fails on ANY late/failed enabled agent.
# agent-watch records each run of this workflow (public GitHub API) as the "Watcher of the watcher" row on the
# Agent Monitor page, so a silently-disabled schedule shows up there too.
#
# ── SETUP (unchanged) ─────────────────────────────────────────────────────────────────────────────────────────
#   Repository secret SUPABASE_PRESS_ANON_KEY = the press project's publishable (sb_publishable_…) key. Never a
#   service-role key. Optional AGENT_HEALTH_HEARTBEAT_URL = a healthchecks.io ping URL (dead-man's switch).
# Cost: $0 — <1-minute runs against the free Actions allowance (public repo).

name: Agent health notifier

on:
  schedule:
    - cron: "17 * * * *"   # hourly at :17 UTC (GitHub may start it late; secondary check)
  workflow_dispatch:
    inputs:
      strict:
        description: "Fail on ANY late/failed enabled agent (not only a stale watcher / undelivered alert)."
        required: false
        default: "false"

concurrency:
  group: agent-health-notifier
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the check script
        uses: actions/checkout@v4

      - name: Check the agent watcher + all apps (fails → GitHub emails the owner)
        env:
          SUPABASE_PRESS_ANON_KEY: ${{ secrets.SUPABASE_PRESS_ANON_KEY }}
          STRICT: ${{ github.event.inputs.strict || 'false' }}
        run: node .github/scripts/agent-health-check.mjs

      - name: Dead-man's-switch heartbeat (only on a healthy run, only if armed)
        if: ${{ success() }}
        env:
          HEARTBEAT_URL: ${{ secrets.AGENT_HEALTH_HEARTBEAT_URL }}
        run: |
          if [ -n "${HEARTBEAT_URL}" ]; then
            curl -sS -o /dev/null --max-time 15 --retry 3 "${HEARTBEAT_URL}" && echo "heartbeat sent"
          else
            echo "AGENT_HEALTH_HEARTBEAT_URL not set — heartbeat skipped (optional dead-man's switch)."
          fi
