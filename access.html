<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark"><title>press — Access admin</title>
<!--
  The Family Wing access-admin page (docs/access-framework.md §6). It lives in the Private Wing:
  it is listed in spaces.json.personal, so the marquee keeps it out of the public lobby and its
  card only appears once Mark has unlocked the wing with his passkey. Its WRITES are protected by
  RLS `is_admin` — only Mark's own Supabase session can change anything; a non-admin session reads
  and writes nothing (the gate is courtesy, RLS is the lock, §2).

  It loads its own repo's ONE copy of family-gate.js (admin OTP sign-in) and src/gate.js (the
  wing passkey vault) by relative path (no vendoring, no inline drift — this is a press page beside
  src/, not a vendored tenant). Two belts now cover it: a per-page passkey overlay gates a direct
  GET on an enrolled browser (session-presence, since access.html has no keyring credential of its
  own — see the belt note by enter()), and its WRITES stay protected by is_admin RLS regardless.
-->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --stage:#0d1420; --raised:#131d2c; --panel:rgba(201,162,109,.055);
  --brass:#c9a26d; --brass-dim:rgba(201,162,109,.28); --brass-faint:rgba(201,162,109,.14);
  --ink:#eae4d6; --muted:#7d8a9c; --faint:#5d6a7b;
  --paid:#7fae86; --rejected:#c2686e; --asked:#c9a26d;
  --sans:Outfit,system-ui,-apple-system,'Segoe UI',sans-serif;
  --weave:repeating-linear-gradient(48deg,rgba(201,162,109,.05) 0 1px,transparent 1px 9px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--stage);color:var(--ink);font:400 14.5px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0;background:var(--weave);pointer-events:none;z-index:0;opacity:.85}
.app{position:relative;z-index:1;max-width:430px;margin:0 auto;min-height:100vh;padding:20px 18px 60px}
@media(min-width:900px){.app{max-width:880px;padding:32px 40px 60px}}
a.back{display:inline-block;margin-bottom:14px;font:400 12px/1 var(--sans);color:var(--muted);text-decoration:none;border-bottom:1px solid var(--brass-faint)}
.wing{display:flex;align-items:center;gap:9px;font:400 9.5px/1 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--brass);margin-bottom:16px}
.wing:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--brass)}
.hd{padding-bottom:12px;border-bottom:3px double var(--brass-dim)}
.hd .r{display:flex;justify-content:space-between;align-items:baseline}
.hd .who{font:600 22px/1 var(--sans);letter-spacing:-.01em}
.hd .mo{font:400 10px/1 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--brass)}
.hd .sub{font:400 11px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin-top:7px}
.zone{margin-top:26px}
.zone-hd{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--brass-dim);padding-bottom:8px}
.zone-hd h2{margin:0;font:500 11px/1 var(--sans);letter-spacing:.26em;text-transform:uppercase;color:var(--ink)}
.zone-hd .tt{font:600 14px/1 var(--sans);color:var(--ink)}
.zone-hd .tt em{font-style:normal;font-weight:400;color:var(--faint);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.note{font:400 11.5px/1.6 var(--sans);color:var(--faint)}
.grid{width:100%;border-collapse:collapse;margin-top:8px}
.grid th,.grid td{padding:13px 8px;border-bottom:1px dotted var(--brass-faint);text-align:center}
.grid th:first-child,.grid td:first-child{text-align:left;padding-left:0}
.grid thead th{font:400 9.5px/1.35 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);vertical-align:bottom;border-bottom:1px solid var(--brass-dim)}
.grid td.p b{display:block;font:400 15px/1.3 var(--sans)}
.grid td.p em{display:block;font-style:normal;font:400 11px/1.3 var(--sans);color:var(--faint);margin-top:3px}
.sw2{display:inline-block;width:38px;height:21px;border-radius:3px;background:rgba(255,255,255,.07);border:1px solid var(--brass-faint);position:relative;cursor:pointer;vertical-align:middle}
.sw2:after{content:"";position:absolute;top:3px;left:3px;width:14px;height:13px;border-radius:2px;background:var(--faint);transition:left .15s}
.sw2.on{background:rgba(201,162,109,.28);border-color:var(--brass)}
.sw2.on:after{left:19px;background:var(--brass)}
.sw2.busy{opacity:.5;cursor:progress}
.arow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px dotted var(--brass-faint)}
.arow .nm{flex:1;min-width:0}
.arow .nm b{font-weight:400;font-size:15px}
.arow .nm em{display:block;font-style:normal;font-size:11.5px;color:var(--faint);margin-top:3px}
.lock{font:500 9px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--brass);border:1px solid var(--brass-dim);border-radius:2px;padding:5px 7px;white-space:nowrap}
label{display:block;text-align:left;font:400 10px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px 2px}
input{width:100%;min-height:46px;background:rgba(13,20,32,.6);border:1px solid var(--brass-dim);border-radius:8px;padding:11px 13px;color:var(--ink);font-size:16px;font-family:inherit}
input:focus{outline:2px solid var(--brass);outline-offset:1px}
.btn{display:block;width:100%;margin-top:14px;padding:14px;border-radius:8px;border:1px solid var(--brass);background:var(--brass);color:#1a1205;font:600 13.5px/1 var(--sans);letter-spacing:.04em;cursor:pointer}
.btn.ghost{background:transparent;color:var(--brass)}
.btn[disabled]{opacity:.6;cursor:progress}
.msg{font-size:12.5px;margin-top:12px;min-height:1em;color:var(--ink)}
.msg.err{color:var(--rejected)}
.msg.ok{color:var(--paid)}
.center{max-width:400px;margin:8vh auto 0;text-align:center}
.center .fg-icon svg{width:44px;height:44px;stroke:var(--brass);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;margin-bottom:12px}
.center h1{font:600 20px/1.2 var(--sans);margin:0 0 8px}
.center p{font:400 13px/1.55 var(--sans);color:var(--muted);margin:0 auto 16px;max-width:320px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.85em;color:var(--brass)}
.linkrow{display:flex;gap:8px;margin-top:12px}
.linkrow input{font-size:13px}
</style></head><body>
<main class="app" id="app"><div class="center"><p>Loading…</p></div></main>

<script src="src/gate.js"></script>
<script src="src/family-gate.js"></script>
<script>
/* eslint-disable */
(function(){
  'use strict';
  var G = window.FamilyGate;
  var app = document.getElementById('app');
  var REST = G.REST, KEY = G.SUPA_KEY;
  var GATED_BY_SPACES = [];   // pages gated by spaces.json.family (can't be un-gated here)

  function esc(s){ return G.escapeHtml(s); }
  function h(html){ app.innerHTML = html; }
  function headers(extra){ return Object.assign({}, G.authHeaders(), extra||{}); }

  async function rest(path, opts){
    var r = await fetch(REST + path, Object.assign({ headers: headers((opts&&opts.headers)||{}) }, opts||{}));
    if(!r.ok){ var e = new Error('rest '+r.status); e.status=r.status; try{ e.body=await r.json(); }catch(_){} throw e; }
    var t = await r.text(); return t ? JSON.parse(t) : null;
  }
  async function isAdmin(){
    var r = await fetch(REST + '/rpc/press_access_is_admin', { method:'POST', headers: headers({'Content-Type':'application/json'}), body:'{}' });
    if(!r.ok) return false; try{ return (await r.json())===true; }catch(_){ return false; }
  }

  // ── sign-in (admin's own Supabase session; RLS enforces is_admin on every write) ──
  function renderSignIn(note){
    h('<div class="center"><div class="fg-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><polyline points="3 7 12 13 21 7"/></svg></div>'+
      '<h1>Access admin</h1><p>Sign in with your admin email to manage who can open which tool.</p>'+
      '<form id="ef"><label for="em">Admin email</label><input id="em" type="email" inputmode="email" autocomplete="email" autofocus placeholder="you@example.com">'+
      '<button class="btn" id="send" type="submit">Send me a code</button></form>'+
      '<form id="cf" hidden><label for="cd">6-digit code</label><input id="cd" type="text" inputmode="numeric" maxlength="6" placeholder="••••••" style="letter-spacing:.4em;text-align:center">'+
      '<button class="btn" id="ver" type="submit">Verify &amp; sign in</button></form>'+
      '<div class="msg '+(note&&note.cls||'')+'" id="m">'+(note&&note.text||'')+'</div>'+
      '<a class="back" href="index.html?view=personal" style="margin-top:16px">← the private wing</a></div>');
    var ef=document.getElementById('ef'), cf=document.getElementById('cf'), m=document.getElementById('m'), email='';
    ef.addEventListener('submit', async function(e){ e.preventDefault();
      email=(document.getElementById('em').value||'').trim().toLowerCase();
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ m.className='msg err'; m.textContent='Enter a valid email.'; return; }
      document.getElementById('send').disabled=true; m.className='msg'; m.textContent='Sending…';
      try{ await G.sendCode(email); ef.hidden=true; cf.hidden=false; m.textContent='Code sent to '+email+'. Enter it above.'; document.getElementById('cd').focus(); }
      catch(_){ document.getElementById('send').disabled=false; m.className='msg err'; m.textContent='Couldn’t reach the mail service.'; }
    });
    cf.addEventListener('submit', async function(e){ e.preventDefault();
      var code=(document.getElementById('cd').value||'').trim();
      if(!/^\d{6}$/.test(code)){ m.className='msg err'; m.textContent='The code is 6 digits.'; return; }
      document.getElementById('ver').disabled=true; m.className='msg'; m.textContent='Signing in…';
      var s; try{ s=await G.verifyCode(email, code); }catch(_){ s=null; }
      if(!s){ document.getElementById('ver').disabled=false; m.className='msg err'; m.textContent='That didn’t work — check the code.'; return; }
      G.saveSession(s); boot();
    });
  }

  async function boot(){
    var s = await G.ensureFresh();
    if(!s){ renderSignIn(); return; }
    var admin=false; try{ admin=await isAdmin(); }catch(_){ admin=false; }
    if(!admin){ renderSignIn({cls:'err', text:'That address is not an admin. Ask Mark to set is_admin.'}); return; }
    loadAdmin(s);
  }

  async function loadAdmin(session){
    h('<div class="center"><p>Loading the access grid…</p></div>');
    var people, apps, grants, pages, spaces;
    try{
      people = await rest('/press_access_people?select=email,name,is_admin,active,last_seen_at&order=is_admin.desc,name.asc');
      apps   = await rest('/press_access_apps?select=page,label,gated');
      grants = await rest('/press_access_grants?select=email,page,active');
    }catch(e){
      if(e.status===404 || (e.body&&/relation|does not exist/i.test(e.body.message||''))){
        h('<div class="center"><h1>Not applied yet</h1><p>The <code>press_access_*</code> tables aren’t in the database yet. Have Cowork apply <code>db/20260921_press_access.sql</code> via the Supabase connector, then reload.</p><button class="btn ghost" onclick="location.reload()">Reload</button></div>');
        return;
      }
      h('<div class="center"><h1>Couldn’t load</h1><p>'+esc((e.body&&e.body.message)||e.message)+'</p><button class="btn ghost" onclick="location.reload()">Reload</button></div>');
      return;
    }
    try{ spaces = await (await fetch('spaces.json')).json(); }catch(_){ spaces={}; }
    try{ pages = await (await fetch('pages.json')).json(); }catch(_){ pages={}; }
    GATED_BY_SPACES = Array.isArray(spaces.family) ? spaces.family : [];

    render(session, people||[], apps||[], grants||[], pages||{});
  }

  function titleFor(page, pages){ return (pages[page]&&pages[page].title) || page.replace(/\.html$/,''); }
  function gatedPages(apps, pages){
    // the union of spaces.family and any app flagged gated — these are the columns of the grid
    var set = {}; GATED_BY_SPACES.forEach(function(p){ set[p]=true; });
    apps.forEach(function(a){ if(a.gated) set[a.page]=true; });
    return Object.keys(set).sort();
  }
  function grantOn(grants, email, page){
    var g = grants.find(function(x){ return x.email===email && x.page===page; });
    return !!(g && g.active);
  }
  function lastSeen(ts){
    if(!ts) return 'never signed in';
    var d=(Date.now()-new Date(ts).getTime())/86400000;
    if(d<1) return 'last in today'; if(d<2) return 'last in yesterday';
    return 'last in '+Math.floor(d)+' days ago';
  }

  function render(session, people, apps, grants, pages){
    var cols = gatedPages(apps, pages);
    var head = '<a class="back" href="index.html?view=personal">← the private wing</a>'+
      '<div class="wing">Private wing · admin</div>'+
      '<div class="hd"><div class="r"><span class="who">Access</span><span class="mo">'+people.length+' '+(people.length===1?'person':'people')+'</span></div>'+
      '<div class="sub">Who can open which tool</div></div>';

    // 1) the grid
    var grid = '<section class="zone"><div class="zone-hd"><h2>Who gets what</h2><span class="tt"><em>tap to grant or revoke</em></span></div>';
    if(!cols.length){ grid += '<p class="note" style="margin-top:10px">No gated tools yet. Gate one below and it becomes a column here.</p>'; }
    else{
      grid += '<table class="grid"><thead><tr><th>Person</th>'+cols.map(function(p){ return '<th>'+esc(titleFor(p,pages))+'</th>'; }).join('')+'</tr></thead><tbody>';
      grid += people.map(function(pn){
        var cells = cols.map(function(pg){
          var on = grantOn(grants, pn.email, pg);
          return '<td><i class="sw2'+(on?' on':'')+'" role="switch" aria-checked="'+on+'" tabindex="0" data-grant="'+esc(pn.email)+'|'+esc(pg)+'"></i></td>';
        }).join('');
        return '<tr><td class="p"><b>'+esc(pn.name||pn.email)+'</b><em>'+(pn.is_admin?'admin · ':'')+esc(lastSeen(pn.last_seen_at))+'</em></td>'+cells+'</tr>';
      }).join('');
      grid += '</tbody></table>';
    }
    grid += '</section>';

    // 2) gate an app — every page in pages.json with a switch
    var allPages = Object.keys(pages).sort();
    var appMap = {}; apps.forEach(function(a){ appMap[a.page]=a; });
    var gate = '<section class="zone"><div class="zone-hd"><h2>Which tools are gated</h2></div>';
    gate += allPages.map(function(pg){
      var bySpaces = GATED_BY_SPACES.indexOf(pg)!==-1;
      var on = bySpaces || !!(appMap[pg]&&appMap[pg].gated);
      var sub = bySpaces ? 'Family Wing — set in spaces.json' : (on ? 'gated' : 'public');
      var ctrl = bySpaces ? '<span class="lock">locked on</span>'
        : '<i class="sw2'+(on?' on':'')+'" role="switch" aria-checked="'+on+'" tabindex="0" data-app="'+esc(pg)+'"></i>';
      return '<div class="arow"><span class="nm"><b>'+esc(titleFor(pg,pages))+'</b><em>'+esc(sub)+'</em></span>'+ctrl+'</div>';
    }).join('');
    gate += '<p class="note" style="margin-top:12px">Tools set in <code>spaces.json</code> can’t be un-gated here — the two sources only ever add protection, never remove it.</p></section>';

    // 3) add someone
    var add = '<section class="zone"><div class="zone-hd"><h2>Add someone</h2></div>'+
      '<label for="an">Name</label><input id="an" type="text" placeholder="Their name">'+
      '<label for="ae">Email</label><input id="ae" type="email" inputmode="email" placeholder="them@example.com">'+
      '<p class="note" style="margin-top:10px">Adding them lets that address request a code. Nothing is emailed from here — you’ll get a link to send them however you like.</p>'+
      '<button class="btn ghost" id="addBtn">Add &amp; get their link</button>'+
      '<div class="msg" id="addMsg"></div><div id="linkWrap"></div></section>';

    h(head + grid + gate + add);
    wire(session, people, apps, grants, pages);
  }

  function wire(session, people, apps, grants, pages){
    // grid: grant / revoke — upsert a row {email,page,active}
    Array.prototype.forEach.call(document.querySelectorAll('[data-grant]'), function(sw){
      var toggle = async function(){
        if(sw.classList.contains('busy')) return;
        var parts = sw.getAttribute('data-grant').split('|'), email=parts[0], page=parts[1];
        var next = !sw.classList.contains('on');
        sw.classList.add('busy');
        try{
          await rest('/press_access_grants?on_conflict=email,page', { method:'POST',
            headers:{'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},
            body: JSON.stringify({ email:email, page:page, active:next, revoked_at: next?null:new Date().toISOString() }) });
          sw.classList.toggle('on', next); sw.setAttribute('aria-checked', next);
        }catch(e){ /* leave state unchanged on failure */ }
        sw.classList.remove('busy');
      };
      sw.addEventListener('click', toggle);
      sw.addEventListener('keydown', function(e){ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); toggle(); } });
    });

    // gate an app — upsert {page,gated,label}
    Array.prototype.forEach.call(document.querySelectorAll('[data-app]'), function(sw){
      var toggle = async function(){
        if(sw.classList.contains('busy')) return;
        var page = sw.getAttribute('data-app'), next=!sw.classList.contains('on');
        sw.classList.add('busy');
        try{
          await rest('/press_access_apps?on_conflict=page', { method:'POST',
            headers:{'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},
            body: JSON.stringify({ page:page, gated:next, label: titleFor(page,pages) }) });
          sw.classList.toggle('on', next); sw.setAttribute('aria-checked', next);
        }catch(e){}
        sw.classList.remove('busy');
      };
      sw.addEventListener('click', toggle);
      sw.addEventListener('keydown', function(e){ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); toggle(); } });
    });

    // add a person
    var addBtn = document.getElementById('addBtn');
    if(addBtn) addBtn.addEventListener('click', async function(){
      var name=(document.getElementById('an').value||'').trim();
      var email=(document.getElementById('ae').value||'').trim().toLowerCase();
      var m=document.getElementById('addMsg');
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ m.className='msg err'; m.textContent='Enter a valid email.'; return; }
      addBtn.disabled=true; m.className='msg'; m.textContent='Adding…';
      try{
        await rest('/press_access_people?on_conflict=email', { method:'POST',
          headers:{'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},
          body: JSON.stringify({ email:email, name:name||null, active:true }) });
        m.className='msg ok'; m.textContent=(name||email)+' added. Send them the link below.';
        var url = location.origin + location.pathname.replace(/access\.html$/, '') ;
        var link = url + 'index.html?view=family';
        document.getElementById('linkWrap').innerHTML =
          '<div class="linkrow"><input id="lk" readonly value="'+esc(link)+'"><button class="btn ghost" id="cp" style="margin:0;width:auto;white-space:nowrap">Copy</button></div>';
        document.getElementById('cp').addEventListener('click', function(){ var i=document.getElementById('lk'); i.select(); try{ document.execCommand('copy'); this.textContent='Copied'; }catch(_){}});
      }catch(e){ m.className='msg err'; m.textContent=(e.body&&e.body.message)||'Couldn’t add — are you signed in as an admin?'; }
      addBtn.disabled=false;
    });
  }

  // ── private-wing passkey belt (defense-in-depth over the admin OTP + is_admin RLS) ──
  // access.html has no data store, so it holds no keyring credential and cannot use
  // PressGate.guard() — credsFor('access.html') never resolves, so a successful unlock would
  // still stick on "No credentials stored for this tool yet". Instead gate on the presence of an
  // unlocked wing SESSION: on an ENROLLED browser with no live session, require the passkey before
  // the admin sign-in is shown at all. A never-enrolled / public browser is unchanged (the OTP +
  // is_admin RLS stay the real lock). src/gate.js is loaded, never modified.
  function wingLocked(){
    try{
      if(!(window.PressVault && PressVault.everEnrolled && PressVault.everEnrolled())) return false; // no passkey set up → no belt
      return !(PressVault.loadSession && PressVault.loadSession());                                   // enrolled but no live session → locked
    }catch(_){ return false; }
  }
  function renderWingGate(note){
    h('<div class="center"><div class="fg-icon"><svg viewBox="0 0 24 24" aria-hidden="true">'+
      '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>'+
      '<h1>Private wing</h1><p>Unlock with your passkey to open the access admin.</p>'+
      '<button class="btn" id="pk" type="button">Unlock with your passkey</button>'+
      '<div class="msg '+((note&&note.cls)||'')+'" id="m">'+((note&&note.text)||'')+'</div>'+
      '<a class="back" href="index.html?view=personal" style="margin-top:16px">← the private wing</a></div>');
    document.getElementById('pk').addEventListener('click', async function(){
      var b=this, m=document.getElementById('m'); b.disabled=true; m.className='msg'; m.textContent='Waiting for your passkey…';
      try{ await PressVault.unlock(); enter(); }
      catch(e){ b.disabled=false; m.className='msg err'; m.textContent=(e&&e.message)||'Could not unlock — try again.'; }
    });
  }
  // If the wing session is later lost (Lock now / another tab / 8h expiry), fall back to the gate.
  try{ if(window.addEventListener) window.addEventListener('storage', function(ev){
    if(ev && ev.key && window.PressVault && ev.key !== PressVault.SESSION_KEY) return;
    if(wingLocked()) renderWingGate();
  }); }catch(_){}

  function enter(){ if(wingLocked()){ renderWingGate(); return; } boot(); }

  enter();
})();
</script>
</body></html>
