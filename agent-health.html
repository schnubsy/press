<style>
/* ============================================================================
   PRESS — AGENT MONITOR · Twilight Cut house style (matches index.html / giving.html)
   Every agent, AI function, scheduled job and scheduled task Mark relies on, as one status dot,
   grouped by the app it supports. Click a dot for the detail. Status is computed SERVER-SIDE
   (press_agent_monitor_public) from REAL work against the expected schedule — never from a
   `skipped` tick, and never from anything this page decides. Read-only for everyone; the Retry
   button appears only for the marquee admin (agent-fix re-checks that on the server).
   ============================================================================ */
:root{
  --tw-stage:#100C1E; --tw-ink:#EDE7F2; --tw-violet:#8E7BE8; --tw-rose:#E7A6C7;
  --tw-muted:#9E97AE; --tw-faint:#6a6478; --tw-icon:#B7A8FF;
  --tw-dusk-1:#151029; --tw-dusk-2:#100C1E; --tw-dusk-3:#0E0A18;
  --tw-stage-gradient:linear-gradient(165deg,var(--tw-dusk-1),var(--tw-dusk-2) 55%,var(--tw-dusk-3));
  --tw-glass-card:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.03));
  --tw-border-card:rgba(255,255,255,.10); --tw-hairline:rgba(255,255,255,.07);
  --tw-font-display:'Unbounded','Inter',system-ui,sans-serif;
  --tw-font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --tw-font-meta:'Space Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --tw-radius-card:22px; --tw-radius-pill:100px; --tw-blur-card:16px;
  --tw-shadow-card:0 10px 34px rgba(10,7,22,.5),inset 0 1px 0 rgba(255,255,255,.12);
  --tw-eyebrow:10px; --tw-track-eyebrow:.16em;
  --tw-grad-title:linear-gradient(92deg,#B7A8FF,#E7A6C7);
  --ok:#57C79A; --ok-glow:rgba(87,199,154,.5);
  --warn:#E0A93B; --warn-glow:rgba(224,169,59,.5);
  --bad:#E5606B; --bad-glow:rgba(229,96,107,.5);
  --off:#5b5568;
  --tw-aurora-field:radial-gradient(520px 340px at 30% -8%,rgba(142,123,232,.4),transparent 62%),
                    radial-gradient(440px 320px at 92% 20%,rgba(231,166,199,.2),transparent 60%),
                    radial-gradient(380px 300px at 12% 68%,rgba(142,123,232,.14),transparent 65%),
                    radial-gradient(420px 340px at 78% 84%,rgba(231,166,199,.12),transparent 65%);
}
@keyframes twBreath{0%{opacity:.5;transform:translateY(0)}100%{opacity:.72;transform:translateY(-2%)}}
@keyframes twShimmer{100%{transform:translateX(100%)}}
@keyframes twPulse{0%,100%{opacity:.55}50%{opacity:1}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body.tw-page{background:var(--tw-stage-gradient);color:var(--tw-ink);font-family:var(--tw-font-body);
  -webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden;min-height:100vh}
.tw-aurora{position:fixed;inset:-20%;z-index:0;pointer-events:none;opacity:.6;
  background:var(--tw-aurora-field);animation:twBreath 32s ease-in-out infinite alternate}
.tw-in{position:relative;z-index:3;max-width:720px;margin:0 auto;padding:26px 18px 48px}
@media(min-width:700px){.tw-in{padding:34px 28px 56px}}
.tw-back{display:inline-flex;align-items:center;gap:7px;font-family:var(--tw-font-meta);font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--tw-violet);border:1px solid rgba(142,123,232,.4);
  padding:6px 12px;border-radius:var(--tw-radius-pill);text-decoration:none;margin-bottom:16px}
.tw-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11.5px;color:var(--tw-muted)}
.tw-top b{color:var(--tw-ink);font-weight:600;letter-spacing:.02em}
h1.tw-title{font-family:var(--tw-font-display);font-weight:500;font-size:clamp(24px,6.5vw,31px);line-height:1.2;
  margin:14px 0 6px;background:var(--tw-grad-title);-webkit-background-clip:text;background-clip:text;color:transparent}
.tw-dek{font-size:13px;color:var(--tw-muted);max-width:480px;margin-bottom:18px;line-height:1.5}
.glass{border:1px solid var(--tw-border-card);background:var(--tw-glass-card);border-radius:var(--tw-radius-card);
  backdrop-filter:blur(var(--tw-blur-card));-webkit-backdrop-filter:blur(var(--tw-blur-card));box-shadow:var(--tw-shadow-card)}

/* ── summary strip ─────────────────────────────────────────────────────────── */
.summary{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:12px}
@media(min-width:620px){.summary{grid-template-columns:1.6fr 1fr 1fr}}
.verdict{padding:18px 18px;display:flex;align-items:center;gap:14px}
.verdict .dot{width:16px;height:16px;border-radius:50%;flex:none}
.verdict h2{font-family:var(--tw-font-display);font-weight:500;font-size:clamp(17px,4.8vw,21px);line-height:1.2}
.verdict p{font-size:12px;color:var(--tw-muted);margin-top:4px}
.verdict.green{border-color:rgba(87,199,154,.4)} .verdict.green .dot{background:var(--ok);box-shadow:0 0 16px 3px var(--ok-glow)} .verdict.green h2{color:#8be0bd}
.verdict.amber{border-color:rgba(224,169,59,.42)} .verdict.amber .dot{background:var(--warn);box-shadow:0 0 16px 3px var(--warn-glow)} .verdict.amber h2{color:#f0c877}
.verdict.red{border-color:rgba(229,96,107,.45)} .verdict.red .dot{background:var(--bad);box-shadow:0 0 16px 3px var(--bad-glow)} .verdict.red h2{color:#f08a92}
.verdict.grey .dot{background:var(--off)}
.costs{display:contents}
@media(max-width:619px){.costs{display:grid;grid-template-columns:1fr 1fr;gap:10px}}
.tile{padding:14px 16px}
.tile .lbl{font-size:var(--tw-eyebrow);letter-spacing:.12em;text-transform:uppercase;color:var(--tw-faint)}
.tile .val{font-family:var(--tw-font-meta);font-size:19px;margin-top:6px;color:var(--tw-ink)}
.tile .sub{font-size:10.5px;color:var(--tw-faint);margin-top:3px}

.ctrl{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 6px;flex-wrap:wrap}
.ctrl .stamp{font-family:var(--tw-font-meta);font-size:10.5px;color:var(--tw-faint)}
.chip{font-family:var(--tw-font-meta);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;
  border-radius:var(--tw-radius-pill);border:1px solid rgba(87,199,154,.4);color:#8be0bd}
.refresh{cursor:pointer;font-family:var(--tw-font-meta);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--tw-violet);border:1px solid rgba(142,123,232,.4);padding:7px 14px;border-radius:var(--tw-radius-pill);
  background:rgba(142,123,232,.08);display:inline-flex;align-items:center;gap:7px}
.refresh:hover{border-color:var(--tw-violet);background:rgba(142,123,232,.16)}
.refresh[aria-busy="true"]{opacity:.6;pointer-events:none}
.refresh svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ── app groups + agent dots ───────────────────────────────────────────────── */
.app{margin-top:22px}
.app-head{display:flex;align-items:center;gap:10px;margin:0 4px 10px}
.app-head h2{font-family:var(--tw-font-display);font-weight:500;font-size:clamp(15px,4vw,18px);
  background:var(--tw-grad-title);-webkit-background-clip:text;background-clip:text;color:transparent}
.app-head .count{font-family:var(--tw-font-meta);font-size:10px;color:var(--tw-faint);margin-left:auto}
.list{padding:4px 0;overflow:hidden}
.agent + .agent{border-top:1px solid var(--tw-hairline)}
.row{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;cursor:pointer;min-height:48px}
.row:focus-visible{outline:2px solid var(--tw-violet);outline-offset:-2px;border-radius:12px}
.row .name{font-size:14.5px;font-weight:600;color:var(--tw-ink)}
.row .line{font-size:12px;color:var(--tw-muted);margin-top:2px;line-height:1.35}
.row .line.warn{color:#f0c877} .row .line.bad{color:#f08a92}
.row .txt{flex:1;min-width:0}
.row .chev{width:14px;height:14px;flex:none;stroke:var(--tw-faint);fill:none;stroke-width:2;transition:transform .2s}
.agent.open .chev{transform:rotate(90deg)}
.sdot{width:12px;height:12px;border-radius:50%;flex:none}
.sdot.ok{background:var(--ok);box-shadow:0 0 10px 2px var(--ok-glow)}
.sdot.warn{background:var(--warn);box-shadow:0 0 10px 2px var(--warn-glow)}
.sdot.bad{background:var(--bad);box-shadow:0 0 10px 2px var(--bad-glow);animation:twPulse 2s ease-in-out infinite}
.sdot.none{background:transparent;border:2px solid var(--tw-faint)}
.sdot.off{background:var(--off)}

/* ── detail (expanded) ─────────────────────────────────────────────────────── */
.detail{padding:2px 16px 18px 40px}
.detail[hidden]{display:none}
.status-line{font-size:13.5px;font-weight:600;margin-bottom:4px}
.status-line.ok{color:#8be0bd} .status-line.warn{color:#f0c877} .status-line.bad{color:#f08a92} .status-line.none,.status-line.off{color:var(--tw-muted)}
.what{font-size:12px;color:var(--tw-muted);margin-bottom:12px;line-height:1.45}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
@media(max-width:440px){.meta{grid-template-columns:1fr}}
.meta .lbl{font-size:var(--tw-eyebrow);letter-spacing:.1em;text-transform:uppercase;color:var(--tw-faint);margin-bottom:3px}
.meta .val{font-size:13px;color:var(--tw-ink);line-height:1.4}
.meta .val.mono{font-family:var(--tw-font-meta);font-size:12px}
.meta .val small{color:var(--tw-muted);font-size:11.5px}
.strip{grid-column:1/-1}
.bars{display:flex;gap:4px;align-items:flex-end;height:40px;margin-top:4px}
.bar{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bar i{display:block;border-radius:3px;width:100%}
.bar i.b-ok{background:linear-gradient(180deg,#6fd6ab,#3f9d78)}
.bar i.b-bad{background:linear-gradient(180deg,#f08a92,#c94651)}
.bar i.b-quiet{background:rgba(142,123,232,.45)}
.bar i.b-empty{background:rgba(255,255,255,.07);height:3px!important}
.bar .d{font-size:8px;color:var(--tw-faint);text-align:center;margin-top:4px;font-family:var(--tw-font-meta)}
.striphint{font-size:10.5px;color:var(--tw-faint);margin-top:6px}
.fix{margin-top:14px;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.45}
.fix.warn{background:rgba(224,169,59,.10);border:1px solid rgba(224,169,59,.3);color:#f0c877}
.fix.bad{background:rgba(229,96,107,.10);border:1px solid rgba(229,96,107,.32);color:#f08a92}
.fix.calm{background:rgba(255,255,255,.04);border:1px solid var(--tw-hairline);color:var(--tw-muted)}
.fix b{color:var(--tw-ink)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.lnk{font-size:12px;color:var(--tw-icon);text-decoration:none;border:1px solid rgba(183,168,255,.3);padding:6px 11px;border-radius:var(--tw-radius-pill)}
.lnk:hover{border-color:var(--tw-icon)}
.retry{cursor:pointer;font:600 12px var(--tw-font-body);color:#100C1E;background:linear-gradient(92deg,#B7A8FF,#E7A6C7);
  border:0;padding:8px 14px;border-radius:var(--tw-radius-pill)}
.retry[disabled]{opacity:.55;cursor:default}
.retry-msg{font-size:12px;color:var(--tw-muted)}

/* ── switched-off section ──────────────────────────────────────────────────── */
details.offsec{margin-top:26px}
details.offsec > summary{cursor:pointer;list-style:none;font-size:var(--tw-eyebrow);letter-spacing:var(--tw-track-eyebrow);
  text-transform:uppercase;color:var(--tw-faint);padding:10px 4px;display:flex;align-items:center;gap:8px}
details.offsec > summary::-webkit-details-marker{display:none}
details.offsec > summary::before{content:'▸';font-size:11px}
details.offsec[open] > summary::before{content:'▾'}
details.offsec .list{opacity:.75}
.offapp{font-family:var(--tw-font-meta);font-size:10px;color:var(--tw-faint);margin-left:6px}

.tw-skel{margin-bottom:12px;border-radius:var(--tw-radius-card);background:var(--tw-glass-card);
  border:1px solid var(--tw-border-card);height:120px;position:relative;overflow:hidden}
.tw-skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);animation:twShimmer 1.8s ease-in-out infinite}
.foot{font-size:10.5px;color:var(--tw-faint);text-align:center;margin-top:26px;line-height:1.6}
@media(prefers-reduced-motion:reduce){.tw-aurora,.tw-skel::after,.sdot{animation:none!important}}
</style>
</head>
<body class="tw-page">
  <div class="tw-aurora"></div>

    <h1 class="tw-title">Agent Monitor</h1>

        <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        Refresh
      </span>
    </div>
    <div id="root"></div>
    <div class="foot" id="foot"></div>
  </div>

<script src="src/agent-monitor.js"></script>
<script>
/* Reads ONLY the two public views (press_agent_monitor_public + press_agent_monitor_daily_public) with the
   publishable key — no secrets, no emails, no prompts. Status is the server's; this script only draws it.
   A fetch failure shows "can't check" — never green. Refreshes on open + the Refresh button; no polling. */
const SB_URL = 'https://eepjhpyziczrxvirczio.supabase.co';
const SB_KEY = 'sb_publishable__iv3bI7xDAsOdHUlXzbVZQ_2yyFS4uX';
const REST = SB_URL + '/rest/v1';
const FIX_URL = SB_URL + '/functions/v1/agent-fix';
const AM = window.AgentMonitor;
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const safeUrl = u => /^https:\/\//.test(String(u || '')) ? u : null;

let ADMIN = null;          // the admin's access token when the Family Wing session belongs to an admin
let ROWS = [], DAILY = {}, OPEN = new Set();

async function getJSON(path){
  const r = await fetch(REST + path, { headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY }, cache: 'no-store' });
  if (!r.ok) throw new Error('press ' + r.status);
  return r.json();
}

/* ── admin session (reuse the Family Wing gate's localStorage session; the SERVER re-checks) ── */
async function detectAdmin(){
  let s = null;
  try { s = AM.readSession(window.localStorage); } catch (e) { s = null; }
  if (!s) return null;
  try {
    if (!AM.sessionFresh(s, Date.now())) {
      const r = await fetch(SB_URL + '/auth/v1/token?grant_type=refresh_token', {
        method: 'POST', headers: { apikey: SB_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: s.refresh_token }) });
      if (!r.ok) return null;
      const t = await r.json();
      if (!t.access_token || !t.refresh_token) return null;
      s = { access_token: t.access_token, refresh_token: t.refresh_token,
            expires_at: t.expires_at ? t.expires_at * 1000 : Date.now() + (t.expires_in || 3600) * 1000,
            email: s.email, name: s.name };
      try { localStorage.setItem(AM.SESSION_KEY, JSON.stringify(s)); } catch (e) {}
    }
    const a = await fetch(REST + '/rpc/press_access_is_admin', { method: 'POST',
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + s.access_token, 'Content-Type': 'application/json' }, body: '{}' });
    if (!a.ok) return null;
    return (await a.json()) === true ? s.access_token : null;
  } catch (e) { return null; }
}

/* ── render ─────────────────────────────────────────────────────────────── */
function lineFor(r, now){
  if (r.status === 'healthy' || r.status === 'off') {
    if (r.last_real_work_at) return 'Last real work ' + AM.ago(r.last_real_work_at, now) + (r.last_output_note ? ' · ' + r.last_output_note : '');
    return r.status_reason;
  }
  if (r.status === 'no-data') return r.status_reason;
  return r.status_reason + (r.last_real_work_at ? ' · last real work ' + AM.ago(r.last_real_work_at, now) : '');
}
function barsHTML(id, now){
  const days = AM.stripDays(now, 14), byDay = DAILY[id] || {};
  const max = Math.max(1, ...days.map(d => (byDay[d.key] ? byDay[d.key].real_n + byDay[d.key].failed_n : 0)));
  let fails = 0, real = 0;
  const bars = days.map(d => {
    const x = byDay[d.key] || { real_n: 0, quiet_n: 0, failed_n: 0 };
    fails += x.failed_n; real += x.real_n;
    let cls, h;
    if (x.failed_n > 0) { cls = 'b-bad'; h = Math.max(30, Math.round((x.real_n + x.failed_n) / max * 100)); }
    else if (x.real_n > 0) { cls = 'b-ok'; h = Math.max(18, Math.round(x.real_n / max * 100)); }
    else if (x.quiet_n > 0) { cls = 'b-quiet'; h = 10; }
    else { cls = 'b-empty'; h = 0; }
    const tip = d.dow + ' ' + d.m + '/' + d.d + ' — ' + x.real_n + ' real, ' + x.quiet_n + ' quiet, ' + x.failed_n + ' failed';
    return `<div class="bar" title="${esc(tip)}"><i class="${cls}" style="height:${h}%"></i><span class="d">${esc(d.dow[0])}</span></div>`;
  }).join('');
  return { html: `<div class="bars">${bars}</div>`, fails, real };
}
function detailHTML(r, now){
  const m = AM.statusMeta(r.status);
  const strip = barsHTML(r.id, now);
  const links = (Array.isArray(r.fix_links) ? r.fix_links : []).filter(l => safeUrl(l && l.url))
    .map(l => `<a class="lnk" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join('');
  const bad = AM.needsFix(r);
  const retry = ADMIN && r.retry_available
    ? `<button class="retry" type="button" data-retry="${esc(r.id)}">${bad ? 'Retry now' : 'Run now'}</button><span class="retry-msg" id="msg-${esc(r.id)}"></span>` : '';
  const fixCls = r.status === 'failed' ? 'bad' : r.status === 'late' ? 'warn' : 'calm';
  const fixLead = bad ? '<b>How to fix:</b> ' : '<b>If it goes wrong:</b> ';
  const fix = (r.fix_hint || links || retry)
    ? `<div class="fix ${fixCls}">${r.fix_hint ? fixLead + esc(r.fix_hint) : ''}<div class="actions">${links}${retry}</div></div>` : '';
  const cost = r.cost_tracked
    ? `<div><div class="lbl">Cost this month</div><div class="val mono">${esc(AM.money(r.cost_mtd))}</div></div>
       <div><div class="lbl">Projected full month</div><div class="val mono">~${esc(AM.money(r.cost_projected))}</div></div>`
    : `<div><div class="lbl">Cost</div><div class="val"><small>No model cost tracked here</small></div></div>`;
  const reason = r.status_reason && r.status_reason !== m.word ? ' — ' + r.status_reason : '';
  return `<div class="status-line ${m.dot}">${esc(m.word)}${esc(reason)}</div>
    <div class="what">${esc(r.what)} <span style="color:var(--tw-faint)">· ${esc(AM.kindText(r.kind))} · ${esc(AM.schedText(r.sched))}</span></div>
    <div class="meta">
      <div><div class="lbl">Last real work</div><div class="val">${r.last_real_work_at ? esc(AM.whenCT(r.last_real_work_at)) + '<br><small>' + esc(AM.ago(r.last_real_work_at, now)) + '</small>' : 'Never yet'}</div></div>
      <div><div class="lbl">What it produced</div><div class="val">${esc(r.last_output_note || '—')}</div></div>
      <div><div class="lbl">Next due</div><div class="val">${esc(r.sched ? AM.dueText(r.next_due_at, now) : 'When it is asked')}</div></div>
      <div><div class="lbl">Last failure</div><div class="val">${r.last_failed_at ? esc(AM.whenCT(r.last_failed_at)) : 'None seen'}</div></div>
      ${cost}
      <div class="strip"><div class="lbl">Last 14 days (Central time)</div>${strip.html}
        <div class="striphint">${strip.real} real run${strip.real === 1 ? '' : 's'} · ${strip.fails} failed · faint = checked in with nothing to do</div></div>
    </div>${fix}`;
}
function agentHTML(r, now, showApp){
  const m = AM.statusMeta(r.status);
  const open = OPEN.has(r.id);
  const lineCls = r.status === 'failed' ? 'bad' : r.status === 'late' ? 'warn' : '';
  return `<div class="agent${open ? ' open' : ''}" id="a-${esc(r.id)}" data-status="${esc(r.status)}">
    <button class="row" type="button" aria-expanded="${open}" aria-controls="d-${esc(r.id)}" data-toggle="${esc(r.id)}">
      <span class="sdot ${m.dot}" role="img" aria-label="${esc(m.word)}"></span>
      <span class="txt"><span class="name">${esc(r.label)}</span>${showApp ? `<span class="offapp">${esc(r.app_label)}</span>` : ''}
        <span class="line ${lineCls}" style="display:block">${esc(lineFor(r, now))}</span></span>
      <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 6 15 12 9 18"/></svg>
    </button>
    <div class="detail" id="d-${esc(r.id)}" ${open ? '' : 'hidden'}>${open ? detailHTML(r, now) : ''}</div>
  </div>`;
}
function summaryHTML(now){
  const v = AM.overallVerdict(ROWS);
  const tracked = ROWS.filter(r => r.cost_tracked);
  const mtd = tracked.reduce((a, r) => a + (Number(r.cost_mtd) || 0), 0);
  const dailyTotals = {};
  for (const id in DAILY) for (const k in DAILY[id]) dailyTotals[k] = (dailyTotals[k] || 0) + (Number(DAILY[id][k].cost_usd) || 0);
  const p = AM.projectMonth(mtd, dailyTotals, now);
  return `<div class="summary">
    <div class="glass verdict ${v.cls}" id="verdict"><span class="dot"></span><div><h2>${esc(v.title)}</h2><p>${esc(v.sub)}</p></div></div>
    <div class="costs">
      <div class="glass tile"><div class="lbl">AI cost this month</div><div class="val" id="cost-mtd">${esc(AM.money(p.mtd))}</div><div class="sub">Central-time month to date</div></div>
      <div class="glass tile"><div class="lbl">Projected month</div><div class="val" id="cost-proj">~${esc(AM.money(p.projected))}</div><div class="sub">+ last 7 days’ average × ${p.remaining.toFixed(1)} days left</div></div>
    </div></div>`;
}
function render(){
  const now = Date.now();
  const { groups, off } = AM.groupByApp(ROWS);
  document.getElementById('summary').innerHTML = summaryHTML(now);
  let html = '';
  for (const g of groups) {
    const n = g.items.length, bad = g.items.filter(AM.needsFix).length;
    html += `<section class="app" data-app="${esc(g.app)}"><div class="app-head"><span class="sdot ${AM.statusMeta(g.worst).dot}"></span><h2>${esc(g.app)}</h2>
      <span class="count">${bad ? bad + ' of ' + n + ' need attention' : n + (n === 1 ? ' item' : ' items')}</span></div>
      <div class="glass list">${g.items.map(r => agentHTML(r, now, false)).join('')}</div></section>`;
  }
  if (off.length) {
    html += `<details class="offsec" id="offsec"><summary>Switched off (${off.length})</summary>
      <div class="glass list">${off.map(r => agentHTML(r, now, true)).join('')}</div></details>`;
  }
  if (!groups.length && !off.length) html = `<div class="glass verdict grey"><span class="dot"></span><div><h2>Nothing registered yet</h2><p>Agents appear here once they have a row in press_agent_expect.</p></div></div>`;
  document.getElementById('root').innerHTML = html;
  const on = ROWS.filter(r => r.status !== 'off').length;
  document.getElementById('scope').textContent = on + ' watched · ' + groups.length + ' apps';
}
function toggle(id){
  if (OPEN.has(id)) OPEN.delete(id); else OPEN.add(id);
  const r = ROWS.find(x => x.id === id); const el = document.getElementById('a-' + id);
  if (!r || !el) return;
  const open = OPEN.has(id), d = el.querySelector('.detail');
  el.classList.toggle('open', open);
  el.querySelector('.row').setAttribute('aria-expanded', String(open));
  d.innerHTML = open ? detailHTML(r, Date.now()) : '';
  d.hidden = !open;
}
async function retry(id, btn){
  const msg = document.getElementById('msg-' + id);
  btn.disabled = true; if (msg) msg.textContent = 'Running…';
  try {
    const r = await fetch(FIX_URL, { method: 'POST',
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + ADMIN, 'Content-Type': 'application/json' },
      body: JSON.stringify({ agent: id }) });
    const j = await r.json().catch(() => ({}));
    if (msg) msg.textContent = r.ok ? (j.result || 'Done') + ' — refreshing shortly' : (j.error || ('Failed (' + r.status + ')'));
    if (r.ok) setTimeout(load, 4000);
  } catch (e) { if (msg) msg.textContent = 'Could not reach the fix service.'; }
}
document.getElementById('root').addEventListener('click', e => {
  const t = e.target.closest('[data-toggle]'); if (t) { toggle(t.getAttribute('data-toggle')); return; }
  const b = e.target.closest('[data-retry]'); if (b && !b.disabled) retry(b.getAttribute('data-retry'), b);
});

function showError(){
  document.getElementById('summary').innerHTML = '';
  document.getElementById('root').innerHTML = `<div class="glass verdict grey"><span class="dot"></span><div><h2>Can’t check the agents right now</h2>
    <p>The status service didn’t answer. This page shows nothing rather than a false all-clear — try Refresh in a moment.</p></div></div>`;
  document.getElementById('scope').textContent = 'unavailable';
}
async function load(){
  const btn = document.getElementById('refresh');
  btn.setAttribute('aria-busy', 'true');
  if (!ROWS.length) document.getElementById('root').innerHTML = '<div class="tw-skel"></div><div class="tw-skel"></div><div class="tw-skel"></div>';
  try {
    const [rows, daily, admin] = await Promise.all([
      getJSON('/press_agent_monitor_public?select=*&order=sort.asc'),
      getJSON('/press_agent_monitor_daily_public?select=id,day,real_n,quiet_n,failed_n,cost_usd'),
      ADMIN === null ? detectAdmin() : Promise.resolve(ADMIN)
    ]);
    if (!Array.isArray(rows)) throw new Error('shape');
    ROWS = rows; DAILY = {};
    for (const d of (daily || [])) (DAILY[d.id] = DAILY[d.id] || {})[d.day] = d;
    ADMIN = admin || null;
    const h = decodeURIComponent((location.hash || '').slice(1));
    if (h && ROWS.some(r => r.id === h)) OPEN.add(h);
    render();
    document.getElementById('admin').innerHTML = ADMIN ? '<span class="chip">Admin · fixes on</span>' : '';
    document.getElementById('stamp').textContent = 'checked ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    document.getElementById('foot').textContent = 'Status is decided on the server from real work against each schedule (a “nothing to do” tick never counts). A watcher checks every 15 minutes and pushes + emails Mark when something changes; a GitHub Action watches the watcher.';
    if (h && OPEN.has(h)) { const el = document.getElementById('a-' + h); if (el) el.scrollIntoView({ block: 'center' }); }
  } catch (e) {
    showError();
    document.getElementById('stamp').textContent = '';
  } finally {
    btn.setAttribute('aria-busy', 'false');
  }
}
const rb = document.getElementById('refresh');
rb.addEventListener('click', load);
rb.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); load(); } });
load();
</script>
</body>
</html>
