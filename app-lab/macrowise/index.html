<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B4F57">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Macrowise</title>
  <meta name="page-title" content="Macrowise">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <script type="module" crossorigin src="./assets/index-BrDTQxPP.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CoWiAX2C.css">
</head>
<body>
  <main id="app">
    <header class="top">
      <h1><button id="place" class="place" aria-haspopup="dialog" aria-controls="picker"><span id="placeLead"></span> <strong id="placeName">Finding where you are…</strong> <span aria-hidden="true">▾</span></button></h1>
      <p id="noMenu" class="no-menu" hidden>Menu coming in the next arc — showing sample orders</p>
      <p id="source" class="source"></p>
      <p id="notice" class="notice" role="status" hidden></p>
      <pre id="received" class="received" hidden></pre>
      <section id="left" class="left" aria-live="polite" aria-label="Remaining today"></section>
    </header>
    <ol id="list" class="list" aria-label="Orders, best golden ratio first"></ol>
  </main>
  <dialog id="picker" class="picker" aria-labelledby="pickerTitle">
    <div class="sheet-head">
      <h2 id="pickerTitle">Where are you eating?</h2>
      <button id="pickerDone" class="done" type="button">Done</button>
    </div>
    <p id="nearMsg" class="msg" role="status"></p>
    <ul id="nearList" class="rows" aria-label="Nearest restaurants"></ul>
    <label class="search-label" for="search">Search to plan ahead</label>
    <input id="search" class="search" type="search" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" placeholder="Restaurant name">
    <p id="searchMsg" class="msg" role="status"></p>
    <ul id="searchList" class="rows" aria-label="Search results"></ul>
  </dialog>
  <p id="toast" class="toast" role="status" hidden></p>
  <nav class="dock" aria-label="Log"><a id="logIt" class="log-it" href="#" hidden>Log it to MacroFactor</a></nav>
</body>
</html>
