<meta name="description" content="Personal gift-card deal monitor — alerts only on the deals that beat your rules.">
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --ink:#161a22; --muted:#5b6470; --line:#e3e6ea;
    --accentA:#149b6b; --accentB:#b07d2a; --hit:#0f7a4d; --near:#8a6d1f; --danger:#b3261e;
    --chip:#eef1f4; --shadow:0 1px 2px rgba(16,20,30,.06),0 2px 8px rgba(16,20,30,.05);
    --band:rgba(20,155,107,.08); /* Slice 5: subtle accent band behind each section heading */
    /* Slice 6 (Eye P0): badge PILL text must clear WCAG 4.5:1 on its pale tint in light mode — the
       verdict-at-a-glance signal. Darker than --hit/--near (which stay for dots/labels on plain bg). */
    --badge-hit-fg:#0f5c34; --badge-near-fg:#6b4e12;
    --tap:44px;
    /* live-measured sticky offsets (JS: --stick = header height; --stick2 = Rules search bar) so
       jump-to-category anchors land BELOW the sticky stack, not buried under it. Seeded generously. */
    --stick:150px; --stick2:0px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1216; --card:#171b21; --ink:#eef1f5; --muted:#9aa4b1; --line:#272d36;
      --chip:#20262e; --shadow:0 1px 2px rgba(0,0,0,.4);
      --band:rgba(79,195,138,.12); /* Slice 5: accent band, dark token */
      /* Slice 6: in dark mode the tint is dark, so the BRIGHT accent text is the high-contrast choice. */
      --badge-hit-fg:#4fc38a; --badge-near-fg:#e0bd8f;
      --accentA:#4fc38a; --accentB:#e0bd8f; --hit:#4fc38a; --near:#e0bd8f;
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding-bottom:calc(env(safe-area-inset-bottom) + 8px);
  }
  header{
    position:sticky;top:0;z-index:20;background:var(--bg);
    padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:10px}
  .brand h1{font-size:20px;margin:0;letter-spacing:-.02em}
  .brand .logo{width:26px;height:26px;flex:0 0 auto}
  #sync{margin-left:auto;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--chip);color:var(--muted)}
  /* Slice 4 (Eye P1): the Synced/Saved state is a FILLED green pill (its own tinted background),
     distinct from the app's plain accent text; badge-hit-fg over the .18 tint clears WCAG 4.5:1 in
     both themes (light 5.90:1, dark 7.28:1 — verified by blending, docs/evidence/truthup-slice-4). */
  #sync.ok{color:var(--badge-hit-fg);background:rgba(15,122,77,.18)}
  #sync.err{color:var(--danger)} #sync.busy{color:var(--accentB)} #sync.locked{color:var(--muted)}
  /* back chip to the marquee's Private Wing */
  .tw-back{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;padding:6px 10px 6px 4px;margin-bottom:2px}
  .tw-back:hover{color:var(--ink)}
  nav{display:flex;gap:6px;margin-top:10px}
  nav button{
    flex:1;min-height:var(--tap);border:1px solid var(--line);background:var(--card);color:var(--muted);
    border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;
  }
  nav button[aria-selected="true"]{color:#fff;background:linear-gradient(135deg,var(--accentA),var(--accentB));border-color:transparent}
  main{max-width:640px;margin:0 auto;padding:14px 16px}
  section[hidden]{display:none}
  /* quick nav — a horizontally scrollable chip row, one per visible group */
  /* Slice 6 (fixes arc): nav-style JUMP buttons — a CSS grid of N equal (1fr) columns that spans the
     content column edge-to-edge (first button left == column left, last button right == column right).
     Distinct from the Feed filter pills: squared 10px radius, card background, accent label, a trailing
     ↓, a subtle shadow. Labels ellipsize (min-width:0) so N buttons never cause horizontal scroll; the
     count is always kept. --qn-cols is set inline per container = number of groups. */
  .quicknav{display:flex;flex-wrap:wrap;gap:8px;
    padding:4px 0 8px;margin:0;scroll-margin-top:calc(var(--stick) + var(--stick2) + 16px)}
  .quicknav:empty{display:none}
  /* Each button flexes to an equal share; on a wide screen all N sit in ONE full-width row. On a
     phone they wrap to 2 across so the category word stays legible (Eye P0), and a lone last item
     flex-grows to fill the row so the grid still spans the column edge-to-edge on odd counts. */
  .qchip{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;min-height:40px;
    text-decoration:none;font-size:13px;font-weight:600;color:var(--accentA);
    background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px 10px}
  @media (max-width:480px){ .qchip{flex:1 1 calc(50% - 4px)} } /* 2-across on the phone — full labels fit */
  .qchip:hover{border-color:var(--accentA)}
  .qchip:focus-visible{outline:2px solid var(--accentA);outline-offset:2px}
  .qlabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .qcount{flex:0 0 auto;color:var(--muted);font-weight:700}
  .qdown{flex:0 0 auto;color:var(--accentA);font-weight:700}
  /* consistent section heading — full-width rule above, count, and a Top link */
  /* Slice 5: a subtle full-width accent band behind each heading; 48px gap from the previous section.
     scroll-margin-top is unchanged so every jump still lands the heading below the sticky stack. */
  .grouphead{display:flex;align-items:baseline;gap:10px;background:var(--band);border-radius:12px;
    padding:10px 14px;margin:48px 0 14px;scroll-margin-top:calc(var(--stick) + var(--stick2) + 16px)}
  .grouphead:first-child{margin-top:8px}
  .grouphead h2{font-size:24px;font-weight:800;letter-spacing:-.015em;margin:0;flex:1;min-width:0}
  .grouphead .gcount{display:inline-block;font-size:14px;font-weight:600;color:var(--muted);background:var(--chip);border-radius:999px;padding:1px 9px;margin-left:6px;vertical-align:middle}
  .grouphead .toplink{font-size:13px;font-weight:600;color:var(--accentA);text-decoration:none;flex:0 0 auto}
  /* rules search */
  .searchbar{display:flex;gap:8px;position:sticky;top:var(--stick);z-index:5;
    background:var(--bg);padding:8px 0 6px}
  .searchbar input{flex:1;min-height:44px}
  .searchbar .btn{min-height:44px}
  /* per-rule controls: the % and min-denomination steppers, stacked on narrow screens */
  .ctrls{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}
  .ctrl{display:flex;align-items:center;gap:10px}
  .ctrl-lab{font-size:13px;color:var(--muted);font-weight:600}
  /* plain-English alerts summary */
  .summary{background:linear-gradient(135deg,rgba(20,155,107,.10),rgba(176,125,42,.08));border:1px solid var(--line)}
  .summary p{margin:0;font-size:15px;line-height:1.5}
  /* locked feed panel */
  .locked{display:flex;flex-direction:column;align-items:center;gap:10px}
  .locked .locktitle{font-size:18px;font-weight:700;color:var(--ink)}
  .locked p{margin:0;max-width:34ch}
  .field select{flex:0 0 auto}
  .helper{font-size:13px;color:var(--muted);margin:2px 2px 0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:10px}
  .card.coming{opacity:.6;background:var(--chip)} /* Slice 9: a "Coming soon" source is visibly inert */
  .sw[disabled]{cursor:not-allowed;opacity:.5}
  .row{display:flex;align-items:center;gap:10px}
  .row .grow{flex:1;min-width:0}
  .title{font-weight:600}
  .sub{font-size:13px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--chip);color:var(--muted);margin-right:5px}
  .badge.hit{background:rgba(15,122,77,.18);color:var(--badge-hit-fg)}
  .badge.near{background:rgba(138,109,31,.22);color:var(--badge-near-fg)}
  .badge.warn{background:rgba(179,38,30,.12);color:var(--danger)}
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:#9aa4b1}
  .dot.ok{background:var(--hit)} .dot.err{background:var(--danger)} .dot.blocked{background:#c58a1e}
  /* Slice 4 (Eye P1): the alerted marker is a HOLLOW hairline ring, not a filled dot, so it never
     reads as a live/status dot (which are solid fills). Carries a tooltip + aria-label "Alerted". */
  .dot.alerted{box-sizing:border-box;background:transparent;border:1.5px solid var(--hit);box-shadow:none;margin-right:6px}
  /* toggle — 52x44 hit area (iOS min), pill drawn 48x28 centred */
  .sw{position:relative;width:52px;height:44px;flex:0 0 auto;border:none;background:transparent;cursor:pointer;padding:0}
  .sw::before{content:"";position:absolute;top:50%;left:0;transform:translateY(-50%);width:48px;height:28px;border-radius:999px;background:#c7ccd3;transition:background .15s}
  .sw[aria-pressed="true"]::before{background:linear-gradient(135deg,var(--accentA),var(--accentB))}
  .sw::after{content:"";position:absolute;top:50%;left:3px;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
  .sw[aria-pressed="true"]::after{transform:translate(20px,-50%)}
  .stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .stepper button{width:44px;height:44px;border:none;background:var(--card);color:var(--ink);font-size:20px;cursor:pointer}
  .stepper output{min-width:52px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
  .btn{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;cursor:pointer}
  .btn.primary{background:linear-gradient(135deg,var(--accentA),var(--accentB));color:#fff;border-color:transparent}
  .btn.small{min-height:40px;padding:0 14px;font-size:14px}
  a.deal{color:var(--accentA);text-decoration:none;font-weight:600}
  a.deal:focus-visible,button:focus-visible,.sw:focus-visible,input:focus-visible{outline:3px solid var(--accentB);outline-offset:2px}
  .field{display:flex;align-items:center;gap:10px;margin:8px 0}
  .field label{flex:1}
  input[type=time],input[type=text],select{min-height:38px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:0 10px;font-size:15px}
  .empty{color:var(--muted);text-align:center;padding:26px 10px}
  .addrow{display:flex;gap:8px;margin-top:6px}
  .addrow input{flex:1}
  footer{max-width:640px;margin:6px auto 0;padding:14px 16px 24px;color:var(--muted);font-size:13px;text-align:center}
  footer a{color:var(--accentA)}
  /* feed filter bar — one compact row (When / Type / Sort / Search) + a status line */
  .feedbar{margin:2px 0 8px}
  .ftoolbar{display:flex;align-items:center;gap:8px;min-height:44px}
  .ftrigs{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
  .ftoolbar[data-searching="true"] .ftrigs{display:none}
  .fsearch{display:none;align-items:center;gap:8px;flex:1;min-width:0}
  .ftoolbar[data-searching="true"] .fsearch{display:flex}
  .fpop-wrap{position:relative;flex:0 1 auto;min-width:0}
  .ftrig{display:inline-flex;align-items:center;gap:6px;min-height:40px;max-width:100%;padding:0 11px;border-radius:999px;
    border:1px solid var(--line);background:var(--chip);color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
  .ftrig .ftrig-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .ftrig .caret{opacity:.6;font-size:11px;flex:0 0 auto}
  .ftrig.active{color:#fff;background:linear-gradient(135deg,var(--accentA),var(--accentB));border-color:transparent}
  .ftrig.active .caret{opacity:.9}
  .fgrow{flex:1;min-width:0}
  .fsearch-btn{flex:0 0 auto;min-width:40px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;
    border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer;font-size:15px}
  .fsearch-btn.active{color:#fff;background:linear-gradient(135deg,var(--accentA),var(--accentB));border-color:transparent}
  .fsearch input{flex:1;min-width:0;min-height:40px}
  .fsearch .fx{flex:0 0 auto;min-width:40px;min-height:40px;border-radius:999px;border:1px solid var(--line);
    background:var(--chip);color:var(--ink);cursor:pointer;font-size:15px}
  /* popover anchored under its trigger — one open at a time */
  .fpop{position:absolute;top:calc(100% + 6px);left:0;z-index:30;min-width:184px;max-width:calc(100vw - 32px);
    background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:6px;display:none}
  .fpop.rt{left:auto;right:0}
  .fpop[data-open="true"]{display:block}
  .fitem{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 12px;border:none;border-radius:8px;
    background:transparent;color:var(--ink);font-size:14px;font-weight:600;cursor:pointer;text-align:left}
  .fitem:hover,.fitem:focus-visible{background:var(--chip)}
  .fitem .fcheck{width:18px;flex:0 0 auto;text-align:center;color:var(--accentA)}
  .fitem .fcount{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
  .fitem[aria-checked="true"]{color:var(--accentA)}
  .fitem.zero{opacity:.45}
  .fpop .fdone{margin-top:4px;width:100%;min-height:40px;border-radius:8px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);font-weight:600;cursor:pointer}
  /* status line under the toolbar */
  .fstatus{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-top:6px;min-height:20px}
  .fstatus .fgrow{flex:1;min-width:0}
  .fstatus a{color:var(--accentA);text-decoration:none;font-weight:600;cursor:pointer}
  /* generic removable chips (Rules tab: blocked stores + sale-watch terms) */
  .chiprow{display:flex;gap:8px;flex-wrap:wrap}
  .fchip{flex:0 0 auto;font-size:13px;font-weight:600;color:var(--ink);background:var(--chip);border:1px solid var(--line);
    border-radius:999px;padding:8px 12px;white-space:nowrap;min-height:36px;cursor:pointer}
  .fchip:hover{border-color:var(--accentB)}
  .tabbadge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;margin-left:6px;
    border-radius:999px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;vertical-align:middle}
  .tabbadge[hidden]{display:none} /* class display would otherwise override the [hidden] UA rule */
  nav button[aria-selected="true"] .tabbadge{background:#fff;color:var(--accentA)}
  .newtag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.04em;padding:2px 6px;border-radius:999px;background:var(--danger);color:#fff;margin-right:6px}
  /* Slice 4d: sale-watch rows show a per-term status line + last match, one per line. */
  .watchrow{padding:10px 0;border-top:1px solid var(--line)} .watchrow:first-child{border-top:none;padding-top:2px}
  .watchrow .fchip{align-self:flex-start;flex:0 0 auto}
  /* Slice 2 (pushover arc): sale-watch add row — a divider, then [term][compact Min % stepper][Watch]
     on one line; the stepper matches the compact rule-card stepper (44px hit area, ~32px visible via a
     6px transparent inset). On a phone the term takes the full first row; stepper + Watch share row 2. */
  .watch-addrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px;
    border-top:1px solid var(--line);padding-top:12px}
  .watch-addrow .watch-addterm{flex:1 1 160px;min-width:0}
  .watch-addrow .ctrl{gap:6px;flex:0 0 auto}
  .watch-addrow .ctrl-lab{font-size:11px}
  .watch-addrow .stepper{flex:0 0 auto}
  .watch-addrow .stepper button{padding:6px;background-clip:content-box;font-size:16px} /* 44px hit, ~32 visible */
  .watch-addrow .stepper output{min-width:34px;font-size:13px}
  .watch-addrow #addwatch{flex:0 0 auto}
  @media (max-width:480px){ .watch-addrow .watch-addterm{flex:1 1 100%} } /* term full width; stepper + Watch → row 2 */
  /* per-rule category segmented control (Slice 4) */
  /* Slice 5: rule cards compressed vertically — tighter padding, gaps and the category picker moved
     off the card into a ⋯ overflow menu (was a 4-button row). */
  /* Slice 5 (fixes arc): compact rule cards — brand name is the largest text; both steppers inline on
     ONE row; the stepper buttons keep a 44px hit area (border-box 44px) but READ ~32px via a 6px
     transparent inset (background-clip:content-box). ~1.6× more cards per iPhone screen. */
  #rules-list .card{padding:5px 10px;margin-bottom:5px}
  #rules-list .title{font-size:18px;font-weight:700;line-height:1.1}
  #rules-list .sub{font-size:12px;margin-top:1px}
  #rules-list .ovf{font-size:16px}                 /* smaller than the 18px brand name (largest text) */
  #rules-list .ctrls{margin-top:4px;gap:8px;flex-wrap:nowrap;align-items:center}
  #rules-list .ctrl{flex:1 1 0;min-width:0;gap:5px}
  #rules-list .ctrl-lab{font-size:11px;flex:0 0 auto}
  #rules-list .stepper{flex:1 1 auto;min-width:0}
  #rules-list .stepper button{flex:0 0 44px;padding:6px;background-clip:content-box;font-size:16px} /* 44px hit area, ~32px visible */
  #rules-list .stepper output{flex:1 1 auto;min-width:34px;font-size:13px}
  /* ⋯ overflow menu (Move to…) */
  .rulehead-actions{position:relative;flex:0 0 auto}
  .ovf{width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);
    color:var(--muted);font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .ovf[aria-expanded="true"]{color:var(--ink);border-color:var(--accentA)}

    var p=pct(d); var isHit=d.verdict==="hit"; var bought=d.status==="bought", skip=d.status==="skip";
    var isNew=isUnseen(d); var rt=relTime(d.created_at);
    // Slice 1: the SHOP is a secondary label ("· at Sam's Club"), never the bucket.
    var retailer=d.extras&&d.extras.retailer;
    var covers=d.extras&&d.extras.container_for; // Slice 5: "covers Total Wine"
    var reason=nearReason(d); // Slice 7
    // Slice 2: build the sub from the parts that exist, joined by ' · ' — no leading separator when
    // the price line is empty (an unpriced card).
    var parts=[];
    var pl=priceLine(d); if(pl) parts.push(pl);
    if(retailer) parts.push('at '+esc(retailer));
    if(covers&&covers.length) parts.push('covers '+esc(covers.slice(0,3).join(", ")));
    if(reason) parts.push(esc(reason));
    if(d.source) parts.push(esc(String(d.source).replace(/^src-/,"")));
    if(rt) parts.push(esc(rt));
    if(d.expiry) parts.push('exp '+esc(d.expiry));

    // reads "Price unknown". A hit carries a small subtle alerted dot instead of a HIT label.
    var badgeClass=isHit?"hit":(d.verdict==="near"?"near":"");
    var badgeText=(p!=null?p+"% off":"Price unknown");
    return '<div class="card"><div class="row"><span class="badge '+badgeClass+'">'+esc(badgeText)+'</span>'
      +(isHit?'<span class="dot alerted" role="img" title="Alerted" aria-label="Alerted"></span>':"")
      +'<div class="grow"><div class="title">'+(isNew?'<span class="newtag">NEW</span>':"")+esc(d.brand||"Gift card")+'</div>'
      +'<div class="sub">'+sub+'</div></div></div>'
      +'<div class="row" style="margin-top:10px">'
      +(d.url?'<a class="deal" href="'+esc(d.url)+'" target="_blank" rel="noopener">Open deal &rarr;</a>':'<span class="sub">no link</span>')
      +'<span class="grow"></span>'
      +'<button class="btn small'+(bought?" primary":"")+'" data-buy="'+esc(d.item_id)+'" aria-pressed="'+bought+'">Bought</button> '

      +'</div></div>';
  }

  // ---------- feed filtering / sorting ----------
  var WHEN_OPTS=[["today","Today"],["7d","Last 7 days"],["30d","Last 30 days"]];

  var SORT_OPTS=[["new","Newest"],["old","Oldest"],["discount","Best discount"],["brand","Brand A–Z"]];
  function dateFloorMs(){
    var now=Date.now();
    if(feedDate==="today"){ var d=new Date(); d.setHours(0,0,0,0); return d.getTime(); }
    if(feedDate==="7d")  return now-7*864e5;
    return now-30*864e5; // 30d default (the data window is already 30d)
  }
  function withinWindow(d){ var f=dateFloorMs(); return !(f && dealTime(d)<f); }
  // Slice 2: apostrophe-insensitive brand search — normBrand deletes ' ’ ʼ ` both sides, so
  // "jimmy john's" finds "Jimmy Johns" (and vice-versa).
  function matchesBrand(d){ var q=normBrand(feedBrand); return !q || normBrand(d.brand).indexOf(q)>=0; }
  function typesOnList(){ return Object.keys(feedTypes).filter(function(k){ return feedTypes[k]; }); }
  // Type counts are computed over the date + search filtered set (NOT the type-filtered set), so each
  // option shows how many rows it WOULD add. Unknown groups fall back to "other".
  function typeCounts(){
    var c={restaurant:0,retail:0,retailer:0,other:0};
    (state.deals||[]).forEach(function(d){
      if(!withinWindow(d)||!matchesBrand(d)) return;
      var g=dealGroup(d); if(c[g]==null) g="other"; c[g]++;
    });
    return c;
  }
  function feedFiltered(){
    var on=typesOnList();
    return (state.deals||[]).filter(function(d){
      if(!withinWindow(d)) return false;
      if(on.length && on.indexOf(dealGroup(d))<0) return false;
      if(!matchesBrand(d)) return false;
      return true;
    });
  }
  function sortFeed(list){
    var a=list.slice();
    if(feedSort==="brand")         a.sort(function(x,y){ return String(x.brand||"").localeCompare(String(y.brand||"")); });
    else if(feedSort==="discount") a.sort(function(x,y){ return (pct(y)||0)-(pct(x)||0); });
    else if(feedSort==="old")      a.sort(function(x,y){ return dealTime(x)-dealTime(y); });
    else                           a.sort(function(x,y){ return dealTime(y)-dealTime(x); }); // newest first (default)
    return a;
  }

  function renderFeedList(){

    if(!deals.length){ listEl.innerHTML='<div class="empty">No deals match these filters.</div>'; return; }
    var buckets={}; FEED_GROUPS.forEach(function(g){buckets[g[0]]=[];});
    deals.forEach(function(d){ var g=dealGroup(d); if(!buckets[g]) g="other"; buckets[g].push(d); });
    var groups=[];
    FEED_GROUPS.forEach(function(g){ var l=buckets[g[0]]; if(l.length) groups.push({slug:g[0],label:g[1],count:l.length,list:l}); });

  // ---------- Sources (Slice 9: never show coverage that doesn't exist) ----------
  var SRC_GROUPS=[["feed","Deal feeds"],["direct","Direct retailers"],["marketplace","Marketplaces"]];
  // A cloud source with no group still belongs under "Deal feeds"; everything else defaults to Direct.
  function groupOf(s){ var g=s.extras&&s.extras.group; if(g) return g; return (s.extras&&s.extras.lane==="cloud")?"feed":"direct"; }
  // How long a source may go unchecked before it's overdue, per cadence.
  var CADENCE_WINDOW={ "30m":1.5*3600e3, "3x-day":13*3600e3, "1x-day":30*3600e3, "weekly":8*864e5 };
  function withinCadence(iso,cadence){
    var t=new Date(iso||0).getTime(); if(isNaN(t)||!iso) return false;
    return (Date.now()-t) <= (CADENCE_WINDOW[cadence]||24*3600e3);

  // EXACTLY three states — no "unknown", no green for a source nothing checks.
  //   coming: not wired yet (coming_soon / !lane_ready) → toggle forced OFF.
  //   stale : wired but blocked / errored / overdue / NEVER checked → not green.
  //   live  : wired, healthy, and checked within its cadence.
  function sourceState(s){
    var x=s.extras||{};
    if(x.coming_soon===true || x.lane_ready===false) return "coming";
    if(x.blocked===true || x.health==="error") return "stale";
    if(!x.last_checked) return "stale"; // never checked → never green
    return withinCadence(x.last_checked,x.cadence) ? "live" : "stale";
  }
  function sourceCard(s){
    var x=s.extras||{}; var on=s.status==="on"; var st=sourceState(s);

    var label=st==="live"?"Live":(st==="stale"?"Stale":"Coming soon");
    var lbcls=st==="live"?" hit":(st==="stale"?" warn":"");
    var checked=x.last_checked?("checked "+relTime(x.last_checked)):"Not yet checked";

    var reason=st==="coming" ? (x.dormant_reason||"not wired up yet — can't be turned on")
      : (x.blocked ? "needs the browser lane — "+(x.browser_only_reason||x.last_error||"blocked to a server fetch")
      : (x.health==="error"&&x.last_error ? esc(x.last_error) : ""));
    var disabled=st==="coming";
    return '<div class="card'+(st==="coming"?" coming":"")+'"><div class="row">'
      +'<span class="dot '+dot+'" title="'+esc(label)+'"></span>'
      +'<div class="grow"><div class="title">'+esc(s.title)+' <span class="badge'+lbcls+'">'+label+'</span></div>'

  // ---------- Rules ----------
  var RULE_GROUPS=[["restaurant","Restaurants"],["retail","Retail"],["other","Other"],["retailer","Warehouse / retailer"]];
  function groupLabel(g){ for(var i=0;i<RULE_GROUPS.length;i++) if(RULE_GROUPS[i][0]===g) return RULE_GROUPS[i][1]; return "Other"; }
  // Auto-categorize a typed brand (Slice 4): a keyword + known-brand table maps a name to
  // restaurant | retail | other. Defaults to 'other' ONLY when nothing matches (and the UI says so).
  var RESTAURANT_KW=["grill","grille","pizza","taco","coffee","cafe","bbq","barbecue","kitchen","diner",
    "burger","bistro","deli","donut","doughnut","bakery","steak","steakhouse","wings","sushi","noodle",
    "ramen","cantina","tavern","eatery","roadhouse","creamery","pretzel","smoothie","juice","chicken",
    "seafood","pub","brewhouse","waffle","pancake","bagel","cream","pizzeria","taqueria","grillhouse"];
  var RETAIL_KW=["hardware","apparel","clothing","beauty","cosmetics","home","market","depot","outfitters",
    "supply","furniture","mattress","electronics","hobby","craft","toys","shoes","jewelry","jewellery",
    "pharmacy","grocery","outlet","goods","boutique","threads","sporting","fashion","cellar"];
  var KNOWN_BRAND={

    "starbucks":"restaurant","dunkin":"restaurant","sonic":"restaurant","subway":"restaurant","ihop":"restaurant",
    "olive garden":"restaurant","texas roadhouse":"restaurant","red robin":"restaurant","cold stone":"restaurant",
    "sephora":"retail","ulta":"retail","nordstrom":"retail","lululemon":"retail","gap":"retail","wayfair":"retail",
    "total wine":"retail","home depot":"retail","lowes":"retail","ace hardware":"retail","woodcraft":"retail"
  };
  function categorizeBrand(name){
    var n=normBrand(name); if(!n) return "other";
    if(KNOWN_BRAND[n]) return KNOWN_BRAND[n];
    var toks=n.split(" ");
    for(var i=0;i<toks.length;i++){ if(RESTAURANT_KW.indexOf(toks[i])>=0) return "restaurant"; }
    for(var j=0;j<toks.length;j++){ if(RETAIL_KW.indexOf(toks[j])>=0) return "retail"; }
    return "other";
  }
  // Slice 5: the category picker moved off the card into a ⋯ overflow menu ("Move to…"). The menu is

  // Slice 3: the three seed stack/bonus rules are protected — no Delete item (they anchor the

  var PROTECTED_RULES={ "rule-costco-stack":1, "rule-sams-club-stack":1, "rule-heb":1 };
  function overflowMenu(r){
    var cur=(r.extras&&r.extras.group)||"other";

  function fmtClock(hhmm){
    var m=/^(\d{1,2}):(\d{2})$/.exec(hhmm||""); if(!m) return hhmm||"";
    var h=+m[1], mm=+m[2];
    if(h===12&&mm===0) return "noon";
    if(h===0&&mm===0) return "midnight";
    var ap=h<12?"am":"pm", h12=h%12; if(h12===0) h12=12;
    return h12+(mm?(":"+(mm<10?"0":"")+mm):"")+ap;
  }
  function cadencePhrase(fc){

  }

  // ---------- interactions ----------
  function setSwitch(btn,on){ btn.setAttribute("aria-checked",on); btn.setAttribute("aria-pressed",on); }
  document.addEventListener("click", function(ev){
    var b=ev.target.closest("button, a"); if(!b) return;
    // Slice 5: the ⋯ overflow menu (Move to…) — toggle; any other button click closes open menus.
    var ovf=b.getAttribute("data-ovf"); if(ovf){ toggleOverflowMenu(ovf,b); return; }
    if(!b.closest(".ovfmenu")) closeOverflowMenus();
    // tabs — opening the Feed tab is Mark "looking", so it clears the NEW badge (Slice 2).
    if(b.getAttribute("role")==="tab"){ selectTab(b.id); if(b.id==="tab-feed") markFeedSeen(); return; }
    // ---- feed filter bar (When / Type / Sort / Search + status links) ----
    if(b.classList.contains("ftrig")){ toggleFeedPopover(b); return; }
    if(b.classList.contains("fitem")){ pickFeedItem(b); return; }
    if(b.id==="type-done"){ closeFeedPopovers(); var tdt=el("type-trig"); if(tdt) tdt.focus(); return; }
    if(b.id==="feed-search-btn"){ openFeedSearch(); return; }
    if(b.id==="feed-search-close"){ closeFeedSearch(); return; }
    if(b.id==="feed-clear"){ clearFeedFilters(); return; }
    if(b.id==="feed-markseen"){ markFeedSeen(); return; }
    // source toggle — a "Coming soon" source is forced off and cannot be enabled (Slice 9).
    var sid=b.getAttribute("data-src");
    if(sid){ var s=find(state.sources,sid); if(!s||sourceState(s)==="coming") return; var on=s.status!=="on"; s.status=on?"on":"off"; setSwitch(b,on); withSave(patchTask(sid,{status:s.status,updated_at:new Date().toISOString()})); return; }
    // rule toggle
    var rid=b.getAttribute("data-rule");
    if(rid){ var r=find(state.rules,rid); var on2=r.status!=="on"; r.status=on2?"on":"off"; setSwitch(b,on2); withSave(patchTask(rid,{status:r.status,updated_at:new Date().toISOString()})); return; }
    // % stepper
    var inc=b.getAttribute("data-inc"), dec=b.getAttribute("data-dec");
    if(inc||dec){ stepRule(inc||dec, inc?5:-5, b); return; }
    // min-denomination stepper
    var dinc=b.getAttribute("data-dinc"), ddec=b.getAttribute("data-ddec");
    if(dinc||ddec){ stepDenom(dinc||ddec, dinc?5:-5, b); return; }
    // rules search clear
    if(b.id==="ruleclear"){ ruleQuery=""; var ri=el("rulesearch"); if(ri){ ri.value=""; ri.focus(); } renderRulesList(); return; }
    // alert toggle — re-render the summary so it reflects the change live
    var tg=b.getAttribute("data-toggle");
    if(tg){ var on3=state.toggles[tg]!==true; state.toggles[tg]=on3; setSwitch(b,on3); withSave(upsertState(tg,on3)); renderAlerts(); return; }
    // bought / skip
    var buy=b.getAttribute("data-buy"), skip=b.getAttribute("data-skip");
    if(buy||skip){ markDeal(buy||skip, buy?"bought":"skip", b); return; }
    // add brand
    if(b.id==="addbrand"){ addBrand(); return; }
    // blocked stores (Slice 3)
    if(b.id==="addblock"){ addBlock(); return; }
    var ub=b.getAttribute("data-unblock"); if(ub){ removeBlock(ub); return; }
    // recategorize a rule (Slice 4)
    var grp=b.getAttribute("data-grp"); if(grp){ setRuleGroup(grp,b.getAttribute("data-grpval")); return; }
    // delete a rule (Slice 3): ⋯ → "Delete rule…" swaps the menu to an inline confirm.
    var del=b.getAttribute("data-del"); if(del){ showDeleteConfirm(del); return; }
    var delok=b.getAttribute("data-delok"); if(delok){ deleteRule(delok); return; }
    var delcancel=b.getAttribute("data-delcancel"); if(delcancel){ cancelDeleteConfirm(delcancel); return; }
    // sale watch (Slice 6)
    if(b.id==="addwatch"){ addWatch(); return; }
    var uw=b.getAttribute("data-unwatch"); if(uw){ removeWatch(uw); return; }
    // Slice 4: per-watch + add-row Min % off steppers
    var winc=b.getAttribute("data-winc"), wdec=b.getAttribute("data-wdec");
    if(winc||wdec){ stepWatch(winc||wdec, winc?5:-5, b); return; }
    if(b.hasAttribute("data-wnewinc")||b.hasAttribute("data-wnewdec")){ stepNewWatch(b.hasAttribute("data-wnewinc")?5:-5, b); return; }
    // Slice 1: send test push
    if(b.id==="send-test-push"){ sendTestPush(b); return; }
  });
  // Slice 1: POST {action:'test_push'} to the Edge Function, gated on the page's sync_id (x-plan-id).
  // Shows the REAL Pushover outcome inline; never sends or displays a Pushover credential.
  function sendTestPush(btn){
    var sid=planId(); var out=el("test-push-result");
    if(!sid){ if(out) out.textContent="Unlock the page first, then try again."; return; }
    if(out) out.textContent=""; btn.disabled=true; var prev=btn.textContent; btn.textContent="Sending…";
    fetch(SUPA+"/functions/v1/"+PAGE, {
      method:"POST",
      headers:{ "content-type":"application/json", "apikey":KEY, "x-plan-id":sid },
      body: JSON.stringify({ action:"test_push" })
    }).then(function(r){ return r.json().catch(function(){return {};}).then(function(j){ return {status:r.status, j:j||{}}; }); })
      .then(function(res){
        var j=res.j;
        if(res.status===200 && j.ok===true){ out.textContent="Sent ✓ (Pushover). If your phone stays silent, open the Pushover app and check notifications are allowed."; }
        else if(res.status===200 && j.ok===false){ out.textContent="Pushover didn’t deliver"+(j.status?" (HTTP "+j.status+")":"")+" — not sent."; }
        else if(res.status===429){ out.textContent="Please wait "+(j.retry_after_s||60)+"s between test pushes."; }
        else if(res.status===401){ out.textContent="Not authorized — unlock the page and try again."; }
        else if(res.status===500){ out.textContent="Pushover not set up yet."; }
        else { out.textContent="Couldn’t send a test push (error "+res.status+")."; }
      })
      .catch(function(){ if(out) out.textContent="Couldn’t reach the server — check your connection."; })
      .then(function(){ btn.disabled=false; btn.textContent=prev; });
  }
  // Slice 5: ⋯ overflow-menu plumbing (open/close, outside-click, keyboard nav).
  function closeOverflowMenus(exceptId){
    var btns=document.querySelectorAll(".ovf[aria-expanded='true']");
    for(var i=0;i<btns.length;i++){
      var id=btns[i].getAttribute("data-ovf");
      if(exceptId&&id===exceptId) continue;
      btns[i].setAttribute("aria-expanded","false");
      var m=el("ovfmenu-"+id); if(m) m.hidden=true;
    }
  }
  function toggleOverflowMenu(id,btn){
    var m=el("ovfmenu-"+id); if(!m) return;
    var open=btn.getAttribute("aria-expanded")==="true";
    closeOverflowMenus(id);
    if(open){ btn.setAttribute("aria-expanded","false"); m.hidden=true; }
    else{ btn.setAttribute("aria-expanded","true"); m.hidden=false;
      var first=m.querySelector("button[role='menuitemradio']"); if(first) first.focus(); }
  }
  document.addEventListener("click", function(ev){
    // isConnected guard: an in-menu action (e.g. Slice 3 "Delete rule…" swapping the menu to a
    // confirm) detaches ev.target; a detached node must NOT count as an outside click and close it.
    var t=ev.target;
    if(t && t.isConnected && !t.closest(".rulehead-actions")) closeOverflowMenus();
  });
  document.addEventListener("keydown", function(ev){
    var menu=ev.target.closest&&ev.target.closest(".ovfmenu"); if(!menu) return;
    var id=menu.id.replace("ovfmenu-","");
    var btn=document.querySelector(".ovf[data-ovf='"+id+"']");
    if(ev.key==="Escape"){ closeOverflowMenus(); if(btn) btn.focus(); ev.preventDefault(); return; }
    if(ev.key==="ArrowDown"||ev.key==="ArrowUp"){
      var items=[].slice.call(menu.querySelectorAll("button[role='menuitemradio']"));
      var i=items.indexOf(ev.target); if(i<0){ if(items[0]) items[0].focus(); ev.preventDefault(); return; }
      var n=ev.key==="ArrowDown"?(i+1)%items.length:(i-1+items.length)%items.length;
      items[n].focus(); ev.preventDefault();
    }
  });
  document.addEventListener("change", function(ev){
    var f=ev.target.getAttribute && ev.target.getAttribute("data-set");
    if(!f) return;
    state.settings[f]=ev.target.value;
    withSave(patchTask("settings",{extras:state.settings,updated_at:new Date().toISOString()}));
    // every data-set control lives on the Alerts tab; re-render so the summary stays in sync, and
    // refresh the footer so a Feed-frequency change is reflected in its "checked …" line immediately.
    renderAlerts(); renderFooter();
  });
  document.addEventListener("input", function(ev){
    if(ev.target && ev.target.id==="rulesearch"){ ruleQuery=ev.target.value||""; renderRulesList(); }
    // feed brand search: re-render only the list + status so the input keeps focus (badge unaffected).
    else if(ev.target && ev.target.id==="feedbrand"){ feedBrand=ev.target.value||""; renderFeedList(); syncFilterUI(); }
  });

  function find(list,id){ for(var i=0;i<list.length;i++) if(list[i].item_id===id) return list[i]; return null; }
  function stepRule(id,delta,btn){
    var r=find(state.rules,id); r.extras=r.extras||{}; var v=Math.max(0,Math.min(90,(Number(r.extras.min_pct)||0)+delta));
    r.extras.min_pct=v; var out=btn.parentNode.querySelector("output"); if(out) out.textContent=v+"%";
    withSave(patchTask(id,{extras:r.extras,updated_at:new Date().toISOString()}));
  }
  // Minimum card value stepper: $5 steps, floor $0 ("Any"), ceiling $500. Writes extras.min_denom.
  function stepDenom(id,delta,btn){
    var r=find(state.rules,id); r.extras=r.extras||{};
    var v=Math.max(0,Math.min(500,denomVal(r.extras)+delta));
    r.extras.min_denom=v; var out=btn.parentNode.querySelector("output"); if(out) out.textContent=(v<=0?"Any":"$"+v);
    withSave(patchTask(id,{extras:r.extras,updated_at:new Date().toISOString()}));
  }
  function markDeal(id,status,btn){
    var d=find(state.deals,id); var was=d.status===status; d.status=was?"judged":status;
    // reflect on both buttons in the card
    var card=btn.closest(".card");
    card.querySelectorAll("[data-buy],[data-skip]").forEach(function(x){ x.classList.remove("primary"); x.setAttribute("aria-pressed","false"); });
    if(!was){ btn.classList.add("primary"); btn.setAttribute("aria-pressed","true"); }
    withSave(patchDeal(id,{status:d.status,updated_at:new Date().toISOString()}));
  }
  // Slice 2: a rule whose brand normalizes to the same key (apostrophes deleted) as `name`, or null.
  function findRuleByBrand(name){
    var nb=normBrand(name); if(!nb) return null;
    for(var i=0;i<state.rules.length;i++){ if(normBrand(state.rules[i].title)===nb) return state.rules[i]; }
    return null;
  }
  function addBrand(){
    var inp=el("newbrand"); var name=(inp.value||"").trim(); if(!name) return;
    // Slice 2: build the slug from normBrand so "Jimmy John's" → rule-jimmy-johns (matches the judge's
    // key), and treat any brand that NORMALIZES to an existing rule as a duplicate — so adding
    // "Jimmy John's" when "Jimmy Johns" exists reports "already in your rules" instead of a twin rule.
    var slug="rule-"+normBrand(name).replace(/ /g,"-");
    var dup=find(state.rules,slug)||findRuleByBrand(name);
    if(dup){ inp.value=""; selectTab("tab-rules"); noteAdd("“"+name+"” is already in your rules."); return; }
    var grp=categorizeBrand(name); // Slice 4: guessed, not silently "other"
    var row={page:PAGE,item_id:slug,title:name,status:"on",category:"rule",position:999,
      extras:{group:grp,mode:"pct",min_pct:20,min_denom:25,note:""},updated_at:new Date().toISOString()};
    state.rules.push(row); inp.value=""; renderRules();
    noteAdd(grp==="other"
      ? "Added “"+name+"” — Category: Other. Not sure what it is; change it on the row."
      : "Added “"+name+"” under "+groupLabel(grp)+".");
    withSave(api("press_tasks?on_conflict=page,item_id",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(row)}));
  }
  function noteAdd(msg){ var n=el("addnote"); if(n) n.textContent=msg; }
  // Recategorize any rule from its segmented control (Slice 4) — persists to press_tasks.
  function setRuleGroup(id,val){
    var r=find(state.rules,id); if(!r||!val) return; r.extras=r.extras||{};
    if(r.extras.group===val){ return; }
    r.extras.group=val; renderRulesList(); // the rule moves into its new group section
    withSave(patchTask(id,{extras:r.extras,updated_at:new Date().toISOString()}));
  }
  // ---------- delete a rule (Slice 3) ----------
  // "Delete rule…" swaps the ⋯ menu contents to an inline "Delete <Brand>? [Delete] [Cancel]" confirm.
  function showDeleteConfirm(id){
    var r=find(state.rules,id); if(!r) return;
    var m=el("ovfmenu-"+id); if(!m) return;
    m.innerHTML='<div class="ovfmenu-label">Delete '+esc(r.title)+'?</div>'
      +'<div class="ovf-confirm">'
      +'<button class="confirm-del" data-delok="'+esc(id)+'">Delete</button>'
      +'<button class="confirm-cancel" data-delcancel="'+esc(id)+'">Cancel</button>'
      +'</div>';
    var d=m.querySelector('[data-delok]'); if(d) d.focus();
  }
  // Cancel restores the normal menu (renderRulesList rebuilds the card) and returns focus to the ⋯.
  function cancelDeleteConfirm(id){
    renderRulesList();
    var btn=document.querySelector('.ovf[data-ovf="'+id+'"]'); if(btn) btn.focus();
  }
  // Hard DELETE of the press_tasks row (same pattern as removeWatch), then re-render + focus the next
  // card's ⋯ (or the Add-brand input when the list is now empty).
  function deleteRule(id){
    state.rules=state.rules.filter(function(r){ return r.item_id!==id; });
    renderRulesList();
    var next=document.querySelector('#rules-list .ovf'); if(next) next.focus(); else { var nb=el("newbrand"); if(nb) nb.focus(); }
    withSave(api("press_tasks?page=eq."+PAGE+"&item_id=eq."+encodeURIComponent(id),{method:"DELETE",headers:{Prefer:"return=minimal"}}));
  }
  // ---------- blocked stores (Slice 3) ----------
  function saveSettings(){ return withSave(patchTask("settings",{extras:state.settings,updated_at:new Date().toISOString()})); }
  function addBlock(){
    var inp=el("newblock"); var name=normBrand(inp&&inp.value); if(!name) return; // normalized to match the judge
    var list=blocklist().slice();
    if(list.indexOf(name)<0) list.push(name);
    state.settings.retailer_blocklist=list;
    if(inp) inp.value=""; renderBlockList(); saveSettings();
  }
  function removeBlock(entry){
    state.settings.retailer_blocklist=blocklist().filter(function(e){ return e!==entry; });
    renderBlockList(); saveSettings();
  }
  // ---------- sale watch (Slice 6) ----------
  function addWatch(){
    var inp=el("newwatch"); var term=(inp&&inp.value||"").trim(); if(!term) return;
    if(watchTerms().length>=10) return; // cap so a tick can't fan out unboundedly
    var slug="watch-"+term.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
    if(find(state.watch,slug)){ if(inp) inp.value=""; return; }
    var row={page:PAGE,item_id:slug,title:term,status:"on",category:"watch",position:999,extras:{min_pct:newWatchMin,note:""},updated_at:new Date().toISOString()};
    state.watch.push(row); if(inp) inp.value=""; newWatchMin=0; renderWatchList();
    var nm=el("newwatchmin"); if(nm) nm.textContent=pctMinLabel(newWatchMin);
    withSave(api("press_tasks?on_conflict=page,item_id",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(row)}));
  }
  // Slice 4: per-watch "Min % off" stepper — 5-pt steps, 0 ("Any") to 90; writes extras.min_pct.
  function stepWatch(id,delta,btn){
    var w=find(state.watch,id); if(!w) return; w.extras=w.extras||{};
    var v=Math.max(0,Math.min(90,(Number(w.extras.min_pct)||0)+delta));
    w.extras.min_pct=v; var out=btn.parentNode.querySelector("output"); if(out) out.textContent=pctMinLabel(v);
    withSave(patchTask(id,{extras:w.extras,updated_at:new Date().toISOString()}));
  }
  // Slice 4: the add-row "Min % off" for the NEXT watch (not yet persisted — applied on Watch).
  function stepNewWatch(delta,btn){
    newWatchMin=Math.max(0,Math.min(90,(Number(newWatchMin)||0)+delta));
    var out=btn.parentNode.querySelector("output"); if(out) out.textContent=pctMinLabel(newWatchMin);
  }
  function removeWatch(id){
    state.watch=watchTerms().filter(function(w){ return w.item_id!==id; });
    renderWatchList();
    withSave(api("press_tasks?page=eq."+PAGE+"&item_id=eq."+encodeURIComponent(id),{method:"DELETE",headers:{Prefer:"return=minimal"}}));
  }

  function selectTab(tabId){
    ["feed","sources","rules","alerts"].forEach(function(name){
      var tab=el("tab-"+name), panel=el("panel-"+name), on=("tab-"+name)===tabId;
      tab.setAttribute("aria-selected",on); panel.hidden=!on;
    });
    measureSticky();
  }
  // Measure the real sticky stack so .grouphead / .quicknav scroll-margin-top matches it and every
  // jump lands the heading fully below the bar (not the old hard-coded 120px). --stick = the sticky
  // header; --stick2 = the Rules search bar (sticky under the header) when the Rules tab is showing.
  function measureSticky(){
    var root=document.documentElement;
    var header=document.querySelector("header");
    if(header) root.style.setProperty("--stick", Math.round(header.getBoundingClientRect().height)+"px");
    var sb=document.querySelector("#panel-rules:not([hidden]) .searchbar");
    root.style.setProperty("--stick2", (sb?Math.round(sb.getBoundingClientRect().height):0)+"px");
  }
  // keyboard: arrow between tabs
  document.querySelector("nav").addEventListener("keydown",function(ev){
    var order=["tab-feed","tab-sources","tab-rules","tab-alerts"]; var i=order.indexOf(document.activeElement.id);
    if(i<0) return; var n=null;
    if(ev.key==="ArrowRight") n=order[(i+1)%order.length];
    else if(ev.key==="ArrowLeft") n=order[(i-1+order.length)%order.length];
    if(n){ ev.preventDefault(); el(n).focus(); selectTab(n); }
  });

  // ---------- boot (passkey-gated) ----------
  // The shared press passkey gate (inlined above) blocks the WHOLE app until the private-wing vault
  // session holds Card Scout's credentials. Card Scout's keyring entry is { sync_id, pass: SENTINEL }
  // — the wing seals an inert sentinel (see press index.html) so the shared gate's credsFor() is
  // satisfied. Mounted UNCONDITIONALLY (like fsa.html, NOT retirement's everEnrolled() conditional):
  // a fresh or locked browser sees only the gate and NEVER queries the DB. Do NOT edit gate.js.
  function boot(){
    loadLS();
    state.locked = !planId();
    renderAll();
    measureSticky();
    if(state.sources && state.sources.length){ sync(state.locked?"locked":"", state.locked?"Locked":"Cached"); }
    refresh();
  }
  // Keep the measured sticky offsets current: on header resize, viewport resize, and once fonts land
  // (a late webfont can grow the header after first paint).
  if(window.ResizeObserver){ try{ new ResizeObserver(measureSticky).observe(document.querySelector("header")); }catch(e){} }
  window.addEventListener("resize", measureSticky);
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(measureSticky).catch(function(){}); }
  function lockDown(){
    // Session lost (Lock now / TTL expiry): drop sensitive data from memory and the screen; the gate
    // re-mounts over the top. Deals are cleared; the page is back behind the passkey.
    state.deals = []; state.locked = true;
    renderAll();
  }
  if(window.PressGate && typeof PressGate.guard === "function"){
    PressGate.guard({ page:"card-scout.html", onUnlock: boot, onLock: lockDown });
  } else {
    // The vendored gate is inlined first and its presence is fail-closed at release; if it is somehow
    // missing at runtime, fail SAFE — stay locked, never boot the app open.
    console.error("[card-scout] PressGate missing — refusing to boot unlocked.");
  }
  window.addEventListener("online", function(){ if(planId()) refresh(); });
})();
</script>
