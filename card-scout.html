<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --ink:#161a22; --muted:#5b6470; --line:#e3e6ea;
    --accentA:#149b6b; --link:#0b6b47; --accentB:#b07d2a; --hit:#0f7a4d; --near:#8a6d1f; --danger:#b3261e;
    --chip:#eef1f4; --shadow:0 1px 2px rgba(16,20,30,.06),0 2px 8px rgba(16,20,30,.05);
    --band:rgba(20,155,107,.08); /* Slice 5: subtle accent band behind each section heading */
    /* Slice 6 (Eye P0): badge PILL text must clear WCAG 4.5:1 on its pale tint in light mode — the
       verdict-at-a-glance signal. Darker than --hit/--near (which stay for dots/labels on plain bg). */
    --badge-hit-fg:#0f5c34; --badge-near-fg:#6b4e12;
    --tap:44px;
    /* Thrift Shop Slice 5: kind tag tints (text ≥ 4.5:1 on its tint, both themes) */
    --k-card-bg:rgba(15,122,77,.16); --k-card-fg:#0d5a37; --k-sale-bg:rgba(29,99,197,.14); --k-sale-fg:#174f9e; --k-offer-bg:rgba(122,63,191,.14); --k-offer-fg:#5e2d99;
    --on-accent:#fff; --on-danger:#fff; /* safari-ui (Eye P0): ink ON the accent gradient / danger fill — dark ink in dark mode */
    /* live-measured sticky offsets (JS: --stick = header height; --stick2 = Rules search bar) so
       jump-to-category anchors land BELOW the sticky stack, not buried under it. Seeded generously. */
    --stick:150px; --stick2:0px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1216; --card:#171b21; --ink:#eef1f5; --muted:#9aa4b1; --line:#272d36;
      --chip:#20262e; --shadow:0 1px 2px rgba(0,0,0,.4);
      --band:rgba(79,195,138,.12); /* Slice 5: accent band, dark token */
      /* Slice 6: in dark mode the tint is dark, so the BRIGHT accent text is the high-contrast choice. */
      --badge-hit-fg:#4fc38a; --badge-near-fg:#e0bd8f;
      --accentA:#4fc38a; --link:#5fd39a; --accentB:#e0bd8f; --hit:#4fc38a; --near:#e0bd8f;
      /* polish Slice 5 (Eye): #b3261e on #171b21 was ≈1.7:1 — a light red clears 4.5:1 on the dark card. */
      --danger:#ff8a80;
      --k-card-bg:rgba(79,195,138,.18); --k-card-fg:#7ee0ad; --k-sale-bg:rgba(110,168,255,.18); --k-sale-fg:#a9c9ff; --k-offer-bg:rgba(190,150,255,.18); --k-offer-fg:#d6c0ff;
      --on-accent:#0b1210; --on-danger:#0b1210; /* white on #4fc38a→#e0bd8f / #ff8a80 was ≈2:1; this ink clears 7:1 */
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding-bottom:calc(env(safe-area-inset-bottom) + 8px);
  }
  header{
    position:sticky;top:0;z-index:20;background:var(--bg);
    padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:10px}
  .brand h1{font-size:20px;margin:0;letter-spacing:-.02em}
  .brand .logo{width:26px;height:26px;flex:0 0 auto}
  #sync{margin-left:auto;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--chip);color:var(--muted)}
  /* Slice 4 (Eye P1): the Synced/Saved state is a FILLED green pill (its own tinted background),
     distinct from the app's plain accent text; badge-hit-fg over the .18 tint clears WCAG 4.5:1 in
     both themes (light 5.90:1, dark 7.28:1 — verified by blending, docs/evidence/truthup-slice-4). */
  #sync.ok{color:var(--badge-hit-fg);background:rgba(15,122,77,.18)}
  #sync.err{color:var(--danger)} #sync.busy{color:var(--accentB)} #sync.locked{color:var(--muted)}
  /* back chip to the marquee's Private Wing */
  .tw-back{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;padding:6px 10px 6px 4px;margin:-7px 0 -4px;min-height:var(--tap)} /* safari-ui: 44px hit, same visual rhythm */
  .tw-back:hover{color:var(--ink)}
  nav{display:flex;gap:6px;margin-top:10px}
  nav button{
    flex:1;min-height:var(--tap);border:1px solid var(--line);background:var(--card);color:var(--muted);
    border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;
  }
  nav{flex-wrap:wrap}
  nav button{white-space:nowrap;padding:0 6px}
  @media (max-width:520px){ nav button{flex:1 1 calc(33.333% - 4px)} nav button:nth-child(n+4){flex:1 1 calc(50% - 3px)} } /* Thrift Shop S4: 5 tabs → 3 + 2 on a phone */
  nav button[aria-selected="true"]{color:var(--on-accent);background:linear-gradient(135deg,var(--accentA),var(--accentB));border-color:transparent}
  main{max-width:640px;margin:0 auto;padding:14px 16px}
  section[hidden]{display:none}
  /* quick nav — a horizontally scrollable chip row, one per visible group */
  /* Slice 6 (fixes arc): nav-style JUMP buttons — a CSS grid of N equal (1fr) columns that spans the
     content column edge-to-edge (first button left == column left, last button right == column right).
     Distinct from the Feed filter pills: squared 10px radius, card background, accent label, a trailing
     ↓, a subtle shadow. Labels ellipsize (min-width:0) so N buttons never cause horizontal scroll; the
     count is always kept. --qn-cols is set inline per container = number of groups. */
  .quicknav{display:flex;flex-wrap:wrap;gap:8px;
    padding:4px 0 8px;margin:0;scroll-margin-top:calc(var(--stick) + var(--stick2) + 16px)}
  .quicknav:empty{display:none}
  /* Each button flexes to an equal share; on a wide screen all N sit in ONE full-width row. On a
     phone they wrap to 2 across so the category word stays legible (Eye P0), and a lone last item
     flex-grows to fill the row so the grid still spans the column edge-to-edge on odd counts. */
  .qchip{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;min-height:var(--tap);
    text-decoration:none;font-size:13px;font-weight:600;color:var(--link);
    background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px 10px}
  @media (max-width:480px){ .qchip{flex:1 1 calc(50% - 4px)} } /* 2-across on the phone — full labels fit */
  @media (max-width:360px){ .qchip{padding:8px 6px;gap:4px} .qdown{display:none} } /* safari-ui: the SE width keeps the whole label */
  .qchip:hover{border-color:var(--accentA)}
  .qchip:focus-visible{outline:2px solid var(--accentA);outline-offset:2px}
  .qlabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .qcount{flex:0 0 auto;color:var(--muted);font-weight:700}
  .qdown{flex:0 0 auto;color:var(--accentA);font-weight:700}
  /* consistent section heading — full-width rule above, count, and a Top link */
  /* Slice 5: a subtle full-width accent band behind each heading; 48px gap from the previous section.
     scroll-margin-top is unchanged so every jump still lands the heading below the sticky stack. */
  .grouphead{display:flex;align-items:center;gap:10px;background:var(--band);border-radius:12px;
    padding:10px 14px;margin:48px 0 14px;scroll-margin-top:calc(var(--stick) + var(--stick2) + 16px)}
  .grouphead:first-child{margin-top:8px}
  .grouphead h2{font-size:24px;font-weight:800;letter-spacing:-.015em;margin:0;flex:1;min-width:0}
  .grouphead .gcount,.badgroup .gcount{display:inline-block;font-size:14px;font-weight:600;color:var(--muted);background:var(--chip);border-radius:999px;padding:1px 9px;margin-left:6px;vertical-align:middle}
  /* Inbox arc Slice 5: the Processed section is a collapsible heading (button inside the h2).
     Multi-brand arc Slice 4: the bar is EXACTLY as tall as every other .grouphead — the ≥44px tap target is an
     absolutely-positioned ::before hit area spanning the bar, so it never grows the bar; content centred. */
  .proc-toggle{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:6px;width:calc(100% + 28px);min-height:var(--tap);margin:-5px -14px;padding:0 14px;font:inherit;color:inherit;position:relative}
  .proc-toggle .gcount{margin-left:0}
  .proc-toggle:focus-visible{outline:2px solid var(--accentA);outline-offset:3px;border-radius:8px}
  .proc-toggle .caret{margin-left:auto;font-size:16px;color:var(--muted);transition:transform .15s}
  .proc-toggle[aria-expanded="true"] .caret{transform:rotate(180deg)}
  /* Inbox arc Slice 6: the "Bad" sheet (in-page dialog — never a browser prompt) + reason chip + backlog. */
  .sheet-backdrop{position:fixed;inset:0;background:rgba(10,14,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:60;padding:0}
  .sheet-backdrop[hidden]{display:none}
  .sheet{background:var(--card);color:var(--ink);width:100%;max-width:640px;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.18)}
  @media (min-width:700px){ .sheet-backdrop{align-items:center} .sheet{border-radius:16px} }
  .sheet h3{margin:0 0 4px;font-size:18px}
  .sheet .field{display:flex;flex-direction:column;gap:6px;margin-top:12px}
  .sheet label{font-size:13px;font-weight:700;color:var(--muted)}
  .sheet select,.sheet textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:10px;font:inherit;font-size:16px}
  .sheet .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
  .reasonchip{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(179,38,30,.12);color:var(--danger)}
  .badlist{list-style:none;margin:6px 0 0;padding:0}
  .badlist li{padding:8px 0;border-top:1px solid var(--line);font-size:14px}
  .badlist li:first-child{border-top:0}
  .badlist .meta{font-size:12px;color:var(--muted)}
  .badgroup h4{margin:10px 0 2px;font-size:14px}
  /* polish Slice 5 (Eye P2): backlog links use the page link token (were default blue); sheet text is
     left-aligned on every viewport; the sheet carries the deal's price line; the watch ✕ is a 44px target;
     "no channel on" reads as a warning; the inline watch edit carries its keyboard hint. */
  .badlist a{color:var(--link);font-weight:600}
  .sheet,.sheet .field,.sheet label{text-align:left}
  .sheet .field{align-items:stretch}
  .sheet .price{margin-top:2px;font-weight:700;font-variant-numeric:tabular-nums}
  .watchrow .fchip{min-width:var(--tap);min-height:var(--tap);display:inline-flex;align-items:center;justify-content:center}
  .warntext{color:var(--danger);font-weight:700}
  .wedit-hint{display:block;margin-top:4px;font-size:13px;color:var(--muted)}
  /* polish Slice 4: Remove flag (in the sheet) + backlog Unflag + the Undo toast. */
  .sheet .actions .unflag{margin-right:auto;color:var(--danger)}
  .badlist li{display:flex;gap:10px;align-items:flex-start}
  .badlist li .bl-body{flex:1;min-width:0}
  .badlist li .btn{flex:0 0 auto}
  .toast{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:calc(16px + env(safe-area-inset-bottom));z-index:70;display:flex;align-items:center;gap:12px;
    max-width:calc(100% - 32px);box-sizing:border-box;background:var(--ink);color:var(--card);border-radius:12px;padding:8px 8px 8px 14px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:14px}
  .toast[hidden]{display:none}
  .toast .btn{min-height:44px;background:transparent;color:inherit;border-color:currentColor}
  .grouphead .toplink{font-size:13px;font-weight:600;color:var(--link);text-decoration:none;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-height:var(--tap);min-width:var(--tap);margin:-6px -6px -6px 0}
  /* rules search */
  .searchbar{display:flex;gap:8px;position:sticky;top:var(--stick);z-index:5;
    background:var(--bg);padding:8px 0 6px}
  .searchbar input{flex:1;min-width:0;min-height:44px} /* safari-ui: min-width:0 keeps Clear inside the 16px gutter at 320 */
  .searchbar .btn{min-height:44px}
  /* per-rule controls: the % and min-denomination steppers, stacked on narrow screens */
  .ctrls{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}
  .ctrl{display:flex;align-items:center;gap:10px}
  .ctrl-lab{font-size:13px;color:var(--muted);font-weight:600}
  /* plain-English alerts summary */
  .summary{background:linear-gradient(135deg,rgba(20,155,107,.10),rgba(176,125,42,.08));border:1px solid var(--line)}
  .summary p{margin:0;font-size:15px;line-height:1.5}
  /* locked feed panel */
  .locked{display:flex;flex-direction:column;align-items:center;gap:10px}
  .locked .locktitle{font-size:18px;font-weight:700;color:var(--ink)}
  .locked p{margin:0;max-width:34ch}
  .field select{flex:0 0 auto}
  .helper{font-size:13px;color:var(--muted);margin:2px 2px 0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:10px}
  .card.coming{opacity:.6;background:var(--chip)} /* Slice 9: a "Coming soon" source is visibly inert */
  .sw[disabled]{cursor:not-allowed;opacity:.5}
  .row{display:flex;align-items:center;gap:10px}
  .row .grow{flex:1;min-width:0}
  .title{font-weight:600}
  .sub{font-size:13px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--chip);color:var(--muted);margin-right:5px}
  .badge.hit{background:rgba(15,122,77,.18);color:var(--badge-hit-fg)}
  .badge.near{background:rgba(138,109,31,.22);color:var(--badge-near-fg)}
  .badge.warn{background:rgba(179,38,30,.12);color:var(--danger)}
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:#9aa4b1}
  .dot.ok{background:var(--hit)} .dot.err{background:var(--danger)} .dot.blocked{background:#c58a1e}
  /* Slice 4 (Eye P1): the alerted marker is a HOLLOW hairline ring, not a filled dot, so it never
     reads as a live/status dot (which are solid fills). Carries a tooltip + aria-label "Alerted". */
  .dot.alerted{box-sizing:border-box;background:transparent;border:1.5px solid var(--hit);box-shadow:none;margin-right:6px}
  /* toggle — 52x44 hit area (iOS min), pill drawn 48x28 centred */
  .sw{position:relative;width:52px;height:44px;flex:0 0 auto;border:none;background:transparent;cursor:pointer;padding:0}
  .sw::before{content:"";position:absolute;top:50%;left:0;transform:translateY(-50%);width:48px;height:28px;border-radius:999px;background:#c7ccd3;transition:background .15s}
  .sw[aria-checked="true"]::before{background:linear-gradient(135deg,var(--accentA),var(--accentB))}
  .sw::after{content:"";position:absolute;top:50%;left:3px;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
  .sw[aria-checked="true"]::after{transform:translate(20px,-50%)}
  .stepper{display:flex;flex:0 0 auto;align-items:center;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .stepper button{flex:0 0 auto;width:44px;height:44px;border:none;background:var(--card);color:var(--ink);font-size:20px;cursor:pointer}
  .stepper output{min-width:52px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
  .btn{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;cursor:pointer}
  .btn.primary{background:linear-gradient(135deg,var(--accentA),var(--accentB));color:var(--on-accent);border-color:transparent}
  .btn.small{min-height:var(--tap);padding:0 14px;font-size:14px}
  a.deal{color:var(--link);text-decoration:none;font-weight:600}
  .dactrow a.deal{display:inline-flex;align-items:center;min-height:var(--tap);white-space:nowrap} /* safari-ui: one line, 44px */
  a.deal:focus-visible,button:focus-visible,.sw:focus-visible,input:focus-visible{outline:3px solid var(--accentB);outline-offset:2px}
  .field{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:8px 0} /* safari-ui: wrap — a select that cannot fit drops below its label, never off-screen */
  .field label{flex:1}
  input[type=time],input[type=text],select{min-height:var(--tap);border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:0 10px;font-size:16px}
  /* Inbox arc Slice 7: iOS zooms into any field under 16px and the page stays zoomed, drifting sideways.
     Every field is ≥16px; nothing may be wider than the screen. User zoom stays allowed (viewport meta). */
  input,select,textarea{font-size:16px;max-width:100%}
  html,body{overflow-x:hidden}
  @supports (overflow:clip){ html,body{overflow-x:clip} } /* clip: no scroll container, so sticky keeps working */
  img,svg,video,table,pre{max-width:100%}
  main,section,.card,.feedbar,.ftoolbar,.fsearch,.addrow,.searchbar,.row{min-width:0;max-width:100%}
  .empty{color:var(--muted);text-align:center;padding:26px 10px}
  .addrow{display:flex;gap:8px;margin-top:6px}
  .addrow input{flex:1;min-width:0}
  footer{max-width:640px;margin:6px auto 0;padding:14px 16px 24px;color:var(--muted);font-size:13px;text-align:center}
  footer a{color:var(--hit);display:inline-flex;align-items:center;min-height:var(--tap)} /* a11y: --accentA #149b6b is only 3.3:1 on --bg at 13px; --hit #0f7a4d is 4.94:1 (WCAG AA), and 8.4:1 in dark mode */
  /* feed filter bar — one compact row (When / Type / Sort / Search) + a status line */
  .feedbar{margin:2px 0 8px}
  .ftoolbar{display:flex;align-items:center;gap:8px;min-height:44px}
  .ftrigs{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
  .ftoolbar[data-searching="true"] .ftrigs{display:none}
  .fsearch{display:none;align-items:center;gap:8px;flex:1;min-width:0}
  .ftoolbar[data-searching="true"] .fsearch{display:flex}
  .fpop-wrap{position:relative;flex:0 1 auto;min-width:0}
  .ftrig{display:inline-flex;align-items:center;gap:6px;min-height:var(--tap);max-width:100%;padding:0 11px;border-radius:999px;

  function sourceState(s){

    if(x.blocked===true || x.health==="error") return "stale";

  var WATCH_HOLD_MS=400, WATCH_SLOP=10;
  function watchAnnounce(msg){ var l=el("watch-live"); if(!l) return; l.textContent=""; setTimeout(function(){ l.textContent=msg; },30); }

    var ids=[].slice.call(host.querySelectorAll(".watchrow")).map(function(r){ return r.getAttribute("data-wid"); });

      var w=find(state.watch,id); if(!w) return;

  function wireWatchDrag(host){
    var rows=function(){ return [].slice.call(host.querySelectorAll(".watchrow")); };
    rows().forEach(function(row){
      var suppressClick=false;
      row.querySelectorAll("a,button,img").forEach(function(x){ x.setAttribute("draggable","false"); });
      row.addEventListener("dragstart", function(e){ e.preventDefault(); });
      row.addEventListener("keydown", function(e){
        if(e.target!==row || !e.altKey || (e.key!=="ArrowUp"&&e.key!=="ArrowDown")) return;
        e.preventDefault();
        var all=rows(), i=all.indexOf(row), n=all.length, j=e.key==="ArrowUp"?i-1:i+1;
        var name=(find(state.watch,row.getAttribute("data-wid"))||{}).title||"Watch";
        if(j<0||j>=n){ watchAnnounce(name+" is already "+(j<0?"first":"last")); return; }
        if(j<i) host.insertBefore(row,all[j]); else host.insertBefore(row,all[j].nextElementSibling);
        row.focus();
        watchAnnounce(name+" moved to position "+(j+1)+" of "+n);
        saveWatchOrder(host);
      });

      row.addEventListener("contextmenu", function(e){ if(row.classList.contains("pressing")||row.classList.contains("dragging")) e.preventDefault(); });

          ghost.setAttribute("aria-hidden","true"); ghost.style.width=r.width+"px";

          document.body.appendChild(ghost);
          row.classList.remove("pressing"); row.classList.add("dragging"); document.body.classList.add("watch-sorting");
          try{ row.setPointerCapture(e.pointerId); }catch(_){}
        }, WATCH_HOLD_MS);

          clearTimeout(timer); row.classList.remove("pressing");
          window.removeEventListener("pointermove",onMove); window.removeEventListener("pointerup",onUp);
          window.removeEventListener("pointercancel",onCancel); document.removeEventListener("touchmove",blockScroll);
        }
        function finish(){ if(ghost) ghost.remove(); row.classList.remove("dragging"); document.body.classList.remove("watch-sorting"); }
        function onMove(ev){
          if(!active){ if(Math.hypot(ev.clientX-sx,ev.clientY-sy)>WATCH_SLOP) teardown(); return; } // a scroll / normal tap
          moved=true;
          var x=ev.clientX, y=ev.clientY;
          ghost.style.transform="translate("+(x-dx)+"px,"+(y-dy)+"px) rotate(1.5deg)";
          var others=rows().filter(function(c){ return c!==row; });
          for(var k=0;k<others.length;k++){ var rr=others[k].getBoundingClientRect();
            if(y<rr.top+rr.height/2){ if(row.nextElementSibling!==others[k]) host.insertBefore(row,others[k]); return; } }
          if(others.length){ var last=others[others.length-1]; if(last.nextElementSibling!==row) host.insertBefore(row,last.nextElementSibling); }
        }
        function onUp(){
          var was=active; teardown(); if(!was) return; // plain tap → the click proceeds
          finish();
          if(moved){ saveWatchOrder(host); var w=find(state.watch,row.getAttribute("data-wid"));
            watchAnnounce((w&&w.title||"Watch")+" moved to position "+(rows().indexOf(row)+1)+" of "+rows().length); }
        }
        function onCancel(){ var was=active; teardown(); if(was) finish(); }

      });
    });

  // Slice 1: POST {action:'test_push'} to the Edge Function, gated on the page's sync_id (x-plan-id).
  // Shows the REAL Pushover outcome inline; never sends or displays a Pushover credential.
  function sendTestPush(btn){
    var sid=planId(); var out=el("test-push-result");
    if(!sid){ if(out) out.textContent="Unlock the page first, then try again."; return; }
    if(out) out.textContent=""; btn.disabled=true; var prev=btn.textContent; btn.textContent="Sending…";
    fetch(SUPA+"/functions/v1/"+PAGE, {
      method:"POST",
      headers:{ "content-type":"application/json", "apikey":KEY, "x-plan-id":sid },
      body: JSON.stringify({ action:"test_push" })
    }).then(function(r){ return r.json().catch(function(){return {};}).then(function(j){ return {status:r.status, j:j||{}}; }); })
      .then(function(res){
        var j=res.j;
        if(res.status===200 && j.ok===true){ out.textContent="Sent ✓ (Pushover). If your phone stays silent, open the Pushover app and check notifications are allowed."; }
        else if(res.status===200 && j.ok===false){ out.textContent="Pushover didn’t deliver"+(j.status?" (HTTP "+j.status+")":"")+" — not sent."; }
        else if(res.status===429){ out.textContent="Please wait "+(j.retry_after_s||60)+"s between test pushes."; }
        else if(res.status===401){ out.textContent="Not authorized — unlock the page and try again."; }
        else if(res.status===500){ out.textContent="Pushover not set up yet."; }
        else { out.textContent="Couldn’t send a test push (error "+res.status+")."; }
      })
      .catch(function(){ if(out) out.textContent="Couldn’t reach the server — check your connection."; })
      .then(function(){ btn.disabled=false; btn.textContent=prev; });
  }

  // page). Renders each step ✓/✗ with its detail; 1 per 5 min server-side.

    out.innerHTML=FULL_STEPS.map(function(name){

      return '<li class="step '+st+'" data-step="'+esc(name)+'"><span class="mark" aria-hidden="true">'+mark+'</span> <strong>'+esc(name)+'</strong>'
        +'<span class="vh">'+(st==="ok"?" passed":(st==="fail"?" failed":" not run"))+'</span>'

  function runFullTest(btn){
    var sid=planId(); var out=el("full-test-result");
    if(!sid){ if(out) out.innerHTML='<li class="step fail">Unlock the page first, then try again.</li>'; return; }
    btn.disabled=true; var prev=btn.textContent; btn.textContent="Running…";

  // Enhancements Slice 6 — swipe left on a feed card (touch + pointer). Drag ≥60px left → the card stays
  // open at -88px revealing the red Delete; less → it springs back. Vertical scrolls are left alone, and a
  // drag never triggers the card's buttons/links.
  var SWIPE_OPEN=88, SWIPE_MIN=60;
  (function installSwipe(){
    var st=null;
    function closeOthers(except){ document.querySelectorAll(".swipe.open").forEach(function(w){ if(w!==except){ w.classList.remove("open"); var c=w.querySelector(".card.deal"); if(c) c.style.transform=""; } }); }
    document.addEventListener("pointerdown", function(ev){
      var card=ev.target.closest&&ev.target.closest(".swipe .card.deal");
      if(!card){ if(!(ev.target.closest&&ev.target.closest(".swipe-del"))) closeOthers(null); return; }
      if(ev.target.closest(".ovf,.ovfmenu")) return;
      var wrap=card.parentNode;
      st={wrap:wrap,card:card,x:ev.clientX,y:ev.clientY,dx:0,base:wrap.classList.contains("open")?-SWIPE_OPEN:0,drag:false,id:ev.pointerId};
    });
    document.addEventListener("pointermove", function(ev){
      if(!st||ev.pointerId!==st.id) return;
      var dx=ev.clientX-st.x, dy=ev.clientY-st.y;
      if(!st.drag){ if(Math.abs(dx)<8) return; if(Math.abs(dy)>Math.abs(dx)){ st=null; return; } st.drag=true; closeOthers(st.wrap); st.card.style.transition="none"; }
      ev.preventDefault();
      var sel=window.getSelection&&window.getSelection(); if(sel&&sel.removeAllRanges) sel.removeAllRanges();
      st.dx=dx; var x=Math.max(-SWIPE_OPEN-24, Math.min(0, st.base+dx));
      st.card.style.transform="translateX("+x+"px)";
      st.wrap.classList.add("dragging");
    });
    function end(ev){
      if(!st||(ev&&ev.pointerId!==st.id)) return;
      var s0=st; st=null;
      s0.card.style.transition=""; s0.wrap.classList.remove("dragging");
      if(!s0.drag) return;
      var open = (s0.base+s0.dx) <= -SWIPE_MIN;
      s0.wrap.classList.toggle("open",open);
      s0.card.style.transform=open?"translateX(-"+SWIPE_OPEN+"px)":"";
      // swallow the click a drag would otherwise fire on the card's buttons/links
      var swallow=function(e){ e.stopPropagation(); e.preventDefault(); document.removeEventListener("click",swallow,true); };
      document.addEventListener("click",swallow,true); setTimeout(function(){ document.removeEventListener("click",swallow,true); },0);
    }
    document.addEventListener("pointerup", end);
    document.addEventListener("pointercancel", end);
  })();

  function find(list,id){ for(var i=0;i<list.length;i++) if(list[i].item_id===id) return list[i]; return null; }
  function stepRule(id,delta,btn){
    var r=find(state.rules,id); r.extras=r.extras||{}; var v=Math.max(0,Math.min(90,(Number(r.extras.min_pct)||0)+delta));
    r.extras.min_pct=v; var out=btn.parentNode.querySelector("output"); if(out) out.textContent=v+"%";

  // Minimum card value stepper: $5 steps, floor $0 ("Any"), ceiling $500. Writes extras.min_denom.
  function stepDenom(id,delta,btn){
    var r=find(state.rules,id); r.extras=r.extras||{};
    var v=Math.max(0,Math.min(500,denomVal(r.extras)+delta));
    r.extras.min_denom=v; var out=btn.parentNode.querySelector("output"); if(out) out.textContent=(v<=0?"Any":"$"+v);
    withSave(patchTask(id,{extras:r.extras,updated_at:new Date().toISOString()}));

  // Enhancements Slice 6 — Bought / Skip also write ONE row to the permanent savings log (press_tasks,
  // category='savings', item_id='sv-'+deal id, sync_id column via api(); D1: never pruned). The deal's
  // extras.user_status carries the decision so a browser-lane re-run can never undo it. Un-ticking removes
  // the log row (a correction, not a decision).
  function round2(n){ return Math.round(n*100)/100; }
  function savingsRow(d,status,opts){
    var k=dealKind(d);
    var face=k==="card"&&d.face_value!=null?Number(d.face_value):null;
    var paid=k==="card"?netForFace(d):null; paid=paid!=null?Number(paid):null;
    // Thrift Shop Slice 5: Mark's own answer in the saved sheet wins; a Skip saves nothing; else the prefill rule.
    var saved=(opts&&opts.savedSet)?opts.saved:(status==="bought"?savedPrefill(d):((face!=null&&paid!=null)?round2(face-paid):null));
    return {page:PAGE,item_id:"sv-"+d.item_id,title:String(d.brand||KIND_LABEL[k]).slice(0,200),status:status,category:"savings",position:999,
      extras:{kind:k,face:face,paid:paid,saved:saved,pct:pct(d),retailer:(d.extras&&d.extras.retailer)||null,source:d.source||null,
        verdict:d.verdict||null,deal_item_id:d.item_id,at:new Date().toISOString()},updated_at:new Date().toISOString()};
  }
  function writeSavings(d,status,opts){
    if(status==="bought"||status==="skip"){
      var row=savingsRow(d,status,opts);
      state.savings=(state.savings||[]).filter(function(x){ return x.item_id!==row.item_id; }).concat([row]);
      return api("press_tasks?on_conflict=page,item_id",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(row)});
    }
    state.savings=(state.savings||[]).filter(function(x){ return x.item_id!=="sv-"+d.item_id; });
    return api("press_tasks?page=eq."+PAGE+"&item_id=eq."+encodeURIComponent("sv-"+d.item_id),{method:"DELETE",headers:{Prefer:"return=minimal"}});
  }
  function dealExtras(d,userStatus){

  // Inbox arc Slice 5 — every status change stamps extras.status_at (Processed order) and extras.prev_status

      ? "Added “"+name+"” — Category: Other. Not sure what it is; change it on the row."
      : "Added “"+name+"” under "+groupLabel(grp)+".");
    withSave(api("press_tasks?on_conflict=page,item_id",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(row)}));
  }
  function noteAdd(msg){ var n=el("addnote"); if(n) n.textContent=msg; }
  // Recategorize any rule from its segmented control (Slice 4) — persists to press_tasks.
  function setRuleGroup(id,val){
    var r=find(state.rules,id); if(!r||!val) return; r.extras=r.extras||{};
    if(r.extras.group===val){ return; }
    r.extras.group=val; renderRulesList(); // the rule moves into its new group section
    withSave(patchTask(id,{extras:r.extras,updated_at:new Date().toISOString()}));
  }
  // ---------- Sales actions (Thrift Shop Slice 4) ----------
  // review fix (slice 7): the Sales jump chips' counts follow every change (not only the group heading).
  function syncSalesNav(){
    var c={counts:offerRows().filter(function(x){ return x.status==="on"; }).length,brands:brandRows().length,note:(state.settings&&state.settings.offer_note)?1:0,watch:(state.watch||[]).length};
    Object.keys(c).forEach(function(k){ var q=document.querySelector('#qn-sales a[href="#grp-sales-'+k+'"] .qcount'); if(q) q.textContent=String(c[k]);
      var g=document.querySelector('#grp-sales-'+k+' .gcount'); if(g) g.textContent=String(c[k]); });
  }
  function toggleOffer(id,btn){
    var r=find(state.offers||[],id); if(!r) return; var on=r.status!=="on"; r.status=on?"on":"off"; setSwitch(btn,on);
    withSave(patchTask(id,{status:r.status,updated_at:new Date().toISOString()}));
    syncSalesNav();
  }
  function stepOffer(id,kind,dir,btn){
    var r=find(state.offers||[],id); var cfg=OSTEP[kind]; if(!r||!cfg) return;
    r.extras=Object.assign({},r.extras||{}); var v=Math.max(cfg.min,Math.min(cfg.max,oval(r,kind)+dir*cfg.d));
    r.extras[kind]=v; var out=btn.parentNode.querySelector("output"); if(out) out.textContent=cfg.fmt(v);
    withSave(patchTask(id,{extras:r.extras,updated_at:new Date().toISOString()}));
  }
  function saveOfferNote(){
    var t=el("offernote"); if(!t) return; var v=String(t.value||"").slice(0,300);
    state.settings.offer_note=v; saveSettings(); var c=el("offernote-count"); if(c) c.textContent=v.length+" / 300"; syncSalesNav();
  }
  var brandSheetOpener=null;
  function ensureBrandSheet(){
    var sh=el("brand-sheet"); if(sh) return sh;
    sh=document.createElement("div"); sh.className="sheet-backdrop"; sh.id="brand-sheet"; sh.hidden=true;
    sh.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="brand-sheet-title">'
      +'<h3 id="brand-sheet-title">Brand override</h3><div class="sub">Always counts every offer from this brand; Never mutes it — whatever the offer type.</div>'
      +'<div class="field"><label for="brand-name">Brand</label><input id="brand-name" type="text" maxlength="80" placeholder="e.g. Chili’s" autocomplete="off"></div>'
      +'<div class="field"><span class="sub" id="brand-mode-lab">Override</span><div class="seg" role="group" aria-labelledby="brand-mode-lab">'
      +'<button type="button" class="segbtn on" aria-pressed="true" data-bsmode="always">Always</button>'
      +'<button type="button" class="segbtn" aria-pressed="false" data-bsmode="never">Never</button></div></div>'
      +'<div class="sub" id="brand-sheet-msg" role="status" aria-live="polite"></div>'
      +'<div class="actions"><button class="btn" type="button" id="brand-cancel">Cancel</button><button class="btn primary" type="button" id="brand-save">Save</button></div></div>';
    document.body.appendChild(sh);
    sh.addEventListener("click", function(ev){ if(ev.target===sh) closeBrandSheet(); });
    sh.addEventListener("keydown", function(ev){
      if(ev.key==="Escape"){ ev.preventDefault(); ev.stopPropagation(); closeBrandSheet(); return; }
      if(ev.key==="Enter"&&ev.target&&ev.target.id==="brand-name"){ ev.preventDefault(); saveBrandSheet(); return; }
      if(ev.key!=="Tab") return;
      var f=[].slice.call(sh.querySelectorAll("input,button")); var i=f.indexOf(document.activeElement);
      if(ev.shiftKey&&i<=0){ f[f.length-1].focus(); ev.preventDefault(); } else if(!ev.shiftKey&&i===f.length-1){ f[0].focus(); ev.preventDefault(); }
    });
    return sh;
  }
  function openBrandSheet(opener){
    var sh=ensureBrandSheet(); brandSheetOpener=opener||null;
    el("brand-name").value=brandQuery||""; el("brand-sheet-msg").textContent="";
    setBrandSheetMode("always"); sh.hidden=false; el("brand-name").focus();
  }
  function setBrandSheetMode(m){ var sh=el("brand-sheet"); if(!sh) return; sh.querySelectorAll("[data-bsmode]").forEach(function(b){ var on=b.getAttribute("data-bsmode")===m; b.classList.toggle("on",on); b.setAttribute("aria-pressed",String(on)); }); }
  function closeBrandSheet(){ var sh=el("brand-sheet"); if(sh) sh.hidden=true; if(brandSheetOpener&&brandSheetOpener.isConnected) brandSheetOpener.focus(); }
  function saveBrandSheet(){
    var name=(el("brand-name").value||"").trim(); var msg=el("brand-sheet-msg");
    if(!name){ msg.textContent="Type a brand name first."; el("brand-name").focus(); return; }
    var mode=(el("brand-sheet").querySelector("[data-bsmode].on")||{getAttribute:function(){return "always";}}).getAttribute("data-bsmode");
    var key=compactBrand(name);
    var dup=(state.offerBrands||[]).filter(function(b){ return compactBrand(b.title)===key; })[0];
    if(dup){ dup.extras=Object.assign({},dup.extras||{},{mode:mode}); withSave(patchTask(dup.item_id,{extras:dup.extras,updated_at:new Date().toISOString()})); }
    else {
      var bslug=normBrand(name).replace(/ /g,"-")||("x"+Array.prototype.map.call(name,function(c){ return c.charCodeAt(0).toString(36); }).join("").slice(0,40));
      var row={page:PAGE,item_id:"ob-"+bslug,title:name.slice(0,80),status:"on",category:"offer-brand",position:999,extras:{mode:mode},updated_at:new Date().toISOString()};
      state.offerBrands=(state.offerBrands||[]).concat([row]);
      withSave(api("press_tasks?on_conflict=page,item_id",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(row)}));
    }
    var sh=el("brand-sheet"); if(sh) sh.hidden=true; brandQuery=""; var bs=el("brandsearch"); if(bs) bs.value="";
    renderBrandList(); syncSalesNav();
    showToast((mode==="never"?"Muted ":"Always counting ")+name);
    var ab=el("addbrandov"); if(ab) ab.focus();
  }
  function setBrandMode(id,mode){
    var b=find(state.offerBrands||[],id); if(!b) return; b.extras=Object.assign({},b.extras||{},{mode:mode}); renderBrandList();
    showToast((mode==="never"?"Muted ":"Always counting ")+b.title);
    withSave(patchTask(id,{extras:b.extras,updated_at:new Date().toISOString()}));
    var nb=document.querySelector('[data-brand="'+id+'"][data-bmode="'+mode+'"]'); if(nb) nb.focus();
  }
  function removeBrand(id){
    state.offerBrands=(state.offerBrands||[]).filter(function(b){ return b.item_id!==id; }); renderBrandList(); syncSalesNav();
    withSave(api("press_tasks?page=eq."+PAGE+"&item_id=eq."+encodeURIComponent(id),{method:"DELETE",headers:{Prefer:"return=minimal"}}));
    var ab=el("addbrandov"); if(ab) ab.focus();
  }
  function toggleWatchTerm(id,btn){
    var w=find(state.watch||[],id); if(!w) return; var on=w.status!=="on"; w.status=on?"on":"off"; setSwitch(btn,on);
    withSave(patchTask(id,{status:w.status,updated_at:new Date().toISOString()}));
    var line=document.querySelector('.watchrow[data-wid="'+id+'"] .wstatus'); if(line) line.innerHTML=watchStatusLine(w);
  }
  // ---------- delete a rule (Slice 3) ----------
  // "Delete rule…" swaps the ⋯ menu contents to an inline "Delete <Brand>? [Delete] [Cancel]" confirm.
  function showDeleteConfirm(id){
    var r=find(state.rules,id); if(!r) return;
    var m=el("ovfmenu-"+id); if(!m) return;
    m.innerHTML='<div class="ovfmenu-label">Delete '+esc(r.title)+'?</div>'
      +'<div class="ovf-confirm">'
      +'<button class="confirm-del" data-delok="'+esc(id)+'">Delete</button>'
      +'<button class="confirm-cancel" data-delcancel="'+esc(id)+'">Cancel</button>'
      +'</div>';
    var d=m.querySelector('[data-delok]'); if(d) d.focus();
  }
  // Cancel restores the normal menu (renderRulesList rebuilds the card) and returns focus to the ⋯.
  function cancelDeleteConfirm(id){
    renderRulesList();
    var btn=document.querySelector('.ovf[data-ovf="'+id+'"]'); if(btn) btn.focus();
  }
  // Hard DELETE of the press_tasks row (same pattern as removeWatch), then re-render + focus the next
  // card's ⋯ (or the Add-brand input when the list is now empty).
  function deleteRule(id){
    state.rules=state.rules.filter(function(r){ return r.item_id!==id; });
    renderRulesList();
    var next=document.querySelector('#rules-list .ovf'); if(next) next.focus(); else { var nb=el("newbrand"); if(nb) nb.focus(); }
    withSave(api("press_tasks?page=eq."+PAGE+"&item_id=eq."+encodeURIComponent(id),{method:"DELETE",headers:{Prefer:"return=minimal"}}));
  }
  // ---------- blocked stores (Slice 3) ----------
  function saveSettings(){ return withSave(patchTask("settings",{extras:state.settings,updated_at:new Date().toISOString()})); }
  function addBlock(){
    var inp=el("newblock"); var name=normBrand(inp&&inp.value); if(!name) return; // normalized to match the judge
    var list=blocklist().slice();
    if(list.indexOf(name)<0) list.push(name);
    state.settings.retailer_blocklist=list;
    if(inp) inp.value=""; renderBlockList(); saveSettings();
  }
  function removeBlock(entry){
    state.settings.retailer_blocklist=blocklist().filter(function(e){ return e!==entry; });
    renderBlockList(); saveSettings();
  }
  // ---------- sale watch (Slice 6) ----------
  function addWatch(){
    var inp=el("newwatch"); var term=(inp&&inp.value||"").trim(); if(!term) return;
    if(watchTerms().length>=10) return; // cap so a tick can't fan out unboundedly
    var slug="watch-"+term.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
    // Inbox arc Slice 1: a term that differs only in spacing/hyphens/apostrophes is the same watch.
    var dup=watchTerms().some(function(w){ return compactBrand(w.title)===compactBrand(term); });
    if(dup||find(state.watch,slug)){ if(inp) inp.value=""; return; }
    // Inbox arc Slice 10: a new term goes to the BOTTOM of Mark's order (one past the last position).
    var maxPos=-1; watchTerms().forEach(function(w){ var p=watchPos(w); if(p!==Infinity&&p>maxPos) maxPos=p; });
    var row={page:PAGE,item_id:slug,title:term,status:"on",category:"watch",position:maxPos+1,extras:{min_pct:newWatchMin,note:""},created_at:new Date().toISOString(),updated_at:new Date().toISOString()};
    state.watch.push(row); if(inp) inp.value=""; newWatchMin=0; renderWatchList();
    var nm=el("newwatchmin"); if(nm) nm.textContent=pctMinLabel(newWatchMin);
    withSave(api("press_tasks?on_conflict=page,item_id",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(row)}));
  }
  // Slice 4: per-watch "Min % off" stepper — 5-pt steps, 0 ("Any") to 90; writes extras.min_pct.
  function stepWatch(id,delta,btn){
    var w=find(state.watch,id); if(!w) return; w.extras=w.extras||{};
    var v=Math.max(0,Math.min(90,(Number(w.extras.min_pct)||0)+delta));
    w.extras.min_pct=v; var out=btn.parentNode.querySelector("output"); if(out) out.textContent=pctMinLabel(v);
    withSave(patchTask(id,{extras:w.extras,updated_at:new Date().toISOString()}));
  }
  // Slice 4: the add-row "Min % off" for the NEXT watch (not yet persisted — applied on Watch).
  function stepNewWatch(delta,btn){
    newWatchMin=Math.max(0,Math.min(90,(Number(newWatchMin)||0)+delta));
    var out=btn.parentNode.querySelector("output"); if(out) out.textContent=pctMinLabel(newWatchMin);
  }
  // Enhancements Slice 7 — click a watch's term to edit it inline. Enter or blur saves (press_tasks
  // title), Esc cancels; an empty term is never saved (the original stays).
  function editWatch(id){
    var w=find(state.watch,id); var btn=document.querySelector('[data-editwatch="'+id+'"]'); if(!w||!btn) return;
    var inp=document.createElement("input"); inp.type="text"; inp.className="wedit"; inp.value=w.title; inp.maxLength=80;
    inp.setAttribute("aria-label","Watch term"); var done=false;
    // polish Slice 5 (Eye): the inline edit says how to finish it.
    var hint=document.createElement("span"); hint.className="wedit-hint"; hint.id="wedit-hint-"+id; hint.textContent="Enter to save · Esc to cancel";
    inp.setAttribute("aria-describedby",hint.id);
    function finish(save){
      if(done) return; done=true;
      var v=(inp.value||"").trim();
      if(save&&v&&v!==w.title){ w.title=v; withSave(patchTask(id,{title:v,updated_at:new Date().toISOString()})); }
      else if(save&&!v){ sync("err","A watch term can’t be empty"); }
      renderWatchList();
      var nb=document.querySelector('[data-editwatch="'+id+'"]'); if(nb) nb.focus();
    }
    inp.addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); finish(true); } else if(e.key==="Escape"){ e.preventDefault(); finish(false); } });
    inp.addEventListener("blur",function(){ finish(true); });
    btn.replaceWith(inp); inp.insertAdjacentElement("afterend",hint); inp.focus(); inp.select();
  }
  function removeWatch(id){
    state.watch=watchTerms().filter(function(w){ return w.item_id!==id; });
    renderWatchList();
    withSave(api("press_tasks?page=eq."+PAGE+"&item_id=eq."+encodeURIComponent(id),{method:"DELETE",headers:{Prefer:"return=minimal"}}));
  }

  function selectTab(tabId){
    ["feed","sales","rules","sources","alerts"].forEach(function(name){
      var tab=el("tab-"+name), panel=el("panel-"+name), on=("tab-"+name)===tabId;
      tab.setAttribute("aria-selected",on); panel.hidden=!on;
    });
    measureSticky();
  }
  // Measure the real sticky stack so .grouphead / .quicknav scroll-margin-top matches it and every
  // jump lands the heading fully below the bar (not the old hard-coded 120px). --stick = the sticky
  // header; --stick2 = the Rules search bar (sticky under the header) when the Rules tab is showing.
  function measureSticky(){
    var root=document.documentElement;
    var header=document.querySelector("header");
    if(header) root.style.setProperty("--stick", Math.round(header.getBoundingClientRect().height)+"px");
    var sb=document.querySelector("#panel-rules:not([hidden]) .searchbar");
    root.style.setProperty("--stick2", (sb?Math.round(sb.getBoundingClientRect().height):0)+"px");
  }
  // keyboard: arrow between tabs
  document.querySelector("nav").addEventListener("keydown",function(ev){
    var order=["tab-feed","tab-sales","tab-rules","tab-sources","tab-alerts"]; var i=order.indexOf(document.activeElement.id);
    if(i<0) return; var n=null;
    if(ev.key==="ArrowRight") n=order[(i+1)%order.length];
    else if(ev.key==="ArrowLeft") n=order[(i-1+order.length)%order.length];
    if(n){ ev.preventDefault(); el(n).focus(); selectTab(n); }
  });

  // ---------- boot (passkey-gated) ----------
  // The shared press passkey gate (inlined above) blocks the WHOLE app until the private-wing vault
  // session holds Card Scout's credentials. Card Scout's keyring entry is { sync_id, pass: SENTINEL }
  // — the wing seals an inert sentinel (see press index.html) so the shared gate's credsFor() is
  // satisfied. Mounted UNCONDITIONALLY (like fsa.html, NOT retirement's everEnrolled() conditional):
  // a fresh or locked browser sees only the gate and NEVER queries the DB. Do NOT edit gate.js.
  function boot(){
    loadLS();
    state.locked = !planId();
    renderAll();
    measureSticky();
    if(state.sources && state.sources.length){ sync(state.locked?"locked":"", state.locked?"Locked":"Cached"); }
    refresh();
  }
  // Keep the measured sticky offsets current: on header resize, viewport resize, and once fonts land
  // (a late webfont can grow the header after first paint).
  if(window.ResizeObserver){ try{ new ResizeObserver(measureSticky).observe(document.querySelector("header")); }catch(e){} }
  window.addEventListener("resize", measureSticky);
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(measureSticky).catch(function(){}); }
  function lockDown(){
    // Session lost (Lock now / TTL expiry): drop sensitive data from memory and the screen; the gate
    // re-mounts over the top. Deals are cleared; the page is back behind the passkey.
    state.deals = []; state.locked = true; stopOutlookPoll(); outlookFlow = null;
    renderAll();
  }
  if(window.PressGate && typeof PressGate.guard === "function"){
    PressGate.guard({ page:"card-scout.html", onUnlock: boot, onLock: lockDown });
  } else {
    // The vendored gate is inlined first and its presence is fail-closed at release; if it is somehow
    // missing at runtime, fail SAFE — stay locked, never boot the app open.
    console.error("[card-scout] PressGate missing — refusing to boot unlocked.");
  }
  window.addEventListener("online", function(){ if(planId()) refresh(); });
})();
</script>
