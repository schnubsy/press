<title>Cardsharp</title>
<!-- Redirect stub (cardsharp own-origin pilot, 2026-11-13): Cardsharp now lives at its own address with its own passkey.
     Keeps old bookmarks and the home-screen icon working; the ?query and #hash (deep links) are preserved. No app code,
     no data, no credentials: the only other work is emptying the RETIRED 7-day seal (a version-2 tombstone no old page can open). -->
<script>
var go = function () { location.replace('https://schnubsy-cardsharp.github.io/' + location.search + location.hash); };
try { var k = 'press:vault:v1', s = JSON.parse(localStorage.getItem(k) || 'null'); if (s && 'seal' in s) { delete s.seal; localStorage.setItem(k, JSON.stringify(s)); } } catch (e) {}
try { var o = indexedDB.open('press:vault:seal', 2); o.onupgradeneeded = function () { var d = o.result, n = d.objectStoreNames; for (var i = n.length - 1; i >= 0; i--) d.deleteObjectStore(n[i]); };
  o.onsuccess = function () { o.result.close(); go(); }; o.onerror = o.onblocked = go; setTimeout(go, 400); } catch (e) { go(); }
</script>
