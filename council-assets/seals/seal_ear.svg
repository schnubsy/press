<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Official Ear seal — The Standard (final), v2.2.1. Concentric arcs converging on a node; optically centered, uses less of its square by design. -->
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(64,64)" filter="url(#glow)">
    <path d="M -18 -44 A 44 44 0 0 1 -18 44" fill="none" stroke="#56B896" stroke-width="6" stroke-linecap="round"/>
    <path d="M -18 -24 A 24 24 0 0 1 -18 24" fill="none" stroke="#56B896" stroke-width="6" stroke-linecap="round"/>
    <circle cx="-20" r="8" fill="#56B896"/>
  </g>
</svg>
