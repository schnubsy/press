<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Official Hand seal — The Standard (final), optical-width corrected. Five fingers: thumb/index/middle/ring/pinky, uniform 6px stroke. Span 79.6px (centerlines ±39.8/±19.9) — optically equal to the Eye's 88px circle rather than measured-equal, since sparse verticals read wider than a closed form. -->
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(64,64)" filter="url(#glow)" stroke="#C97F52" stroke-width="6" stroke-linecap="round">
    <line x1="-39.8" y1="44" x2="-39.8" y2="16"/>
    <line x1="-19.9" y1="44" x2="-19.9" y2="-31"/>
    <line x1="0"     y1="44" x2="0"     y2="-44"/>
    <line x1="19.9"  y1="44" x2="19.9"  y2="-35"/>
    <line x1="39.8"  y1="44" x2="39.8"  y2="-17"/>
  </g>
</svg>
