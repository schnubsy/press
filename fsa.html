/* styles/tokens.css */
/* tokens.css — Apparatus Gauge palette + type + grid. Exact hexes only; no others anywhere. */
:root, [data-theme="dark"] {
  --base:#14161A; --surface:#1C2026; --ink:#E6E9ED; --dim:#8C949E; --hairline:#2A2F36;
  --accent:#00A3E0; --warn:#E0A400; --danger:#E0483A; --neutral:#6C7684; --neutral-deep:#383F48;
  --font-display:'Space Grotesk', system-ui, sans-serif;
  --font-mono:'Azeret Mono', ui-monospace, monospace;
  --s1:8px; --s2:16px; --s3:24px; --s4:32px; --s5:40px; --s6:48px;
}
[data-theme="light"] {
  --base:#ECEDEF; --surface:#FFFFFF; --ink:#14161A; --dim:#5A6068; --hairline:#D8DBDF;
  --accent:#0273A8; --warn:#92650A; --danger:#B03626;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme]) {
    --base:#ECEDEF; --surface:#FFFFFF; --ink:#14161A; --dim:#5A6068; --hairline:#D8DBDF;
    --accent:#0273A8; --warn:#92650A; --danger:#B03626;
  }
}

/* styles/base.css */
/* base.css — movement discipline: flat planes, hairlines, no radius/shadow/gradient, 8px grid. */
* { border-radius: 0; box-sizing: border-box; }
/* The `hidden` attribute must win over component display rules (e.g. #readout is display:grid) —
   the signed-out view and the inbox toggle rely on it to actually hide sections. */
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--base);
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 15px;
  line-height: 1.4;
}
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.dim { color: var(--dim); }
.vh {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
main { max-width: 960px; margin: 0 auto; padding: 0 var(--s2) var(--s6); }
body.preboot main { visibility: hidden; }  /* revealed after first full render — one paint, no layout shift */
a, button, select { font-family: inherit; }
button {
  background: var(--surface); color: var(--ink); border: 1px solid var(--hairline);
  padding: var(--s1); cursor: pointer; transition: border-color 120ms;
}
button:hover { border-color: var(--accent); }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
select {
  background: var(--surface); color: var(--ink); border: 1px solid var(--hairline);
  padding: 4px var(--s1); font-family: var(--font-mono);
}

#topbar {
  display: flex; align-items: center; gap: var(--s2);
  max-width: 960px; margin: 0 auto; padding: var(--s2);
  border-bottom: 1px solid var(--hairline);
}
.wordmark { font-family: var(--font-display); font-weight: 600; font-size: 20px; letter-spacing: .04em; }
#asof { font-size: 12px; }
#theme-toggle { margin-left: auto; line-height: 1; }
.pill-sync { font-size: 11px; border: 1px solid var(--hairline); padding: 2px 6px; color: var(--dim); }

.section-h {
  font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim);
  font-weight: 600; margin: var(--s3) 0 var(--s1);
}

/* inbox (review queue) — flat editable cards, hairline-separated (slice 4) */
#inbox-list .inbox-item { border-top: 1px solid var(--hairline); padding: var(--s2) 0; }
#inbox-list .inbox-item:first-child { border-top: 0; }
.inbox-meta { font-size: 11px; margin: 0 0 var(--s1); }
.inbox-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: var(--s1) var(--s2); }
.inbox-field { display: flex; flex-direction: column; gap: 2px; }
.inbox-label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); }
.inbox-form input { background: var(--surface); color: var(--ink); border: 1px solid var(--hairline); padding: 4px var(--s1); font-size: 13px; }
.inbox-actions { display: flex; flex-wrap: wrap; gap: var(--s1); margin-top: var(--s2); }
.inbox-error { color: var(--ink); font-size: 12px; margin: var(--s1) 0 0; border-left: 2px solid var(--danger); padding-left: var(--s1); }

/* (arc/passkey-only: the sync-id + passphrase unlock panel and its styles were removed —
   the private-wing passkey gate is the single unlock surface now.) */
#signout { line-height: 1; font-size: 12px; }

/* agent control (slice 5) */
#agents { display: inline-flex; align-items: center; gap: var(--s1); }
.agent-badge { font-size: 11px; color: var(--dim); }

/* styles/gauge.css */
/* gauge.css — the hero. One flat bar, four segments: paid (fill) · pending (hatched) · denied
   (outlined) · empty (available). Below it, a mono readout of all four figures. */
#gauge { margin-top: var(--s3); }
#gauge-bar {
  position: relative; display: flex; height: 48px; width: 100%;
  border: 1px solid var(--hairline); background: var(--surface); overflow: hidden;
}
#gauge-fill { background: var(--accent); height: 100%; width: 0; }
/* Animate the fill only when motion is welcome (slice 5). */
@media (prefers-reduced-motion: no-preference) {
  #gauge-fill, #gauge-pending, #gauge-denied { transition: width 600ms ease; }
}
/* pending — in flight, awaiting Fidelity's decision: a muted neutral fill (flat, no gradient). */
#gauge-pending { height: 100%; width: 0; background: var(--neutral); }
/* denied — returns to the pool: an OUTLINED box (not filled), tappable to jump to the cards. */
#gauge-denied {
  height: 100%; width: 0; padding: 0; background: transparent;
  border: 1px solid var(--danger); box-sizing: border-box; cursor: pointer; min-width: 0;
}
#gauge-denied:hover { background: var(--surface); }
#gauge-unfilled { position: relative; flex: 1 1 auto; height: 100%; display: flex; align-items: center; justify-content: flex-end; }
#gauge-label { font-size: 13px; padding: 0 var(--s1); color: var(--ink); font-variant-numeric: tabular-nums; }
#gauge-ticks { position: absolute; inset: 0; pointer-events: none; }
#gauge-note { font-size: 11px; margin: 4px 0 0; color: var(--ink); }

/* gauge tick marks + scale labels */
#gauge-ticks .tick { position: absolute; bottom: 0; width: 1px; height: 25%; background: var(--hairline); }
#gauge-ticks .tick.major { height: 55%; }
#gauge-scale { position: relative; height: 16px; margin-top: 2px; }
#gauge-scale .scale-label { position: absolute; top: 0; transform: translateX(-50%); font-size: 11px; color: var(--dim); white-space: nowrap; }
#gauge-scale .scale-label.end { transform: translateX(-100%); }
/* Narrow screens: the readout carries the numbers, so drop the crowded interior scale labels. */
@media (max-width: 560px) {
  #gauge-scale .scale-label:not(.end) { display: none; }
}

/* the four-figure mono readout — a segmented bar means nothing to a screen reader or in sunlight */
#gauge-readout {
  display: grid; grid-template-columns: repeat(4, 1fr); margin-top: var(--s2);
  border: 1px solid var(--hairline);
}
#gauge-readout .g-fig { padding: var(--s2); border-left: 1px solid var(--hairline); display: flex; flex-direction: column; gap: 4px; }
#gauge-readout .g-fig:first-child { border-left: 0; }
#gauge-readout .g-fig-l { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); font-weight: 600; }
/* bold + 22px makes these "large text" (WCAG 3:1), which the fixed palette needs for accent/danger. */
#gauge-readout .g-fig-v { font-size: 22px; color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
#gauge-readout .g-fig-paid .g-fig-v { color: var(--accent); }
#gauge-readout .g-fig-denied .g-fig-v { color: var(--danger); }   /* label stays dim — the ⚠ glyph + word carry it */
@media (max-width: 640px) {
  #gauge-readout { grid-template-columns: repeat(2, 1fr); }
  #gauge-readout .g-fig:nth-child(3) { border-left: 0; }
  #gauge-readout .g-fig:nth-child(3), #gauge-readout .g-fig:nth-child(4) { border-top: 1px solid var(--hairline); }
}

/* styles/table.css */
/* table.css — chips + claims table. Flat, hairline-ruled, radius 0. (Refined in slice 3.) */
#chips { display: flex; flex-wrap: wrap; gap: var(--s1); margin: var(--s3) 0 var(--s2); }
.chip { background: transparent; border: 1px solid var(--hairline); color: var(--dim); padding: 4px var(--s1); font-size: 13px; }
.chip[aria-selected="true"] { border-color: var(--accent); color: var(--ink); }

#claims-table { width: 100%; border-collapse: collapse; font-size: 14px; }
#claims-table th, #claims-table td { text-align: left; padding: var(--s1); border-bottom: 1px solid var(--hairline); vertical-align: top; }
#claims-table th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); font-weight: 600; cursor: pointer; }
#claims-table td.num, #claims-table th.num { text-align: right; }
.col-amount, .col-claimed, .col-date, .col-docs { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.tag { font-size: 11px; color: var(--warn); background: var(--surface); padding: 0 4px; }
.note-line { font-size: 11px; color: var(--dim); display: block; }
.status { font-size: 12px; border: 1px solid var(--hairline); padding: 1px 6px; background: var(--surface); }
.status.submitted { border-color: var(--neutral-deep); color: var(--ink); }
.status.candidate { border-color: var(--accent); color: var(--accent); }
.status.waiting, .status.needs-receipt { border-color: var(--warn); color: var(--warn); }
.status.denied { border-color: var(--danger); color: var(--danger); }
.status.skipped { border-color: var(--dim); color: var(--dim); }
.status.parked { border-color: var(--dim); color: var(--dim); margin-left: 4px; }
/* Below 768px an 8-column table can't hold its shape — restack each row as a card (slice 5). */
@media (max-width: 767px) {
  #claims-table thead { display: none; }  /* each cell self-labels via data-label; no header row needed */
  #claims-table, #claims-table tbody, #claims-table tr, #claims-table td { display: block; width: auto; }
  #claims-table tr { border: 1px solid var(--hairline); margin-bottom: var(--s2); padding: var(--s1) var(--s2); }
  #claims-table td { border-bottom: 0; padding: 4px 0; display: flex; justify-content: space-between; gap: var(--s2); text-align: right; }
  #claims-table td.col-provider { flex-direction: column; align-items: flex-start; text-align: left; }
  #claims-table td.num { text-align: right; }
  #claims-table td::before {
    content: attr(data-label); color: var(--dim); font-size: 11px; text-transform: uppercase;
    letter-spacing: .06em; font-weight: 600; font-family: var(--font-display); text-align: left;
  }
  #claims-table td.col-provider::before { margin-bottom: 2px; }
  #claims-table td.col-date { border-bottom: 1px solid var(--hairline); padding-bottom: var(--s1); margin-bottom: 4px; }
  #claims-table tr.small-summary { padding: 0; border: 0; }
  #claims-table tr.small-summary td { display: block; }
  #claims-table tr.small-summary td::before { content: none; }
  .small-toggle { min-height: 44px; }
  /* 44px tap targets on touch */
  .chip, .blocked-action, .strip-confirm, #overflow-btn, #disclosure > summary,
  .nextclaim-checklist > summary { min-height: 44px; display: inline-flex; align-items: center; }
}

/* styles/chase.css */
/* chase.css — the reshape (arc/chase-list). Flat instrument geometry, hairlines, 8px grid, cyan
   accent, danger for denied/alarm, warn for aging. No radius/shadow/gradient beyond functional hatch. */

/* --- header: year control, agent alert, overflow menu --- */
#year-static { font-size: 13px; letter-spacing: .04em; }
.agent-alert { font-size: 12px; color: var(--danger); border: 1px solid var(--danger); background: var(--surface); padding: 2px 6px; }
.overflow { margin-left: auto; position: relative; }
#overflow-btn { line-height: 1; font-size: 18px; padding: 2px 8px; }
#overflow-menu {
  position: absolute; right: 0; top: calc(100% + 4px); z-index: 20;
  background: var(--surface); border: 1px solid var(--hairline); min-width: 12rem;
  display: flex; flex-direction: column;
}
#overflow-menu > * { border: 0; border-top: 1px solid var(--hairline); text-align: left; padding: var(--s1) var(--s2); background: var(--surface); }
#overflow-menu > *:first-child { border-top: 0; }
#overflow-menu #agents { display: flex; gap: var(--s1); align-items: center; flex-wrap: wrap; }
#topbar #theme-toggle { margin-left: 0; }

/* --- deadline strip: a thin full-width mono rule --- */
#deadline { border-top: 1px solid var(--hairline); border-bottom: 1px solid var(--hairline); padding: var(--s1) 0; margin-top: var(--s2); }
/* 18px/700 = large text, so the amber/alarm escalation colours clear WCAG 3:1 on the fixed palette. */
#deadline-primary { margin: 0; font-size: 18px; letter-spacing: .03em; font-weight: 700; }
#deadline-secondary { margin: 4px 0 0; font-size: 12px; color: var(--dim); }
.strip-confirm { font-size: 11px; padding: 1px 6px; margin-left: 6px; text-transform: uppercase; letter-spacing: .05em; vertical-align: middle; }

/* --- blocked cards: the centrepiece, keyed by person --- */
#blocked { margin-top: var(--s3); }
#blocked-list { display: flex; flex-direction: column; gap: var(--s2); }
.blocked-card { border: 1px solid var(--hairline); border-left: 3px solid var(--neutral-deep); padding: var(--s2); background: var(--surface); }
.blocked-card.is-denial { border-left-color: var(--danger); }
.blocked-top { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s2); }
.blocked-who { font-size: 17px; font-weight: 600; }
.blocked-amt { font-size: 17px; font-variant-numeric: tabular-nums; }
.blocked-meta { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s2); margin-top: 4px; align-items: baseline; }
.blocked-prov { font-size: 12px; }
/* age is the emphasis — carried by weight/size + a glyph, not colour (the fixed palette can't render
   small red/amber text at AA on the card surface). */
.blocked-age { font-size: 15px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.blocked-flag { font-size: 12px; letter-spacing: .03em; color: var(--ink); border: 1px solid var(--danger); padding: 0 6px; }
.blocked-need { margin: var(--s1) 0 0; font-size: 14px; }
.blocked-notice { margin: 2px 0 0; font-size: 11px; overflow-wrap: anywhere; }
.blocked-escalate { margin: var(--s1) 0 0; font-size: 12px; color: var(--ink); font-weight: 600; }
.blocked-actions { margin-top: var(--s2); display: flex; gap: var(--s1); flex-wrap: wrap; }
.blocked-action {
  display: inline-block; font-size: 13px; padding: var(--s1) var(--s2);
  border: 1px solid var(--accent); color: var(--accent); text-decoration: none; background: var(--surface);
}
.blocked-action:hover { color: var(--ink); border-color: var(--ink); }
.danger { color: var(--danger); } .warn { color: var(--warn); }

/* --- next claim: exactly one card, the primary action --- */
#nextclaim { margin-top: var(--s3); }
#nextclaim-card { border: 1px solid var(--accent); padding: var(--s2); background: var(--surface); }
#nextclaim-card.is-empty { border-color: var(--hairline); }
.nextclaim-top { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s2); }
.nextclaim-prov { font-size: 17px; font-weight: 600; }
.nextclaim-amt { font-size: 19px; color: var(--accent); font-variant-numeric: tabular-nums; }
.nextclaim-date { margin: 2px 0 0; font-size: 12px; }
.nextclaim-none { margin: 0; font-size: 14px; }
.nextclaim-checklist { margin-top: var(--s2); }
.nextclaim-checklist > summary { cursor: pointer; font-size: 13px; border: 1px solid var(--accent); color: var(--accent); padding: var(--s1) var(--s2); display: inline-block; }
.nextclaim-checklist[open] > summary { margin-bottom: var(--s1); }
.checklist { list-style: none; padding: 0; margin: var(--s1) 0; display: flex; flex-direction: column; gap: 4px; }
.checklist li { font-size: 13px; }
.checklist li.done { color: var(--dim); }

/* --- setup + open questions --- */
#setup, #questions { margin-top: var(--s3); }
#setup-list { display: flex; flex-direction: column; gap: var(--s2); }
.setup-card { border: 1px solid var(--hairline); padding: var(--s2); background: var(--surface); }
.setup-prov { font-weight: 600; margin-bottom: var(--s1); }
#questions-list { list-style: none; padding: 0; margin: 0; }
.question { display: flex; justify-content: space-between; gap: var(--s2); padding: var(--s1) 0; border-bottom: 1px solid var(--hairline); align-items: baseline; }
.question-text { font-size: 14px; }
.question-age { font-size: 12px; white-space: nowrap; }

/* --- disclosure (all charges) --- */
#claims { margin-top: var(--s3); }
#disclosure > summary { cursor: pointer; font-size: 13px; padding: var(--s1) 0; border-top: 1px solid var(--hairline); border-bottom: 1px solid var(--hairline); font-variant-numeric: tabular-nums; letter-spacing: .03em; list-style: none; }
#disclosure > summary::-webkit-details-marker { display: none; }
#disclosure > summary::before { content: '▸ '; color: var(--dim); }
#disclosure[open] > summary::before { content: '▾ '; }
.small-summary td { padding: var(--s1); }
.small-toggle { font-size: 12px; color: var(--dim); border: 1px dashed var(--hairline); background: transparent; padding: 4px var(--s1); width: 100%; text-align: left; font-variant-numeric: tabular-nums; }
.small-toggle:hover { border-color: var(--accent); color: var(--ink); }

/* styles/print.css */
/* print.css — light tokens forced; chrome hidden; table intact. (Expanded in slice 3.) */
@media print {
  :root, [data-theme="dark"], [data-theme="light"] {
    --base:#FFFFFF; --surface:#FFFFFF; --ink:#14161A; --dim:#5A6068; --hairline:#D8DBDF;
    --accent:#0273A8; --warn:#92650A; --danger:#B03626;
  }
  #theme-toggle, #chips, #syncpill { display: none !important; }
  body { background: #FFFFFF; color: #14161A; }
  #gauge-bar { border: 1px solid #D8DBDF; }
  #claims-table th, #claims-table td { border-bottom: 1px solid #D8DBDF; font-size: 10pt; }
  #claims-table tr { page-break-inside: avoid; }
}

@media print {
  /* gauge as a thin outlined bar; the full sentence + percentage prints as text (from #gauge-sr) */
  #gauge-bar { height: 14px; border: 1px solid #D8DBDF; }
  #gauge-fill { background: #0273A8; }
  #gauge-label { color: #14161A; }
  #gauge-ticks, #gauge-scale { display: none; }
  #gauge-sr { position: static !important; width: auto; height: auto; clip: auto; margin: 4px 0 0; font-size: 10pt; }
  #nextup-list .tag, #claims-table .tag, .status { background: #FFFFFF; }
}

</style>
</head>

  <header id="topbar">
    <span class="wordmark">FSA</span>
    <span id="year-static" class="mono dim" aria-label="Plan year"></span>
    <label class="vh" for="year">Plan year</label>
    <select id="year" aria-label="Plan year" hidden></select>
    <span id="asof" class="mono dim" aria-live="polite"></span>
    <span id="syncpill" class="mono pill-sync" hidden></span>
    <button id="agent-alert" class="agent-alert" type="button" hidden></button>
    <div id="overflow" class="overflow">
      <button id="overflow-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Menu">⋯</button>
      <div id="overflow-menu" role="menu" hidden>
        <button id="theme-toggle" type="button" role="menuitem">Toggle theme</button>
        <span id="agents" role="menuitem"></span>
        <button id="data-export" type="button" role="menuitem" hidden>Download my data (.json)</button>
        <button id="data-export-enc" type="button" role="menuitem" hidden>Download encrypted backup</button>
        <button id="data-import" type="button" role="menuitem" hidden>Import my data…</button>
        <button id="signout" type="button" role="menuitem" hidden>Lock</button>
      </div>
      <input id="data-import-file" type="file" accept="application/json,.json" hidden aria-hidden="true">
    </div>
  </header>

  <main>
    <!-- 2 · DEADLINE STRIP — submission run-out is the primary clock; incur-by the secondary. -->
    <section id="deadline" aria-label="Deadlines" hidden>
      <p id="deadline-primary" class="mono"></p>
      <p id="deadline-secondary" class="mono dim"></p>
    </section>

    <!-- 3 · GAUGE — four segments: paid (fill) · pending (hatched) · denied (outlined) · empty. -->
    <section id="gauge" aria-label="Reimbursement gauge">
      <div id="gauge-bar">
        <div id="gauge-fill"></div>
        <div id="gauge-pending"></div>
        <button id="gauge-denied" type="button" aria-label="Jump to denied claims" hidden></button>
        <div id="gauge-unfilled"><span id="gauge-label" class="mono"></span></div>
        <div id="gauge-ticks" aria-hidden="true"></div>
      </div>
      <div id="gauge-scale" aria-hidden="true"></div>
      <div id="gauge-readout" aria-label="Reimbursement figures"></div>
      <p id="gauge-note" class="dim" hidden></p>
      <p id="gauge-sr" class="vh"></p>
    </section>

    <!-- 4 · BLOCKED (n) — the centrepiece: stacked cards keyed by PERSON. -->
    <section id="blocked" aria-label="Blocked" hidden>
      <h2 class="section-h" id="blocked-h">Blocked</h2>
      <div id="blocked-list"></div>
    </section>

    <!-- 4b · JANUARY SETUP — replaces Blocked in January / the empty state. -->
    <section id="setup" aria-label="Plan-year setup" hidden>
      <h2 class="section-h" id="setup-h">Set up the year</h2>
      <p id="setup-lead" class="dim"></p>
      <div id="setup-list"></div>
    </section>

    <!-- 5 · NEXT CLAIM — exactly one card. -->
    <section id="nextclaim" aria-label="Next claim">
      <h2 class="section-h">Next claim</h2>
      <div id="nextclaim-card"></div>
    </section>

    <!-- OPEN QUESTIONS — each with an age. -->
    <section id="questions" aria-label="Open questions" hidden>
      <h2 class="section-h" id="questions-h">Open questions</h2>
      <ul id="questions-list"></ul>
    </section>

    <!-- 6 · INBOX (n) — rendered only when n > 0. -->
    <section id="inbox" aria-label="Inbox" hidden>
      <h2 class="section-h" id="inbox-h">Inbox</h2>
      <div id="inbox-list"></div>
    </section>

    <!-- 7 · DISCLOSURE — all charges, collapsed by default, amount desc, <$75 folded. -->
    <section id="claims" aria-label="All charges">
      <details id="disclosure">
        <summary id="disclosure-summary" class="mono">All charges</summary>
        <div id="chips" role="tablist" aria-label="Filter claims"></div>
        <table id="claims-table">
          <caption class="vh">Claims for the selected plan year</caption>
          <thead>
            <tr>
              <th scope="col" data-sort="date">Date</th>
              <th scope="col" data-sort="provider">Provider</th>
              <th scope="col" class="h-person" data-sort="person">Person</th>
              <th scope="col" data-sort="amount">Amount</th>
              <th scope="col" data-sort="claimed">Claimed</th>
              <th scope="col" data-sort="status">Status</th>
              <th scope="col">Documents</th>
            </tr>
          </thead>
          <tbody id="claims-body"></tbody>
        </table>
        <p id="claims-empty" class="dim" hidden>No claims for this year.</p>
      </details>
    </section>
  </main>

  const list = (doc && doc.questions) || (yearData(doc, year).questions) || [];
  return list.filter((q) => q && q.text && !q.answered).map((q) => ({
    text: q.text, ageDays: blockerAge({ blocked_since: q.asked }, today), asked: q.asked || null,
  })).sort((a, b) => (b.ageDays ?? -1) - (a.ageDays ?? -1));
}

// Top providers of a year by total claimed/charged amount (for the January setup checklist).
function topProviders(doc, year, n = 3) {
  const totals = new Map();
  for (const c of yearClaims(doc, year)) {
    const k = c.provider || c.payee; if (!k) continue;
    totals.set(k, (totals.get(k) || 0) + (Number(c.amount) || 0));
  }
  return [...totals.entries()].sort((a, b) => b[1] - a[1]).slice(0, n)
    .map(([provider, total]) => ({ provider, total: r2c(total) }));
}

// January setup checklist, built from LAST year's top-3 providers — the strategy: line up big,
// well-documented claims before the money is spent.
function setupChecklist(doc, prevYear) {
  return topProviders(doc, prevYear, 3).map((p) => ({
    provider: p.provider,
    steps: [
      { key: 'statement', label: 'annual itemised statement requested', done: false },
      { key: 'lmn', label: 'Medical Necessity Form signed', done: false },
      { key: 'crossover', label: 'UHC→FSA crossover confirmed', done: false },
    ],
  }));
}

// The collapsed all-charges disclosure: total + count, with everything under `threshold` folded into
// one summary row. `large` are shown individually (amount desc); `small` is the folded tail.
function allChargesSummary(doc, year, threshold = 75) {
  const claims = yearClaims(doc, year);
  const total = r2c(claims.reduce((a, c) => a + (Number(c.amount) || 0), 0));
  const large = claims.filter((c) => (Number(c.amount) || 0) >= threshold)
    .slice().sort((a, b) => (Number(b.amount) || 0) - (Number(a.amount) || 0));
  const smallRows = claims.filter((c) => (Number(c.amount) || 0) < threshold);
  const small = { count: smallRows.length, total: r2c(smallRows.reduce((a, c) => a + (Number(c.amount) || 0), 0)) };
  return { total, count: claims.length, threshold, large, small };
}

// The deadline strip: submission run-out is the primary clock, incur-by the secondary (certain) one.
// Escalate by TEXT as well as colour: amber under 60 days, alarm under 21.
function deadlineStrip(doc, year, today) {
  const d = yearData(doc, year).deadline || {};
  const confirmed = runOutConfirmed(doc, year);
  const runOut = daysToRunOut(doc, year, today);
  const incur = daysToIncur(doc, year, today);
  const level = (n) => n == null ? 'none' : n <= 21 ? 'alarm' : n <= 60 ? 'warn' : 'ok';
  return {
    runOutDate: d.claims_run_out || null, incurDate: d.incur_by || null,
    runOutDays: runOut, incurDays: incur, confirmed,
    runOutLevel: level(runOut), incurLevel: level(incur),
    color: { none: 'dim', ok: 'dim', warn: 'warn', alarm: 'danger' },
  };
}

// Which lifecycle state the year is in — drives which sections dominate (slice 4).
function yearState(doc, year, today) {
  const claims = yearClaims(doc, year);
  const yd = today ? new Date(`${String(today).slice(0, 10)}T00:00:00Z`) : null;
  const isJanuary = yd ? yd.getUTCMonth() === 0 : false;
  const e = election(doc, year);
  const paid = paidTotal(doc, year);
  const avail = available(doc, year);
  const incur = daysToIncur(doc, year, today);
  if (!claims.length && paid === 0) return 'setup';      // empty year
  if (isJanuary && paid < 0.005) return 'setup';         // January, before anything is reimbursed
  if (e > 0 && avail <= 0.005) return 'done';
  if (incur != null && incur <= 45) return 'year-end';
  return 'active';
}

function r2c(n) { return Math.round((Number(n) || 0) * 100) / 100; }

// src/core/crypto.js — client-side encryption for the FSA document.
// Envelope matched BYTE-FOR-BYTE to giving-tracker (src/sync/crypto.js): the whole document
// is encrypted IN THE BROWSER before it reaches the `press` Supabase project and decrypted only
// in the browser. The server stores CIPHERTEXT ONLY; the passphrase never leaves the device.
//
// Scheme: AES-256-GCM (fails closed on wrong key / tamper — decrypt throws before any plaintext)
// with a key derived by PBKDF2-HMAC-SHA-256 >= 310,000 iters, a per-document 128-bit salt and a
// per-write 96-bit IV. kdf_iters is stored so the count can be raised without breaking old blobs.
// Pure, node-testable (WebCrypto is in Node 20+ and every browser); btoa/atob for base64.

const KDF_ITERS = 310000;
const SALT_BYTES = 16;
const IV_BYTES = 12;
const KEY_BITS = 256;

function webcrypto() {
  const c = (typeof globalThis !== 'undefined' && globalThis.crypto) || (typeof crypto !== 'undefined' ? crypto : null);
  if (!c || !c.subtle) throw new Error('WebCrypto (crypto.subtle) unavailable in this environment');
  return c;
}
function randomBytes(n) { const a = new Uint8Array(n); webcrypto().getRandomValues(a); return a; }

function bytesToB64(bytes) {
  let s = '';
  for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return btoa(s);
}
function b64ToBytes(b64) {
  const s = atob(String(b64));
  const a = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
  return a;
}

// unguessable 128-bit sync id (a secret capability, NOT a name)
function newSyncId() {
  const b = randomBytes(16); let hex = '';
  for (let i = 0; i < b.length; i++) hex += (b[i] + 0x100).toString(16).slice(1);
  return hex;
}

async function deriveKey(passphrase, saltBytes, iters) {
  const enc = new TextEncoder();
  const base = await webcrypto().subtle.importKey('raw', enc.encode(String(passphrase)), { name: 'PBKDF2' }, false, ['deriveKey']);
  return webcrypto().subtle.deriveKey(
    { name: 'PBKDF2', salt: saltBytes, iterations: iters, hash: 'SHA-256' },
    base,
    { name: 'AES-GCM', length: KEY_BITS },
    false,
    ['encrypt', 'decrypt'],
  );
}

// Encrypt an object -> { ciphertext, iv, salt, kdf_iters } (base64 / int).
async function encryptDoc(docObj, passphrase, opts) {
  opts = opts || {};
  if (passphrase == null || String(passphrase) === '') throw new Error('passphrase required');
  const iters = opts.kdf_iters || KDF_ITERS;
  const salt = opts.salt ? b64ToBytes(opts.salt) : randomBytes(SALT_BYTES);
  const iv = randomBytes(IV_BYTES);
  const key = await deriveKey(passphrase, salt, iters);
  const pt = new TextEncoder().encode(JSON.stringify(docObj));
  const ct = await webcrypto().subtle.encrypt({ name: 'AES-GCM', iv }, key, pt);
  return { ciphertext: bytesToB64(new Uint8Array(ct)), iv: bytesToB64(iv), salt: bytesToB64(salt), kdf_iters: iters };
}

// Decrypt { ciphertext, iv, salt, kdf_iters } -> object, or null. FAILS CLOSED.
async function decryptDoc(record, passphrase) {
  try {
    if (!record || record.ciphertext == null || record.iv == null || record.salt == null) return null;
    const iters = record.kdf_iters || KDF_ITERS;
    const key = await deriveKey(passphrase, b64ToBytes(record.salt), iters);
    const ptBuf = await webcrypto().subtle.decrypt(
      { name: 'AES-GCM', iv: b64ToBytes(record.iv) }, key, b64ToBytes(record.ciphertext),
    );
    return JSON.parse(new TextDecoder().decode(ptBuf));
  } catch (e) { return null; }
}

const CONSTS = { KDF_ITERS, SALT_BYTES, IV_BYTES, KEY_BITS };

// Generate the app's ECDH P-256 capture keypair (public seals inbound items in the agents;
// private opens them in the browser). Returns { public_jwk, private_jwk }. Generated once.
async function generateCaptureKeypair() {
  const kp = await webcrypto().subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveBits']);
  const public_jwk = await webcrypto().subtle.exportKey('jwk', kp.publicKey);
  const private_jwk = await webcrypto().subtle.exportKey('jwk', kp.privateKey);
  return { public_jwk, private_jwk };
}

// src/core/cloud.js — PostgREST client for press_fsa. Injected fetch (opts.fetchImpl) so the
// whole thing is node-testable offline against a fake PostgREST. Sends only ciphertext.
// The publishable (anon) key is the ONLY key embedded in the built page (safe by press convention).
const FSA_SUPABASE_URL = 'https://eepjhpyziczrxvirczio.supabase.co';
const FSA_REST = 'https://eepjhpyziczrxvirczio.supabase.co/rest/v1';
const FSA_FUNCTIONS = 'https://eepjhpyziczrxvirczio.functions.supabase.co';
const FSA_PUBLISHABLE = 'sb_publishable__iv3bI7xDAsOdHUlXzbVZQ_2yyFS4uX';

class ConflictError extends Error {
  constructor(msg) { super(msg || 'version conflict'); this.name = 'ConflictError'; }
}

function makeClient(opts = {}) {
  const rest = opts.rest || FSA_REST;
  const key = opts.key || FSA_PUBLISHABLE;
  const fetchImpl = opts.fetchImpl || (typeof fetch !== 'undefined' ? fetch : null);
  if (!fetchImpl) throw new Error('no fetch available (pass opts.fetchImpl)');

  function headers(syncId, extra) {
    return {
      apikey: key,
      Authorization: `Bearer ${key}`,
      'x-plan-id': syncId,
      'Content-Type': 'application/json',
      ...(extra || {}),
    };
  }

  // Load the row for a sync id -> { doc, version } (the envelope + row version), or null.
  async function load(syncId) {
    const url = `${rest}/press_fsa?sync_id=eq.${encodeURIComponent(syncId)}&select=doc,version`;
    const res = await fetchImpl(url, { method: 'GET', headers: headers(syncId) });
    if (!res.ok) throw new Error(`load failed: ${res.status}`);
    const rows = await res.json();
    return (Array.isArray(rows) && rows[0]) ? { doc: rows[0].doc, version: rows[0].version } : null;
  }

  // Save the envelope. currentVersion null => first insert; else optimistic PATCH.
  // Returns the new row version. Throws ConflictError if someone else wrote first.
  async function save(syncId, envelope, currentVersion) {
    if (currentVersion == null) {
      const url = `${rest}/press_fsa?on_conflict=sync_id`;
      const res = await fetchImpl(url, {
        method: 'POST',
        headers: headers(syncId, { Prefer: 'resolution=merge-duplicates,return=representation' }),
        body: JSON.stringify({ sync_id: syncId, doc: envelope, version: 0, updated_at: new Date().toISOString() }),
      });
      if (!res.ok) throw new Error(`insert failed: ${res.status}`);
      const rows = await res.json();
      return (Array.isArray(rows) && rows[0]) ? rows[0].version : 0;
    }
    const next = currentVersion + 1;
    const url = `${rest}/press_fsa?sync_id=eq.${encodeURIComponent(syncId)}&version=eq.${currentVersion}`;
    const res = await fetchImpl(url, {
      method: 'PATCH',
      headers: headers(syncId, { Prefer: 'return=representation' }),
      body: JSON.stringify({ doc: envelope, version: next, updated_at: new Date().toISOString() }),
    });
    if (!res.ok) throw new Error(`update failed: ${res.status}`);
    const rows = await res.json();
    if (!Array.isArray(rows) || rows.length === 0) throw new ConflictError('someone else wrote first');
    return rows[0].version;
  }

  // --- review queue (sealed) ---
  async function loadPending(syncId) {
    const url = `${rest}/press_fsa_review_queue?sync_id=eq.${encodeURIComponent(syncId)}&status=eq.pending&select=*`;
    const res = await fetchImpl(url, { method: 'GET', headers: headers(syncId) });
    if (!res.ok) throw new Error(`loadPending failed: ${res.status}`);
    const rows = await res.json();
    return Array.isArray(rows) ? rows : [];
  }
  async function decideQueue(syncId, id, status) {
    const url = `${rest}/press_fsa_review_queue?id=eq.${encodeURIComponent(id)}`;
    const res = await fetchImpl(url, {
      method: 'PATCH',
      headers: headers(syncId, { Prefer: 'return=representation' }),
      body: JSON.stringify({ status, decided_at: new Date().toISOString() }),
    });
    if (!res.ok) throw new Error(`decideQueue failed: ${res.status}`);
    const rows = await res.json();
    return (Array.isArray(rows) && rows[0]) ? rows[0] : null;
  }

  return { load, save, loadPending, decideQueue, rest, key };
}

// council-agent@3.4.0
// src/core/inbox.js — the PERSISTENT needs-review inbox, vendored from the council agent instrument
// (instruments/agent/app/inbox.js) and converted to ESM. Behaviour identical: same function names,
// same `deps` injection contract (apply, mergeInto, save, deleteFile). A review draft lives inside the
// app document at doc.inbox.pending[] — it survives reload and is removed only on approve/merge/dismiss
// after a successful save. Pure and node-testable: no DOM, no network, no per-app knowledge.

function ensureInbox(doc) {
  if (!doc.inbox || typeof doc.inbox !== 'object') doc.inbox = { pending: [] };
  if (!Array.isArray(doc.inbox.pending)) doc.inbox.pending = [];
  return doc.inbox;
}

function addPending(doc, draft) {
  const ib = ensureInbox(doc);
  if (draft && draft.id && !ib.pending.some((d) => d.id === draft.id)) ib.pending.push(draft);
  return ib.pending;
}

function pendingList(doc) { return ensureInbox(doc).pending.slice(); }

function findPending(doc, id) {
  const ib = ensureInbox(doc);
  for (let i = 0; i < ib.pending.length; i++) if (ib.pending[i].id === id) return ib.pending[i];
  return null;
}

function attFileId(a) { return a ? (a.file_id || a.id) : null; }

function fileReferenced(doc, fileId) {
  if (!fileId) return false;
  const ib = ensureInbox(doc);
  for (let i = 0; i < ib.pending.length; i++) {
    const f = ib.pending[i] && ib.pending[i].file;
    if (f && f.id === fileId) return true;
  }
  const atts = doc.attachments || [];
  for (let j = 0; j < atts.length; j++) if (attFileId(atts[j]) === fileId) return true;
  return false;
}

function removePending(doc, id) {
  const ib = ensureInbox(doc);
  let draft = null;
  ib.pending = ib.pending.filter((d) => { if (d.id === id) { draft = d; return false; } return true; });
  let orphan = null;
  if (draft && draft.file && draft.file.id && !fileReferenced(doc, draft.file.id)) orphan = draft.file.id;
  return { removed: !!draft, draft, orphanFileId: orphan };
}

async function approve(doc, id, deps) {
  deps = deps || {};
  const draft = findPending(doc, id);
  if (!draft) return { ok: false, reason: 'not-found' };
  const created = (typeof deps.apply === 'function') ? (deps.apply(doc, draft) || []) : [];
  removePending(doc, id);
  if (typeof deps.save === 'function') await deps.save(doc);
  return { ok: true, created };
}

async function merge(doc, id, targetId, deps) {
  deps = deps || {};
  const draft = findPending(doc, id);
  if (!draft) return { ok: false, reason: 'not-found' };
  const merged = (typeof deps.mergeInto === 'function') ? deps.mergeInto(doc, draft, targetId) : null;
  removePending(doc, id);
  if (typeof deps.save === 'function') await deps.save(doc);
  return { ok: true, merged, targetId };
}

async function dismiss(doc, id, deps) {
  deps = deps || {};
  const res = removePending(doc, id);
  if (!res.removed) return { ok: false, reason: 'not-found' };
  if (res.orphanFileId && typeof deps.deleteFile === 'function') await deps.deleteFile(res.orphanFileId);
  if (typeof deps.save === 'function') await deps.save(doc);
  return { ok: true, freedFileId: res.orphanFileId };
}

// src/core/unseal.js — the RECEIVER half of the capture sealed box (browser). Opens a box
// { v:1, epk, iv, ct } produced by the agents' sealWithInfo(obj, PUBLIC_JWK, 'marquee/fsa/v1')
// using the capture PRIVATE jwk stored inside the app's encrypted document. ECDH P-256 +
// HKDF-SHA-256 (info 'marquee/fsa/v1') + AES-256-GCM. FAILS CLOSED (wrong key / tamper -> null).


const FSA_SEAL_INFO = 'marquee/fsa/v1';
const CURVE = 'P-256';

function wc() {
  const c = (typeof globalThis !== 'undefined' && globalThis.crypto) || (typeof crypto !== 'undefined' ? crypto : null);
  if (!c || !c.subtle) throw new Error('WebCrypto unavailable');
  return c;
}

async function aesKeyFromShared(privateKey, ephPublicKey, info) {
  const bits = await wc().subtle.deriveBits({ name: 'ECDH', public: ephPublicKey }, privateKey, 256);
  const base = await wc().subtle.importKey('raw', bits, 'HKDF', false, ['deriveKey']);
  return wc().subtle.deriveKey(
    { name: 'HKDF', hash: 'SHA-256', salt: new Uint8Array(0), info: new TextEncoder().encode(info) },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
}

async function unseal(box, privateJwk, info = FSA_SEAL_INFO) {
  try {
    if (!box || box.v !== 1 || !box.epk || !box.iv || !box.ct) return null;
    const priv = await wc().subtle.importKey('jwk', privateJwk, { name: 'ECDH', namedCurve: CURVE }, false, ['deriveBits']);
    const eph = await wc().subtle.importKey('raw', b64ToBytes(box.epk), { name: 'ECDH', namedCurve: CURVE }, false, []);
    const key = await aesKeyFromShared(priv, eph, info);
    const pt = await wc().subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(box.iv) }, key, b64ToBytes(box.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  } catch (e) {
    return null; // fail closed
  }
}

// src/ui/gauge.js — the hero gauge. Pure model (gaugeModel/gaugeTicks) + DOM render.



function tickLabel(v) { return money(v).replace(/\.00$/, ''); }

// Tick marks: minor every $100, major every $500 (labelled). Positions as % of the election scale.
function gaugeTicks(electionAmt) {
  const ticks = [];
  if (!(electionAmt > 0)) return ticks;
  for (let v = 100; v < electionAmt; v += 100) {
    const major = v % 500 === 0;
    ticks.push({ value: v, pct: (v / electionAmt) * 100, major, label: major ? tickLabel(v) : null });
  }
  return ticks;
}

function gaugeModel(doc, year, today) {
  const e = election(doc, year);
  const sub = submittedTotal(doc, year);
  const den = deniedTotal(doc, year);
  const pend = pendingTotal(doc, year);
  const paid = paidTotal(doc, year);
  const avail = available(doc, year);
  const unc = unclaimed(doc, year);
  // Four segments partitioning [0, election]: paid (fill) · pending (hatched) · denied (outlined) ·
  // empty (the flex remainder). still-yours (available = election − paid) = pending + denied + empty.
  const clampPct = (v) => e > 0 ? Math.max(0, Math.min(100, (v / e) * 100)) : 0;
  const pct = clampPct(paid);                    // fill = PAID (denied returns to the pool)
  const pctPending = clampPct(pend);
  const pctDenied = clampPct(den);
  // The gauge's own clock mirrors the deadline strip: run-out when confirmed, else the certain incur-by.
  const confirmed = runOutConfirmed(doc, year);
  const dl = confirmed ? daysToRunOut(doc, year, today) : daysToIncur(doc, year, today);
  const tail = dl == null ? 'no deadline set' : confirmed ? `${dl} days left` : `${dl} days left to incur`;
  // DONE state (slice 4): the election is fully recovered — a quiet, not celebratory, line.
  const done = e > 0 && avail <= 0.005 && paid > 0;
  const caption = done ? `${money(paid)} recovered · nothing owed` : `${money(avail)} still yours`;
  const sentence = done ? caption : `${money(avail)} still yours · ${tail}`;
  const color = dl == null ? 'dim' : dl <= 7 ? 'danger' : dl <= 30 ? 'warn' : 'dim';
  return {
    election: e, submitted: sub, unclaimed: unc, denied: den, pending: pend, paid, available: avail,
    pct, pctPending, pctDenied, daysLeft: dl, confirmed, caption, sentence, tail, color, ticks: gaugeTicks(e),
  };
}

// One readout cell — label above, tabular-nums figure below, plus a glyph so denied is never
// colour-only (slice 5). Returns the cell element.
function readoutCell(kind, label, value, glyph) {
  const cell = document.createElement('div'); cell.className = `g-fig g-fig-${kind}`;

function renderGauge(doc, year, today) {
  const bar = document.getElementById('gauge-bar');
  const fill = document.getElementById('gauge-fill');
  const pendingEl = document.getElementById('gauge-pending');
  const deniedEl = document.getElementById('gauge-denied');
  const label = document.getElementById('gauge-label');
  const ticksEl = document.getElementById('gauge-ticks');
  const scaleEl = document.getElementById('gauge-scale');
  const note = document.getElementById('gauge-note');
  const sr = document.getElementById('gauge-sr');
  const readout = document.getElementById('gauge-readout');
  if (ticksEl) ticksEl.innerHTML = '';
  if (scaleEl) scaleEl.innerHTML = '';
  if (readout) readout.innerHTML = '';
  if (!doc) {
    fill.style.width = '0%'; if (pendingEl) pendingEl.style.width = '0%'; if (deniedEl) { deniedEl.style.width = '0%'; deniedEl.hidden = true; }
    label.textContent = ''; sr.textContent = ''; note.hidden = true; return;
  }

  const m = gaugeModel(doc, year, today);
  fill.style.width = m.pct.toFixed(2) + '%';
  if (pendingEl) pendingEl.style.width = m.pctPending.toFixed(2) + '%';
  if (deniedEl) { deniedEl.style.width = m.pctDenied.toFixed(2) + '%'; deniedEl.hidden = m.pctDenied <= 0; } // no empty focusable control
  label.textContent = m.caption;
  sr.textContent = `Reimbursement gauge: ${money(m.paid)} paid of ${money(m.election)} (${m.pct.toFixed(0)}%)`
    + (m.pending > 0 ? `, ${money(m.pending)} pending` : '') + (m.denied > 0 ? `, ${money(m.denied)} denied` : '')
    + `. ${m.caption}. ${m.tail}.`;
  note.hidden = m.confirmed || m.daysLeft == null;
  if (!note.hidden) note.textContent = 'run-out date unconfirmed';

  // Visible mono readout of all four figures (slice 5) — a segmented bar means nothing in sunlight.
  if (readout) {
    readout.append(
      readoutCell('paid', 'Paid', money(m.paid)),
      readoutCell('pending', 'Pending', money(m.pending)),
      readoutCell('denied', 'Denied', money(m.denied), '⚠'),
      readoutCell('avail', 'Still yours', money(m.available)),
    );
    readout.setAttribute('aria-label',
      `Paid ${money(m.paid)}, pending ${money(m.pending)}, denied ${money(m.denied)}, still yours ${money(m.available)}.`);
  }

  for (const t of m.ticks) {
    const tick = document.createElement('div');
    tick.className = 'tick' + (t.major ? ' major' : '');

      lab.className = 'scale-label mono'; lab.style.left = t.pct + '%'; lab.textContent = t.label;

// src/ui/strip.js — the deadline strip (slice 3/4). A thin full-width mono rule. The submission
// run-out is the PRIMARY clock; the incur-by date is the secondary (certain) line. Escalates by
// TEXT as well as colour — amber under 60 days, alarm under 21. The run-out is Mark's recollection
// (not published by Fidelity) so it renders UNCONFIRMED until he confirms it.



function urgencyWord(level) { return level === 'alarm' ? 'DUE SOON' : level === 'warn' ? 'CLOSING' : ''; }

function renderDeadlineStrip(doc, year, today, onConfirm) {
  const section = document.getElementById('deadline');
  const primary = document.getElementById('deadline-primary');
  const secondary = document.getElementById('deadline-secondary');
  if (!section) return;
  if (!doc) { section.hidden = true; return; }
  const s = deadlineStrip(doc, year, today);
  section.hidden = !(s.runOutDate || s.incurDate);

  // Primary: the submission deadline. Unconfirmed → "SUBMIT BY 31 MAR 2027 · UNCONFIRMED [confirm]".
  primary.textContent = '';
  const color = s.color[s.confirmed ? s.runOutLevel : 'ok'] || 'dim';
  primary.style.color = `var(--${color})`;
  if (s.runOutDate) {
    const days = s.runOutDays;
    const urg = s.confirmed ? urgencyWord(s.runOutLevel) : '';
    const parts = [`SUBMIT BY ${shortDate(s.runOutDate)}`];
    if (days != null && s.confirmed) parts.push(`${pluralDays(days)} left`);
    if (urg) parts.push(urg);
    if (!s.confirmed) parts.push('UNCONFIRMED');
    primary.append(document.createTextNode(parts.join(' · ') + ' '));
    if (!s.confirmed && typeof onConfirm === 'function') {
      const btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'strip-confirm'; btn.textContent = 'confirm';
      btn.addEventListener('click', onConfirm);
      primary.appendChild(btn);
    }
  } else {
    primary.textContent = 'SUBMISSION DEADLINE NOT SET';
    if (typeof onConfirm === 'function') {
      const btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'strip-confirm'; btn.textContent = 'set date';
      btn.addEventListener('click', onConfirm);
      primary.append(' ', btn);
    }
  }

  // Secondary: the certain incur-by date.
  if (s.incurDate) {
    const days = s.incurDays;
    const urg = urgencyWord(s.incurLevel);
    secondary.textContent = `INCUR BY ${shortDate(s.incurDate)}`
      + (days != null ? ` · ${pluralDays(days)} to spend` : '') + (urg ? ` · ${urg}` : '');
    secondary.hidden = false; // colour stays dim (CSS); urgency is carried by the CLOSING/DUE SOON word
  } else {
    secondary.hidden = true;
  }
}

// src/ui/blocked.js — the centrepiece. Stacked full-width cards keyed by PERSON, so one chase clears
// several rows. Age in days is the emphasis; the card's TEXT escalates at 14 and 30 days (not colour
// alone). Denials are flagged with the Fidelity reason in English and the notice-PDF path on the NAS.



const FIDELITY_URL = 'https://nb.fidelity.com/';
// The app stores FILENAMES only; the notice PDFs live on the NAS. Show the path so Mark can find it.
function noticePath(year, name) { return `Reciepts/${year}/FSA/correspondence/${name}`; }

function elB(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function renderBlocked(doc, year, today, deps) {
  const section = document.getElementById('blocked');
  const list = document.getElementById('blocked-list');
  const head = document.getElementById('blocked-h');
  if (!section || !list) return;
  list.innerHTML = '';
  const cards = doc ? blockedCards(doc, year, today) : [];
  // In the January setup / empty state, Blocked yields to the setup checklist (handled by app.js).
  section.hidden = cards.length === 0;
  head.textContent = `Blocked (${cards.length})`;

  for (const c of cards) {
    const card = elB('div', 'blocked-card' + (c.denied ? ' is-denial' : ''));
    card.dataset.key = c.key;

    const top = elB('div', 'blocked-top');
    const who = elB('span', 'blocked-who', c.who);
    const amt = elB('span', 'blocked-amt mono', money(c.amount));
    top.append(who, amt);
    card.appendChild(top);

    const meta = elB('div', 'blocked-meta');
    if (c.provider && c.provider !== c.who) meta.appendChild(elB('span', 'blocked-prov dim', c.provider));
    if (c.ageDays != null) {
      // Escalation shows in the glyph + word, not colour alone (fixed palette can't pass AA in red here).
      const mark = c.tier.level === 'stale' ? '⚠ ' : c.tier.level === 'aging' ? '↑ ' : '';
      meta.appendChild(elB('span', 'blocked-age mono', `${mark}${pluralDays(c.ageDays)} waiting`));
    } else {
      // Blocking date unknown — show the state, never an invented day count (age from service date was the bug).
      meta.appendChild(elB('span', 'blocked-age mono dim', 'waiting'));
    }
    if (c.denied) meta.appendChild(elB('span', 'blocked-flag mono', '⚠ denied'));
    card.appendChild(meta);

    // What's needed — one line. For a denial, the Fidelity code in English.
    card.appendChild(elB('p', 'blocked-need', c.need));

    // Notice PDF paths for denials.
    for (const d of c.denials) {
      if (!d.notice) continue;
      const n = elB('p', 'blocked-notice mono dim');
      n.textContent = `notice: ${noticePath(year, d.notice)}`;
      card.appendChild(n);
    }

    // Escalation text (14d follow up, 30d go around) — TEXT, not just colour.
    if (c.tier.note) card.appendChild(elB('p', 'blocked-escalate', (c.tier.level === 'stale' ? '→ ' : '↑ ') + c.tier.note));

    const actions = elB('div', 'blocked-actions');
    const action = elB('a', 'blocked-action', c.action);
    action.href = FIDELITY_URL; action.target = '_blank'; action.rel = 'noopener noreferrer';
    actions.appendChild(action);
    card.appendChild(actions);

    list.appendChild(card);
  }
}

/* ---- src/ui/inbox.js ---- */
// src/ui/inbox.js — the review-queue inbox UI. Fetches sealed pending rows, unseals them in the
// browser into doc.inbox.pending (dedupe by id, document-save-first), and lets Mark
// approve / edit / reject / merge each captured item into a claim. Filenames only — never a file/PDF.





// --- ingest: unseal queue rows into the persisted inbox; track rows that fail to open ---
async function ingest(doc, rows) {
  const errors = [];
  for (const row of rows || []) {
    const item = await unseal(row.payload_sealed, doc.capture && doc.capture.private_jwk);
    if (!item) { errors.push({ id: row.id, agent: row.agent }); continue; }
    addPending(doc, { ...item, id: row.id, agent: row.agent, captured_at: row.created_at });
  }
  ensureInbox(doc)._errors = errors;
  return { opened: (rows || []).length - errors.length, errors };
}

async function loadDemoInbox(doc) {
  const el = document.getElementById('demo-inbox');
  let rows = []; try { rows = el ? JSON.parse(el.textContent) : []; } catch (_) { rows = []; }
  return ingest(doc, rows);
}
async function loadLiveInbox(doc, syncId, client) {
  let rows = []; try { rows = await client.loadPending(syncId); } catch (_) { rows = []; }
  return ingest(doc, rows);
}

// --- app-specific write ops injected into the inbox core ---
function newClaimId(draft) { return `cap-${draft.ynab_id || draft.id}`; }
function draftToClaim(draft) {
  return {
    id: newClaimId(draft), ynab_id: draft.ynab_id || null, date: draft.date || null,
    payee: draft.payee || draft.provider || '', account: draft.account || '',
    amount: Number(draft.amount) || 0, provider: draft.provider || draft.payee || '',
    type: draft.type || 'Medical Services', person: draft.person || '',
    eligibility: draft.eligibility || 'unknown', eob_needed: !!draft.eob_needed,
    status: draft.suggested_status || 'candidate',
    docs: draft.documents || [], documents: draft.documents || [], submitted_on: null,
    notes: draft.reason ? [draft.reason] : [],
  };
}
function apply(doc, draft) {
  const year = activeYear(doc);
  const claim = draftToClaim(draft);
  doc.years[year].claims.push(claim);
  return [claim.id];
}
function mergeInto(doc, draft, targetId) {
  const year = activeYear(doc);
  const claim = yearClaims(doc, year).find((c) => c.id === targetId);
  if (!claim) return null;
  for (const d of (draft.documents || [])) if (!(claim.documents || []).includes(d)) (claim.documents = claim.documents || []).push(d);
  if (draft.reason) (claim.notes = claim.notes || []).push(draft.reason);
  return claim;
}
// A candidate to merge into: same provider + amount, service date within 3 days.
function findMergeTarget(doc, draft) {
  const year = activeYear(doc);
  const dd = Date.parse(String(draft.date || '') + 'T00:00:00Z');
  return yearClaims(doc, year).find((c) => c.provider === draft.provider
    && Math.abs((Number(c.amount) || 0) - (Number(draft.amount) || 0)) < 0.005
    && !Number.isNaN(dd) && Math.abs(Date.parse(String(c.date) + 'T00:00:00Z') - dd) <= 3 * 86400000);
}

// --- render ---
const FIELDS = [
  ['provider', 'Provider', 'text'], ['date', 'Date', 'text'], ['amount', 'Amount', 'number'],
  ['person', 'Person', 'text'], ['eligibility', 'Eligibility', 'text'],
];

function renderInbox(state, deps) {
  const section = document.getElementById('inbox');
  const list = document.getElementById('inbox-list');
  const head = document.getElementById('inbox-h');
  if (!section || !list) return;
  list.innerHTML = '';
  const doc = state.doc;
  const pending = doc ? pendingList(doc) : [];
  const errors = (doc && doc.inbox && doc.inbox._errors) || [];
  section.hidden = pending.length === 0 && errors.length === 0;
  head.textContent = `Inbox (${pending.length})`;

  for (const draft of pending) {
    const card = document.createElement('div'); card.className = 'inbox-item'; card.dataset.id = draft.id;
    const meta = document.createElement('p'); meta.className = 'dim mono inbox-meta';
    meta.textContent = `${draft.agent || 'agent'} · ${ymd(draft.captured_at)} · confidence ${draft.confidence != null ? Math.round(draft.confidence * 100) + '%' : '—'}`;
    card.appendChild(meta);

    const form = document.createElement('div'); form.className = 'inbox-form';
    for (const [key, label, type] of FIELDS) {
      const wrap = document.createElement('label'); wrap.className = 'inbox-field';
      const lab = document.createElement('span'); lab.className = 'inbox-label'; lab.textContent = label;
      const input = document.createElement('input'); input.className = 'mono'; input.type = type;
      input.value = draft[key] != null ? draft[key] : '';
      input.setAttribute('aria-label', label);
      input.addEventListener('input', () => { draft[key] = type === 'number' ? Number(input.value) : input.value; });
      wrap.append(lab, input); form.appendChild(wrap);
    }
    card.appendChild(form);

    const actions = document.createElement('div'); actions.className = 'inbox-actions';
    const approveBtn = button('Approve', async () => {
      await approve(doc, draft.id, { apply, save: deps.save });
      await deps.decide(draft.id, 'approved');
      deps.refresh();
    });
    const rejectBtn = button('Reject', async () => {
      await dismiss(doc, draft.id, { save: deps.save });
      await deps.decide(draft.id, 'rejected');
      deps.refresh();
    });
    actions.append(approveBtn, rejectBtn);
    const target = doc ? findMergeTarget(doc, draft) : null;
    if (target) {
      actions.appendChild(button(`Merge into ${ymd(target.date)} ${money(target.amount)}`, async () => {
        await merge(doc, draft.id, target.id, { mergeInto, save: deps.save });
        await deps.decide(draft.id, 'approved');
        deps.refresh();
      }));
    }
    card.appendChild(actions);
    list.appendChild(card);
  }

  for (const err of errors) {
    const line = document.createElement('p'); line.className = 'inbox-error';
    line.textContent = `Couldn't open a sealed item from ${err.agent || 'an agent'} — wrong key. Skipped.`;
    list.appendChild(line);
  }
}

function button(text, onClick) {
  const b = document.createElement('button'); b.type = 'button'; b.textContent = text;
  b.addEventListener('click', onClick); return b;
}


/* ---- src/ui/table.js ---- */
// src/ui/table.js — filter chips + sortable claims table. Pure FILTERS/sortClaims/noteLines + DOM render.



const FILTERS = {
  all: () => true,
  submitted: (c) => ['submitted', 'paid'].includes(c.status),
  waiting: (c) => ['picked', 'gathered', 'waiting', 'needs-receipt'].includes(c.status),
  candidates: (c) => c.status === 'candidate',
  skipped: (c) => ['skipped', 'denied', 'rejected'].includes(c.status),
};
const CHIP_LABELS = { all: 'All', submitted: 'Submitted', waiting: 'Waiting', candidates: 'Candidates', skipped: 'Skipped' };

function sortClaims(claims, key, dir) {
  const s = dir === 'asc' ? 1 : -1;
  return [...claims].sort((a, b) => {
    let av = a[key]; let bv = b[key];
    if (key === 'amount' || key === 'claimed') { av = Number(a.amount) || 0; bv = Number(b.amount) || 0; }
    av = av == null ? '' : av; bv = bv == null ? '' : bv;
    if (av < bv) return -1 * s; if (av > bv) return 1 * s; return 0;
  });
}

// A claim's notes as DISPLAY LINES: one entry per newline-delimited line. `notes` may be a string
// (split on \n) or an array (used as-is). Blank lines are dropped. This is the slice-2 fix: the old
// code iterated the string by CHARACTER, emitting one <span> per letter (2,644 spans, 38,490px tall).
function noteLines(c) {
  const raw = c && c.notes;
  if (raw == null) return [];
  const arr = Array.isArray(raw) ? raw : String(raw).split('\n');
  return arr.map((s) => String(s)).filter((s) => s.trim() !== '');
}

// A cell carries a data-label so the mobile card restack (< 768px) can show "Amount $860.00" etc.
function td(text, cls, label) { const el = document.createElement('td'); if (cls) el.className = cls; if (label) el.dataset.label = label; el.textContent = text; return el; }

function renderChips(state, onFilter) {
  const box = document.getElementById('chips'); box.innerHTML = '';
  for (const key of Object.keys(FILTERS)) {
    const b = document.createElement('button');
    b.className = 'chip'; b.type = 'button'; b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', String(key === state.filter));
    b.textContent = CHIP_LABELS[key];
    b.addEventListener('click', () => onFilter(key));
    box.appendChild(b);
  }
}

function renderTable(state, claims) {
  const body = document.getElementById('claims-body'); body.innerHTML = '';
  const pred = FILTERS[state.filter] || FILTERS.all;
  let rows = sortClaims(claims.filter(pred), state.sort.key, state.sort.dir);
  // Fold everything under the threshold into ONE summary row — but only on the All view, and only
  // until the reader expands it. The 44-row enumeration is a fallback; the chase list is the job.
  const threshold = state.foldThreshold || 0;
  let small = [];
  if (state.filter === 'all' && threshold > 0 && !state.expandSmall) {
    small = rows.filter((c) => (Number(c.amount) || 0) < threshold);
    rows = rows.filter((c) => (Number(c.amount) || 0) >= threshold);
  }
  document.getElementById('claims-empty').hidden = (rows.length + small.length) > 0;

  for (const c of rows) {
    const tr = document.createElement('tr');
    tr.appendChild(td(ymd(c.date), 'col-date', 'Date'));
    const prov = td('', 'col-provider'); prov.dataset.label = 'Provider';
    const name = document.createElement('span'); name.textContent = c.provider || c.payee || '—'; prov.appendChild(name);
    // The tag is driven ONLY by the claim's `need` field — nothing rendered when it is empty.
    const need = needText(c);
    if (need) { const t = document.createElement('span'); t.className = 'tag'; t.textContent = need; prov.appendChild(t); }
    for (const n of noteLines(c)) { const nl = document.createElement('span'); nl.className = 'note-line'; nl.textContent = n; prov.appendChild(nl); }
    if (c.claim_number) { const cn = document.createElement('span'); cn.className = 'note-line mono'; cn.textContent = 'claim ' + c.claim_number; prov.appendChild(cn); }
    tr.appendChild(prov);
    tr.appendChild(td(c.person || '', 'col-person', 'Person'));
    tr.appendChild(td(money(c.amount), 'col-amount num', 'Amount'));
    tr.appendChild(td(['submitted', 'paid'].includes(c.status) ? money(claimedAmount(c)) : '—', 'col-claimed num', 'Claimed'));
    const st = td('', 'col-status', 'Status');
    const pill = document.createElement('span'); pill.className = 'status ' + c.status; pill.textContent = c.status; st.appendChild(pill);
    // A parked claim keeps its status but is deliberately set aside — flag it so it reads as intentional,
    // not stuck. Parked claims are excluded from the next-claim pick and from Blocked (see core/chase.js).
    if (c.parked) { const p = document.createElement('span'); p.className = 'status parked'; p.textContent = 'parked'; st.appendChild(p); }
    tr.appendChild(st);
    tr.appendChild(td((c.documents || c.docs || []).map((d) => String(d).split('/').pop()).join(', '), 'col-docs', 'Documents'));
    body.appendChild(tr);
  }

  // The folded small-charges summary row — one line, expandable in place.
  if (small.length) {
    const sum = small.reduce((a, c) => a + (Number(c.amount) || 0), 0);
    const tr = document.createElement('tr'); tr.className = 'small-summary';
    const cell = document.createElement('td'); cell.colSpan = 7;
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'small-toggle';
    btn.textContent = `${small.length} charges under ${money(threshold)} · ${money(sum)} — show`;
    btn.addEventListener('click', () => { state.expandSmall = true; renderTable(state, claims); });
    cell.appendChild(btn); tr.appendChild(cell); body.appendChild(tr);
  }

  document.querySelectorAll('#claims-table th[data-sort]').forEach((th) => {
    const k = th.getAttribute('data-sort');
    th.setAttribute('aria-sort', state.sort.key === k ? (state.sort.dir === 'asc' ? 'ascending' : 'descending') : 'none');
  });
}

// council-agent@3.4.0
// src/ui/agents.js — browser-side client for the FSA council-agents (vendored from
// instruments/agent/app/agent-client.js, ESM). callAgent posts an on-demand call with the x-plan-id
// gate; lastRun reads the header-gated (x-app) press_agent_runs_public badge view. Plus initAgents(),
// which (live mode only) puts a flat "Sync YNAB" control + last-run badge in the header.



function pickFetch(opts) {
  const f = (opts && opts.fetchImpl) || (typeof fetch !== 'undefined' ? fetch : null);
  if (!f) throw new Error('agent-client: no fetch available (pass opts.fetchImpl)');
  return f;
}
function badgeLabel(outcome) {
  switch (outcome) {
    case 'ok': return 'OK';
    case 'skipped': return 'Skipped';
    case 'refused': return 'Refused';
    case 'error': return 'Error';
    default: return 'No runs';
  }
}
async function callAgent(opts) {
  opts = opts || {};
  if (!opts.url) throw new Error('agent-client: callAgent needs opts.url');
  const f = pickFetch(opts);
  const res = await f(opts.url, {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'x-plan-id': String(opts.planId || '') },
    body: JSON.stringify(opts.body || {}),
  });
  let parsed = null; try { parsed = await res.json(); } catch (_e) { parsed = null; }
  return { status: res.status, ok: !!res.ok, body: parsed };
}
async function lastRun(opts) {
  opts = opts || {};
  if (!opts.baseUrl || !opts.app || !opts.agent) throw new Error('agent-client: lastRun needs baseUrl, app, agent');
  const f = pickFetch(opts);
  const url = opts.baseUrl.replace(/\/$/, '')
    + '/rest/v1/press_agent_runs_public?agent=eq.' + encodeURIComponent(opts.agent)
    + '&select=app,agent,outcome,finished_at&order=finished_at.desc&limit=1';
  const headers = { 'x-app': String(opts.app) };
  if (opts.anonKey) { headers.apikey = opts.anonKey; headers.Authorization = 'Bearer ' + opts.anonKey; }
  const res = await f(url, { headers });
  let rows = []; try { rows = await res.json(); } catch (_e) { rows = []; }
  if (!res.ok || !Array.isArray(rows) || rows.length === 0) return { outcome: null, finished_at: null, label: badgeLabel(null) };
  const row = rows[0];
  return { outcome: row.outcome, finished_at: row.finished_at, label: badgeLabel(row.outcome) };
}

// Header control (live mode only). deps: { syncId, refresh }.
function initAgents(state, deps) {
  const slot = document.getElementById('agents');
  if (!slot || !deps || !deps.syncId) return; // demo / signed-out: no control
  slot.innerHTML = '';
  const badge = document.createElement('span'); badge.className = 'mono agent-badge'; badge.id = 'ynab-badge'; badge.textContent = '…';
  const btn = document.createElement('button'); btn.type = 'button'; btn.id = 'sync-ynab'; btn.textContent = 'Sync YNAB';
  slot.append(btn, badge);

  // Surface a header alert ONLY when a run failed; the routine badge lives in the drawer.
  const setAlert = (outcome) => {
    const alert = document.getElementById('agent-alert');
    if (!alert) return;
    const failed = outcome === 'error' || outcome === 'refused';
    alert.hidden = !failed;
    if (failed) alert.textContent = `⚠ sync ${badgeLabel(outcome).toLowerCase()}`;
  };
  const refreshBadge = async () => {
    try {
      const r = await lastRun({ baseUrl: FSA_SUPABASE_URL, anonKey: FSA_PUBLISHABLE, app: 'fsa', agent: 'fsa-ynab-sync' });
      badge.textContent = r.label + (r.finished_at ? ' · ' + String(r.finished_at).slice(0, 10) : '');
      setAlert(r.outcome);
    } catch (_e) { badge.textContent = '—'; }
  };
  btn.addEventListener('click', async () => {
    btn.disabled = true; badge.textContent = 'syncing…';
    const year = state.doc ? activeYear(state.doc) : null;
    const known = state.doc ? yearClaims(state.doc, year).map((c) => c.ynab_id).filter(Boolean) : [];
    try {
      await callAgent({ url: FSA_FUNCTIONS + '/fsa-ynab-sync', planId: deps.syncId, body: { since: new Date().toISOString().slice(0, 10), known_refs: known } });
    } catch (_e) { /* surfaced by the badge */ }
    btn.disabled = false;

// src/ui/app.js — boot + orchestration for the FSA chase list. Browser only; exercised by e2e.
// Demo mode (?demo=1 or localhost) reads the bundled #demo-fixture and never touches the network or
// registers the service worker. Live mode uses sync-id + passphrase against the encrypted cloud doc.


















const state = { doc: null, year: null, filter: 'all', sort: { key: 'amount', dir: 'desc' }, foldThreshold: 75, expandSmall: false, deps: null, _version: null, _envelope: null };

function isDemo() {
  const p = new URLSearchParams(location.search);
  if (p.get('demo') === '1') return true;
  if (p.get('demo') === '0') return false; // explicit override: exercise the live path on localhost
  return ['localhost', '127.0.0.1', '::1'].includes(location.hostname);
}
function today() { return new Date().toISOString().slice(0, 10); }
function loadDemoDoc() { const el = document.getElementById('demo-fixture'); try { return el ? JSON.parse(el.textContent) : null; } catch (_) { return null; } }

function reveal() { try { document.body.classList.remove('preboot'); } catch (_) { /* ok */ } }

// Every dashboard section is meaningless with no document loaded — hide them (and the year control)
// while signed out so the reader sees ONLY the unlock panel.
const DASH_SECTIONS = ['deadline', 'gauge', 'blocked', 'setup', 'nextclaim', 'questions', 'inbox', 'claims'];
function setSignedOutView(on) {
  for (const id of DASH_SECTIONS) { const el = document.getElementById(id); if (el) el.hidden = on; }
  const sel = document.getElementById('year'); if (sel) sel.hidden = on;
  const stat = document.getElementById('year-static'); if (stat) stat.hidden = on;
}

// "Lock" lives in the overflow menu, shown only once unlocked. Locking drops the shared
// private-wing vault session; PressGate's lock-watcher then falls the app back to the gate.
// No passphrase to re-enter, so no scary confirm — the passkey brings it straight back.
let _lockWired = false;
function wireLock(on) {
  const btn = document.getElementById('signout');
  if (!btn) return;
  btn.hidden = !on;
  if (_lockWired) return;
  _lockWired = true;
  btn.addEventListener('click', () => { try { if (globalThis.PressVault) PressVault.lock(); } catch (_) { /* ok */ } });
}

function setSyncPill(kind) {
  const pill = document.getElementById('syncpill');
  if (!pill) return;
  pill.hidden = false; pill.textContent = kind;
  pill.style.color = kind === 'synced' ? 'var(--dim)' : kind === 'offline' ? 'var(--warn)' : 'var(--danger)';
}

function initGaugeJump() {
  const denied = document.getElementById('gauge-denied');
  if (!denied) return;
  denied.addEventListener('click', () => {
    const blocked = document.getElementById('blocked');
    if (blocked && !blocked.hidden) blocked.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
}

// Confirm / set the submission run-out date (Mark's recollection; not published by Fidelity).
function confirmRunOut() {
  if (!state.doc || !state.year) return;
  const cur = ((state.doc.years[state.year] || {}).deadline || {}).claims_run_out || '';
  const val = prompt('Submission deadline (claims run-out) as YYYY-MM-DD:', cur || `${Number(state.year) + 1}-03-31`);
  if (!val) return;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(val.trim())) { alert('Enter a date as YYYY-MM-DD.'); return; }
  const yd = state.doc.years[state.year] || (state.doc.years[state.year] = {});
  yd.deadline = { ...(yd.deadline || {}), claims_run_out: val.trim(), run_out_confirmed: true };
  render();
  if (state.deps && state.deps.save) state.deps.save(state.doc);
}

async function boot() {
  initTheme();
  document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
  initOverflow();
  initGaugeJump();
  wireSort();

  if (isDemo()) {
    const demoState = new URLSearchParams(location.search).get('state'); // '', 'populated', 'empty'
    if (demoState === 'empty') {
      state.doc = { v: 2, updated_at: '2026-09-16T00:00:00Z', active_year: '2026',
        years: { '2026': { election: 1000, deadline: { incur_by: '2026-12-31', claims_run_out: null }, claims: [] } },
        capture: { private_jwk: null, public_jwk: null }, inbox: { pending: [] } };
      state.year = '2026'; state.deps = makeDemoDeps(); paint(); reveal(); return;
    }
    state.doc = loadDemoDoc();
    state.year = state.doc ? activeYear(state.doc) : null;
    try { const y = localStorage.getItem('fsa:year'); if (y && state.doc && state.doc.years[y]) state.year = y; } catch (_) { /* ok */ }
    state.deps = makeDemoDeps();
    const withInbox = demoState !== 'populated';
    // Unseal the inbox BEFORE the first paint so the page renders in one frame (no layout shift).
    if (state.doc && withInbox) await loadDemoInbox(state.doc);
    paint();
    if (state.doc && withInbox) renderInbox(state, state.deps);
    reveal();

  }

  // Passkey or nothing. The sealed private-wing keyring is the ONLY source of creds — read into
  // memory for this page's life, never surfaced, never persisted. No passphrase field exists.
  // NOTE (hotfix/disable-cred-purge): the legacy on-disk purge is DELIBERATELY not called here.
  // The vault keyring is not yet populated, so on-disk creds are currently the only backup of the

    page: 'fsa.html',
    onUnlock: (creds) => { hydrate(creds.syncId, creds.passphrase); },

}

// hydrate — everything after a successful unlock: load the encrypted row, decrypt in memory,
// render, then the live inbox/agents and the service worker. Creds live only in this closure.
async function hydrate(syncId, passphrase) {

  setSyncPill('offline');

    const client = makeClient({});

    if (row) {
      state._envelope = row.doc; // keep the raw envelope for the encrypted-backup export

      if (state.doc) {
        setSyncPill('synced'); try { localStorage.setItem('press:fsa', JSON.stringify(state.doc)); } catch (_) {}

        // drop any legacy on-disk sync id / passphrase. Never on boot, never on any other path — the

    try { const cached = JSON.parse(localStorage.getItem('press:fsa')); if (cached) state.doc = cached; } catch (_) { /* ok */ }

// lockDown — the vault session was lost (Lock now, another tab, or expiry). Drop everything
// decrypted from memory and blank the dashboard; PressGate re-mounts the gate over the top.
function lockDown() {
  state.doc = null; state.year = null; state.deps = null; state._version = null; state._envelope = null;
  setSignedOutView(true);

  refreshDataMenu();

function paint() {

}

function renderDisclosure() {

  if (!sum) return;
  if (!state.doc) { sum.textContent = 'All charges'; return; }
  const s = allChargesSummary(state.doc, state.year, state.foldThreshold);
  sum.textContent = `All charges · ${s.count} · ${money(s.total)}`;
}

function prevYearOf(doc, year) {
  const years = Object.keys(doc.years).sort();
  const i = years.indexOf(String(year));
  return i > 0 ? years[i - 1] : null;
}

function makeDemoDeps() {

    save: async (doc) => { try { localStorage.setItem('press:fsa', JSON.stringify(doc)); } catch (_) { /* ok */ } },

function makeLiveDeps(syncId, passphrase, client) {
  const deps = {
    save: async (doc) => {
      const env = await encryptDoc(doc, passphrase);
      try { state._version = await client.save(syncId, env, state._version); }
      catch (e) {
        if (e && e.name === 'ConflictError') { const row = await client.load(syncId); state._version = await client.save(syncId, env, row.version); }
        else throw e;
      }
      try { localStorage.setItem('press:fsa', JSON.stringify(doc)); } catch (_) { /* ok */ }
    },
    decide: async (id, status) => { try { await client.decideQueue(syncId, id, status); } catch (_) { /* surfaced elsewhere */ } },
    refresh: () => refreshAll(deps),
  };
  return deps;
}

// --- download my data (the only recovery path now the passphrase UI is gone) -----------------
function downloadFile(name, text, type) {
  try {
    const blob = new Blob([text], { type: type || 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (_) { /* ok */ }
}

let _dataWired = false;
function initDataMenu() {
  const exp = document.getElementById('data-export');
  const expEnc = document.getElementById('data-export-enc');
  const imp = document.getElementById('data-import');
  const file = document.getElementById('data-import-file');
  if (!exp || !expEnc || !imp || !file) return;
  if (!_dataWired) {
    _dataWired = true;
    exp.addEventListener('click', () => {
      if (!state.doc) { alert('Nothing to export yet.'); return; }
      downloadFile(`fsa-data-${today()}.json`, JSON.stringify(state.doc, null, 2));
    });
    expEnc.addEventListener('click', () => {
      if (!state._envelope) { alert('No encrypted backup available yet.'); return; }
      downloadFile(`fsa-encrypted-${today()}.json`, JSON.stringify(state._envelope, null, 2));
    });
    imp.addEventListener('click', () => file.click());
    file.addEventListener('change', async () => {
      const f = file.files && file.files[0]; if (!f) return;
      try { importDoc(JSON.parse(await f.text())); }
      catch (_) { alert('That file is not a valid FSA data export.'); }
      finally { file.value = ''; }
    });
  }
  refreshDataMenu();
}

function refreshDataMenu() {
  const exp = document.getElementById('data-export');
  const expEnc = document.getElementById('data-export-enc');
  const imp = document.getElementById('data-import');
  if (exp) exp.hidden = !state.doc;
  if (expEnc) expEnc.hidden = !state._envelope;
  if (imp) imp.hidden = !state.deps; // import needs the in-memory save path (creds present)
}

// importDoc — restore a decrypted export. Shape-check, load, render, then save through the
// normal encrypted transport. The round-trip proof: an exported doc re-imports to an identical
// document (no re-key — the same in-memory passphrase re-encrypts it).
function importDoc(doc) {
  if (!doc || typeof doc !== 'object' || typeof doc.years !== 'object') { alert('That file is not an FSA data export.'); return; }
  state.doc = doc;
  state.year = activeYear(doc);
  try { localStorage.setItem('press:fsa', JSON.stringify(doc)); } catch (_) { /* ok */ }
  paint();
  refreshDataMenu();
  if (state.deps && state.deps.save) { try { state.deps.save(doc); } catch (_) { /* ok */ } }
}

function wireSort() {
  document.querySelectorAll('#claims-table th[data-sort]').forEach((th) => {
    const k = th.getAttribute('data-sort');
    th.addEventListener('click', () => {
      if (state.sort.key === k) state.sort.dir = state.sort.dir === 'asc' ? 'desc' : 'asc';
      else state.sort = { key: k, dir: 'desc' };
      renderTable(state, state.doc ? yearClaims(state.doc, state.year) : []);
    });
    th.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); th.click(); } });
    th.setAttribute('tabindex', '0');
  });
}
