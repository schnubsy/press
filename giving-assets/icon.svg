<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Giving Tracker — "Hearth's warmth on Ledger's bones". Maskable-safe: the mark
       sits within the centre 60%, the dark ground fills the whole canvas. -->
  <defs>
    <linearGradient id="ember" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0b072"/>
      <stop offset="0.55" stop-color="#e7a86f"/>
      <stop offset="1" stop-color="#d98a4e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#14110f"/>
  <!-- ledger base line -->
  <rect x="150" y="374" width="212" height="10" rx="5" fill="#7fae86"/>
  <!-- ember / flame -->
  <path fill="url(#ember)" d="M256 118
    c 40 58 96 96 96 158
    a 96 96 0 0 1 -192 0
    c 0 -38 22 -66 44 -92
    c 8 22 26 34 44 40
    c -10 -30 -28 -66 8 -106 Z"/>
  <!-- inner glow -->
  <path fill="#fff3e2" opacity="0.85" d="M256 250
    c 20 26 40 42 40 70
    a 40 40 0 0 1 -80 0
    c 0 -22 22 -44 40 -70 Z"/>
</svg>
