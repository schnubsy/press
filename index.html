<style>
/* ============================================================================
   PRESS — TWILIGHT CUT · R3 "Neon masthead" refinement
   Base: Direction 04 "Twilight Cut" (Calm) + Premiere's retimed bulbs.
   R3 (Neon · Mr. Neon, winner): Unbounded display face page-wide; gradient
   masthead; copy describes the tool. Drag-to-sort / drag-into-archive /
   restore with shared Supabase press_portal state + localStorage mirror.
   R3.1: "new" pill; drag ghost + dashed placeholder.
   R3.2: larger masthead; glowing "lit."; "on the pad"; bulbs 2×.
   R3.3: long-press to drag, tap to open; page-type ICON REGISTRY.
   R3.4: springy hover; bulb chase glow; sunrise pill flush right.
   R3.5: FIX native link-drag hijack (draggable=false + dragstart blocked) —
   long-press drag now moves; icons upgraded to Feather-quality strokes in
   bright #B7A8FF at 24px; bulb glow narrowed to a single-bulb spike so the
   chase reads clearly.
   R3.6: smaller "new" pill (icon barely nudged); bulbs back to the smooth
   fade wave with the EXTERNAL halo alone riding the brightest bulb; archive
   card ~50% taller for visual separation.
   R3.7: archive content vertically centered; crescent replaced with Feather
   moon per icon rules; count indicator enlarged; bulb glow removed entirely
   (pure fade wave); "new" pill 30% smaller, glyph-only.
   R3.8: "new" badge inline before the page-type word; archive card back to
   standard card sizing; bulb glow reinstated PROPORTIONALLY — halo animates
   on the same wave as brightness, zero at the dimmest, full at the peak.
   R3.9: proportional glow scaled down 60%; archive moon +50%; "new" pill
   moved to the right of the type word with its text restored; three extra
   subtle aurora blobs for background texture.
   R3.10: archive counter moved inline after the card title — "Resting
   pages → N", counter sized to match the title text.
   R3.11: archive moon -15% and aligned to right:14px (matches .ticon), same
   stroke-width:2 so it reads as the same Feather set.
   R3.12: archive moon filled (solid crescent, no stroke) and 20% smaller.
   ============================================================================ */
:root {
  /* palette */
  --tw-stage:  #100C1E;
  --tw-ink:    #EDE7F2;
  --tw-violet: #8E7BE8;
  --tw-rose:   #E7A6C7;
  --tw-muted:  #9E97AE;
  --tw-faint:  #6a6478;
  --tw-icon:   #B7A8FF;   /* R3.5 — matches the "Your" end of the title gradient */
  /* dusk gradient */
  --tw-dusk-1: #151029;
  --tw-dusk-2: #100C1E;
  --tw-dusk-3: #0E0A18;
  --tw-stage-gradient: linear-gradient(165deg, var(--tw-dusk-1), var(--tw-dusk-2) 55%, var(--tw-dusk-3));
  /* glass */
  --tw-glass-card: linear-gradient(160deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
  --tw-glass-arch: linear-gradient(160deg, rgba(255,255,255,.04), rgba(255,255,255,.015));
  --tw-border-card: rgba(255,255,255,.10);
  --tw-border-arch: rgba(142,123,232,.26);
  --tw-hairline:    rgba(255,255,255,.06);
  /* type — R3: Unbounded is the single display face, page-wide */
  --tw-font-display: 'Unbounded', 'Inter', system-ui, sans-serif;
  --tw-font-body:    'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --tw-font-meta:    'Space Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --tw-h1:clamp(25px, 7vw, 32px); --tw-card-title:15.5px; --tw-arch-title:15px;
  --tw-body:14.5px; --tw-body-sm:13px; --tw-meta:11px;
  --tw-eyebrow:10px; --tw-track-eyebrow:.16em;
  --tw-grad-title: linear-gradient(92deg, #B7A8FF, #E7A6C7);
  --tw-glow-lit: 0 0 14px rgba(237,231,242,.65), 0 0 30px rgba(142,123,232,.75), 0 0 52px rgba(231,166,199,.4);
  /* radii */
  --tw-radius-card:22px; --tw-radius-pill:100px;
  /* blur */
  --tw-blur-card:16px;
  /* glow / shadow */
  --tw-shadow-card:       0 10px 34px rgba(10,7,22,.5), inset 0 1px 0 rgba(255,255,255,.12);
  --tw-shadow-card-hover: 0 12px 40px rgba(142,123,232,.28), inset 0 1px 0 rgba(255,255,255,.16);
  --tw-glow-dot:   0 0 16px 3px rgba(142,123,232,.7);
  /* aurora */
  --tw-aurora-field: radial-gradient(520px 340px at 30% -8%, rgba(142,123,232,.4), transparent 62%),
                     radial-gradient(440px 320px at 92% 20%, rgba(231,166,199,.2), transparent 60%),
                     radial-gradient(380px 300px at 12% 68%, rgba(142,123,232,.14), transparent 65%),
                     radial-gradient(420px 340px at 78% 84%, rgba(231,166,199,.12), transparent 65%),
                     radial-gradient(300px 240px at 52% 42%, rgba(183,168,255,.09), transparent 70%);
  --tw-aurora-opacity:.6; --tw-aurora-cycle:32s; --tw-aurora-ease:ease-in-out;
  --tw-aurora-opacity-lo:.5; --tw-aurora-opacity-hi:.72; --tw-aurora-drift:-2%;
  /* retimed marquee bulbs — R3.8: glow scales 1:1 with brightness (zero at floor) */
  --tw-bulb-color:#8E7BE8;
  --tw-bulb-peak-color:#B7A8FF;
  --tw-bulb-glow-floor:0 0 0 0 rgba(142,123,232,0), 0 0 0 0 rgba(231,166,199,0);
  --tw-bulb-glow-peak:0 0 5px 1px rgba(142,123,232,.85), 0 0 10px 3px rgba(231,166,199,.35);
  --tw-bulb-size:6px; --tw-bulb-gap:10px;
  --tw-bulb-cycle:3.5s; --tw-bulb-stagger:.25s; --tw-bulb-ease:ease-in-out;
  --tw-bulb-opacity-floor:.55; --tw-bulb-opacity-peak:1; --tw-bulb-opacity-reduced:.7;
  /* transitions — R3.4: transform gets a springy overshoot curve */
  --tw-transition-card:.24s;
  --tw-spring:cubic-bezier(.34,1.56,.64,1);
}
@keyframes twBreath {
  0%   { opacity: var(--tw-aurora-opacity-lo, .5);  transform: translateY(0); }
  100% { opacity: var(--tw-aurora-opacity-hi, .72); transform: translateY(var(--tw-aurora-drift, -2%)); }
}
/* R3.8 — glow rides the same wave as brightness: zero at the floor,
   full halo at peak, smoothly proportional in between */
@keyframes twBulb {
  0%, 100% { opacity: var(--tw-bulb-opacity-floor, .55); background: var(--tw-bulb-color);
             box-shadow: var(--tw-bulb-glow-floor); }
  50%      { opacity: var(--tw-bulb-opacity-peak, 1); background: var(--tw-bulb-peak-color);
             box-shadow: var(--tw-bulb-glow-peak); }
}
@media (prefers-reduced-motion: reduce) {
  .tw-aurora { animation: none !important; }
  .tw-bulbs i { animation: none !important; opacity: var(--tw-bulb-opacity-reduced, .7) !important;
    box-shadow: none !important; }
}

/* ── component CSS ─────────────────────────────────────────────────────────*/
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body.tw-page{background:var(--tw-stage-gradient);color:var(--tw-ink);font-family:var(--tw-font-body);
  -webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden;min-height:100vh}
.tw-aurora{position:fixed;inset:-20%;z-index:0;pointer-events:none;opacity:var(--tw-aurora-opacity);
  background:var(--tw-aurora-field);animation:twBreath var(--tw-aurora-cycle) var(--tw-aurora-ease) infinite alternate}
.tw-in{position:relative;z-index:3;max-width:560px;margin:0 auto;padding:26px 26px 40px}
/* THE GRAFT — retimed marquee bulbs */
.tw-bulbs{display:flex;gap:var(--tw-bulb-gap);justify-content:center;margin-bottom:18px}
.tw-bulbs i{width:var(--tw-bulb-size);height:var(--tw-bulb-size);border-radius:50%;background:var(--tw-bulb-color);
  box-shadow:var(--tw-bulb-glow-floor);opacity:var(--tw-bulb-opacity-floor);
  animation:twBulb var(--tw-bulb-cycle) var(--tw-bulb-ease) infinite}
.tw-bulbs i:nth-child(2){animation-delay:calc(var(--tw-bulb-stagger)*1)}
.tw-bulbs i:nth-child(3){animation-delay:calc(var(--tw-bulb-stagger)*2)}
.tw-bulbs i:nth-child(4){animation-delay:calc(var(--tw-bulb-stagger)*3)}
.tw-bulbs i:nth-child(5){animation-delay:calc(var(--tw-bulb-stagger)*4)}
.tw-bulbs i:nth-child(6){animation-delay:calc(var(--tw-bulb-stagger)*5)}
.tw-bulbs i:nth-child(7){animation-delay:calc(var(--tw-bulb-stagger)*6)}
.tw-top{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--tw-muted)}
.tw-top b{color:var(--tw-ink);font-weight:600;letter-spacing:.02em}
.tw-stale{font-size:10.5px;color:var(--tw-faint);margin-top:6px}
h2.tw-title{font-family:var(--tw-font-display);font-weight:500;font-size:var(--tw-h1);line-height:1.22;
  letter-spacing:.005em;margin:18px 0 8px;
  background:var(--tw-grad-title);-webkit-background-clip:text;background-clip:text;color:transparent}
/* R3.2 — "lit." breaks out of the gradient: white, glowing */
h2.tw-title .lit{background:none;-webkit-background-clip:initial;background-clip:initial;
  color:#fff;-webkit-text-fill-color:#fff;text-shadow:var(--tw-glow-lit)}
.tw-dek{font-size:var(--tw-body-sm);color:var(--tw-muted);max-width:380px;margin-bottom:20px}
.tw-card{position:relative;display:block;text-decoration:none;color:inherit;padding:18px 56px 18px 20px;margin-bottom:14px;
  border-radius:var(--tw-radius-card);background:var(--tw-glass-card);border:1px solid var(--tw-border-card);
  backdrop-filter:blur(var(--tw-blur-card));-webkit-backdrop-filter:blur(var(--tw-blur-card));
  box-shadow:var(--tw-shadow-card);cursor:pointer;
  transition:box-shadow var(--tw-transition-card), border-color var(--tw-transition-card),
             transform .32s var(--tw-spring);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  -webkit-user-drag:none}
/* R3.4 — springy lift on hover */
.tw-card:hover{box-shadow:var(--tw-shadow-card-hover);border-color:rgba(142,123,232,.4);
  transform:translateY(-3px) scale(1.02)}
.tw-card:focus-visible{outline:2px solid var(--tw-violet);outline-offset:3px}
.tw-card .k{font-size:var(--tw-eyebrow);letter-spacing:var(--tw-track-eyebrow);text-transform:uppercase;
  color:var(--tw-rose);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.tw-card h3{font-family:var(--tw-font-display);font-weight:400;font-size:var(--tw-card-title);margin-bottom:3px;line-height:1.3}
.tw-card .fn{font-family:var(--tw-font-meta);font-size:10.5px;color:var(--tw-muted)}
/* R3.1/R3.4 — labeled "new" pill, flush right, sunrise = early/new */
.tw-card .newpill{color:var(--tw-violet);flex:none;font-family:var(--tw-font-meta);font-size:8.5px;
  letter-spacing:.1em;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:4px;
  border:1px solid rgba(142,123,232,.45);padding:3px 7px;border-radius:var(--tw-radius-pill);
  background:rgba(142,123,232,.12);box-shadow:0 0 12px rgba(142,123,232,.35)}
.tw-card .newpill svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
/* R3.3/R3.5 — page-type icon: Feather-quality strokes, bright, 24px */
.tw-card .ticon{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;color:var(--tw-icon);pointer-events:none;
  filter:drop-shadow(0 0 6px rgba(142,123,232,.45))}
.tw-card .ticon svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.tw-card:hover .ticon{color:#fff}
/* R3.3 — long-press arming cue (declared after :hover so it wins while held) */
.tw-card.pressing{transform:scale(.985);border-color:rgba(142,123,232,.45)}
/* R3.1 — while dragging: the in-list card becomes a dashed placeholder… */
.tw-card.dragging{opacity:.3;border-style:dashed;border-color:rgba(142,123,232,.5);box-shadow:none;
  background:rgba(142,123,232,.05);transform:none}
.tw-card.dragging>*{visibility:hidden}
/* …and a ghost clone rides under the pointer */
.tw-drag-ghost{position:fixed;left:0;top:0;z-index:999;pointer-events:none;margin:0;opacity:.96;
  box-shadow:0 18px 50px rgba(10,7,22,.7), 0 0 0 1px rgba(142,123,232,.45);will-change:transform}
body.tw-sorting{cursor:grabbing}
body.tw-sorting .tw-card{transition:none}
.tw-arch{position:relative;display:block;text-decoration:none;color:inherit;padding:20px 22px;margin-top:6px;
  border-radius:var(--tw-radius-card);
  background:radial-gradient(140px 90px at 88% 30%, rgba(142,123,232,.16), transparent 70%),var(--tw-glass-arch);
  border:1px solid var(--tw-border-arch);cursor:pointer;transition:var(--tw-transition-card);overflow:hidden}
.tw-arch .aicon{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;color:var(--tw-icon);pointer-events:none;
  filter:drop-shadow(0 0 6px rgba(142,123,232,.45))}
.tw-arch .aicon svg{width:25px;height:25px;stroke:none;fill:currentColor}
.tw-arch:hover{border-color:rgba(142,123,232,.5)}
.tw-arch:focus-visible{outline:2px solid var(--tw-violet);outline-offset:3px}
.tw-arch.drop-hot{border-color:var(--tw-violet);box-shadow:0 0 0 2px rgba(142,123,232,.4), var(--tw-shadow-card-hover);
  background:radial-gradient(140px 90px at 88% 30%, rgba(142,123,232,.3), transparent 70%),var(--tw-glass-arch)}
.tw-arch .k{font-size:var(--tw-eyebrow);letter-spacing:var(--tw-track-eyebrow);text-transform:uppercase;
  color:var(--tw-violet);margin-bottom:6px}
.tw-arch h3{font-family:var(--tw-font-display);font-weight:400;font-size:var(--tw-arch-title)}
.tw-arch p{font-size:12px;color:var(--tw-muted);margin-top:6px;max-width:280px}
.tw-arch .ct{font-family:var(--tw-font-meta);font-size:var(--tw-arch-title);font-weight:700;
  color:var(--tw-violet);margin-left:8px}
.tw-hint{font-size:10.5px;color:var(--tw-faint);margin-top:6px;text-align:center}
.tw-auto{font-size:10.5px;color:var(--tw-faint);margin-top:16px;text-align:center}
.tw-back{display:inline-flex;align-items:center;gap:7px;font-family:var(--tw-font-meta);font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--tw-violet);border:1px solid rgba(142,123,232,.4);
  padding:6px 12px;border-radius:var(--tw-radius-pill);text-decoration:none;margin-bottom:14px}
/* R3 — restore control on archive cards */
.tw-restore{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-family:var(--tw-font-meta);
  font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--tw-violet);
  border:1px solid rgba(142,123,232,.4);padding:7px 11px;border-radius:var(--tw-radius-pill);cursor:pointer;
  background:rgba(16,12,30,.4)}
.tw-restore:hover{border-color:var(--tw-violet);background:rgba(142,123,232,.12)}
.tw-card.restorable{padding-right:132px}
/* states */
.tw-skel{padding:18px 20px;margin-bottom:14px;border-radius:var(--tw-radius-card);background:var(--tw-glass-card);
  border:1px solid var(--tw-border-card);height:78px;position:relative;overflow:hidden}
.tw-skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);animation:twShimmer 1.8s ease-in-out infinite}
@keyframes twShimmer{100%{transform:translateX(100%)}}
.tw-empty,.tw-error{padding:22px 22px;border-radius:var(--tw-radius-card);background:var(--tw-glass-card);
  border:1px solid var(--tw-border-card);text-align:center}
.tw-empty h3,.tw-error h3{font-family:var(--tw-font-display);font-weight:400;font-size:16px;margin-bottom:6px}
.tw-empty p,.tw-error p{font-size:13px;color:var(--tw-muted)}
.tw-error .tw-retry{margin-top:14px;display:inline-block;cursor:pointer;font-family:var(--tw-font-meta);font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--tw-violet);border:1px solid rgba(142,123,232,.4);
  padding:7px 14px;border-radius:var(--tw-radius-pill)}
@media (prefers-reduced-motion:reduce){.tw-skel::after{animation:none}
  .tw-card,.tw-card:hover{transform:none !important}}

/* ══ two-space marquee — the pinned personal card + the private wing ══════════
   The personal/secure card is a PLACE (a sibling of .tw-arch), pinned to the top
   of the stack, never draggable. The private-wing view lives at ?view=personal. */
.tw-secure{position:relative;display:block;text-decoration:none;color:inherit;padding:20px 22px;margin:0 0 14px;
  border-radius:var(--tw-radius-card);
  background:radial-gradient(150px 96px at 88% 26%, rgba(231,166,199,.16), transparent 70%),var(--tw-glass-card);
  border:1px solid rgba(231,166,199,.34);cursor:pointer;overflow:hidden;box-shadow:var(--tw-shadow-card);
  transition:box-shadow var(--tw-transition-card),border-color var(--tw-transition-card),transform .32s var(--tw-spring)}
.tw-secure:hover{border-color:rgba(231,166,199,.6);transform:translateY(-2px) scale(1.01);box-shadow:var(--tw-shadow-card-hover)}
.tw-secure:focus-visible{outline:2px solid var(--tw-rose);outline-offset:3px}
.tw-secure .k{font-size:var(--tw-eyebrow);letter-spacing:var(--tw-track-eyebrow);text-transform:uppercase;
  color:var(--tw-rose);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.tw-secure h3{font-family:var(--tw-font-display);font-weight:400;font-size:var(--tw-arch-title)}
.tw-secure .lockline{font-family:var(--tw-font-meta);font-size:11px;color:var(--tw-muted);margin-top:7px}
.tw-secure .sicon{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:30px;height:30px;
  display:flex;align-items:center;justify-content:center;color:var(--tw-rose);pointer-events:none;
  filter:drop-shadow(0 0 6px rgba(231,166,199,.4))}
.tw-secure .sicon svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
/* private-wing view */
.tw-unlock{padding:32px 24px;border-radius:var(--tw-radius-card);background:var(--tw-glass-card);
  border:1px solid var(--tw-border-card);text-align:center;box-shadow:var(--tw-shadow-card)}
.tw-unlock .sicon svg{width:42px;height:42px;stroke:var(--tw-rose);fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 10px rgba(231,166,199,.4));margin-bottom:14px}
.tw-unlock h3{font-family:var(--tw-font-display);font-weight:400;font-size:18px;margin-bottom:8px}
.tw-unlock p{font-size:13px;color:var(--tw-muted);max-width:330px;margin:0 auto 20px}
.tw-btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--tw-font-meta);font-size:12px;
  letter-spacing:.08em;text-transform:uppercase;color:#fff;cursor:pointer;border:0;
  background:linear-gradient(92deg,var(--tw-violet),var(--tw-rose));
  padding:12px 22px;border-radius:var(--tw-radius-pill);box-shadow:0 8px 24px rgba(142,123,232,.35)}
.tw-btn:hover{filter:brightness(1.08)}
.tw-btn[disabled]{opacity:.6;cursor:progress}
.tw-secmsg{font-size:12.5px;margin-top:14px;min-height:1em}
.tw-secbar{display:flex;gap:10px;align-items:center;justify-content:flex-start;margin:2px 0 16px}
.tw-mini{font-family:var(--tw-font-meta);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--tw-violet);border:1px solid rgba(142,123,232,.4);padding:7px 12px;border-radius:var(--tw-radius-pill);
  cursor:pointer;background:rgba(16,12,30,.4)}
.tw-mini:hover{border-color:var(--tw-violet);background:rgba(142,123,232,.12)}
.tw-devices{margin-top:18px;border-top:1px solid var(--tw-hairline);padding-top:16px}
.tw-devices h4{font-family:var(--tw-font-meta);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--tw-muted);margin-bottom:12px}
.tw-device{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;font-size:13px}
.tw-device .meta{font-family:var(--tw-font-meta);font-size:10.5px;color:var(--tw-faint)}
/* connect your tools */
.tw-connect{margin-top:20px;border-top:1px solid var(--tw-hairline);padding-top:16px}
.tw-connect h4{font-family:var(--tw-font-meta);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--tw-muted);margin-bottom:8px}
.tw-cmeta{font-size:12px;color:var(--tw-muted);margin:0 0 14px;line-height:1.5}
.tw-tool{border:1px solid var(--tw-border-card);border-radius:var(--tw-radius-card);padding:12px 14px;margin-bottom:10px;background:var(--tw-glass-card)}
.tw-tool-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tw-tool-name{font-size:14px}
.tw-tool-status{font-family:var(--tw-font-meta);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.tw-tool-status.on{color:var(--tw-violet)}
.tw-tool-status.off{color:var(--tw-faint)}
.tw-tool-slot:empty{display:none}
.tw-tool-form{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.tw-tool-foot{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.tw-reconnect{-webkit-appearance:none;appearance:none;display:inline-flex;align-items:center;min-height:44px} /* real <button>; 44px tap target */
.tw-cinput{width:100%;min-height:44px;background:rgba(16,12,30,.5);border:1px solid var(--tw-border-card);border-radius:10px;padding:10px 12px;color:var(--tw-ink,#efeaf6);font-size:13px;font-family:var(--tw-font-meta,monospace)}

.tw-verify{font-size:11px;min-height:44px;padding:9px 16px}
.tw-dl{font-family:var(--tw-font-meta);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--tw-violet);border:1px solid rgba(142,123,232,.4);min-height:44px;display:inline-flex;align-items:center;padding:8px 12px;border-radius:var(--tw-radius-pill);cursor:pointer}

.tw-tool-msg{font-size:12px;min-height:1em;color:var(--tw-muted)}

      v: 1,
      apps: {
        'fsa.html': { sync_id: '', pass: '' },
        'giving.html': { sync_id: '', pass: '' },

      key = await deriveKey(prf, ub64(record.salt));

    saveSession(newKeyring, vaultId);
    return newKeyring;

  // Enrol a SECOND credential and write the SAME keyring, sealed under the new key,
  // as a NEW row. Never re-keys or touches existing rows. Requires an open keyring.
  async function addPasskey(opts) {
    opts = opts || {};
    var sess = loadSession();
    if (!sess || !sess.keyring) throw new Error('Unlock the personal space before adding a device.');
    return enrol({ label: opts.label || 'added-device', keyring: sess.keyring });

    var r = await fetch(VAULT_EP + '?id=eq.' + encodeURIComponent(vaultId), { method: 'DELETE', headers: headers(vaultId, { 'Prefer': 'return=representation' }) });
    if (!r.ok) return false;
    var gone = await r.json();
    return Array.isArray(gone) && gone.length > 0;

function order(files, man){ // default order: manifest newest-first; disk-only pages appended A→Z
  if(!man) return {ordered:[...files].sort(), newest:null};
  const manKeys = Object.keys(man).filter(k=>files.includes(k));
  const rest = files.filter(f=>!manKeys.includes(f)).sort();
  return {ordered:[...manKeys.slice().reverse(), ...rest],
          newest: manKeys.length?manKeys[manKeys.length-1]:null};
}
function applyState(files, man){ // user sort first, then default order for the rest; archived hidden
  const visible = files.filter(f=>!PSTATE.archived.includes(f));
  const userOrdered = PSTATE.order.filter(f=>visible.includes(f));
  const rest = visible.filter(f=>!userOrdered.includes(f));
  const d = order(rest.length?rest:visible, man);
  const ordered = userOrdered.length ? [...userOrdered, ...d.ordered.filter(f=>!userOrdered.includes(f))] : d.ordered;
  const dAll = order(visible, man);
  return {ordered, newest:dAll.newest, stateArchived: files.filter(f=>PSTATE.archived.includes(f))};
}
function titleOf(f, man){ return (man&&man[f]&&man[f].title) ? man[f].title : titleize(f); }

function cardHTML(f, man, isNewest){

}

function paintMarquee(root, files, man, physArchiveCount, stale){
  // personal-wing files are removed BEFORE applyState — they can never be sorted,
  // dragged into the public archive, or counted among the public cards.
  const pub = files.filter(f=>!isPersonalFile(f));

/* ══ R3.3 — LONG-PRESS drag (mouse + touch, pointer events) ═════════════════
   Hold ~400ms to lift (card "arms" with a slight press first). Tap = open.
   Move >10px before the hold completes = scroll/click intent, drag cancelled.
   While dragging: ghost clone follows the pointer, dashed placeholder marks
   the drop slot; scroll is blocked via a non-passive touchmove listener.
   R3.5 FIX: anchors start a NATIVE link-drag on mouse move, which hijacked the
   pointer stream and froze the ghost — blocked via draggable="false" +
   dragstart preventDefault + -webkit-user-drag:none. */
const HOLD_MS=400, SLOP=10;
function wireDrag(root){
  const grid = root;
  root.querySelectorAll('.tw-card').forEach(card=>{
    let suppressClick=false;
    card.addEventListener('dragstart', e=>e.preventDefault());
    card.addEventListener('click', e=>{
      if(suppressClick){ e.preventDefault(); e.stopPropagation(); suppressClick=false; }
    });
    card.addEventListener('contextmenu', e=>{
      if(card.classList.contains('pressing')||card.classList.contains('dragging')) e.preventDefault();
    });
    card.addEventListener('pointerdown', e=>{
      if(typeof e.button==='number' && e.button!==0) return;
      const arch = document.getElementById('archTarget');
      const sx=e.clientX, sy=e.clientY;
      let dragActive=false, overArch=false, moved=false, ghost=null, dx=0, dy=0;
      card.classList.add('pressing');
      const blockScroll = ev=>{ if(dragActive) ev.preventDefault(); };
      document.addEventListener('touchmove', blockScroll, {passive:false});
      const timer = setTimeout(()=>{
        dragActive=true; suppressClick=true;
        const rect = card.getBoundingClientRect();
        dx = sx-rect.left; dy = sy-rect.top;
        ghost = card.cloneNode(true);
        ghost.classList.remove('pressing','dragging'); ghost.classList.add('tw-drag-ghost');
        ghost.style.width = rect.width+'px';
        ghost.style.transform = `translate(${rect.left}px, ${rect.top}px) rotate(1.5deg)`;
        document.body.appendChild(ghost);
        card.classList.remove('pressing'); card.classList.add('dragging');
        document.body.classList.add('tw-sorting');
        try{ card.setPointerCapture(e.pointerId); }catch(_){}
      }, HOLD_MS);
      const teardown = ()=>{
        clearTimeout(timer);
        card.classList.remove('pressing');
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        window.removeEventListener('pointercancel', onCancel);
        document.removeEventListener('touchmove', blockScroll);
      };
      const onMove = ev=>{
        if(!dragActive){
          if(Math.hypot(ev.clientX-sx, ev.clientY-sy)>SLOP) teardown(); // scroll / normal click
          return;
        }
        moved=true;
        const x=ev.clientX, y=ev.clientY;
        ghost.style.transform = `translate(${x-dx}px, ${y-dy}px) rotate(1.5deg)`;
        if(arch){
          const r = arch.getBoundingClientRect();
          overArch = x>=r.left && x<=r.right && y>=r.top && y<=r.bottom;
          arch.classList.toggle('drop-hot', overArch);
        }
        if(overArch) return;
        const cards = Array.from(grid.querySelectorAll('.tw-card')).filter(c=>c!==card);
        for(const c of cards){
          const r = c.getBoundingClientRect();
          if(y < r.top + r.height/2){ if(c.previousElementSibling!==card) grid.insertBefore(card, c); return; }
        }
        if(cards.length){ const last=cards[cards.length-1];
          if(last.nextElementSibling!==card) grid.insertBefore(card, last.nextElementSibling); }
      };
      const finishDrag = ()=>{
        if(ghost) ghost.remove();
        card.classList.remove('dragging'); document.body.classList.remove('tw-sorting');
        if(arch) arch.classList.remove('drop-hot');
      };
      const onUp = ()=>{
        const wasDrag = dragActive;
        teardown();
        if(!wasDrag) return; // plain tap → click proceeds and opens the page
        finishDrag();
        if(overArch){
          const f = card.dataset.file;
          if(!PSTATE.archived.includes(f)) PSTATE.archived.push(f);
          PSTATE.order = PSTATE.order.filter(x=>x!==f);
          pLocalSave(); pCloudSave();
          card.remove();
          const ct = arch.querySelector('.ct');
          if(ct){ const n=(parseInt((ct.textContent.match(/\d+/)||[0])[0],10)||0)+1; ct.textContent='→ '+n; }
          const top = grid.querySelector('.tw-top span:last-child');
          if(top) top.textContent = grid.querySelectorAll('.tw-card').length+' showing · '+COPY_FLAVOR;
          flash('Moved to the archive');
        } else if(moved){
          PSTATE.order = Array.from(grid.querySelectorAll('.tw-card')).map(c=>c.dataset.file);
          pLocalSave(); pCloudSave();
        }
      };
      const onCancel = ()=>{ const wasDrag=dragActive; teardown(); if(wasDrag) finishDrag(); };
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
      window.addEventListener('pointercancel', onCancel);
    });
  });
}

async function renderMarquee(root){
  root.innerHTML = skelHTML;
  pLocalLoad();
  try{
    const results = await Promise.all([listPages(''), loadManifest(''), loadSpaces(), pCloudLoad().catch(()=>{})]);
    const files = results[0], man = results[1];
    SPACES = normSpaces(results[2]);

    const cached = cacheLoad();

        `<p>GitHub didn't answer — this usually clears in a minute.</p>`+

}

async function renderArchive(root){
  root.innerHTML = `<a class="tw-back" href="index.html">← the marquee</a>`+
    `<div class="tw-top"><span>The <b>Archive</b></span><span>resting pages</span></div>`+

    const physCards = [...physFiles].sort().map(f=>{const k=kicker(f);
      return `<a class="tw-card" href="archive/${esc(f)}" draggable="false">`+
      `<div class="k">${esc(k)}</div><h3>${esc(titleOf(f,physMan))}</h3>`+

    root.innerHTML = back +

      `<h2 class="tw-title">At rest.</h2>`+
      `<div class="tw-dek">Everything eased off the marquee. Nothing lost — send a page back whenever you need it.</div>`+
      stateCards + physCards;
    root.querySelectorAll('.tw-restore').forEach(btn=>{
      const restore = e=>{
        e.preventDefault(); e.stopPropagation();

        const top = root.querySelector('.tw-top span:last-child');
        const left = root.querySelectorAll('.tw-card').length;
        if(top) top.textContent = left+' resting';
        if(!left){
          root.innerHTML = `<a class="tw-back" href="index.html">← the marquee</a>`+
            `<div class="tw-top"><span>The <b>Archive</b></span><span>resting pages</span></div>`+
            `<h2 class="tw-title">At rest.</h2>`+
            `<div class="tw-empty"><h3>The archive is empty</h3>`+
            `<p>Pages you archive will rest here.</p></div>`;
        }
        flash('Back on the launchpad');
      };
      btn.addEventListener('click', restore);
      btn.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' ') restore(e); });
    });
  }catch(e){
    root.innerHTML = `<a class="tw-back" href="index.html">← the marquee</a>`+
      `<div class="tw-error"><h3>Couldn't reach the archive</h3>`+
      `<p>GitHub didn't answer — try again shortly.</p>`+
      `<span class="tw-retry" onclick="location.reload()">Retry</span></div>`;
  }
}
/* ══ the private wing — ?view=personal ══════════════════════════════════════
   WebAuthn / press_vault are touched ONLY inside a button click here — never on
   load — so an idle tab never prompts and never calls the vault. */
function deviceLabel(){ try{ return (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || 'this device'; }catch(e){ return 'this device'; } }
function friendlyErr(e){
  const name=(e&&e.name)||'', msg=(e&&e.message)||'';
  if(name==='NotAllowedError') return 'Cancelled — or the prompt timed out. Try again.';
  if(/can.?t hold the key/i.test(msg)) return "This browser or authenticator can't hold the key for the personal space.";
  if(/No enrolled passkey/i.test(msg)) return 'No passkey for the personal space on this device yet.';
  // Never surface a raw programming error (e.g. TypeError 'expected bytes' from a shim
  // that returns the PRF output in an unexpected shape). Show a plain-language line; the
  // real error is logged to console.error at the call site for diagnosis.
  if(name==='TypeError' || name==='RangeError') return "Couldn't read the passkey response on this device. Please try again.";
  return msg || 'Something went wrong. Try again.';
}
async function loadDevices(root, man){
  const list=document.getElementById('devList'); if(!list) return;
  list.innerHTML='<div class="meta">loading…</div>';
  const st=vaultState(); if(!st.sess){ list.innerHTML=''; return; }
  let row=null; try{ row=await PressVault.fetchRow(st.sess.vaultId); }catch(e){}
  const label=(row&&row.label)||'This device';
  const created=(row&&row.created_at)?new Date(row.created_at).toLocaleDateString():'—';
  list.innerHTML =
    `<div class="tw-device"><span>${esc(label)} <span class="meta">· this device · added ${esc(created)}</span></span>`+
    `<span class="tw-mini" id="revBtn">Remove</span></div>`+
    `<div class="meta" style="margin-top:8px">Each enrolled passkey holds its own sealed copy — other devices keep their access.</div>`;
  document.getElementById('revBtn').addEventListener('click', async ()=>{
    if(!confirm('Remove this device from the private wing? You will need another enrolled passkey to get back in from here.')) return;
    try{ await PressVault.revoke(st.sess.vaultId); PressVault.lock(); paintPersonal(root, man); }
    catch(e){ console.error('[private-wing] revoke failed:', e); list.insertAdjacentHTML('beforeend', `<div class="tw-secmsg" style="color:var(--tw-rose)">${esc(friendlyErr(e))}</div>`); }
  });
}
/* ── Connect your tools ─────────────────────────────────────────────────────
   Populate the sealed keyring with each personal app's sync key.
   HIDE, DON'T RE-KEY: we VERIFY the creds against the app's REAL data, then seal
   them into the keyring under the SAME passkey — nothing in the app tables is
   rewritten. Sync ids / passphrases are SECRET capabilities, never baked into this
   public page; they are pasted (Mark keeps them in 1Password).

   Two verification shapes:
     kind:'app'   — fsa/giving/retirement: {sync_id, pass}. Fetch the app row and
                    DECRYPT it (AES-256-GCM + PBKDF2, identical envelope across all
                    three) — a good decrypt proves the passphrase.
     kind:'deals' — card-scout: sync_id ONLY, no passphrase. Probe press_deals with
                    the entered value as the x-plan-id header; >=1 row proves the key.
                    A 200 with ZERO rows is a WRONG key, never success (see vault.js).

   COLLAPSE: a CONNECTED tool renders as a quiet line (name + Connected dot + a
   Reconnect button). Its fields are NOT in the DOM until Reconnect is activated;
   collapsing removes them again, clearing anything typed. A NOT-connected tool shows
   its full form, expanded. */
const TOOL_CFG = {
  'fsa.html':        { label:'FSA Claims',          kind:'app', table:'press_fsa',        idcol:'sync_id', select:'doc,version',                 env:(r)=>r.doc },
  'giving.html':     { label:'Giving Tracker',      kind:'app', table:'press_giving',     idcol:'id',      select:'ciphertext,iv,salt,kdf_iters', env:(r)=>r },
  'retirement.html': { label:'Retirement Projection',kind:'app', table:'press_retirement', idcol:'id',      select:'ciphertext,iv,salt,kdf_iters', env:(r)=>r },
  'card-scout.html': { label:'Card Scout',          kind:'deals' }, // sync-id-only; verified against press_deals
};
const CONNECT_TOOLS = ['fsa.html','giving.html','retirement.html','card-scout.html'];
function b64ToU8(s){ const b=atob(String(s)), u=new Uint8Array(b.length); for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i); return u; }
async function appDecrypt(env, passphrase){
  if(!env || env.ciphertext==null || env.iv==null || env.salt==null) return null;
  try{
    const iters=env.kdf_iters||310000;
    const base=await crypto.subtle.importKey('raw', new TextEncoder().encode(String(passphrase)), {name:'PBKDF2'}, false, ['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64ToU8(env.salt), iterations:iters, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM', iv:b64ToU8(env.iv)}, key, b64ToU8(env.ciphertext));
    return JSON.parse(new TextDecoder().decode(pt));
  }catch(e){ return null; } // wrong passphrase / tamper -> fail closed
}
async function fetchAppRow(cfg, syncId){
  const url=PressVault.SUPA_URL+'/rest/v1/'+cfg.table+'?'+cfg.idcol+'=eq.'+encodeURIComponent(syncId)+'&select='+encodeURIComponent(cfg.select);
  const r=await fetch(url, { headers:{ apikey:PressVault.SUPA_KEY, Authorization:'Bearer '+PressVault.SUPA_KEY, 'x-plan-id':syncId } });
  if(!r.ok) return { ok:false };
  const rows=await r.json();
  return { ok:true, row:(Array.isArray(rows)&&rows[0])||null };
}
// CONNECTED = the keyring holds this tool's full capability. For an app that is a
// {sync_id, pass}; card-scout is sync-id-only, so a sync_id alone is connected.
function toolConnected(f){ const k=vaultState().sess; const v=k&&k.keyring&&k.keyring.apps&&k.keyring.apps[f]; if(!v||!v.sync_id) return false; return TOOL_CFG[f].kind==='deals' ? true : !!v.pass; }
function wingDownload(name, text){
  try{ const blob=new Blob([text],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000); }catch(e){}
}
// The fields region for one tool — built fresh each time a row expands, so collapsing
// (which empties the slot) removes any typed value from the DOM. A labelled region with
// per-field aria labels; card-scout gets a sync-id field ONLY (no passphrase, no download).
function toolFieldsHTML(f){
  const cfg=TOOL_CFG[f], deals=cfg.kind==='deals';
  const sync=`<input class="tw-cinput tw-sync" type="text" inputmode="latin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${deals?'Card Scout sync id':'sync id (32 hex)'}" aria-label="${esc(cfg.label)} sync id">`;
  const pass=deals?'':`<input class="tw-cinput tw-pass" type="password" autocomplete="off" placeholder="passphrase" aria-label="${esc(cfg.label)} passphrase">`;
  const dl  =deals?'':`<span class="tw-dl" hidden role="button" tabindex="0">Download my data</span>`;
  return `<div class="tw-tool-form" role="region" aria-label="Connect ${esc(cfg.label)}">`+
      sync+pass+
      `<div class="tw-tool-actions"><span class="tw-btn tw-verify" role="button" tabindex="0">Verify &amp; connect</span>${dl}</div>`+
      `<div class="tw-tool-msg" aria-live="polite"></div>`+
    `</div>`;
}
function renderConnect(){
  return `<div class="tw-connect"><h4>Connect your tools</h4>`+
    `<p class="tw-cmeta">Each tool works once its sync key is sealed behind your passkey — verified against your real data before anything is stored, nothing re-encrypted. Connected tools sit quiet; hit Reconnect to re-enter a key.</p>`+
    CONNECT_TOOLS.map(f=>{
      const cfg=TOOL_CFG[f], on=toolConnected(f);
      const head=`<div class="tw-tool-head"><span class="tw-tool-name">${esc(cfg.label)}</span>`+
        `<span class="tw-tool-status ${on?'on':'off'}">${on?'● Connected':'○ not connected'}</span></div>`;
      // CONNECTED → empty slot + a Reconnect button (fields absent from the DOM until it is pressed).
      // NOT connected → the full form, expanded, and no foot button (nothing to reconnect yet).
      const slot=on?'':toolFieldsHTML(f);
      const foot=on?`<div class="tw-tool-foot"><button type="button" class="tw-mini tw-reconnect" aria-expanded="false">Reconnect</button></div>`:'';
      return `<div class="tw-tool" data-f="${f}" data-kind="${cfg.kind}">${head}<div class="tw-tool-slot">${slot}</div>${foot}</div>`;
    }).join('')+
    `</div>`;
}
function wireConnect(root, man){
  root.querySelectorAll('.tw-tool').forEach(el=>{
    const f=el.getAttribute('data-f'), cfg=TOOL_CFG[f];
    const slot=el.querySelector('.tw-tool-slot');
    const statusEl=el.querySelector('.tw-tool-status');
    let footBtn=el.querySelector('.tw-reconnect'); // present only when the row rendered connected

    // Ensure a Reconnect/Cancel toggle exists (created lazily after a fresh connect so the
    // just-connected row can collapse to the quiet line like any other connected row).
    function ensureFoot(expanded){
      let foot=el.querySelector('.tw-tool-foot');
      if(!foot){ foot=document.createElement('div'); foot.className='tw-tool-foot'; el.appendChild(foot); }
      if(!footBtn){
        footBtn=document.createElement('button'); footBtn.type='button'; footBtn.className='tw-mini tw-reconnect';
        foot.appendChild(footBtn);
        footBtn.addEventListener('click', ()=>{ (footBtn.getAttribute('aria-expanded')==='true') ? collapse() : expand(); });
      }
      footBtn.setAttribute('aria-expanded', expanded?'true':'false');
      footBtn.textContent=expanded?'Cancel':'Reconnect';
    }
    function expand(){
      slot.innerHTML=toolFieldsHTML(f);
      wireForm();
      if(footBtn){ footBtn.setAttribute('aria-expanded','true'); footBtn.textContent='Cancel'; }
      const first=slot.querySelector('.tw-sync'); if(first) first.focus();
    }
    function collapse(){
      slot.innerHTML=''; // drops the fields AND anything typed into them
      if(footBtn){ footBtn.setAttribute('aria-expanded','false'); footBtn.textContent='Reconnect'; }
    }
    function onConnected(){ statusEl.className='tw-tool-status on'; statusEl.textContent='● Connected'; ensureFoot(true); }

    function wireForm(){
      const form=slot.querySelector('.tw-tool-form'); if(!form) return;
      const idIn=form.querySelector('.tw-sync'), passIn=form.querySelector('.tw-pass');
      const verify=form.querySelector('.tw-verify'), dl=form.querySelector('.tw-dl'), msg=form.querySelector('.tw-tool-msg');
      let lastDoc=null;
      const run=async ()=>{
        const syncId=(idIn.value||'').trim(); msg.className='tw-tool-msg';
        if(cfg.kind==='deals'){
          if(!syncId){ msg.classList.add('err'); msg.textContent="Enter Card Scout's sync id."; return; }
          msg.textContent='Verifying against your deals…';
          let verdict; try{ verdict=await PressVault.verifyCardScout(syncId); }catch(e){ verdict='unreachable'; }
          if(verdict==='unreachable'){ msg.classList.add('err'); msg.textContent='Could not reach the data service. Try again.'; return; }
          if(verdict!=='verified'){ msg.classList.add('err'); msg.textContent="That sync id doesn't open Card Scout's deals."; return; } // 200+0 rows = wrong, never success
          const sess=PressVault.loadSession(); if(!sess){ msg.classList.add('err'); msg.textContent='Session expired — unlock again.'; return; }
          const keyring=sess.keyring; keyring.apps=keyring.apps||{};
          const entry=Object.assign({}, keyring.apps[f], { sync_id:syncId });
          if('pass' in entry) delete entry.pass; // card-scout has NO passphrase — never write a pass key
          keyring.apps[f]=entry;
          try{ await PressVault.updateKeyring(keyring); }
          catch(e){ console.error('[private-wing] updateKeyring failed:', e); msg.classList.add('err'); msg.textContent=friendlyErr(e); return; }
          msg.classList.remove('err'); msg.classList.add('ok'); msg.textContent='Connected ✓ — sealed behind your passkey.';
          onConnected(); return;
        }
        // kind:'app' — {sync_id, pass}, verified by decrypting the real row
        const pass=passIn?(passIn.value||''):'';
        if(!/^[0-9a-f]{32}$/i.test(syncId)){ msg.classList.add('err'); msg.textContent='Enter the 32-character sync id.'; return; }
        if(!pass){ msg.classList.add('err'); msg.textContent='Enter the passphrase.'; return; }
        msg.textContent='Verifying against your data…';
        let res; try{ res=await fetchAppRow(cfg, syncId); }catch(e){ res={ok:false}; }
        if(!res.ok){ msg.classList.add('err'); msg.textContent='Could not reach the data service. Try again.'; return; }
        if(!res.row){ msg.classList.add('err'); msg.textContent='No data found for that sync id — check the id.'; return; } // row not found (distinct from bad passphrase)
        const doc=await appDecrypt(cfg.env(res.row), pass);
        if(!doc){ msg.classList.add('err'); msg.textContent='That passphrase did not open the data. Check it and try again.'; return; } // decrypt failed
        // VERIFIED — seal into the keyring (never store unverified; never overwrite a working entry with an unverified one)
        const sess=PressVault.loadSession(); if(!sess){ msg.classList.add('err'); msg.textContent='Session expired — unlock again.'; return; }
        const keyring=sess.keyring; keyring.apps=keyring.apps||{}; keyring.apps[f]=Object.assign({}, keyring.apps[f], { sync_id:syncId, pass:pass });
        try{ await PressVault.updateKeyring(keyring); }
        catch(e){ console.error('[private-wing] updateKeyring failed:', e); msg.classList.add('err'); msg.textContent=friendlyErr(e); return; }
        lastDoc=doc;
        msg.classList.remove('err'); msg.classList.add('ok'); msg.textContent='Connected ✓ — sealed behind your passkey. Download a backup now:';
        if(dl) dl.hidden=false;
        onConnected();
      };
      verify.addEventListener('click', run);
      verify.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); run(); } });
      const submitOnEnter=(inp)=>{ if(inp) inp.addEventListener('keydown', e=>{ if(e.key==='Enter') run(); }); };
      submitOnEnter(passIn); if(!passIn) submitOnEnter(idIn); // card-scout: Enter in the lone sync field submits
      if(dl) dl.addEventListener('click', ()=>{ if(lastDoc) wingDownload(f.replace(/\.html$/,'')+'-data-'+new Date().toISOString().slice(0,10)+'.json', JSON.stringify(lastDoc,null,2)); });
    }

    if(footBtn){ footBtn.addEventListener('click', ()=>{ (footBtn.getAttribute('aria-expanded')==='true') ? collapse() : expand(); }); }
    else { wireForm(); } // not-connected row: the form is already in the slot
  });
}

function paintPersonal(root, man){
  const back=`<a class="tw-back" href="index.html">← the marquee</a>`;
  const top=`<div class="tw-top"><span>The <b>Private Wing</b></span><span>personal tools</span></div>`;
  const st=vaultState();
  if(st.sess){
    const cards=(SPACES.personal||[]).map(f=>cardHTML(f, man, false)).join('');
    root.innerHTML = back+top+`<h2 class="tw-title">Behind the passkey.</h2>`+
      `<div class="tw-dek">Unlocked · ${timeLeft(st.sess.expiresAt)}. Open any tool — no more prompts until you lock or it expires.</div>`+
      `<div class="tw-secbar"><span class="tw-mini" id="lockBtn">⏻ Lock now</span>`+
      `<span class="tw-mini" id="devBtn">⚙ Devices</span></div>`+
      cards +
      renderConnect() +
      `<div class="tw-devices" id="devWrap" hidden><h4>Enrolled passkeys</h4><div id="devList"></div>`+
      `<div style="margin-top:14px"><span class="tw-mini" id="addBtn">＋ Add this device</span></div>`+
      `<div class="tw-secmsg" id="devMsg"></div></div>`;
    document.getElementById('lockBtn').addEventListener('click', ()=>{ PressVault.lock(); paintPersonal(root, man); });
    const devWrap=document.getElementById('devWrap');
    document.getElementById('devBtn').addEventListener('click', ()=>{ devWrap.hidden=!devWrap.hidden; if(!devWrap.hidden) loadDevices(root, man); });
    document.getElementById('addBtn').addEventListener('click', async ()=>{
      const m=document.getElementById('devMsg'); m.style.color=''; m.textContent='Creating a passkey for this device…';
      // Add-device carries the CURRENT (populated) keyring and re-seals it under the new credential — never an empty one.
      try{ await PressVault.addPasskey({label: deviceLabel()}); m.style.color='var(--tw-violet)'; m.textContent='Device added.'; loadDevices(root, man); }
      catch(e){ console.error('[private-wing] addPasskey failed:', e); m.style.color='var(--tw-rose)'; m.textContent=friendlyErr(e); }
    });
    wireConnect(root, man);
  } else {
    // DEFECT 2 fix: "Use your passkey" is ALWAYS the primary action (a discoverable get() works on
    // any device with the synced passkey), regardless of this device's local enrolled flag. "Set up
    // a new passkey" is a de-emphasised secondary that REFUSES to create an empty row when one is
    // already reachable (it adopts the existing row instead).
    root.innerHTML = back+top+`<h2 class="tw-title">Behind the passkey.</h2>`+
      `<div class="tw-unlock"><span class="sicon">${ICONS['Secure']}</span>`+
      `<h3>Unlock the private wing</h3>`+
      `<p>Use your passkey to open your personal tools. Nothing here loads until you unlock.</p>`+
      `<button class="tw-btn" id="unlockBtn">Use your passkey</button>`+
      `<div class="tw-secmsg" id="secmsg"></div>`+
      `<div class="tw-setup-alt"><span class="tw-setup-link" id="setupLink" role="button" tabindex="0">First time on any device? Set up a new passkey</span></div>`+
      `</div>`;
    const btn=document.getElementById('unlockBtn'), msg=document.getElementById('secmsg');
    btn.addEventListener('click', async ()=>{
      btn.disabled=true; msg.style.color=''; msg.textContent='Waiting for your passkey…';
      try{ await PressVault.unlock(); paintPersonal(root, man); }
      catch(e){ console.error('[private-wing] unlock failed:', e); btn.disabled=false; msg.style.color='var(--tw-rose)';
        msg.textContent=friendlyErr(e)+(/No enrolled passkey/i.test((e&&e.message)||'')?' If this is a brand-new space, use “Set up a new passkey”.':''); }
    });
    document.getElementById('setupLink').addEventListener('click', async ()=>{
      if(!confirm('Set up a NEW passkey for the private wing?\n\nOnly if you have never set one up on ANY device. If you already have a passkey (even on another device), tap “Use your passkey” instead — this keeps your existing tools.')) return;
      msg.style.color=''; msg.textContent='Checking for an existing passkey…';
      try{
        // Adopt a reachable row rather than create an empty one.
        try{ await PressVault.unlock(); paintPersonal(root, man); return; }
        catch(e){ if(!/No enrolled passkey|NotAllowed/i.test(((e&&e.name)||'')+' '+((e&&e.message)||''))) throw e; }
        msg.textContent='Creating your passkey…';
        await PressVault.enrol({label: deviceLabel()});
        paintPersonal(root, man);
      }catch(e){ console.error('[private-wing] setup failed:', e); msg.style.color='var(--tw-rose)'; msg.textContent=friendlyErr(e); }
    });
  }
}
async function renderPersonal(root){
  root.innerHTML = `<a class="tw-back" href="index.html">← the marquee</a>`+
    `<div class="tw-top"><span>The <b>Private Wing</b></span><span>personal tools</span></div>`+
    `<h2 class="tw-title">Behind the passkey.</h2><div class="tw-skel"></div>`;
  let man=null;
  try{ const res=await Promise.all([loadManifest(''), loadSpaces()]); man=res[0]; SPACES=normSpaces(res[1]); }
  catch(e){ SPACES=normSpaces(null); }
  paintPersonal(root, man);
}

const params = new URLSearchParams(location.search);
const isArchive  = params.get('view')==='archive'  || location.hash==='#archive';
const isPersonal = params.get('view')==='personal' || location.hash==='#personal';
const root = document.getElementById('tw-root');
(isPersonal ? renderPersonal : isArchive ? renderArchive : renderMarquee)(root);
</script>
