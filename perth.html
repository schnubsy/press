<h2>The first week, in the right order</h2>
<div class="box"><p>Doing these out of order wastes days, because each one needs the one before it.</p>
<ul>
<li><b>Bank ID at a branch</b> — if the account was opened online before flying, the ID has to be shown within 20 days or it closes itself.</li>
<li><b>Medicare</b> — needs the passport plus two documents showing he lives at the address. Living with family means no lease in his name, so a letter from the uni or an employer does the job.</li>
<li><b>myID, then the Tax File Number</b> — with an Australian passport plus one other Australian document he can reach "Strong" identity, and then the TFN usually issues on the spot.</li>
<li><b>Then</b> the phone, the doctor, the SmartRider, the licence appointment.</li>
</ul></div>

<h2>Medicare and health</h2>
<p>As a citizen there is <b>no waiting period</b> — cover starts when he enrols. But enrolment can't happen before he lands, and the US has <b>no reciprocal health agreement</b> with Australia, so the gap between landing and enrolling is uninsured. A month of travel medical cover is cheap next to one emergency visit.</p>
<p>The plastic card takes three or four weeks, but the <b>digital card works immediately</b> through the Express Plus Medicare app.</p>
<p>Medicare does not cover <b>dental, optical or physio</b>. Anything in that bracket is cheaper to deal with in Texas while he's still on US insurance.</p>
<p><b>Bulk billing</b> means the practice bills Medicare directly and he pays nothing. Not every clinic does it, and some only bulk bill under-16s or concession card holders — worth phoning ahead rather than turning up.</p>
<p>Bring medicines in <b>original labelled packaging</b> with a doctor's letter using generic names, and declare them on arrival. A few routine US prescriptions are controlled or simply unavailable in Australia, so it's worth checking before assuming a repeat is possible.</p>

<h2>Money and the US tax tail</h2>
<p>This is the part that quietly follows him. As a US citizen he must <b>file a US return every year</b> regardless of living in Australia, with an automatic extension to 15 June. On top of that, <b>FBAR</b> (FinCEN 114) is triggered once all his foreign accounts <em>added together</em> pass US$10,000 at any point in the year — and superannuation almost certainly counts toward that. It's a disclosure form, not a tax, but the penalties for ignoring it are severe.</p>
<p>Arriving in January means a <b>part-year tax-free threshold</b> in his first Australian year — roughly $16,000 rather than the full $18,200. Worth knowing before he budgets on a refund that doesn't arrive.</p>
<p>Employer <b>super</b> is 12% on top of wages. If he doesn't nominate a fund, the employer picks one for him — not a disaster, but it's a decision made on his behalf, and one account is far simpler to report than three.</p>
<p>Moving money across: retail bank wires lose 3–4% in the exchange rate rather than the fee. Wise, OFX and similar are materially cheaper — compare the amount that <em>arrives</em>, not the advertised fee.</p>
<p>Keep <b>one US bank account and a US phone number alive</b>. US banks and the IRS send verification codes to US numbers, and recovering access from 11,000 miles away with a foreign IP address is genuinely painful.</p>

<h2>Driving</h2>
<p>The USA is on WA's recognised-country list, so the transfer is <b>one appointment, no tests</b> — an eyesight check at the counter, a photo and a fee.</p>
<p>He has <b>three months</b> from taking up residence. After that, driving on the Texas licence is illegal even though the licence itself is perfectly valid, and nobody sends a reminder.</p>
<p>The catch for someone in his position: WA wants <b>five proof-of-identity documents</b> across categories, and the top category wants an Australian birth certificate or citizenship certificate. An Australian passport covers a different category. Somebody who has never lived in Australia can turn up one document short — worth checking the exact list before booking, not at the counter.</p>
<p>Get a <b>certified Texas driving record</b> before leaving (about $10, instant online) plus a letter from the US insurer showing years insured and no claims. Australian insurers default a young driver with no local history to the worst rating band, and these are the only evidence that argues otherwise. Both are far harder to obtain once he no longer has a Texas address.</p>

<h2>Phone, banking and the no-credit-history problem</h2>
<p>He arrives with no Australian credit file, which closes a few doors for six to twelve months.</p>
<ul>
<li><b>Prepaid phone</b> works on day one with just a passport. Postpaid plans and handset contracts need a credit assessment he will fail — not worth attempting yet.</li>
<li><b>Credit cards</b> are the same story. Usually easier after a few pay cycles into an Australian account, and some banks offer a low-limit starter card to existing customers.</li>
<li><b>Rental and utility applications</b> lean on the same file, which is one more reason living with family first is useful.</li>
</ul>

<h2>Uni and the student loan</h2>
<p>As a citizen he gets a <b>Commonwealth Supported Place</b>, so the government subsidises the tuition and he pays the student contribution — which <b>HECS-HELP</b> then lends him, repaid through the tax system only once he earns above the threshold.</p>
<p>Two things gate it. He needs a <b>Tax File Number</b>, and he must submit the <b>Request for Commonwealth support and HECS-HELP</b> form before the <b>census date</b> — a few weeks into semester, somewhere around late March. Miss the census date and the whole semester's fees become payable up front with no loan. This is the single most expensive deadline in the move.</p>
<p>There's also a rule worth knowing: HECS-HELP requires undertaking at least one unit <b>physically in Australia</b>. Being there satisfies it, but it means starting a unit online from Texas wouldn't.</p>

<h2>Worth double-checking before he flies</h2>
<div class="box">
<p>Not cards, because they are probably already handled — but each is hard or impossible to fix once he has gone.</p>
<ul>
<li><b>STAAR exams.</b> If he is on the Texas UT High School programme rather than the International one, a Texas diploma needs five end-of-course exams passed <b>in person in Texas</b> — Algebra I, English I, English II, Biology, US History. The fall window is <b>30 November to 11 December</b>; the next is April, after he has left. One question to the UTHS counsellor settles it.</li>
<li><b>Authenticator apps.</b> Changing phone and number at the same time can lock him out of his own accounts. Export the codes and print the recovery keys first — recovering an account from a foreign IP address is genuinely difficult.</li>
<li><b>US student loans</b>, if he has any. A foreign address quietly breaks the servicer relationship, and income-based repayment recalculations on Australian income have to be filed proactively.</li>
</ul>
</div>

<h2>Two passports</h2>
<p>He must <b>leave the US on the US passport and enter Australia on the Australian one</b>. Present the Australian passport at check-in for the Australia leg — an Australian citizen cannot hold an Australian visa, so a US-passport-only check-in can be refused boarding by the airline's border check. Never apply for a visitor visa or ETA on the US passport as a workaround; that creates a worse problem.</p>

<h2>Flying in</h2>
<p>Declare everything on the <b>Incoming Passenger Card</b> — all food, plant and animal products, wooden items, medicines, and cash over A$10,000. Declaring costs nothing; failing to declare carries an on-the-spot fine. Jerky, fruit, nuts, seeds and homemade food are the classic accidental one, and "I forgot it was in my bag" is not a defence.</p>
<p>Australia runs on <b>230–240V with Type I plugs</b>. Anything with a motor or a heating element won't work properly on a travel adaptor, so it's not worth the suitcase space.</p>
<p>Perth is <b>UTC+8 with no daylight saving</b>, which is 13–15 hours ahead of Texas depending on the season. There's almost no overlapping waking time on weekdays, so a standing call slot beats trying to catch each other.</p>

      extras:{due:'',note:'',steps:[],who:[]}};
    rows.push(row);upsert(row);render();openSheet(id2);setTimeout(function(){$('#sTitle').focus()},260);
    return;
  }
});
$('#sClose').onclick=closeSheet; $('#scrim').onclick=closeSheet; $('#sSave').onclick=save;
$('#sDel').onclick=function(){if(!cur)return;var r=byId(cur);
  if(!confirm('Delete "'+(r.title||'this card')+'"?'))return;
  var id=cur;rows=rows.filter(function(x){return x.item_id!==id});del(id);closeSheet();render();toast('Deleted')};
$('#sStepAdd').onclick=function(){var v=$('#sStepIn').value.trim();if(!v)return;
  var st=curSteps();st.push({t:v,d:false});drawSteps(st);$('#sStepIn').value='';$('#sStepIn').focus()};
$('#sStepIn').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();$('#sStepAdd').click()}});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});

$('#tBoard').onclick=function(){$('#board').hidden=false;$('#tips').hidden=true;
  $('#tBoard').setAttribute('aria-selected','true');$('#tTips').setAttribute('aria-selected','false');render()};
$('#tTips').onclick=function(){$('#board').hidden=true;$('#tips').hidden=false;
  $('#tTips').setAttribute('aria-selected','true');$('#tBoard').setAttribute('aria-selected','false')};

document.addEventListener('dragstart',function(e){
  var n=e.target.closest&&e.target.closest('[data-id]');if(!n)return;
  dragId=n.getAttribute('data-id');n.style.opacity='.45';
  try{e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move'}catch(x){}});
document.addEventListener('dragend',function(){dragId=null;if(autoT){clearInterval(autoT);autoT=null}
  $$('[data-id]').forEach(function(n){n.style.opacity=''});
  $$('.zone.over').forEach(function(n){n.classList.remove('over')})});
var autoT=null;
function autoScroll(y){
  var h=window.innerHeight, edge=90, step=0;
  if(y<edge)step=-Math.ceil((edge-y)/5);
  else if(y>h-edge)step=Math.ceil((y-(h-edge))/5);
  if(!step){if(autoT){clearInterval(autoT);autoT=null}return}
  if(autoT)return;
  autoT=setInterval(function(){
    if(!dragId){clearInterval(autoT);autoT=null;return}
    window.scrollBy(0,step*4);},16);
}
document.addEventListener('dragover',function(e){
  if(!dragId)return;
  e.preventDefault();
  autoScroll(e.clientY);
  var z=e.target.closest&&e.target.closest('[data-zone]');if(!z)return;
  $$('.zone.over').forEach(function(n){if(n!==z)n.classList.remove('over')});z.classList.add('over')});
document.addEventListener('drop',function(e){
  var z=e.target.closest&&e.target.closest('[data-zone]');if(!z)return;
  e.preventDefault();z.classList.remove('over');
  if(autoT){clearInterval(autoT);autoT=null}
  if(dragId)setState(dragId,z.getAttribute('data-zone'));dragId=null});

$('#tips').innerHTML=$('#tipsrc').innerHTML;
function boot(){
  render();load();
  setInterval(function(){if(!document.hidden&&!cur)load()},120000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&!cur)load()});
}
if(window.FamilyGate){
  window.FamilyGate.cfg({spacesUrl:'spaces.json'});
  window.FamilyGate.require('perth.html').then(boot)
    .catch(function(){/* gate stays up; the board never renders behind it */});
}else{
  document.body.innerHTML='<p style="padding:24px;color:#8a94a6;font:15px system-ui,-apple-system,sans-serif">Sign-in unavailable \u2014 the gate did not load.</p>';
}
</script>
</body>
