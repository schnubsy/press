<style>/* remit — Passport. Ink-navy stock, guilloché weave, brass double-rules, Outfit throughout.
   Tokens + structure are the design/ Canvas Brief and the six screen mocks, verbatim. */
:root{
  --stage:#0d1420; --raised:#131d2c; --panel:rgba(201,162,109,.055);
  --brass:#c9a26d; --brass-dim:rgba(201,162,109,.28); --brass-faint:rgba(201,162,109,.14);
  --ink:#eae4d6; --muted:#8f9bab; --faint:#7e8da3;  /* raised to clear WCAG AA (4.5:1) incl. on the tinted riding panel */
  --paid:#7fae86; --rejected:#c2686e; --asked:#c9a26d;
  --sans:Outfit,system-ui,-apple-system,'Segoe UI',sans-serif;
  --weave:repeating-linear-gradient(48deg,rgba(201,162,109,.05) 0 1px,transparent 1px 9px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--stage);color:var(--ink);font:400 14.5px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0;background:var(--weave);pointer-events:none;z-index:0;opacity:.85}
.app{position:relative;z-index:1;max-width:430px;margin:0 auto;min-height:100vh;padding:20px 18px 190px}
@media(min-width:900px){.app{max-width:880px;padding:32px 40px 190px}}
.num{font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1,'lnum' 1}
.linkbtn{background:0;border:0;color:var(--brass);font:inherit;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}

.hd{padding-bottom:12px;border-bottom:3px double var(--brass-dim)}
.hd .r{display:flex;justify-content:space-between;align-items:baseline}
.hd .who{font:600 22px/1 var(--sans);letter-spacing:-.01em}
.hd .mo{font:400 10px/1 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--brass)}
.hd .sub{font:400 11px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin-top:7px}

.seg{display:flex;gap:20px;margin:16px 0 0;border-bottom:1px solid var(--brass-faint)}
.seg button{background:0;border:0;padding:0 0 10px;cursor:pointer;font:500 13px/1 var(--sans);color:var(--muted)}
.seg button[aria-pressed=true]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--brass)}
.months{display:flex;gap:17px;overflow-x:auto;margin:14px -18px 0;padding:0 18px 9px;scrollbar-width:none}
.months::-webkit-scrollbar{display:none}
.months a{font:400 10.5px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--faint);
  text-decoration:none;white-space:nowrap;padding-bottom:6px;border-bottom:1px solid transparent}
.months a[aria-current=true]{color:var(--ink);border-bottom-color:var(--brass)}

.zone{margin-top:26px}
.zone-hd{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--brass-dim);padding-bottom:8px}
.zone-hd h2{margin:0;font:500 11px/1 var(--sans);letter-spacing:.26em;text-transform:uppercase;color:var(--ink)}
.zone-hd .tt{font:600 14px/1 var(--sans);color:var(--ink)}
.zone-hd .tt em{font-style:normal;font-weight:400;color:var(--faint);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-right:8px}

.riding{margin-top:34px;background:var(--panel);border:1px solid var(--brass-faint);
  border-left:3px solid var(--brass);border-radius:0 10px 10px 0;padding:4px 16px 16px}
.riding .zone-hd{border-bottom-color:var(--brass-faint);padding-top:14px}
.riding .zone-hd h2{color:var(--brass)}
.riding .why{font:400 11.5px/1.55 var(--sans);color:var(--muted);margin:10px 0 2px}

.bk{font:400 10px/1 var(--sans);letter-spacing:.26em;text-transform:uppercase;color:var(--faint);margin:20px 0 4px}
.bk .num{float:right;letter-spacing:.06em;text-transform:none;font-size:11.5px;color:var(--muted)}
.row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px dotted var(--brass-faint);min-height:44px;cursor:pointer}
.row:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.chip{flex:0 0 auto;font:500 8.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;
  border:1px solid;border-radius:2px;padding:4px 5px;min-width:46px;text-align:center}
.chip.paid{color:var(--paid);border-color:rgba(127,174,134,.32)}  /* quiet, but AA-legible */
.chip.yes{color:var(--ink);border-color:rgba(234,228,214,.4)}
.chip.asked{color:var(--asked);border-color:var(--brass);background:rgba(201,162,109,.1)}
.chip.no{color:#d98d92;border-color:var(--rejected);background:rgba(194,104,110,.10)}  /* AA-legible on its own tint */
.nm{flex:1;min-width:0}
.nm b{font-weight:400;font-size:14px;display:block;line-height:1.35}
.nm em{display:block;font-style:normal;font-size:11.5px;line-height:1.4;color:var(--faint);margin-top:2px}
.am{font:500 14.5px/1 var(--sans);white-space:nowrap}
.row.off .nm b,.row.off .am{color:var(--muted)}
.row.rej .nm b,.row.rej .am{color:var(--muted);text-decoration:line-through}
.row.dragging{opacity:.5}
.row.dragover{box-shadow:inset 0 2px 0 var(--brass)}
.flag{display:inline-block;min-width:15px;height:15px;border-radius:50%;background:var(--brass);color:#1a1205;
  font:600 9.5px/15px var(--sans);text-align:center;margin-left:7px;vertical-align:1px;padding:0 3px}
.cur{font:500 9px/1 var(--sans);letter-spacing:.1em;color:var(--brass);border:1px solid var(--brass-dim);
  border-radius:2px;padding:3px 4px;margin-left:7px;vertical-align:1px}
.note{font:400 11.5px/1.6 var(--sans);color:var(--faint)}

.foot{position:fixed;left:0;right:0;bottom:0;z-index:5;background:linear-gradient(180deg,rgba(13,20,32,.8),var(--stage) 34%);
  border-top:3px double var(--brass-dim);backdrop-filter:blur(12px)}
.foot .in{max-width:430px;margin:0 auto;padding:15px 18px calc(18px + env(safe-area-inset-bottom));position:relative}
@media(min-width:900px){.foot .in{max-width:880px;padding:15px 40px 18px}}
.tl{display:flex;justify-content:space-between;align-items:baseline}
.tl+.tl{margin-top:4px}
.tl span{font:400 10px/1 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.tl b{font:600 27px/1 var(--sans);letter-spacing:-.01em}
.est{font:400 11.5px/1.6 var(--sans);color:var(--faint)}
.btn{display:block;width:100%;margin-top:13px;padding:14px;border-radius:4px;border:1px solid var(--brass);
  background:var(--brass);color:#1a1205;font:600 13.5px/1 var(--sans);letter-spacing:.04em;cursor:pointer}
.btn.ghost{background:transparent;color:var(--brass)}
.btn[disabled]{opacity:.55;cursor:progress}
.stamp{position:absolute;right:24px;top:6px;transform:rotate(-8deg);border:2px solid var(--paid);
  color:var(--paid);border-radius:4px;padding:6px 10px;text-align:center;opacity:.85}
.stamp b{display:block;font:700 12px/1 var(--sans);letter-spacing:.16em}
.stamp i{display:block;font-style:normal;font:500 8.5px/1 var(--sans);letter-spacing:.14em;margin-top:4px}

/* ── item sheet (bottom sheet) — slice 5 ── */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(6,10,16,.62);opacity:0;transition:opacity .2s}
.scrim.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--raised);border-top:3px double var(--brass-dim);
  border-radius:16px 16px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);
  transition:transform .24s cubic-bezier(.22,1,.36,1);max-height:92vh;overflow:auto}
.sheet.open{transform:translateY(0)}
@media(min-width:900px){.sheet{max-width:520px;left:50%;transform:translate(-50%,100%);border-radius:16px;bottom:24px}.sheet.open{transform:translate(-50%,0)}}
.sheet h3{margin:0 0 14px;font:600 17px/1.2 var(--sans)}
.sheet .grip{width:40px;height:4px;border-radius:2px;background:var(--brass-faint);margin:0 auto 14px}
.field{margin-bottom:12px}
.field label{display:block;font:400 9.5px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;min-height:46px;background:rgba(13,20,32,.6);border:1px solid var(--brass-dim);
  border-radius:8px;padding:11px 13px;color:var(--ink);font-size:16px;font-family:inherit}
.field textarea{min-height:70px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--brass);outline-offset:1px}
.field input::placeholder,.field textarea::placeholder{color:#9aa6b6;opacity:1}
.frow{display:flex;gap:10px}.frow .field{flex:1}
.seg2{display:flex;gap:8px}
.seg2 button{flex:1;min-height:44px;border:1px solid var(--brass-dim);background:rgba(13,20,32,.5);color:var(--muted);
  border-radius:8px;font:500 12px/1 var(--sans);cursor:pointer}
.seg2 button[aria-pressed=true]{background:rgba(201,162,109,.16);border-color:var(--brass);color:var(--ink)}
.sheet-actions{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.sheet-actions .btn{margin-top:0;flex:1;min-width:120px}
.danger{color:var(--rejected);border-color:var(--rejected);background:transparent}
.thread{margin-top:14px;border-top:1px solid var(--brass-faint);padding-top:12px}
.msg-line{padding:8px 0;border-bottom:1px dotted var(--brass-faint)}
.msg-line .who{font:500 10px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--brass)}
.msg-line .body{font-size:13.5px;margin-top:3px}

/* sheet internals — the item editor (mock: item.html) */
.grab{width:34px;height:3px;border-radius:3px;background:var(--brass-dim);margin:0 auto 16px}
.f{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px dotted var(--brass-faint)}
.f label{flex:0 0 88px;padding-top:9px;font:400 9.5px/1.3 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.f .v{flex:1;min-width:0;font:400 14.5px/1.4 var(--sans)}
.f .v input,.f .v textarea{width:100%;background:rgba(13,20,32,.6);border:1px solid var(--brass-dim);border-radius:8px;
  padding:11px 12px;color:var(--ink);font:400 16px/1.4 var(--sans);min-height:46px}
.f .v textarea{min-height:60px;resize:vertical}
.f .v input:focus,.f .v textarea:focus{outline:2px solid var(--brass);outline-offset:1px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{font:500 11.5px/1 var(--sans);padding:9px 12px;border-radius:3px;border:1px solid var(--brass-faint);
  color:var(--muted);background:rgba(13,20,32,.4);cursor:pointer;min-height:38px}
.pills button.on{border-color:var(--brass);color:var(--ink);background:rgba(201,162,109,.12)}
.pills button.on.danger{border-color:var(--rejected);color:#d98d92;background:rgba(194,104,110,.12)}
.msgbox{margin-top:16px;border:1px solid var(--rejected);border-radius:5px;padding:14px;background:rgba(194,104,110,.08)}
.msgbox h4{margin:0 0 9px;font:500 9.5px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:#d98d92}
.msgbox textarea{width:100%;background:transparent;border:0;resize:vertical;min-height:48px;color:var(--ink);font:400 14.5px/1.5 var(--sans);outline:0}
.thread{margin-top:16px}
.msg{padding:11px 0;border-bottom:1px dotted var(--brass-faint)}
.msg .mh{font:400 9.5px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.msg p{margin:0;font:400 14px/1.5 var(--sans)}
.addmsg{display:flex;gap:8px;margin-top:12px}
.addmsg input{flex:1;background:rgba(13,20,32,.6);border:1px solid var(--brass-dim);border-radius:8px;padding:10px 12px;color:var(--ink);font:400 15px/1.4 var(--sans);min-height:44px}
.acts{display:flex;gap:9px;margin-top:20px;flex-wrap:wrap}.acts .btn{margin:0;flex:1;min-width:120px}
.lockmsg{margin:10px 0 0;font:400 12px/1.5 var(--sans);color:#d98d92}

/* transfer screen (mock: transfer.html) */
.f2{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dotted var(--brass-faint)}
.f2 label{flex:0 0 118px;font:400 9.5px/1.3 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.f2 .v{flex:1;min-width:0}
.f2 .v input,.f2 .v select{width:100%;background:rgba(13,20,32,.6);border:1px solid var(--brass-dim);border-radius:8px;
  padding:10px 12px;color:var(--ink);font:500 16px/1.3 var(--sans);min-height:44px}
.f2 .v input:focus,.f2 .v select:focus{outline:2px solid var(--brass);outline-offset:1px}
.derived{margin-top:22px;border:1px solid var(--brass-faint);border-left:3px solid var(--brass);
  border-radius:0 10px 10px 0;padding:16px 18px;background:var(--panel)}
.derived h4{margin:0 0 10px;font:500 9.5px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--brass)}
.dl{display:flex;justify-content:space-between;padding:7px 0;font:400 13.5px/1.4 var(--sans);color:var(--muted)}
.dl b{font-weight:600;color:var(--ink)}.dl b.good{color:var(--paid)}
.covered{margin:6px 0 2px}

/* ── toast / undo ── */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);z-index:60;opacity:0;
  background:var(--raised);border:1px solid var(--brass-dim);border-radius:10px;padding:12px 16px;display:flex;gap:14px;align-items:center;
  font-size:13px;box-shadow:0 12px 30px rgba(0,0,0,.4);transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast button{background:0;border:0;color:var(--brass);font:600 13px/1 var(--sans);cursor:pointer;text-transform:uppercase;letter-spacing:.06em}

/* ── reports (spec §4.4 / S9) — a full-height overlay over the month view ── */
.rsheet{position:fixed;inset:0;z-index:30;background:var(--stage);overflow-y:auto;opacity:0;transition:opacity .2s;
  padding:0 0 calc(40px + env(safe-area-inset-bottom))}
.rsheet.open{opacity:1}
.rsheet:before{content:"";position:fixed;inset:0;background:var(--weave);pointer-events:none;opacity:.85}
.rhead{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;max-width:430px;margin:0 auto;
  padding:16px 18px 12px;background:linear-gradient(180deg,var(--stage) 78%,transparent);border-bottom:3px double var(--brass-dim)}
@media(min-width:900px){.rhead,.rtabs,.rbody{max-width:880px}.rhead{padding-left:40px;padding-right:40px}}
.rback{background:0;border:0;color:var(--brass);font:500 13px/1 var(--sans);cursor:pointer;padding:6px 0;min-height:44px}
.rtitle{flex:1;font:600 18px/1 var(--sans);letter-spacing:-.01em}
.rgrand{font:600 16px/1 var(--sans);color:var(--ink)}
.rtabs{display:flex;gap:16px;overflow-x:auto;max-width:430px;margin:0 auto;padding:12px 18px 0;scrollbar-width:none;
  position:sticky;top:63px;z-index:2;background:var(--stage);border-bottom:1px solid var(--brass-faint)}
.rtabs::-webkit-scrollbar{display:none}
@media(min-width:900px){.rtabs{padding-left:40px;padding-right:40px}}
.rtabs button{background:0;border:0;padding:2px 0 10px;cursor:pointer;white-space:nowrap;font:500 12px/1 var(--sans);
  letter-spacing:.06em;color:var(--muted);border-bottom:2px solid transparent;min-height:40px}
.rtabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--brass)}
.rbody{position:relative;max-width:430px;margin:0 auto;padding:10px 18px 0}
@media(min-width:900px){.rbody{padding-left:40px;padding-right:40px}}
.rlead{font:400 12px/1.6 var(--sans);color:var(--faint);margin:12px 0 4px}
.rgroup{margin-top:22px}
.rgroup h3{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 4px;padding-bottom:8px;
  border-bottom:1px solid var(--brass-dim);font:500 11px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--ink)}
.rgroup h3 .rgt{letter-spacing:.02em;text-transform:none;font-size:12.5px;color:var(--muted);font-weight:400}
.empty-group h3{color:var(--muted)}
.rmonth{padding:12px 0;border-bottom:1px dotted var(--brass-faint)}
.rmonth.is-flagged{background:rgba(201,162,109,.05);margin:0 -10px;padding:12px 10px;border-radius:6px;border-bottom:1px dotted var(--brass-faint)}
.rmrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;min-height:38px;padding:9px 0}
.rmonth .rmrow{padding:0;min-height:0}
.rml{flex:1;min-width:0;font:400 14px/1.4 var(--sans)}
.rml em{display:block;font-style:normal;font-size:11.5px;line-height:1.4;color:var(--faint);margin-top:2px}
.rml .chip{margin-right:8px}
.rmrow b.num{font:500 14.5px/1 var(--sans);white-space:nowrap}
.rmeta{font:400 10.5px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.rsub{display:flex;justify-content:space-between;gap:14px;font:400 11.5px/1.5 var(--sans);color:var(--faint);margin-top:5px}
.rnotes{margin-top:8px;border-left:2px solid var(--brass-dim);padding:2px 0 2px 12px}
.rnotes p{margin:6px 0;font:400 11.5px/1.55 var(--sans);color:var(--muted)}
.rnotes p b{color:var(--ink);font-weight:500}
.flagpill{display:inline-block;font:600 8.5px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--asked);
  border:1px solid var(--brass);border-radius:2px;padding:3px 5px;background:rgba(201,162,109,.1);vertical-align:1px}
.rsplit{padding:14px 0;border-bottom:1px dotted var(--brass-faint)}
.bar{display:flex;height:9px;border-radius:5px;overflow:hidden;margin:9px 0 7px;background:rgba(13,20,32,.6);border:1px solid var(--brass-faint)}
.bar-rec{background:var(--brass);height:100%}
.bar-ext{background:rgba(143,155,171,.5);height:100%}
.rcat .rml{color:var(--muted)}
.rtotal{border-top:3px double var(--brass-dim);margin-top:18px;padding-top:14px}
.rtotal b.num{font-size:16px}
.rduewarn{margin:14px 0 2px;font:500 12px/1.4 var(--sans);color:#d98d92;border:1px solid var(--rejected);
  border-radius:5px;padding:11px 13px;background:rgba(194,104,110,.08)}
.rduewarn.ok{color:var(--paid);border-color:rgba(127,174,134,.4);background:rgba(127,174,134,.08)}
.rempty{font:400 12px/1.6 var(--sans);color:var(--faint);margin:8px 0 0}
.rempty-full{padding:40px 4px;text-align:center;color:var(--muted);font:400 13px/1.7 var(--sans)}
</style>

    <div class="sub">loading…</div></div>

<!-- src/vendor/family-gate.js -->
<script>
/* eslint-disable */
/* =============================================================================
 * press family-gate.js — the ONE place the Family Wing sign-in flow is written
 * (docs/access-framework.md §7). Vendored into each tenant page the same way
 * src/gate.js is vendored into the personal apps, and guarded byte-for-byte by
 * the tenant's own `--check` (press's inline:check does not police sibling repos).
 *
 *   FamilyGate.require(page)  -> resolves {email,name} when a GRANTED session exists;
 *                                otherwise renders the full-page sign-in and resolves
 *                                after a granted sign-in completes.
 *   FamilyGate.session()      -> { email, name } | null   (sync, from local storage)
 *   FamilyGate.authHeaders()  -> { apikey, Authorization } for the tenant's own REST calls
 *   FamilyGate.signOut()      -> clears the local session (and best-effort GoTrue logout)
 *
 * Design notes:
 *   - It talks to Supabase Auth (GoTrue) and PostgREST with RAW fetch — NO supabase-js,
 *     no CDN, no runtime dep, matching the house "no network at boot for public pages"
 *     rule. persistSession / autoRefreshToken are implemented here (localStorage + a
 *     refresh timer), which is what the spec's "signed in effectively forever" means.
 *   - FAIL CLOSED is the whole point: reads of spaces.json and press_access_apps that
 *     error are treated as "gated". Zero auth calls happen until a page is known gated.
 *   - A failed token refresh renders the sign-in screen, never an error (spec §8).
 *   - The gate is courtesy; RLS is the lock (framework §2). Deleting this block yields a
 *     working app with nothing in it — every row is behind press_access_has('<page>').
 *
 * Node-importable: every DOM/browser touch is guarded, so the unit tests load this file
 * for its pure helpers (normSession, isExpired, sessionFromToken, gatedDecision, …) and
 * a Playwright spec drives the full flow against mocked GoTrue + PostgREST endpoints.
 * ========================================================================== */
(function (root) {
  'use strict';

  // --- config (all public / embeddable — the publishable anon key, same project) ---
  var SUPA_URL = 'https://eepjhpyziczrxvirczio.supabase.co';
  var SUPA_KEY = 'sb_publishable__iv3bI7xDAsOdHUlXzbVZQ_2yyFS4uX';
  var AUTH = SUPA_URL + '/auth/v1';
  var REST = SUPA_URL + '/rest/v1';
  var SESSION_KEY = 'press:family:v1';
  var REFRESH_SKEW_MS = 60 * 1000;   // treat a token as expired 60s early; refresh this far ahead

  // spaces.json sits beside the tenant page at the press root; a RELATIVE url resolves to
  // /press/spaces.json on the live site and to the served copy under a test origin. Overridable.
  var SPACES_URL = 'spaces.json';

  // Injectable seams for the unit tests (browser uses the real globals).
  var _fetch = (typeof fetch !== 'undefined') ? fetch.bind(globalThis) : null;
  var _store = (function () { try { return globalThis.localStorage || null; } catch (e) { return null; } })();

  function cfg(opts) {
    opts = opts || {};
    if (opts.fetch) _fetch = opts.fetch;
    if (opts.store) _store = opts.store;
    if (opts.spacesUrl) SPACES_URL = opts.spacesUrl;
    if (opts.supaUrl) { SUPA_URL = opts.supaUrl; AUTH = SUPA_URL + '/auth/v1'; REST = SUPA_URL + '/rest/v1'; }
    if (opts.supaKey) SUPA_KEY = opts.supaKey;
    return { SUPA_URL: SUPA_URL, SUPA_KEY: SUPA_KEY, AUTH: AUTH, REST: REST, SPACES_URL: SPACES_URL };
  }

  // ── pure helpers (unit-tested; no I/O) ──────────────────────────────────────
  // Build a normalised session from a GoTrue token response. GoTrue `expires_at` is epoch
  // SECONDS; `expires_in` is seconds-from-now. Returns null unless both tokens are present.
  function sessionFromToken(tok) {
    if (!tok || typeof tok.access_token !== 'string' || typeof tok.refresh_token !== 'string') return null;
    var user = tok.user || {};
    var meta = user.user_metadata || {};
    var expMs = tok.expires_at ? (tok.expires_at * 1000)
              : (Date.now() + ((tok.expires_in || 3600) * 1000));
    return {
      access_token: tok.access_token,
      refresh_token: tok.refresh_token,
      expires_at: expMs,
      email: String(user.email || '').toLowerCase(),
      name: meta.name || meta.full_name || null
    };
  }
  function normSession(o) {
    if (!o || typeof o !== 'object') return null;
    if (typeof o.access_token !== 'string' || typeof o.refresh_token !== 'string') return null;
    if (typeof o.expires_at !== 'number') return null;
    return { access_token: o.access_token, refresh_token: o.refresh_token,
             expires_at: o.expires_at, email: String(o.email || '').toLowerCase(), name: o.name || null };
  }
  function isExpired(session, now, skewMs) {
    if (!session) return true;
    now = (typeof now === 'number') ? now : Date.now();
    skewMs = (typeof skewMs === 'number') ? skewMs : REFRESH_SKEW_MS;
    return now >= (session.expires_at - skewMs);
  }
  // The fail-closed union, as a pure decision (framework §3). `page` is gated when it is in
  // spaces.family, OR the DB says so, OR EITHER read failed.
  function gatedDecision(d) {
    d = d || {};
    if (!d.spacesOk) return true;            // spaces.json unreadable -> gate
    if (d.inSpacesFamily) return true;       // repo-owned gate
    if (!d.appsOk) return true;              // press_access_apps unreadable -> gate
    return !!d.appsGated;                     // DB half of the union
  }

  // ── local session store ─────────────────────────────────────────────────────
  function loadSession() {
    if (!_store) return null;
    try { return normSession(JSON.parse(_store.getItem(SESSION_KEY) || 'null')); }
    catch (e) { return null; }
  }
  function saveSession(s) {
    if (!_store || !s) return;
    try { _store.setItem(SESSION_KEY, JSON.stringify(s)); } catch (e) {}
  }
  function clearSession() {
    if (!_store) return;
    try { _store.removeItem(SESSION_KEY); } catch (e) {}
  }

  // ── network ─────────────────────────────────────────────────────────────────
  function authFetch() { if (!_fetch) throw new Error('no fetch available'); return _fetch; }
  function anonHeaders(extra) {
    var h = { 'apikey': SUPA_KEY, 'Content-Type': 'application/json' };
    if (extra) for (var k in extra) h[k] = extra[k];
    return h;
  }
  function bearerHeaders(session, extra) {
    var h = { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + (session ? session.access_token : SUPA_KEY),
              'Content-Type': 'application/json' };
    if (extra) for (var k in extra) h[k] = extra[k];
    return h;
  }

  async function loadSpaces() {
    var r = await authFetch()(SPACES_URL, { headers: { 'Accept': 'application/json' } });
    if (!r || !r.ok) throw new Error('spaces ' + (r && r.status));
    return await r.json();
  }
  async function fetchApp(page, session) {
    // authenticated read of press_access_apps for one page; anon is revoked, so a signed-out
    // caller gets a non-2xx here and the caller fails closed.
    var r = await authFetch()(REST + '/press_access_apps?select=page,gated&page=eq.' + encodeURIComponent(page),
      { headers: bearerHeaders(session) });
    if (!r || !r.ok) throw new Error('apps ' + (r && r.status));
    var rows = await r.json();
    return (rows && rows[0]) || null;
  }
  async function hasGrant(session, page) {
    var r = await authFetch()(REST + '/rpc/press_access_has',
      { method: 'POST', headers: bearerHeaders(session), body: JSON.stringify({ page: page }) });
    if (!r || !r.ok) return false;
    var v = await r.json();
    return v === true;
  }
  function touch(session) {
    // fire-and-forget last_seen_at stamp (§6); never blocks sign-in and never throws.
    try {
      authFetch()(REST + '/rpc/press_access_touch',
        { method: 'POST', headers: bearerHeaders(session), body: '{}' }).catch(function () {});
    } catch (e) {}
  }
  async function sendCode(email) {
    var r = await authFetch()(AUTH + '/otp',
      { method: 'POST', headers: anonHeaders(), body: JSON.stringify({ email: email, create_user: false }) });
    return { ok: !!(r && r.ok), status: r && r.status };
  }
  async function verifyCode(email, token) {
    var r = await authFetch()(AUTH + '/verify',
      { method: 'POST', headers: anonHeaders(), body: JSON.stringify({ email: email, token: token, type: 'email' }) });
    if (!r || !r.ok) return null;
    return sessionFromToken(await r.json());
  }
  async function refresh(refreshToken) {
    var r = await authFetch()(AUTH + '/token?grant_type=refresh_token',
      { method: 'POST', headers: anonHeaders(), body: JSON.stringify({ refresh_token: refreshToken }) });
    if (!r || !r.ok) return null;
    return sessionFromToken(await r.json());
  }

  // Resolve a usable session from storage, refreshing if needed. Returns a live session or null.
  async function ensureFresh() {
    var s = loadSession();
    if (!s) return null;
    if (!isExpired(s)) return s;
    var ns = await refresh(s.refresh_token);   // rotation, not expiry, is the usual cause
    if (!ns) { clearSession(); return null; }   // failed refresh -> sign-in, not an error
    saveSession(ns);
    return ns;
  }

  async function isGated(page) {
    var spaces;
    try { spaces = await loadSpaces(); }
    catch (e) { return gatedDecision({ spacesOk: false }); }
    var fam = (spaces && Array.isArray(spaces.family)) ? spaces.family : [];
    if (fam.indexOf(page) !== -1) return true;
    // not repo-gated — consult the DB half of the union, failing closed
    try {
      var s = loadSession();
      var app = await fetchApp(page, s);
      return gatedDecision({ spacesOk: true, inSpacesFamily: false, appsOk: true, appsGated: app ? app.gated : false });
    } catch (e) {
      return gatedDecision({ spacesOk: true, inSpacesFamily: false, appsOk: false });
    }
  }

  // ── auto-refresh timer (autoRefreshToken equivalent) ────────────────────────
  var _timer = null;
  function stopAutoRefresh() { if (_timer) { try { clearTimeout(_timer); } catch (e) {} _timer = null; } }
  function scheduleRefresh(session, onLost) {
    if (typeof setTimeout !== 'function') return;
    stopAutoRefresh();
    var delay = Math.max(5000, session.expires_at - Date.now() - REFRESH_SKEW_MS);
    _timer = setTimeout(async function () {
      var ns = await refresh(session.refresh_token);
      if (!ns) { clearSession(); stopAutoRefresh(); if (onLost) try { onLost(); } catch (e) {} return; }
      saveSession(ns);
      scheduleRefresh(ns, onLost);
    }, delay);
  }

  // ── the sign-in UI (browser only) ───────────────────────────────────────────
  var STYLE_ID = 'family-gate-style';
  var CSS =
    '#family-gate{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;' +
    'padding:24px;background:radial-gradient(130% 100% at 50% 0%,#131d2c 0%,#0d1420 72%);' +
    "font-family:Outfit,system-ui,-apple-system,'Segoe UI',sans-serif;color:#eae4d6}" +
    /* muted text colour, raised to clear WCAG AA on the card */
    '#family-gate *{box-sizing:border-box}' +
    '#family-gate .fg-card{width:100%;max-width:400px;text-align:center;padding:34px 26px;border-radius:14px;' +
    'background:rgba(19,29,44,.82);border:1px solid rgba(201,162,109,.28);box-shadow:0 24px 60px rgba(0,0,0,.5)}' +
    '#family-gate .fg-icon{width:44px;height:44px;margin:0 auto 14px;color:#c9a26d}' +
    '#family-gate .fg-icon svg{width:44px;height:44px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}' +
    '#family-gate h1{font-size:20px;font-weight:600;margin:0 0 8px;letter-spacing:.1px}' +
    '#family-gate p{font-size:13px;line-height:1.55;color:#8f9bab;margin:0 auto 20px;max-width:320px}' +
    '#family-gate label{display:block;text-align:left;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#8f9bab;margin:0 0 6px 2px}' +
    '#family-gate input{width:100%;min-height:48px;background:rgba(13,20,32,.6);border:1px solid rgba(201,162,109,.3);' +
    'border-radius:8px;padding:12px 14px;color:#eae4d6;font-size:16px;font-family:inherit;margin-bottom:14px}' +
    '#family-gate input:focus{outline:2px solid #c9a26d;outline-offset:1px}' +
    '#family-gate input::placeholder{color:#9aa6b6;opacity:1}' +
    '#family-gate .fg-code{letter-spacing:.4em;text-align:center;font-variant-numeric:tabular-nums}' +
    '#family-gate .fg-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;' +
    'font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#1a1205;cursor:pointer;border:0;border-radius:8px;' +
    'padding:14px 24px;background:#c9a26d;font-weight:600;font-family:inherit}' +
    '#family-gate .fg-btn:hover{filter:brightness(1.06)}' +
    '#family-gate .fg-btn[disabled]{opacity:.6;cursor:progress}' +
    '#family-gate .fg-msg{font-size:12.5px;margin-top:14px;min-height:1em;color:#eae4d6}' +
    '#family-gate .fg-msg.err{color:#c2686e}' +
    '#family-gate .fg-back{display:inline-block;margin-top:18px;font-size:12px;color:#8f9bab;text-decoration:none;' +
    'border-bottom:1px solid rgba(125,138,156,.4)}' +
    '#family-gate .fg-back:hover{color:#eae4d6}' +
    '#family-gate .fg-link{background:0;border:0;color:#8f9bab;font:inherit;font-size:12px;text-decoration:underline;' +
    'text-underline-offset:3px;cursor:pointer;margin-top:14px}';
  var ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect>' +
    '<polyline points="3 7 12 13 21 7"></polyline></svg>';

  function injectStyle() {
    if (typeof document === 'undefined' || document.getElementById(STYLE_ID)) return;
    var s = document.createElement('style'); s.id = STYLE_ID; s.textContent = CSS;
    (document.head || document.documentElement).appendChild(s);
  }
  function removeGate() {
    if (typeof document === 'undefined') return;
    var el = document.getElementById('family-gate');
    if (el && el.parentNode) el.parentNode.removeChild(el);
  }
  function friendlyAuthErr(status) {
    if (status === 429) return 'Too many attempts just now — wait a minute and try again.';
    if (status === 403 || status === 422) return 'That address is not on the family list.';
    return 'That didn’t work. Check the code and try again.';
  }

  // Render the sign-in and resolve `done` only on a granted sign-in. `existing` is a valid but
  // UN-granted session, if any (a signed-in address that lacks a grant for THIS page).
  function renderSignIn(page, done, existing) {
    if (typeof document === 'undefined') { return; } // nothing to render in Node
    injectStyle();
    removeGate();
    var host = document.createElement('div');
    host.id = 'family-gate';
    host.setAttribute('role', 'dialog');
    host.setAttribute('aria-modal', 'true');
    host.setAttribute('aria-label', 'Sign in to the Family Wing');

    var MARQUEE = 'index.html?view=family';

    if (existing) {
      host.innerHTML =
        '<div class="fg-card">' +
          '<div class="fg-icon">' + ICON + '</div>' +
          '<h1>You’re signed in.</h1>' +
          '<p>Signed in as <b>' + escapeHtml(existing.email) + '</b>, but that address doesn’t have access to this page yet. Ask Mark to grant it.</p>' +
          '<button class="fg-link" id="fg-signout" type="button">Sign in as someone else</button>' +
          '<div><a class="fg-back" href="' + MARQUEE + '">← the family wing</a></div>' +
        '</div>';
      document.body.appendChild(host);
      host.querySelector('#fg-signout').addEventListener('click', function () {
        clearSession(); renderSignIn(page, done, null);
      });
      return;
    }

    host.innerHTML =
      '<div class="fg-card">' +
        '<div class="fg-icon">' + ICON + '</div>' +
        '<h1>The Family Wing.</h1>' +
        '<p>Enter your email and we’ll send a 6-digit code. You’ll stay signed in on this device.</p>' +
        '<form id="fg-email-form">' +
          '<label for="fg-email">Your email</label>' +
          '<input id="fg-email" type="email" inputmode="email" autocomplete="email" autofocus placeholder="you@example.com" />' +
          '<button class="fg-btn" id="fg-send" type="submit">Send me a code</button>' +
        '</form>' +
        '<form id="fg-code-form" hidden>' +
          '<label for="fg-code">6-digit code</label>' +
          '<input id="fg-code" class="fg-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" />' +
          '<button class="fg-btn" id="fg-verify" type="submit">Verify &amp; sign in</button>' +
        '</form>' +
        '<div class="fg-msg" id="fg-msg" aria-live="polite"></div>' +
        '<a class="fg-back" href="' + MARQUEE + '">← the family wing</a>' +
      '</div>';
    document.body.appendChild(host);

    var emailForm = host.querySelector('#fg-email-form');
    var codeForm = host.querySelector('#fg-code-form');
    var emailInput = host.querySelector('#fg-email');
    var codeInput = host.querySelector('#fg-code');
    var sendBtn = host.querySelector('#fg-send');
    var verifyBtn = host.querySelector('#fg-verify');
    var msg = host.querySelector('#fg-msg');
    var currentEmail = '';

    emailForm.addEventListener('submit', async function (e) {
      e.preventDefault();
      var email = String(emailInput.value || '').trim().toLowerCase();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { msg.className = 'fg-msg err'; msg.textContent = 'Enter a valid email.'; return; }
      currentEmail = email;
      sendBtn.disabled = true; msg.className = 'fg-msg'; msg.textContent = 'Sending…';
      try {
        await sendCode(email); // deliberately non-committal on the result, to avoid leaking who is on the list
        emailForm.hidden = true; codeForm.hidden = false;
        msg.className = 'fg-msg';
        msg.textContent = 'If ' + email + ' is on the family list, a code is on its way. Enter it above.';
        if (codeInput.focus) codeInput.focus();
      } catch (err) {
        sendBtn.disabled = false; msg.className = 'fg-msg err'; msg.textContent = 'Couldn’t reach the mail service. Try again.';
      }
    });

    codeForm.addEventListener('submit', async function (e) {
      e.preventDefault();
      var code = String(codeInput.value || '').trim();
      if (!/^\d{6}$/.test(code)) { msg.className = 'fg-msg err'; msg.textContent = 'The code is 6 digits.'; return; }
      verifyBtn.disabled = true; msg.className = 'fg-msg'; msg.textContent = 'Signing you in…';
      var session;
      try { session = await verifyCode(currentEmail, code); }
      catch (err) { session = null; }
      if (!session) {
        verifyBtn.disabled = false; msg.className = 'fg-msg err'; msg.textContent = friendlyAuthErr(422);
        return;
      }
      var granted = false;
      try { granted = await hasGrant(session, page); } catch (err) { granted = false; }
      if (!granted) {
        saveSession(session);
        renderSignIn(page, done, session); // signed in, but no grant for THIS page
        return;
      }
      saveSession(session);
      touch(session);
      removeGate();
      done({ email: session.email, name: session.name });
    });

    // allow a "resend" by going back to the email step
    codeForm.addEventListener('click', function () {}, { once: true });
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  // ── public API ──────────────────────────────────────────────────────────────
  // require(page, opts?) -> Promise<{email,name}>. Resolves when a granted session exists;
  // otherwise mounts the sign-in and resolves after a granted sign-in. Public pages (a page
  // vendoring the gate but not gated) resolve immediately with whatever local session exists.
  function require_(page, opts) {
    cfg(opts);
    return (async function () {
      var gated = await isGated(page);
      if (!gated) { var s0 = loadSession(); return s0 ? { email: s0.email, name: s0.name } : null; }
      var s = await ensureFresh();
      if (s) {
        var granted = false;
        try { granted = await hasGrant(s, page); } catch (e) { granted = false; }
        if (granted) {
          touch(s);
          scheduleRefresh(s, function () { renderSignIn(page, function (id) { scheduleRefresh(loadSession(), function () {}); }, null); });

<script>
/* eslint-disable */
/* =============================================================================
 * remit money.js — the one rule made executable: NEVER sum two currencies.

<script>

  FixtureStore.prototype.getTransfers = function (year, month, currency) {

  FixtureStore.prototype.getCommitments = function () { return clone(this.state.commitments); };
  // The whole dataset the reports (spec §4.4) read — every month, item, transfer and commitment at once.
  FixtureStore.prototype.getReportData = async function () {
    return {

  // ── SupabaseStore (live; PostgREST via the family gate). Verified at slice 8. ──
  function SupabaseStore(gate) {

  SupabaseStore.prototype._h = function (extra) { return Object.assign({}, this.gate.authHeaders(), extra || {}); };

  SupabaseStore.prototype.load = async function () {

    try { this._rates = await this._get('/remit_rates?select=*'); } catch (e) { this._rates = []; }
    return this;
  };
  SupabaseStore.prototype.viewer = function () { var s = this.gate.session(); return (s && s.email) || 'unknown'; };
  SupabaseStore.prototype.getPeople = function () { return this._people.filter((p) => p.active !== false); };
  SupabaseStore.prototype.getPerson = function (id) { return this._people.find((p) => p.id === id) || null; };
  SupabaseStore.prototype.getRates = function () { return this._rates; };
  SupabaseStore.prototype.getMessages = function () { return this._messages || []; };
  SupabaseStore.prototype.getMonths = function (personId, focus) {
    var f = focus || { year: new Date().getUTCFullYear(), month: new Date().getUTCMonth() + 1 };

  };
  SupabaseStore.prototype.getMonthData = async function (personId, year, month) {
    var periods = await this._get('/remit_periods?select=*&person_id=eq.' + personId + '&year=eq.' + year + '&month=eq.' + month);
    var period = periods[0] || null;
    if (!period) return { period: null, items: [], messages: [] };

  SupabaseStore.prototype.ensurePeriod = async function (personId, year, month) {

  SupabaseStore.prototype.getBudgets = async function (personId, year) {

  SupabaseStore.prototype.addItem = async function (periodId, fields) {
    var body = Object.assign({ period_id: periodId, settle: 'transfer', status: 'requested', created_by: this.viewer() }, fields);
    var rows = await this._post('/remit_items', body); this._emit(); return rows && rows[0];
  };
  SupabaseStore.prototype.updateItem = async function (id, patch) { var rows = await this._patch('/remit_items?id=eq.' + id, patch); this._emit(); return rows && rows[0]; };
  SupabaseStore.prototype.setStatus = function (id, status) { return this.updateItem(id, { status: status }); };
  SupabaseStore.prototype.setSort = function (id, sort_order, bucket) { var p = { sort_order: sort_order }; if (bucket) p.bucket = bucket; return this.updateItem(id, p); };
  SupabaseStore.prototype.reorder = async function (id, dir) {

  };
  SupabaseStore.prototype.setBudget = async function (id, patch) { var r = await this._patch('/remit_budgets?id=eq.' + id, patch); this._emit(); return r && r[0]; };
  SupabaseStore.prototype.addBudget = async function (fields) { var r = await this._post('/remit_budgets', fields); this._emit(); return r && r[0]; };
  SupabaseStore.prototype.softDelete = function (id) { return this.updateItem(id, { deleted_at: nowISO() }); };
  SupabaseStore.prototype.undoDelete = function (id) { return this.updateItem(id, { deleted_at: null }); };
  SupabaseStore.prototype.addMessage = async function (itemId, body, author) {
    var rows = await this._post('/remit_messages', { item_id: itemId, body: body, author_email: author || this.viewer(), read_by: [author || this.viewer()] });

  SupabaseStore.prototype.rejectWithMessage = async function (id, body, author) {

  SupabaseStore.prototype.materialise = async function (personId, year, month) {
    var periods = await this._get('/remit_periods?select=*&person_id=eq.' + personId + '&year=eq.' + year + '&month=eq.' + month);
    var period = periods[0];
    if (!period) period = (await this._post('/remit_periods', { person_id: personId, year: year, month: month, materialised_at: nowISO() }))[0];
    var budgets = await this.getBudgets(personId, year);
    var existing = await this._get('/remit_items?select=budget_id&period_id=eq.' + period.id + '&deleted_at=is.null');
    var have = {}; existing.forEach((e) => { if (e.budget_id) have[e.budget_id] = true; });
    var added = 0, order = 0;
    for (var i = 0; i < budgets.length; i++) { var b = budgets[i]; if (have[b.id]) continue; order += 10; added++;

  SupabaseStore.prototype.createTransfer = async function (fields, itemIds) {

<script>
/* eslint-disable */
/* =============================================================================
 * remit ui/month.js — the home screen (spec §4.1 + §4.7). Two zones, three levels of hierarchy:
 * the kid's Recurring + Extras under one heading with a running subtotal, then "Riding along —
 * Mark's own" as a separate tinted panel. Per-currency totals only, USD always a labelled estimate.
 * Renders from Remit.money.monthModel; row taps open the item sheet (wired from slice 5).
 * ========================================================================== */
(function (root) {
  'use strict';
  var Remit = root.Remit = root.Remit || {};
  var money = Remit.money, fx = Remit.fx;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  var WHERE = { USD: 'the US', GBP: 'the UK', AUD: 'Australia', EUR: 'Europe' };

  function chipFor(it) {
    if (it.status === 'paid') return { cls: 'paid', label: 'Paid' };
    if (it.status === 'approved') return { cls: 'yes', label: 'Approved' };
    if (it.status === 'rejected') return { cls: 'no', label: 'Refused' };
    return { cls: 'asked', label: 'Asked' };
  }

  function rowHTML(row, person) {
    var it = row.item, chip = chipFor(it);
    var homeCur = person && person.home_currency;
    var curBadge = (it.currency && it.currency !== homeCur) ? '<span class="cur">' + esc(it.currency) + '</span>' : '';
    var flag = row.unread ? '<span class="flag" aria-label="unread message">!</span>' : '';
    var note = it.note ? '<em>' + esc(it.note) + '</em>' : '';
    return '<div class="row ' + row.cls + '" role="button" tabindex="0" data-item="' + esc(it.id) + '">' +
      '<span class="chip ' + chip.cls + '">' + chip.label + '</span>' +
      '<span class="nm"><b>' + esc(it.description) + curBadge + flag + '</b>' + note + '</span>' +
      '<span class="am num">' + money.fmt(it.amount, it.currency) + '</span></div>';
  }

  function groupHTML(label, subtotalMap, rows, person) {
    if (!rows.length) return '';
    var sub = money.fmtByCurrency(subtotalMap);
    return '<div class="bk">' + esc(label) + '<span class="num">' + esc(sub) + '</span></div>' +
      rows.map((r) => rowHTML(r, person)).join('');
  }

  function render(ctrl) {
    var store = ctrl.store, root = ctrl.root;
    var person = store.getPerson(ctrl.personId);
    var months = store.getMonths(ctrl.personId, { year: ctrl.year, month: ctrl.month });
    var model = ctrl.model;

    var people = store.getPeople().filter((p) => p.is_kid);
    var seg = '<div class="seg" role="group" aria-label="Person">' +
      people.map((p) => '<button type="button" data-person="' + esc(p.id) + '" aria-pressed="' + (p.id === ctrl.personId) + '">' + esc(p.name) + '</button>').join('') +
      '<button type="button" data-person="__both" aria-pressed="' + (ctrl.personId === '__both') + '">Both</button></div>';

    var strip = '<nav class="months" aria-label="Month">' +
      months.map((m) => '<a href="#" data-ym="' + m.year + '-' + m.month + '" aria-current="' + (m.current ? 'true' : 'false') + '">' + esc(m.current ? m.label : m.short) + '</a>').join('') + '</nav>';

    var head = '<div class="hd"><div class="r"><span class="who">' + esc(person ? person.name : '') + '</span>' +
      '<span class="mo">' + esc(money.monthLabel(ctrl.year, ctrl.month)) + '</span></div>' +
      (person && person.sub ? '<div class="sub">' + esc(person.sub) + '</div>' : '') + '</div>';

    if (!model.period) {
      root.innerHTML = head + seg + strip + emptyHTML(ctrl);
      wire(ctrl);
      return;
    }

    // settled-here groups, one per currency, labelled by where
    var settledRows = model.settled.rows;
    var settledHTML = '';
    if (settledRows.length) {
      var byCur = {};
      settledRows.forEach((r) => { (byCur[r.item.currency] = byCur[r.item.currency] || []).push(r); });
      settledHTML = Object.keys(byCur).map((cur) => {
        var sub = {}; sub[cur] = money.sumByCurrency(byCur[cur].filter((r) => r.settledHere).map((r) => r.item))[cur] || 0;
        return groupHTML('Settled in ' + (WHERE[cur] || cur), sub, byCur[cur], person);
      }).join('');
    }

    var kid = '<section class="zone"><div class="zone-hd"><h2>' + esc((person ? person.name : '') + '’s month') + '</h2>' +
      '<span class="tt"><em>subtotal</em> <span class="num">' + esc(money.fmtByCurrency(model.kidSubtotal) || money.fmt(0, person ? person.home_currency : 'GBP')) + '</span></span></div>' +
      groupHTML('Recurring', model.recurring.subtotal, model.recurring.rows, person) +
      groupHTML('Extras', model.extras.subtotal, model.extras.rows, person) +
      settledHTML +
      '</section>';

    var riding = model.mine.rows.length ? (
      '<section class="riding"><div class="zone-hd"><h2>Riding along — Mark’s own</h2>' +
      '<span class="tt"><em>subtotal</em> <span class="num">' + esc(money.fmtByCurrency(model.mine.subtotal)) + '</span></span></div>' +
      '<p class="why">Nothing to do with ' + esc(person ? person.name : 'the kid') + '. Bundled into the same transfer to pay one fee instead of two.</p>' +
      model.mine.rows.map((r) => rowHTML(r, person)).join('') + '</section>') : '';

    var addBar = '<p class="note" style="margin-top:26px"><button type="button" class="linkbtn" id="addItem">＋ Add an item</button> · <button type="button" class="linkbtn" id="planBtn">Yearly plan</button> · <button type="button" class="linkbtn" id="reportsBtn">Reports</button> · drag a line to reorder or move it between sections; on touch, use the sheet.</p>';

    root.innerHTML = head + seg + strip + kid + riding + addBar + footerHTML(ctrl);
    wire(ctrl);
  }

  function emptyHTML(ctrl) {
    var budgets = ctrl.store.getBudgets ? (ctrl.store.getBudgets(ctrl.personId, ctrl.year) || []) : [];
    var n = Array.isArray(budgets) ? budgets.length : 0;
    return '<section class="zone"><div class="tw-empty" style="text-align:center;padding:40px 0;color:var(--muted)">' +
      '<h3 style="font-weight:500;color:var(--ink)">Nothing here yet</h3>' +
      (n ? '<p>' + n + ' recurring item' + (n === 1 ? '' : 's') + ' ready — approve them or change them.</p><button class="btn" id="materialise" style="max-width:280px;margin:14px auto 0">Bring in the recurring plan</button>'
         : '<p>Add the first item for this month.</p><button class="btn ghost" id="addItem" style="max-width:280px;margin:14px auto 0">＋ Add an item</button>') +
      '</div></section>';
  }

  function footerHTML(ctrl) {
    var model = ctrl.model, rates = ctrl.store.getRates ? ctrl.store.getRates() : [];
    var outCurs = Object.keys(model.outstanding);
    // currencies fully sent this month (something transferred, nothing left outstanding) get a SENT line
    var sentCurs = Object.keys(model.transferred).filter((c) => !model.outstanding[c]);
    var tl = outCurs.length
      ? outCurs.map((c) => '<div class="tl"><span>To transfer · ' + esc(c) + '</span><b class="num">' + money.fmt(model.outstanding[c], c) + '</b></div>').join('')
      : (sentCurs.length
        ? sentCurs.map((c) => '<div class="tl"><span>Sent · ' + esc(c) + '</span><b class="num">' + money.fmt(model.transferred[c], c) + '</b></div>').join('')
        : '<div class="tl"><span>To transfer</span><b class="num">—</b></div>');
    var stamp = (!outCurs.length && sentCurs.length) ? '<div class="stamp"><b>SENT</b><i>' + esc(money.monthLabel(ctrl.year, ctrl.month).toUpperCase()) + '</i></div>' : '';
    var est = outCurs.length ? fx.estimateLine(model.outstanding, rates) : null;
    var counts = [];
    if (model.counts.requested) counts.push(model.counts.requested + ' asked');
    if (model.counts.rejected) counts.push(model.counts.rejected + ' refused');
    Object.keys(model.settledHere).forEach((c) => counts.push(money.fmt(model.settledHere[c], c) + ' settled here'));
    var btn = model.anyOutstanding ? '<button class="btn" id="recordTransfer">Record the ' + esc(money.monthLabel(ctrl.year, ctrl.month).split(' ')[0]) + ' transfer</button>' : '';
    return '<div class="foot"><div class="in">' + stamp + tl +
      (est ? '<div class="est" style="margin-top:9px">' + esc(est) + '</div>' : '') +
      (counts.length ? '<div class="est">' + esc(counts.join(' · ')) + '</div>' : '') +
      btn + '</div></div>';
  }

  function wire(ctrl) {
    var root = ctrl.root;
    root.querySelectorAll('[data-person]').forEach((b) => b.addEventListener('click', () => ctrl.setPerson(b.getAttribute('data-person'))));
    root.querySelectorAll('[data-ym]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); var p = a.getAttribute('data-ym').split('-'); ctrl.setMonth(+p[0], +p[1]); }));
    var mat = root.querySelector('#materialise'); if (mat) mat.addEventListener('click', () => ctrl.materialise());
    var add = root.querySelector('#addItem'); if (add) add.addEventListener('click', () => ctrl.addItem());
    var plan = root.querySelector('#planBtn'); if (plan) plan.addEventListener('click', () => ctrl.openBudgets());
    var rep = root.querySelector('#reportsBtn'); if (rep) rep.addEventListener('click', () => ctrl.openReports());
    var rec = root.querySelector('#recordTransfer'); if (rec) rec.addEventListener('click', () => ctrl.recordTransfer());
    // row → open the item sheet (Remit.ui.sheet, from slice 5). Enter/Space too, for a11y.
    root.querySelectorAll('[data-item]').forEach((rowEl) => {
      var open = () => ctrl.openItem(rowEl.getAttribute('data-item'));
      rowEl.addEventListener('click', open);
      rowEl.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
    });
    if (Remit.ui.wireDrag) Remit.ui.wireDrag(ctrl); // slice 6
  }

  // ── the month controller ──────────────────────────────────────────────────
  function mountMonth(root, store, opts) {
    opts = opts || {};
    var ctrl = {
      root: root, store: store, personId: null, year: null, month: null, model: null,
    };
    // default person: first kid with data, else first kid
    var kids = store.getPeople().filter((p) => p.is_kid);
    ctrl.personId = opts.personId || (kids[0] && kids[0].id) || (store.getPeople()[0] && store.getPeople()[0].id);
    // default month: the person's latest period, else the current month
    var strip = store.getMonths(ctrl.personId);
    var cur = strip.find((m) => m.current) || strip[strip.length - 1];
    ctrl.year = opts.year || cur.year; ctrl.month = opts.month || cur.month;

    ctrl.refresh = async function () {
      // lazy materialisation (spec §4.1/§5.5): first view of a real kid's month with a yearly plan
      // brings the recurring budget in, unapproved. Idempotent — materialise never duplicates.
      if (ctrl.personId !== '__both') {
        var probe = await store.getMonthData(ctrl.personId, ctrl.year, ctrl.month);
        if ((!probe.period || probe.items.length === 0)) {
          var budgets = await Promise.resolve(store.getBudgets(ctrl.personId, ctrl.year));
          if (budgets && budgets.length) await store.materialise(ctrl.personId, ctrl.year, ctrl.month);
        }
      }
      var data = await store.getMonthData(ctrl.personId === '__both' ? (kids[0] && kids[0].id) : ctrl.personId, ctrl.year, ctrl.month);
      if (ctrl.personId === '__both') {
        // combined: merge every kid's items for this month (per-currency totals still never cross-sum)
        var merged = data.items.slice(), msgs = data.messages.slice(), period = data.period;
        for (var i = 1; i < kids.length; i++) { var d2 = await store.getMonthData(kids[i].id, ctrl.year, ctrl.month); merged = merged.concat(d2.items); msgs = msgs.concat(d2.messages); period = period || d2.period; }
        ctrl.model = money.monthModel(period || { id: '__both' }, merged, { messages: msgs, viewer: store.viewer() });
      } else {
        ctrl.model = money.monthModel(data.period || { id: '__none' }, data.items, { messages: data.messages, viewer: store.viewer() });
      }
      render(ctrl);
    };
    ctrl.setPerson = function (id) { ctrl.personId = id; var s = store.getMonths(id === '__both' ? (kids[0] && kids[0].id) : id); var c = s.find((m) => m.current) || s[s.length - 1]; ctrl.refresh(); };
    ctrl.setMonth = function (y, m) { ctrl.year = y; ctrl.month = m; ctrl.refresh(); };
    ctrl.materialise = async function () { await store.materialise(ctrl.personId, ctrl.year, ctrl.month); ctrl.refresh(); };
    ctrl.ensurePeriod = function () { return (ctrl.model && ctrl.model.period && ctrl.model.period.id && ctrl.model.period.id !== '__none' && ctrl.model.period.id !== '__both') ? Promise.resolve(ctrl.model.period) : store.ensurePeriod(ctrl.personId, ctrl.year, ctrl.month); };
    ctrl.openItem = function (id) { if (Remit.ui.openSheet) Remit.ui.openSheet(ctrl, id); };
    ctrl.addItem = function () { if (Remit.ui.openSheet) Remit.ui.openSheet(ctrl, null); };
    ctrl.recordTransfer = function () { if (Remit.ui.openTransfer) Remit.ui.openTransfer(ctrl); };
    ctrl.openBudgets = function () { if (Remit.ui.openBudgets) Remit.ui.openBudgets(ctrl); };
    ctrl.openReports = function () { if (Remit.ui.openReports) Remit.ui.openReports(ctrl); };

<script>

 *   2. Recurring vs extras — the kid's split, as a share, over every month.
 *   3. Category drift — what "extras" actually consisted of, by half-year.
 *   4. Transfers — sent · delivered · cost · effective rate vs the ECB mid.
 *   5. Commitments — the tuition + residence ledger, with what is still due.
 *

 * currencies — every total is per currency. Months whose imported line items

    ['Food & groceries', /\b(deliveroo|grocer|groceries|tesco|sainsbur|food|meal|lunch|dinner|coffee|restaurant|takeaway|snack|drink)\b/i],
    ['Health & care',    /\b(bandaid|band-?aid|blister|plaster|pharmac|chemist|medic|dentist|doctor|health|prescription|glasses|optician|hair)\b/i],
    ['Home & living',    /\b(bedding|duvet|pillow|furniture|homeware|kitchen|laundry|cleaning|decor|lamp|storage|bin)\b/i],
    ['Study & kit',      /\b(book|course|tuition|laptop|printing|print|stationery|library|\blab\b|software|subscription|phone|mobile|charger|cable)\b/i],

  // ── the pure model ──────────────────────────────────────────────────────────
  function build(data) {

    var transfers = data.transfers || [], commitments = data.commitments || [], rates = data.rates || [];

    var items = allItems.filter(function (it) { return !it.deleted_at; });
    var periodById = {}; periods.forEach(function (pr) { periodById[pr.id] = pr; });
    var personById = {}; people.forEach(function (p) { personById[p.id] = p; });
    var byPeriod = {}; items.forEach(function (it) { (byPeriod[it.period_id] = byPeriod[it.period_id] || []).push(it); });

    var ordered = periods.slice().sort(function (a, b) { return (b.year * 12 + b.month) - (a.year * 12 + a.month); });

        periodId: pr.id, year: pr.year, month: pr.month, label: money.monthLabel(pr.year, pr.month),
        personId: pr.person_id, personName: (personById[pr.person_id] || {}).name || '—',

    { key: 'split', label: 'Split' },

    { key: 'transfers', label: 'Transfers' },

          '<div class="rmrow"><span class="rml">' + esc(m.label) + (m.flagged ? ' ' + flagPill() : '') + '</span>' +
          '<b class="num">' + esc(curLine(m.transfer)) + '</b></div>' + settled + notes + '</div>';

  }

      rows.map(function (m) {

      '<span class="rtitle">Reports</span><span class="rgrand num" id="rGrand">…</span></div>' +
      '<nav class="rtabs" role="tablist">' + TABS.map(function (t, i) {

<script>
/* eslint-disable */
/* =============================================================================
 * remit boot.js — the one entry point. Two paths, one sign-in implementation:
 *   • FIXTURE mode (window.__REMIT_FIXTURE__ injected) — the data-layer seam is local, no live
 *     sign-in in the inner loop (the arc's FIXTURE RULE). Used by slices 3–7's tests.
 *   • LIVE mode — FamilyGate.require('remit.html') gates the app. This is the ONLY sign-in code
 *     path in the repo; RLS is the real protection. Flipped on at slice 8 by not injecting a fixture.
 * After a live sign-in the app offers Add to Home Screen once (exempts iOS from the 7-day sweep).
 * ========================================================================== */
(function (root) {
  'use strict';
  var Remit = root.Remit = root.Remit || {};

  function fixture() { try { return (typeof window !== 'undefined' && window.__REMIT_FIXTURE__) || null; } catch (e) { return null; } }

    var mount = document.getElementById('remit-root');

    } else {
      if (!window.FamilyGate) { mount.innerHTML = '<p style="padding:24px;color:var(--muted)">Sign-in unavailable — the gate did not load.</p>'; return; }
      window.FamilyGate.cfg({ spacesUrl: 'spaces.json' });

    catch (e) { mount.innerHTML = '<p style="padding:24px;color:var(--muted)">Couldn’t load your data — try again in a moment.</p>'; return; }

      ? 'Add remit to your Home Screen (Share → Add to Home Screen) — it keeps you signed in.'
      : 'Install remit — it keeps you signed in on this device.') + '</span>' +
      '<button type="button" id="a2hs-go">' + (isIOS ? 'Got it' : 'Install') + '</button>';
