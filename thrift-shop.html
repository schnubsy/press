<style>
  /* ==== Native Ledger (arc native-ledger-redesign, 2026-10-22) — Mark's A1–A7 over the Native Ledger base system.
     A1 colour = Night Market's scheme, dark-first; light follows prefers-color-scheme; [data-theme] overrides both ways.
     A2 spacing = multiples of 6px. Rows stay ≥ 44px (touch). Tokens below are the ONLY colour source. ==== */
  :root{
    color-scheme:dark;
    --bg:#0B0D1A; --glow-a:rgba(62,230,240,.20); --glow-b:rgba(154,107,255,.22);
    --surface:rgba(255,255,255,.055); --surface-2:rgba(255,255,255,.10); --solid:#161A2C;
    --ink:#EEF0FF; --ink-2:#A9AED6; --ink-3:#8A8FBA; --line:rgba(255,255,255,.12);
    --accent:#3EE6F0; --accent-2:#9A6BFF; --accent-text:#67EEF5; --on-accent:#0B0D1A; --accent-soft:rgba(62,230,240,.14);
    --primary:#3EE6F0; --on-primary:#0B0D1A;
    --h-ok:#3EE6F0; --h-empty:#8A8FBA; --h-blocked:#FF5C8A; --h-signin:#B897FF; --h-partial:#FFC857;
    --danger:#FF5C8A; --on-danger:#0B0D1A; --scrim:rgba(4,5,12,.6);
    --nav-shadow:0 8px 30px rgba(0,0,0,.6); --menu-shadow:0 12px 36px rgba(0,0,0,.55);
    --s1:3px; --s2:6px; --s3:9px; --s4:12px; --s5:18px; --s6:24px; --s7:36px;
    --tap:44px; --r:14px;
    --ui:-apple-system,BlinkMacSystemFont,system-ui,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --navfont:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif;
    --capsule-h:52px; --capsule-gap:calc(16px + env(safe-area-inset-bottom));
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      color-scheme:light;
      --bg:#E9ECFA; --glow-a:rgba(62,230,240,.10); --glow-b:rgba(154,107,255,.11);
      --surface:rgba(255,255,255,.72); --surface-2:rgba(255,255,255,.92); --solid:#FFFFFF;
      --ink:#14163A; --ink-2:#474C78; --ink-3:#5F6492; --line:rgba(20,22,58,.12);
      --accent:#0AA5B0; --accent-2:#6B3DF0; --accent-text:#06737B; --on-accent:#FFFFFF; --accent-soft:rgba(10,165,176,.12);
      --primary:#06737B; --on-primary:#FFFFFF;
      --h-ok:#06737B; --h-empty:#5F6492; --h-blocked:#C2185B; --h-signin:#6B3DF0; --h-partial:#9A6A00;
      --danger:#C2185B; --on-danger:#FFFFFF; --scrim:rgba(20,22,58,.35);
      --nav-shadow:0 8px 30px rgba(0,0,0,.35); --menu-shadow:0 12px 36px rgba(20,22,58,.22);
    }
  }
  :root[data-theme="light"]{
    color-scheme:light;
    --bg:#E9ECFA; --glow-a:rgba(62,230,240,.10); --glow-b:rgba(154,107,255,.11);
    --surface:rgba(255,255,255,.72); --surface-2:rgba(255,255,255,.92); --solid:#FFFFFF;
    --ink:#14163A; --ink-2:#474C78; --ink-3:#5F6492; --line:rgba(20,22,58,.12);
    --accent:#0AA5B0; --accent-2:#6B3DF0; --accent-text:#06737B; --on-accent:#FFFFFF; --accent-soft:rgba(10,165,176,.12);
    --primary:#06737B; --on-primary:#FFFFFF;
    --h-ok:#06737B; --h-empty:#5F6492; --h-blocked:#C2185B; --h-signin:#6B3DF0; --h-partial:#9A6A00;
    --danger:#C2185B; --on-danger:#FFFFFF; --scrim:rgba(20,22,58,.35);
    --nav-shadow:0 8px 30px rgba(0,0,0,.35); --menu-shadow:0 12px 36px rgba(20,22,58,.22);
  }
  /* A1: under reduced transparency every surface is solid */
  @media (prefers-reduced-transparency: reduce){
    :root{ --surface:#161A2C; --surface-2:#1E2338; --glow-a:transparent; --glow-b:transparent; }
    :root[data-theme="light"]{ --surface:#FFFFFF; --surface-2:#FFFFFF; }
  }
  @media (prefers-reduced-transparency: reduce) and (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){ --surface:#FFFFFF; --surface-2:#FFFFFF; }
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important} /* a component's display must never beat the hidden attribute */
  html{-webkit-text-size-adjust:100%;background:var(--bg)}
  body{
    margin:0;color:var(--ink);background-color:var(--bg);
    background-image:radial-gradient(60% 40% at 15% 0%,var(--glow-a),transparent 70%),radial-gradient(60% 45% at 100% 35%,var(--glow-b),transparent 70%);
    background-attachment:fixed;background-repeat:no-repeat;
    font:15px/1.4 var(--ui);-webkit-font-smoothing:antialiased;
    padding-bottom:calc(var(--capsule-h) + var(--capsule-gap) + 24px);
  }
  html,body{overflow-x:hidden}
  @supports (overflow:clip){ html,body{overflow-x:clip} }
  img,svg,video,table,pre{max-width:100%}
  button{font:inherit;color:inherit}
  a{color:var(--accent-text)}
  .vh{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  :focus-visible{outline:3px solid var(--accent-text);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  /* ---------- top bar: back · logo · name · sync ---------- */
  .top{display:flex;align-items:center;gap:var(--s2);max-width:720px;margin:0 auto;min-height:var(--tap);
    padding:calc(env(safe-area-inset-top) + 2px) 16px 0}
  .tw-back{display:inline-flex;align-items:center;justify-content:center;font-size:24px;font-weight:600;line-height:1;color:var(--ink-2);
    text-decoration:none;min-height:var(--tap);min-width:var(--tap);margin-left:-12px}
  .tw-back:hover{color:var(--ink)}
  .top .logo{width:22px;height:22px;flex:0 0 auto}
  .top h1{font-size:14px;font-weight:600;margin:0;color:var(--ink-2);letter-spacing:0;white-space:nowrap}
  #sync{margin-left:auto;flex:0 0 auto;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
  #sync.ok{color:var(--accent-text);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
  #sync.err{color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger)}
  #sync.busy{color:var(--ink)}
  #sync.locked{color:var(--ink-3)}
  #sync:empty{display:none}

  /* ---------- A3: floating capsule nav (text only, Night Market selected gradient, plain counts) ---------- */
  nav.capsule{position:fixed;z-index:50;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:2px;padding:4px;border-radius:999px;
    background:var(--surface-2);border:1px solid var(--line);box-shadow:var(--nav-shadow);
    -webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);max-width:calc(100vw - 16px)}
  @media (prefers-reduced-transparency: reduce){ nav.capsule{background:var(--solid);-webkit-backdrop-filter:none;backdrop-filter:none} }
  nav.capsule button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;height:44px;padding:0 14px;border:0;border-radius:999px;background:transparent;
    font-family:var(--navfont);font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}
  nav.capsule button:hover{color:var(--ink)}
  nav.capsule button[aria-selected="true"]{background:linear-gradient(90deg,var(--accent),var(--accent-2));color:var(--on-accent)}
  nav.capsule .ncount{margin-left:5px;font-size:11px;font-variant-numeric:tabular-nums}
  nav.capsule .ncount[hidden]{display:none}
  @media (max-width:360px){ nav.capsule button{padding:0 10px} }
  @media (max-width:330px){ nav.capsule button{padding:0 8px;font-size:12px} }
  /* desktop ≥768px: the same four items as a left sidebar */
  @media (min-width:768px){
    nav.capsule{left:16px;top:16px;bottom:auto;transform:none;flex-direction:column;align-items:stretch;width:208px;border-radius:18px;padding:6px;gap:2px}
    nav.capsule button{justify-content:flex-start;padding:0 16px;font-size:14px}
    body{padding-left:240px;padding-bottom:36px}
    .top{padding-left:16px}
  }

  /* ---------- screens ---------- */
  main{max-width:720px;margin:0 auto;padding:0 16px}
  main>section[hidden],.subpanel[hidden]{display:none}
  .ltitle{font-size:30px;line-height:36px;font-weight:700;letter-spacing:-.01em;margin:var(--s1) 0 var(--s3);color:var(--ink)}
  /* Rules segmented control (Gift cards · Sales & offers) */
  .segctl{display:flex;gap:2px;padding:2px;border-radius:10px;background:var(--surface-2);margin:0 0 var(--s4)}
  .segctl button{flex:1 1 0;min-height:var(--tap);border:0;border-radius:8px;background:transparent;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;padding:0 var(--s2)}
  .segctl button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent-text);box-shadow:inset 0 0 0 1px var(--accent-text)}

  /* toolbar: search + Filter / Collapse */
  .tbar{display:flex;align-items:center;gap:var(--s3);margin:0 0 var(--s2);min-height:var(--tap)}
  .search{position:relative;flex:1 1 auto;min-width:0;display:flex;align-items:center}
  .search::before{content:"";position:absolute;left:12px;top:50%;width:11px;height:11px;margin-top:-7px;border:2px solid var(--ink-3);border-radius:50%;pointer-events:none}
  .search::after{content:"";position:absolute;left:23px;top:50%;width:6px;height:2px;margin-top:4px;background:var(--ink-3);transform:rotate(45deg);pointer-events:none}
  .search input{flex:1 1 auto;min-width:0;width:100%;min-height:var(--tap);padding:0 40px 0 34px;border:0;border-radius:12px;background:var(--surface-2);color:var(--ink);font-size:16px;-webkit-appearance:none;appearance:none}
  .search input::placeholder{color:var(--ink-3)}
  .search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none;display:none}
  .search .tbx{position:absolute;right:0;top:0;min-width:var(--tap);min-height:var(--tap);border:0;background:transparent;color:var(--ink-3);cursor:pointer;font-size:15px}
  .search .tbx[hidden]{display:none}
  .tlink{flex:0 0 auto;min-height:var(--tap);min-width:var(--tap);padding:0 var(--s1);border:0;background:transparent;color:var(--accent-text);font-size:15px;font-weight:600;cursor:pointer}
  .tlink[aria-expanded="true"],.tlink.active{text-decoration:underline;text-underline-offset:4px}

  /* ---------- A7 collapsible sections ---------- */
  .sec{margin:var(--s5) 0 0}
  .sec:first-child,.tbar+.sec,.hero+.tbar+.sec{margin-top:var(--s2)}
  .grouphead{display:flex;align-items:center;gap:var(--s2);min-height:var(--tap);padding:0 var(--s1) 0 var(--s2);scroll-margin-top:12px}
  .grouphead h3{margin:0;flex:1 1 auto;min-width:var(--tap);font-size:16px;font-weight:650;letter-spacing:0}
  .sectog{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:var(--s3);width:100%;min-height:var(--tap);cursor:pointer;color:var(--ink);font-size:16px;font-weight:650}
  .sectog:focus-visible{outline:3px solid var(--accent-text);outline-offset:2px;border-radius:8px}
  .sectog .stl{min-width:0;overflow-wrap:anywhere}
  @media (max-width:360px){ #feed-count{display:none} } /* the hero carries the new count; the Inbox header keeps Clear + Mark seen */
  .grouphead .gcount{flex:0 0 auto;font-size:15px;font-weight:500;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .grouphead .sflag,.grouphead .ghmeta{flex:0 0 auto;font-size:12px;font-weight:600;color:var(--h-signin);white-space:nowrap}
  .grouphead .ghmeta{color:var(--accent-text)}
  .grouphead .ghmeta:empty,.grouphead .sflag:empty{display:none}
  .grouphead .sflag.warn{color:var(--danger)}
  .ghlink{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-height:var(--tap);min-width:var(--tap);padding:0 2px;font-size:13px;font-weight:600;color:var(--accent-text);text-decoration:none;cursor:pointer;background:none;border:0}
  .ghlink[hidden]{display:none}
  .qhelp{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:var(--tap);height:var(--tap);margin:0 -10px 0 -6px;border:0;background:transparent;color:var(--ink-3);cursor:pointer}
  .qhelp span{display:flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;font-size:12px;font-weight:700}
  .qhelp[aria-expanded="true"]{color:var(--accent-text)}
  .chev{flex:0 0 auto;width:28px;height:var(--tap);display:flex;align-items:center;justify-content:center;color:var(--accent-text);cursor:pointer}
  .chev svg{width:12px;height:12px;transition:transform .2s ease}
  .sec[data-open="false"] .chev svg{transform:rotate(-90deg)}
  .sec[data-open="false"]>.secbody{display:none}
  .sechelp{margin:0 var(--s2) var(--s3);font-size:13px;line-height:1.45;color:var(--ink-2)}
  .sechelp[hidden]{display:none}
  .secbody>*+*{margin-top:var(--s3)}

  /* ---------- grouped inset rows ---------- */
  .group,.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  .group{padding:0 var(--s4)}
  .card{padding:var(--s3) var(--s4)}
  .group .lrow+.lrow,.group>*+.lrow,.group>.lrow+.rowx,.group>*+.addrow,.group>*+.chiprow,.group>.chiprow+*,.group>*+.watch-addrow{border-top:1px solid var(--line)}
  .group>.watch-addrow:first-child,.group>.addrow:first-child{border-top:0}
  .lrow[hidden]{display:none}
  .grouphead .gcount:empty{display:none}
  .lrow{display:flex;align-items:center;gap:var(--s3);min-height:var(--tap);padding:var(--s2) 0}
  .lrow .rl{flex:1 1 auto;min-width:0}
  .lab{display:block;font-size:15px;font-weight:500;color:var(--ink);overflow-wrap:anywhere}
  .lab.strong{font-weight:650}
  .sub2,.sub{display:block;font-size:13px;line-height:1.35;color:var(--ink-2);overflow-wrap:anywhere;margin-top:1px}
  .lrow .rv{flex:0 0 auto;text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .lrow .rc{flex:0 0 auto;display:flex;align-items:center;gap:2px}
  .lrow.off .lab,.lrow.off .cyc{color:var(--ink-3)}
  .rowx{padding:var(--s3) 0}
  .group>.empty,.group>.sub{padding:var(--s3) 0}
  .empty{color:var(--ink-2);text-align:center;padding:var(--s6) var(--s3);font-size:14px}
  .helper{font-size:13px;color:var(--ink-2);margin:var(--s1) 0 0}
  .helper:empty{display:none}
  .warntext{color:var(--danger);font-weight:700}

  /* A6 tap-to-change value (button with the value in its name) */
  .cyc{position:relative;flex:0 0 auto;min-width:var(--tap);min-height:var(--tap);padding:0 var(--s1);border:0;background:transparent;
    color:var(--ink-2);font-size:15px;font-variant-numeric:tabular-nums;text-align:right;cursor:pointer;white-space:nowrap;border-radius:8px}
  .cyc:hover{background:var(--surface-2);color:var(--ink)}
  .cyc[disabled]{cursor:default;opacity:.6}
  .cyc.w52{min-width:52px}

  /* compact switch: 42×26 drawn, 44×44 hit (A7) */
  .sw{position:relative;width:46px;height:44px;flex:0 0 auto;border:0;background:transparent;cursor:pointer;padding:0;margin:0 -2px 0 0}
  .sw::before{content:"";position:absolute;top:50%;left:2px;transform:translateY(-50%);width:42px;height:26px;border-radius:999px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);transition:background .2s}
  .sw[aria-checked="true"]::before{background:var(--h-ok);box-shadow:none}
  .sw::after{content:"";position:absolute;top:50%;left:4px;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .2s cubic-bezier(.32,.72,0,1)}
  .sw[aria-checked="true"]::after{transform:translate(16px,-50%)}
  .sw[disabled]{cursor:not-allowed;opacity:.45}

  /* buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:var(--tap);padding:0 var(--s4);border:0;border-radius:999px;
    background:var(--accent-soft);color:var(--accent-text);font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
  .btn.primary{background:var(--primary);color:var(--on-primary)}
  .btn.small,.btn.tight{min-height:var(--tap);padding:0 var(--s4);font-size:13px;border-top:7px solid transparent;border-bottom:7px solid transparent;background-clip:padding-box}
  .btn[disabled]{opacity:.55;cursor:default}
  .btn:hover:not([disabled]){filter:brightness(1.08)}
  .addrow{display:flex;gap:var(--s2);align-items:center;padding:var(--s2) 0}
  .addrow input{flex:1 1 auto;min-width:0}
  input[type=text],input[type=time],input[type=number],select,textarea{min-height:var(--tap);border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);
    padding:0 var(--s3);font:inherit;font-size:16px;max-width:100%}
  textarea{padding:var(--s3);width:100%}
  select{padding-right:var(--s2)}
  input::placeholder,textarea::placeholder{color:var(--ink-3)}
  .lrow select,.lrow input[type=time]{border:0;background:transparent;color:var(--ink-2);text-align:right;padding:0 var(--s1);font-variant-numeric:tabular-nums;min-width:0}
  .lrow select:hover,.lrow input[type=time]:hover{background:var(--surface-2)}
  .lrow select option{background:var(--solid);color:var(--ink)}
  input,select,textarea{font-size:16px;max-width:100%}

  /* chips */
  .chiprow{display:flex;flex-wrap:wrap;gap:var(--s2);padding:var(--s3) 0}
  .fchip{display:inline-flex;align-items:center;gap:var(--s1);min-height:var(--tap);padding:0 var(--s3) 0 var(--s4);border-radius:999px;border:1px solid var(--line);
    background:var(--surface-2);color:var(--ink);font-size:14px;cursor:pointer;max-width:100%;text-align:left;overflow-wrap:anywhere;border-top:7px solid transparent;border-bottom:7px solid transparent;background-clip:padding-box}
  .fchip .x{color:var(--ink-3);font-size:13px}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);vertical-align:1px}
  .reasonchip{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--danger)}

  /* ---------- Feed: A4 hero ---------- */
  .hero{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:0 0 var(--s4);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  .hero .htop{display:flex;align-items:center;gap:var(--s4);padding:var(--s2) var(--s4)}
  .hero .ripple{width:58px;height:58px;flex:0 0 58px}
  .hero .ripple text{font-variant-numeric:tabular-nums}
  .hero .hhead{display:block;font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
  .hero .hsub{display:block;font-size:13px;color:var(--ink-2)}
  .hero .split{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line)}
  .hero .split>div{padding:5px 2px 6px;text-align:center;border-left:1px solid var(--line);min-width:0}
  .hero .split>div:first-child{border-left:0}
  .hero .split b{display:block;font-size:18px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
  .hero .split span{display:block;font-size:11px;line-height:1.25;color:var(--ink-2)}
  .hero .split .al b{color:var(--h-blocked)}

  /* ---------- Feed: filter popovers (When / Type / Sort) ---------- */
  .ftrigs{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2);margin:0 0 var(--s2)}
  .ftrigs[hidden]{display:none}
  .fpop-wrap{position:relative;flex:0 1 auto;min-width:0}
  .ftrig{display:inline-flex;align-items:center;gap:var(--s2);min-height:var(--tap);max-width:100%;padding:0 var(--s4);border-radius:999px;border:1px solid var(--line);
    background:var(--surface-2);color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
  .ftrig .ftrig-label{white-space:nowrap;min-width:0}
  .ftrig .caret{opacity:.7;font-size:11px}
  .ftrig.active{background:var(--accent-soft);color:var(--accent-text);border-color:var(--accent-text)}
  .fpop{position:absolute;top:calc(100% + 6px);left:0;z-index:30;min-width:190px;max-width:calc(100vw - 32px);background:var(--solid);border:1px solid var(--line);
    border-radius:13px;box-shadow:var(--menu-shadow);padding:var(--s2);display:none}
  .fpop.rt{left:auto;right:0}
  .fpop[data-open="true"]{display:block}
  .fitem{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:44px;padding:0 var(--s4);border:0;border-radius:8px;background:transparent;color:var(--ink);
    font-size:14px;font-weight:500;cursor:pointer;text-align:left}
  .fitem:hover,.fitem:focus-visible{background:var(--surface-2)}
  .fitem .fcheck{width:18px;flex:0 0 auto;text-align:center;color:var(--accent-text)}
  .fitem .fcount{margin-left:auto;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .fitem[aria-checked="true"]{color:var(--accent-text)}
  .fitem.zero{opacity:.55}
  .fpop .fgroup{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);padding:var(--s3) var(--s4) 2px}
  .fpop .fdone{margin-top:var(--s1);width:100%;min-height:var(--tap);border-radius:8px;border:0;background:var(--accent-soft);color:var(--accent-text);font-weight:600;cursor:pointer}

  /* ---------- Feed: A5 deal card (56px | 1fr | auto) inside an inset group ---------- */
  .deals{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  .deals>.swipe+.swipe,.deals>.morefrom+.swipe,.deals>.morelist+.swipe{border-top:1px solid var(--line)}
  .deals>.empty{padding:var(--s6) var(--s3)}
  .swipe{position:relative}
  .deals>.swipe:first-child .swipe-del{border-top-right-radius:var(--r)} .deals>.swipe:last-child .swipe-del{border-bottom-right-radius:var(--r)}
  .swipe .card.deal{position:relative;transition:transform .18s ease;touch-action:pan-y;background:var(--bg);background:transparent}
  .swipe.open .card.deal,.swipe.dragging .card.deal{background:var(--solid)}
  .swipe-del{position:absolute;top:0;right:0;bottom:0;width:88px;border:0;background:var(--danger);color:var(--on-danger);font-weight:700;font-size:14px;cursor:pointer;visibility:hidden}
  .swipe.open .swipe-del,.swipe.dragging .swipe-del{visibility:visible}
  .swipe.dragging,.swipe.dragging *{-webkit-user-select:none;user-select:none}
  .card.deal{display:grid;grid-template-columns:56px minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:var(--s3);row-gap:var(--s1);
    border:0;border-radius:0;padding:var(--s3) var(--s2) var(--s2) var(--s2);backdrop-filter:none;-webkit-backdrop-filter:none;align-items:start}
  .dfig{grid-column:1;grid-row:1/3;align-self:center;justify-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;width:56px;overflow:hidden;
    background:transparent;padding:0;border-radius:0;margin:0}
  .dfig .bv{display:block;max-width:56px;font-size:23px;font-weight:800;letter-spacing:-.04em;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink-2)}
  .dfig .bv.l5{font-size:19px} .dfig .bv.l6{font-size:15px;letter-spacing:-.02em} .dfig .bv.l7{font-size:13px;letter-spacing:-.02em}
  .dfig .bl{display:block;max-width:56px;margin-top:3px;font-size:10px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);text-align:center;line-height:1.15;overflow-wrap:anywhere}
  .dfig.hit .bv{color:var(--h-ok)}
  .dbody{grid-column:2;grid-row:1;min-width:0}
  .card.deal>.rulehead-actions{grid-column:3;grid-row:1;align-self:start;margin:-8px -6px 0 0}
  .dbrand{display:block;font-size:16px;font-weight:650;line-height:1.3;overflow-wrap:anywhere;padding-right:2px}
  .dbrand .nw{margin-right:var(--s2);vertical-align:2px}
  .dbrand .dot.alerted{margin-left:var(--s2);vertical-align:0}
  .dbrand .ktag{margin-left:var(--s2);vertical-align:2px}
  .nw{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .dot.alerted{display:inline-block;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--h-ok);flex:0 0 auto}
  .ktag{display:inline-block;font-size:11px;font-weight:600;line-height:18px;padding:0 6px;border-radius:5px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
  .dline{font-size:14px;line-height:1.35;color:var(--ink);margin-top:1px;overflow-wrap:anywhere}
  .dline:empty{display:none}
  .dmeta{display:flex;flex-wrap:wrap;gap:2px var(--s3);font-size:12px;line-height:1.35;color:var(--ink-2);margin-top:2px}
  .dmeta .soon,.expiry.soon{color:var(--danger);font-weight:700}
  .dactrow{grid-column:2/4;grid-row:2;display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2) var(--s2);margin-top:0}
  .dactrow a.deal{display:inline-flex;align-items:center;min-height:var(--tap);margin-right:auto;color:var(--accent-text);font-weight:600;text-decoration:none;font-size:14px;white-space:nowrap}
  .dactrow .nolink{margin-right:auto;font-size:13px;color:var(--ink-3)}
  .dacts{display:flex;gap:var(--s2);flex:0 0 auto;margin-left:auto}
  .dacts .btn{background-color:var(--bg);color:var(--ink);font-weight:500;padding:0 var(--s4)}
  .dacts .btn.primary{background-color:var(--accent-soft);color:var(--accent-text);box-shadow:inset 0 0 0 1px var(--accent-text)}
  .morefrom{display:flex;justify-content:flex-end;padding:0 var(--s2) var(--s2)}
  .morelist{margin:0 0 var(--s2) var(--s5);border-left:2px solid var(--line)}
  .morelist[hidden]{display:none}
  .morelist .swipe+.swipe{border-top:1px solid var(--line)}
  .locked{display:flex;flex-direction:column;align-items:center;gap:var(--s3)}
  .locked .locktitle{font-size:18px;font-weight:700;color:var(--ink)}
  .locked p{margin:0;max-width:34ch}

  /* ⋯ overflow menus (feed cards, rules, watches) */
  .rulehead-actions{position:relative;flex:0 0 auto}
  .ovf{width:var(--tap);height:var(--tap);border:0;border-radius:10px;background:transparent;color:var(--ink-3);font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .ovf[aria-expanded="true"]{color:var(--accent-text)}
  .ovfmenu{position:absolute;right:0;top:44px;z-index:40;min-width:190px;width:max-content;max-width:calc(100vw - 32px);background:var(--solid);border:1px solid var(--line);
    border-radius:13px;box-shadow:var(--menu-shadow);padding:var(--s2)}
  .ovfmenu[hidden]{display:none}
  /* a group with backdrop-filter is its own stacking context: lift the one whose ⋯ menu is open above its neighbours */
  .group:has(.ovf[aria-expanded="true"]),.deals:has(.ovf[aria-expanded="true"]),.sec:has(.ovf[aria-expanded="true"]),.swipe:has(.ovf[aria-expanded="true"]){position:relative;z-index:45}
  .ovfmenu-label{font-size:12px;color:var(--ink-2);font-weight:700;padding:var(--s2) var(--s3) var(--s1)}
  .ovfmenu button{display:flex;align-items:center;gap:var(--s2);width:100%;min-height:44px;border:0;background:none;color:var(--ink);font-size:15px;font-weight:500;text-align:left;
    padding:0 var(--s3);border-radius:8px;cursor:pointer;white-space:nowrap}
  .ovfmenu button:hover,.ovfmenu button:focus{background:var(--surface-2);outline:none}
  .ovfmenu button.ovf-block{white-space:normal;overflow-wrap:anywhere;padding:var(--s2) var(--s3);line-height:1.3}
  .ovfmenu button[role="menuitemradio"]::before{content:"";width:16px;flex:0 0 auto;color:var(--accent-text);font-weight:800}
  .ovfmenu button[aria-checked="true"]::before{content:"✓"}
  .ovfmenu-sep{height:1px;background:var(--line);margin:var(--s2) var(--s1)}
  .ovfmenu button.ovf-danger{color:var(--danger)}
  .ovf-confirm{display:flex;gap:var(--s2);padding:2px var(--s1) var(--s1)}
  .ovf-confirm button{justify-content:center;font-weight:700}
  .ovf-confirm button.confirm-del{background:var(--danger);color:var(--on-danger)}
  .ovf-confirm button.confirm-cancel{background:var(--surface-2);color:var(--ink)}

  /* ---------- Rules ---------- */
  .rrow .rl .lab{font-size:15px}
  .rrow .cyc{min-width:52px}

  /* ---------- Sale watch ---------- */
  .watchrow{padding:var(--s2) 0;-webkit-touch-callout:none;border-radius:10px;transition:transform .12s}
  #watchlist>.watchrow+.watchrow{border-top:1px solid var(--line)}
  .watchrow:focus-visible{outline:3px solid var(--accent-text);outline-offset:2px}
  .watchrow.pressing{transform:scale(.985);background:var(--surface-2)}
  .watchrow.dragging{opacity:.35;border:2px dashed var(--accent-text);background:transparent;transform:none}
  .watchrow.dragging>*{visibility:hidden}
  .watch-ghost{position:fixed;left:0;top:0;z-index:999;pointer-events:none;margin:0;opacity:.96;background:var(--solid);border-radius:12px;padding:var(--s3) var(--s4);
    box-shadow:var(--menu-shadow);will-change:transform}
  body.watch-sorting{cursor:grabbing;-webkit-user-select:none;user-select:none}
  body.watch-sorting .watchrow{transition:none}
  .wrow{display:flex;align-items:center;gap:var(--s1);min-height:var(--tap)}
  .wterm-wrap{flex:1 1 auto;min-width:0}
  .wterm{all:unset;box-sizing:border-box;cursor:text;font-size:16px;font-weight:650;color:var(--ink);min-height:var(--tap);display:flex;align-items:center;overflow-wrap:anywhere}
  .wterm:focus-visible{outline:3px solid var(--accent-text);outline-offset:2px;border-radius:4px}
  .wedit{width:100%;max-width:340px;font-weight:650}
  .wedit-hint{display:block;margin-top:var(--s1);font-size:13px;color:var(--ink-2)}
  .watchrow a.wmatch{display:flex;align-items:center;min-height:var(--tap);font-size:14px;line-height:1.35;color:var(--accent-text);text-decoration:none;overflow-wrap:anywhere;padding:2px 0}
  .watchrow a.wmatch::after{white-space:pre}
  .watchrow a.wmatch::after{content:" →"}
  .wline{font-size:14px;color:var(--ink-2)}
  .wx{display:flex;flex-wrap:wrap;gap:2px var(--s3);font-size:12px;color:var(--ink-2);margin-top:2px}
  .watch-addrow{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2);border-top:1px solid var(--line);padding:var(--s3) 0}
  .watch-addrow .watch-addterm{flex:1 1 160px;min-width:0}
  .watch-addrow .cyc{min-width:64px}
  @media (max-width:480px){ .watch-addrow .watch-addterm{flex:1 1 100%} .watch-addrow .cyc{margin-right:auto} }

  /* brand overrides (Always / Never) */
  .seg{display:inline-flex;gap:2px;padding:2px;border-radius:10px;background:var(--surface-2);flex:0 0 auto}
  .segbtn{min-height:44px;min-width:var(--tap);padding:0 var(--s3);border:0;border-radius:8px;background:transparent;color:var(--ink);font-weight:600;font-size:13px;cursor:pointer}
  .segbtn.on{background:var(--accent-soft);color:var(--accent-text);box-shadow:inset 0 0 0 1px var(--accent-text)}
  .brandrow .fchip{padding:0 var(--s3);min-width:var(--tap);justify-content:center}

  /* ---------- Sources ---------- */
  .ssum{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--s2);margin:0 0 var(--s2)}
  .ssum>div{display:flex;flex-direction:column;gap:1px;padding:var(--s2) var(--s3);border-radius:10px;background:var(--surface);border:1px solid var(--line);min-width:0}
  .ssum b{display:flex;align-items:center;gap:5px;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
  .ssum span{font-size:11px;color:var(--ink-2);white-space:nowrap}
  @media (max-width:350px){ .ssum{gap:3px} .ssum>div{padding:var(--s2) 4px} .ssum span{font-size:10px} }
  .need{font-size:13px;color:var(--ink-2);margin:0 0 var(--s3);overflow-wrap:anywhere}
  .need b{color:var(--accent-text)}
  .hg{display:inline-block;width:14px;height:14px;flex:0 0 14px;vertical-align:-2px}
  .hg[data-h="ok"]{color:var(--h-ok)} .hg[data-h="empty"]{color:var(--h-empty)} .hg[data-h="blocked"]{color:var(--h-blocked)}
  .hg[data-h="signin"]{color:var(--h-signin)} .hg[data-h="partial"],.hg[data-h="stale"]{color:var(--h-partial)} .hg[data-h="pending"],.hg[data-h="off"]{color:var(--ink-3)}
  .hstate{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap}
  .srow .rc{gap:var(--s2)}
  .srow.coming .lab{color:var(--ink-3)}
  .oacts{display:flex;flex-wrap:wrap;gap:var(--s2);padding:0 0 var(--s2)}
  .ostat{font-size:13px;color:var(--ink-2)}
  .ostat:empty{display:none}
  .devcode{margin:0 0 var(--s3);border:1px dashed var(--accent-text);border-radius:12px;padding:var(--s4);background:var(--accent-soft)}
  .devcode[hidden]{display:none}
  .devcode .title{font-weight:650}
  .devcode ol{margin:var(--s2) 0 var(--s3);padding-left:20px;font-size:14px;line-height:1.5}
  .devcode .code{display:inline-block;font:700 22px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em;padding:var(--s2) var(--s3);border-radius:8px;background:var(--solid);border:1px solid var(--line);color:var(--ink)}
  .devcode .coderow{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2);margin:var(--s1) 0 var(--s3)}

  /* ---------- Settings ---------- */
  .tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 var(--s4)}
  .tile{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s2);padding:var(--s2) 0;border-top:1px solid var(--line);min-width:0;position:relative}
  .tile .tlabel{font-size:14px;color:var(--ink-2);min-width:0}
  .tile .tvalue{font-size:16px;font-weight:650;font-variant-numeric:tabular-nums}
  .tile .tnote{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .metrics .hero2{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);padding:var(--s3) 0}
  .herovalue{font-size:28px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .tlabel{font-size:13px;color:var(--ink-2)}
  .bykind{font-size:13px;color:var(--ink-2);padding:0 0 var(--s3)}
  .glance{list-style:none;margin:0;padding:0}
  .glance li{display:flex;gap:var(--s3);justify-content:space-between;padding:var(--s2) 0;font-size:14px;border-top:1px solid var(--line)}
  .glance li:first-child{border-top:0}
  .glance li strong{font-weight:500;color:var(--ink-2);flex:0 0 auto}
  .glance li .gv{text-align:right;min-width:0;overflow-wrap:anywhere}
  .steps{list-style:none;margin:0;padding:0 0 var(--s2);display:flex;flex-direction:column;gap:var(--s1);font-size:13px;color:var(--ink-2)}
  .steps:empty{display:none}
  .steps .step strong{color:var(--ink);font-weight:600}
  .steps .step.ok .mark{color:var(--h-ok);font-weight:800}
  .steps .step.fail .mark{color:var(--danger);font-weight:800}
  .judge-ok{color:var(--h-ok);font-weight:800}
  .judge-fail{color:var(--danger);font-weight:800}
  .judge-fields{list-style:none;margin:var(--s2) 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--s1) var(--s4)}
  .judge-misses summary{min-height:44px;display:flex;align-items:center;cursor:pointer}
  .judge-bad{margin-top:var(--s2)}
  #check-judging-result,#test-push-result{font-size:13px;color:var(--ink-2);padding:0 0 var(--s2)}
  #check-judging-result:empty,#test-push-result:empty{display:none}
  ol.learned{margin:0;padding:0;list-style:none}
  ol.learned li{display:flex;gap:var(--s3);align-items:baseline;padding:var(--s3) 0;border-top:1px solid var(--line);font-size:14px;line-height:1.4}
  ol.learned li:first-child{border-top:0}
  ol.learned li .grow{flex:1 1 auto;min-width:0}
  .learned-n{flex:0 0 auto;font-size:12px;font-weight:700;color:var(--ink-2);white-space:nowrap}
  .badgroup h4{margin:var(--s3) 0 2px;font-size:14px}
  .badgroup .bcount{font-size:13px;color:var(--ink-3);font-weight:500;margin-left:4px}
  .badlist{list-style:none;margin:0;padding:0}
  .badlist li{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s2) 0;border-top:1px solid var(--line);font-size:14px}
  .badlist li:first-child{border-top:0}
  .badlist li .bl-body{flex:1;min-width:0;overflow-wrap:anywhere}
  .badlist .meta{font-size:12px;color:var(--ink-2)}
  .badlist .ktag{margin-right:var(--s2)}
  .badlist a{color:var(--accent-text);font-weight:600}

  /* ---------- sheets, toast ---------- */
  .sheet-backdrop{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:60;padding:0}
  .sheet-backdrop[hidden]{display:none}
  .sheet{background:var(--solid);color:var(--ink);width:100%;max-width:640px;border-radius:16px 16px 0 0;padding:var(--s5) 16px calc(var(--s5) + env(safe-area-inset-bottom));box-shadow:var(--menu-shadow);text-align:left}
  @media (min-width:700px){ .sheet-backdrop{align-items:center} .sheet{border-radius:16px} }
  .sheet h3{margin:0 0 var(--s1);font-size:18px}
  .sheet .field{display:flex;flex-direction:column;align-items:stretch;gap:var(--s2);margin-top:var(--s4)}
  .sheet label,.sheet .field>.sub{font-size:13px;font-weight:700;color:var(--ink-2)}
  .sheet select,.sheet textarea,.sheet input{width:100%}
  .sheet .price{margin-top:2px;font-weight:700;font-variant-numeric:tabular-nums}
  .sheet .actions{display:flex;gap:var(--s3);justify-content:flex-end;margin-top:var(--s5);flex-wrap:wrap}
  .sheet .actions .unflag{margin-right:auto;color:var(--danger);background:var(--surface-2)}
  .sheet .btn:not(.primary){background:var(--surface-2);color:var(--ink)}

  function refresh(){ return flushSaves().then(refreshNow,refreshNow); }
  function refreshNow(){
    sync("busy","Syncing…");
    // press_deals is header-gated on x-plan-id = the card-scout sync_id. With no sync_id the REST
    // call returns 200 + ZERO rows — so the page would silently claim "no deals" while real hits
    // sit unseen. Instead, do NOT query press_deals at all when locked; render a Locked panel.
    var sid = planId();
    var q = [
      api("press_tasks?page=eq."+PAGE+"&category=eq.source&select=item_id,title,status,extras&order=position"),
      api("press_tasks?page=eq."+PAGE+"&category=eq.rule&select=item_id,title,status,extras&order=title"),
      api("press_tasks?page=eq."+PAGE+"&category=eq.settings&select=item_id,extras"),
      api("press_state?page=eq."+PAGE+"&select=item_id,checked,updated_at"),
      api("press_tasks?page=eq."+PAGE+"&category=eq.watch&select=item_id,title,status,extras,position,created_at&order=position.asc.nullslast,created_at.asc"),
      api("press_tasks?page=eq."+PAGE+"&category=eq.health&select=item_id,extras"),
      // Thrift Shop Slice 4: the Sales screen's offer significance + brand overrides (config rows, private lane).
      api("press_tasks?page=eq."+PAGE+"&category=eq.offer&select=item_id,title,status,extras,position&order=position"),
      api("press_tasks?page=eq."+PAGE+"&category=eq.offer-brand&select=item_id,title,status,extras&order=title")
    ];
    if(sid){
      // Only hits + near-misses are the feed. Everyday-price rows (verdict='no') are no longer loaded
      // — Mark's tool surfaces deals that beat his rules, not shelf prices.
      q.push(api("press_deals?page=eq."+PAGE+"&created_at=gte."+since30()+"&verdict=in.(hit,near)&status=neq.deleted&order=created_at.desc&select=item_id,brand,title,category,face_value,price,pct_off,expiry,url,source,lane,verdict,status,extras,created_at"));
      // Judge backlog (enhancements Slice 4): browser-lane rows still waiting for the agent.
      q.push(api("press_deals?page=eq."+PAGE+"&status=eq.raw&select=item_id,created_at,updated_at"));
      // Savings log (enhancements Slice 6, D1): one row per Bought/Skip, kept forever.
      q.push(api("press_tasks?page=eq."+PAGE+"&category=eq.savings&select=item_id,title,status,extras,updated_at"));
      // Inbox arc Slice 6: the Bad backlog (press_tasks category='bad', kept forever like the savings log).
      q.push(api("press_tasks?page=eq."+PAGE+"&category=eq.bad&select=item_id,title,status,extras,updated_at"));
    }
    return Promise.all(q).then(function(rs){
      return Promise.all(rs.map(function(r){ if(!r.ok) throw new Error("http "+r.status); return r.json(); }));
    }).then(function(d){
      state.sources=d[0]; state.rules=d[1];
      state.settings=(d[2][0]&&d[2][0].extras)||{};
      state.toggles={}; state.feedSeenAt=null;
      d[3].forEach(function(t){
        if(t.item_id===SEEN_ID){ state.feedSeenAt=t.updated_at||null; return; } // the "last looked" stamp, not a toggle
        state.toggles[t.item_id]=t.checked===true;
      });
      state.watch = d[4]||[];
      state.health = d[5]||[];
      state.offers = d[6]||[];
      state.offerBrands = d[7]||[];
      state.locked = !sid;
      state.deals = sid ? (d[8]||[]) : [];
      state.raw = sid ? (d[9]||[]) : [];
      state.savings = sid ? (d[10]||[]) : [];
      state.bad = sid ? (d[11]||[]) : [];
      saveLS(); renderAll();
      if(sid) sync("ok","Synced"); else sync("locked","Locked");
    }).catch(function(e){
      sync("err", navigator.onLine ? "Sync failed" : "Offline");
    });
  }

  // ---------- deal kind (Thrift Shop Slice 1) ----------
  // THE one classifier, mirrored from judge.mjs dealKind (tests/unit/kind.test.mjs evaluates this copy against
  // the agent's): extras.kind when set; legacy rows fall back — lane 'email' → offer, a watch row → sale, else card.
  function dealKind(d){
    var e=(d&&d.extras)||{}; var k=e.kind;
    if(k==="card"||k==="sale"||k==="offer") return k;
    if(d&&d.lane==="email") return "offer";
    if(e.watch_term||(d&&d.category==="watch")||e.group==="watch") return "sale";
    return "card";
  }
  var KIND_LABEL={card:"Gift card",sale:"Sale",offer:"Offer"};
  var KIND_ICON={card:"🟢",sale:"🔵",offer:"🟣"};
  function kindTag(d){ var k=dealKind(d); return '<span class="ktag k-'+k+'">'+KIND_LABEL[k]+'</span>'; } // Native Ledger: a text pill (no emoji)
  // Today in America/Chicago (YYYY-MM-DD) — offers past their expiry are hidden (status stays; the prune clears them).
  function ctToday(){ try{ return new Intl.DateTimeFormat("en-CA",{timeZone:"America/Chicago",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date()); }catch(e){ return new Date().toISOString().slice(0,10); } }
  function isoDay(s){ var m=/(\d{4})-(\d{2})-(\d{2})/.exec(String(s||"")); return m?m[0]:null; }
  function isExpiredOffer(d){ var e=isoDay(d&&d.expiry); return dealKind(d)==="offer"&&!!e&&e<ctToday(); }
  function daysLeft(d){ var e=isoDay(d&&d.expiry); if(!e) return null; return Math.round((Date.parse(e+"T00:00:00Z")-Date.parse(ctToday()+"T00:00:00Z"))/864e5); }
  // "Expires today" / "Expires tomorrow" / "Expires in 3 days" / "Expires Oct 20"; red when ≤ 48 h away.
  function expiryLabel(d){ var n=daysLeft(d); if(n==null) return ""; if(n<0) return "Expired"; if(n===0) return "Expires today"; if(n===1) return "Expires tomorrow";
    if(n<14) return "Expires in "+n+" days"; return "Expires "+fmtDate(isoDay(d.expiry)+"T12:00:00"); }
  var OFFER_WORD={free_meal:"Free meal",bogo_free:"BOGO free",birthday_reward:"Birthday reward",free_small_item:"Free treat",new_item:"New item",free_shipping:"Free shipping",sweepstakes:"Sweepstakes",other:"Offer",everyday_sale:"Sale",bogo_discount:"BOGO deal",bundle_price:"Bundle price",points_multiplier:"Bonus points",recurring_promo:"Weekly deal"};
  // The offer's headline (mirrors notify.mjs offerHeadline): "$10 off $25+", "40% off", "$5 reward", "Free meal" …
  function offerHeadline(d){
    var e=d.extras||{}, v=d.face_value!=null?Number(d.face_value):null, p=d.pct_off!=null?Math.round(Number(d.pct_off)):null;
    var money=function(n){ return "$"+(n%1?n.toFixed(2):n); };

  }
  // ---------- Feed (grouped by card type) ----------
  var FEED_GROUPS=[["restaurant","Restaurants"],["retail","Retail"],["other","Other"],["retailer","Warehouse / retailer"]];
  var KNOWN_GROUP={restaurant:1,retail:1,other:1,retailer:1};
  // Derive a deal's card-type group: its own category/extras.group when it names a known group,
  // else the rule found by extras.rule_id, else a brand match against the rules, else "other".
  function dealGroup(d){
    if(d.category && KNOWN_GROUP[d.category]) return d.category;
    var g=d.extras&&d.extras.group; if(g && KNOWN_GROUP[g]) return g;
    var rid=d.extras&&d.extras.rule_id;
    if(rid){ var r=find(state.rules,rid); if(r&&r.extras&&KNOWN_GROUP[r.extras.group]) return r.extras.group; }
    if(d.brand){ var b=normBrand(d.brand);
      for(var i=0;i<state.rules.length;i++){ var rr=state.rules[i];
        if(normBrand(rr.title)===b && rr.extras && KNOWN_GROUP[rr.extras.group]) return rr.extras.group; } }
    return "other";

  // Slice 2: the honest net cash you pay for the face value — "$40 for $50". net_cost folds in any
  // bonus/stack saving (a free $10 HEB card on a $50 Starbucks buy reads $40 for $50), falling back to
  // the price when net_cost is absent. An unpriced row returns "" — the badge already says "Price
  // unknown", so there is no price line to show.
  function netForFace(d){ return (d.extras&&d.extras.net_cost!=null)?d.extras.net_cost:d.price; }
  function priceLine(d){
    var face=d.face_value, net=netForFace(d);
    if(net!=null&&face!=null) return "$"+net+" for $"+face;
    if(net!=null) return "$"+net;
    return "";
  }
  // ---------- NEW marker + relative time (Slice 2) ----------
  function dealTime(d){ var t=new Date(d&&d.created_at||0).getTime(); return isNaN(t)?0:t; }
  // A deal is NEW until Mark has LOOKED (opened the Feed tab / "Mark all seen") — never because time
  // passed. NEW = created_at strictly newer than the feed-seen-at stamp (null stamp ⇒ everything new).
  function isUnseen(d){
    if(!d||!d.created_at) return false;
    if(!state.feedSeenAt) return true;
    return dealTime(d) > new Date(state.feedSeenAt).getTime();
  }
  // Inbox arc Slice 2: the feed shows deals that MEET the rules — hits, plus an unpriced near (a rule
  // match whose price we couldn't read). A true near-miss (DoorDash 15% vs a 20% rule) never renders; it
  // only rides the daily digest email (gated by the Alerts-page digest + channel toggles). Mark's own
  // decisions (bought / skip / bad) stay visible whatever the verdict.
  // Multi-brand card arc: a One4all / Happy card whose brands couldn't be read (brands_unknown) is shown too.
  // Thrift Shop Slice 5: an email offer near shows only when its value/expiry is unknown ("check it"); a past-expiry offer
  // never renders (status stays; the 30-day prune clears it).
  function meetsRules(d){ var e=d.extras||{}; if(isExpiredOffer(d)) return false; return d.verdict==="hit" || (d.verdict==="near" && !!(e.unpriced||e.brands_unknown||e.value_unknown)); }
  function isDecided(d){ return d.status==="bought"||d.status==="skip"||d.status==="bad"; }
  // polish Slice 4: a deal is FLAGGED Bad when Mark flagged it (status 'bad') or the agent auto-flagged it
  // (extras.auto_bad on an undecided row — its bad- backlog row exists) — the Bad button reads pressed for both.
  function isFlagged(d){ return !!d && (d.status==="bad" || (!isDecided(d) && !!(d.extras&&d.extras.auto_bad))); }

    var ids=[].slice.call(host.querySelectorAll(".watchrow")).map(function(r){ return r.getAttribute("data-wid"); });

  function wireWatchDrag(host){
    var rows=function(){ return [].slice.call(host.querySelectorAll(".watchrow")); };

  // ---------- Alerts ----------
  var WEEKDAYS=[["mon","Monday"],["tue","Tuesday"],["wed","Wednesday"],["thu","Thursday"],["fri","Friday"],["sat","Saturday"],["sun","Sunday"]];
  function fmtClock(hhmm){
    var m=/^(\d{1,2}):(\d{2})$/.exec(hhmm||""); if(!m) return hhmm||"";
    var h=+m[1], mm=+m[2];

    if(h===0&&mm===0) return "midnight";

  function ctMonthKey(iso){
    try{ return new Intl.DateTimeFormat("en-CA",{timeZone:"America/Chicago",year:"numeric",month:"2-digit"}).format(new Date(iso)); }catch(e){ return String(iso||"").slice(0,7); }

  function metrics(nowMs){
    var sv=state.savings||[], deals=state.deals||[];
    var bought=sv.filter(function(r){ return r.status==="bought"; }), skipped=sv.filter(function(r){ return r.status==="skip"; });
    var savedOf=function(r){ var x=r.extras&&r.extras.saved; return isFinite(Number(x))?Number(x):0; };
    var month=ctMonthKey(new Date(nowMs).toISOString());
    var total=bought.reduce(function(a,r){ return a+savedOf(r); },0);
    var thisMonth=bought.filter(function(r){ return ctMonthKey((r.extras&&r.extras.at)||r.updated_at)===month; }).reduce(function(a,r){ return a+savedOf(r); },0);
    var floor=nowMs-30*864e5;
    var in30=deals.filter(function(d){ return dealTime(d)>=floor; });
    var alerts30=in30.filter(function(d){ return d.status==="alerted"||(d.extras&&d.extras.alert); }).length;
    var flagged=in30.filter(function(d){ return d.extras&&d.extras.suspicious; }).length;

    // Bought/Skip decision — so "Cards bought" and the rate can never disagree (the old rate read the
    // 30-day press_deals statuses while the tiles read the log: $0 / 0 bought beside "11%").
    var decided=bought.length+skipped.length;
    // Thrift Shop Slice 5: savings split by kind (legacy log rows without a kind are gift cards).
    var byKind={card:0,sale:0,offer:0}; bought.forEach(function(r){ var k=(r.extras&&r.extras.kind)||"card"; if(byKind[k]==null) k="card"; byKind[k]+=savedOf(r); });
    return { total:total, month:thisMonth, bought:bought.length, skipped:skipped.length, alerts30:alerts30,
      rate:decided?Math.round(100*bought.length/decided):null, decided:decided, flagged:flagged,
      backlog:backlogState(state.raw, nowMs), byKind:byKind };

  // Enhancements Slice 6 — swipe left on a feed card (touch + pointer). Drag ≥60px left → the card stays

  var SWIPE_OPEN=88, SWIPE_MIN=60;
  (function installSwipe(){
    var st=null;
    function closeOthers(except){ document.querySelectorAll(".swipe.open").forEach(function(w){ if(w!==except){ w.classList.remove("open"); var c=w.querySelector(".card.deal"); if(c) c.style.transform=""; } }); }

      if(ev.target.closest(".ovf,.ovfmenu")) return;
      var wrap=card.parentNode;

    });

  }
  // ---------- Sales actions (Thrift Shop Slice 4) ----------
  // review fix (slice 7): the Sales jump chips' counts follow every change (not only the group heading).
  function syncSalesNav(){
    var c={counts:offerRows().filter(function(x){ return x.status==="on"; }).length,brands:brandRows().length,note:(state.settings&&state.settings.offer_note)?1:0,watch:watchCount(),blocked:blocklist().length};
    Object.keys(c).forEach(function(k){
      var g=document.querySelector('#grp-sales-'+k+' .gcount'); if(g) g.textContent=String(c[k]); });
    var bg=document.querySelector('#grp-rules-blocked .gcount'); if(bg) bg.textContent=String(blocklist().length);
  }
  function toggleOffer(id,btn){
    var r=find(state.offers||[],id); if(!r) return; var on=r.status!=="on"; r.status=on?"on":"off"; setSwitch(btn,on);
    var row=btn.closest(".lrow"); if(row) row.classList.toggle("off",!on);
    withSave(patchTask(id,{status:r.status,updated_at:new Date().toISOString()}));
    syncSalesNav();
  }
  function stepOffer(id,kind,btn){
    var r=find(state.offers||[],id); var cfg=OSTEP[kind]; if(!r||!cfg) return;
    r.extras=Object.assign({},r.extras||{}); var v=nextIn(cfg.cycle,oval(r,kind));
    r.extras[kind]=v; setCyc(btn,(kind==="window_days"?"within ":"")+cfg.fmt(v),OSTEP_NAME[kind]+" for "+r.title);
    saveSoon(id,function(){ return withSave(patchTask(id,{extras:r.extras,updated_at:new Date().toISOString()})); });
  }
  function saveOfferNote(){
    var t=el("offernote"); if(!t) return; var v=String(t.value||"").slice(0,300);
    state.settings.offer_note=v; saveSettings(); var c=el("offernote-count"); if(c) c.textContent=v.length+" / 300"; syncSalesNav();
  }
  var brandSheetOpener=null;
  function ensureBrandSheet(){
    var sh=el("brand-sheet"); if(sh) return sh;
    sh=document.createElement("div"); sh.className="sheet-backdrop"; sh.id="brand-sheet"; sh.hidden=true;
    sh.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="brand-sheet-title">'
      +'<h3 id="brand-sheet-title">Brand override</h3><div class="sub">Always counts every offer from this brand; Never mutes it — whatever the offer type.</div>'
      +'<div class="field"><label for="brand-name">Brand</label><input id="brand-name" type="text" maxlength="80" placeholder="e.g. Chili’s" autocomplete="off"></div>'
      +'<div class="field"><span class="sub" id="brand-mode-lab">Override</span><div class="seg" role="group" aria-labelledby="brand-mode-lab">'
      +'<button type="button" class="segbtn on" aria-pressed="true" data-bsmode="always">Always</button>'
      +'<button type="button" class="segbtn" aria-pressed="false" data-bsmode="never">Never</button></div></div>'
      +'<div class="sub" id="brand-sheet-msg" role="status" aria-live="polite"></div>'
      +'<div class="actions"><button class="btn" type="button" id="brand-cancel">Cancel</button><button class="btn primary" type="button" id="brand-save">Save</button></div></div>';
    document.body.appendChild(sh);
    sh.addEventListener("click", function(ev){ if(ev.target===sh) closeBrandSheet(); });
    sh.addEventListener("keydown", function(ev){
      if(ev.key==="Escape"){ ev.preventDefault(); ev.stopPropagation(); closeBrandSheet(); return; }
      if(ev.key==="Enter"&&ev.target&&ev.target.id==="brand-name"){ ev.preventDefault(); saveBrandSheet(); return; }
      if(ev.key!=="Tab") return;
      var f=[].slice.call(sh.querySelectorAll("input,button")); var i=f.indexOf(document.activeElement);
      if(ev.shiftKey&&i<=0){ f[f.length-1].focus(); ev.preventDefault(); } else if(!ev.shiftKey&&i===f.length-1){ f[0].focus(); ev.preventDefault(); }
    });
    return sh;
  }
  function openBrandSheet(opener){
    var sh=ensureBrandSheet(); brandSheetOpener=opener||null;
    el("brand-name").value=salesQuery||""; el("brand-sheet-msg").textContent="";
    setBrandSheetMode("always"); sh.hidden=false; el("brand-name").focus();
  }
  function setBrandSheetMode(m){ var sh=el("brand-sheet"); if(!sh) return; sh.querySelectorAll("[data-bsmode]").forEach(function(b){ var on=b.getAttribute("data-bsmode")===m; b.classList.toggle("on",on); b.setAttribute("aria-pressed",String(on)); }); }
  // offer-accuracy S4 — "Re-scan last 30 days" confirm sheet (focus-trapped, Esc = Cancel). Confirm → outlook_rescan.
  var rescanOpener=null;
  function ensureRescanSheet(){
    var sh=el("rescan-sheet"); if(sh) return sh;
    sh=document.createElement("div"); sh.className="sheet-backdrop"; sh.id="rescan-sheet"; sh.hidden=true;
    sh.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="rescan-title" aria-describedby="rescan-desc">'
      +'<h3 id="rescan-title">Re-scan the last 30 days?</h3>'
      +'<div class="sub" id="rescan-desc">Every email offer you haven’t acted on is cleared and judged again with the current rules. Offers you marked Used, Skip or Bad — and anything you deleted — stay as they are. The re-scan is quiet: no pushes for old emails.</div>'
      +'<div class="sub" id="rescan-msg" role="status" aria-live="polite"></div>'
      +'<div class="actions"><button class="btn" type="button" id="rescan-cancel">Cancel</button><button class="btn primary" type="button" id="rescan-confirm">Re-scan</button></div></div>';
    document.body.appendChild(sh);
    sh.addEventListener("click", function(ev){ if(ev.target===sh) closeRescanSheet(); });
    sh.addEventListener("keydown", function(ev){
      if(ev.key==="Escape"){ ev.preventDefault(); closeRescanSheet(); return; }
      if(ev.key!=="Tab") return;
      var f=[].slice.call(sh.querySelectorAll("button")).filter(function(x){ return !x.hidden&&!x.disabled; }); var i=f.indexOf(document.activeElement);
      if(ev.shiftKey&&i<=0){ f[f.length-1].focus(); ev.preventDefault(); }
      else if(!ev.shiftKey&&i===f.length-1){ f[0].focus(); ev.preventDefault(); }
    });
    return sh;
  }
  function openRescanSheet(opener){ var sh=ensureRescanSheet(); rescanOpener=opener||null; el("rescan-msg").textContent=""; el("rescan-confirm").disabled=false; sh.hidden=false; el("rescan-cancel").focus(); }
  function closeRescanSheet(){ var sh=el("rescan-sheet"); if(sh) sh.hidden=true; var b=el("outlook-rescan")||rescanOpener; if(b&&b.isConnected&&!b.disabled) b.focus(); }
  function confirmRescan(){
    var btn=el("rescan-confirm"), msg=el("rescan-msg"); btn.disabled=true; msg.textContent="Queuing the re-scan…";
    callFn("outlook_rescan").then(function(res){
      var j=res.j||{};
      if(res.status===200&&j.ok){ setOutlookExtras({rescan_requested_at:new Date().toISOString()}); closeRescanSheet(); renderSources(); outlookMsg("Re-scan queued — the next scan clears and re-reads the last 30 days."); var b=el("outlook-connect"); if(b) b.focus(); return; }
      btn.disabled=false;
      if(res.status===429) msg.textContent="A re-scan just ran — try again in "+Math.max(1,Math.ceil((Number(j.retry_after_s)||600)/60))+" min.";
      else if(res.status===409) msg.textContent="Connect Outlook first.";
      else if(res.status===401) msg.textContent="Not authorized — unlock the page and try again.";
      else msg.textContent="Couldn’t queue the re-scan (error "+res.status+").";
    }).catch(function(){ btn.disabled=false; msg.textContent="Couldn’t reach the server — check your connection."; });
  }
  function closeBrandSheet(){ var sh=el("brand-sheet"); if(sh) sh.hidden=true; if(brandSheetOpener&&brandSheetOpener.isConnected) brandSheetOpener.focus(); }
  function saveBrandSheet(){
    var name=(el("brand-name").value||"").trim(); var msg=el("brand-sheet-msg");
    if(!name){ msg.textContent="Type a brand name first."; el("brand-name").focus(); return; }
    var mode=(el("brand-sheet").querySelector("[data-bsmode].on")||{getAttribute:function(){return "always";}}).getAttribute("data-bsmode");
    var key=compactBrand(name);
    var dup=(state.offerBrands||[]).filter(function(b){ return compactBrand(b.title)===key; })[0];
    if(dup){ dup.extras=Object.assign({},dup.extras||{},{mode:mode}); withSave(patchTask(dup.item_id,{extras:dup.extras,updated_at:new Date().toISOString()})); }
    else {
      var bslug=normBrand(name).replace(/ /g,"-")||("x"+Array.prototype.map.call(name,function(c){ return c.charCodeAt(0).toString(36); }).join("").slice(0,40));
      var row={page:PAGE,item_id:"ob-"+bslug,title:name.slice(0,80),status:"on",category:"offer-brand",position:999,extras:{mode:mode},updated_at:new Date().toISOString()};
      state.offerBrands=(state.offerBrands||[]).concat([row]);
      withSave(api("press_tasks?on_conflict=page,item_id",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(row)}));
    }
    var sh=el("brand-sheet"); if(sh) sh.hidden=true;
    renderBrandList(); syncSalesNav();
    showToast((mode==="never"?"Muted ":"Always counting ")+name);
    var ab=el("addbrandov"); if(ab) ab.focus();
  }
  function setBrandMode(id,mode){
    var b=find(state.offerBrands||[],id); if(!b) return; b.extras=Object.assign({},b.extras||{},{mode:mode}); renderBrandList();
    showToast((mode==="never"?"Muted ":"Always counting ")+b.title);
    withSave(patchTask(id,{extras:b.extras,updated_at:new Date().toISOString()}));
    var nb=document.querySelector('[data-brand="'+id+'"][data-bmode="'+mode+'"]'); if(nb) nb.focus();
  }
  function removeBrand(id){
    state.offerBrands=(state.offerBrands||[]).filter(function(b){ return b.item_id!==id; }); renderBrandList(); syncSalesNav();
    withSave(api("press_tasks?page=eq."+PAGE+"&item_id=eq."+encodeURIComponent(id),{method:"DELETE",headers:{Prefer:"return=minimal"}}));
    var ab=el("addbrandov"); if(ab) ab.focus();
  }
  function toggleWatchTerm(id,btn){
    var w=find(state.watch||[],id); if(!w) return; var on=w.status!=="on"; w.status=on?"on":"off"; setSwitch(btn,on);
    withSave(patchTask(id,{status:w.status,updated_at:new Date().toISOString()}));
    renderWatchList(); var nb=document.querySelector('[data-watchsw="'+id+'"]'); if(nb) nb.focus(); // the status / last-match line follows the switch
  }
  // ---------- delete a rule (Slice 3) ----------
  // "Delete rule…" swaps the ⋯ menu contents to an inline "Delete <Brand>? [Delete] [Cancel]" confirm.
  function showDeleteConfirm(id){
    var r=find(state.rules,id); if(!r) return;
    var m=el("ovfmenu-"+id); if(!m) return;
    m.innerHTML='<div class="ovfmenu-label">Delete '+esc(r.title)+'?</div>'
      +'<div class="ovf-confirm">'
      +'<button class="confirm-del" data-delok="'+esc(id)+'">Delete</button>'
      +'<button class="confirm-cancel" data-delcancel="'+esc(id)+'">Cancel</button>'
      +'</div>';
    var d=m.querySelector('[data-delok]'); if(d) d.focus();
  }
  // Cancel restores the normal menu (renderRulesList rebuilds the card) and returns focus to the ⋯.
  function cancelDeleteConfirm(id){
    renderRulesList();
    var btn=document.querySelector('.ovf[data-ovf="'+id+'"]'); if(btn) btn.focus();
  }
  // Hard DELETE of the press_tasks row (same pattern as removeWatch), then re-render + focus the next
  // card's ⋯ (or the Add-brand input when the list is now empty).
  function deleteRule(id){
    state.rules=state.rules.filter(function(r){ return r.item_id!==id; });
    renderRulesList();
    var next=document.querySelector('#rules-list .ovf'); if(next) next.focus(); else { var nb=el("newbrand"); if(nb) nb.focus(); }
    withSave(api("press_tasks?page=eq."+PAGE+"&item_id=eq."+encodeURIComponent(id),{method:"DELETE",headers:{Prefer:"return=minimal"}}));
  }
  // ---------- blocked stores (Slice 3) ----------
  function saveSettings(){ return withSave(patchTask("settings",{extras:state.settings,updated_at:new Date().toISOString()})); }
  function addBlock(px){
    var inp=el((px||"")+"newblock"); var name=normBrand(inp&&inp.value); if(!name) return; // normalized to match the judge
    var list=blocklist().slice();
    if(list.indexOf(name)<0) list.push(name);
    state.settings.retailer_blocklist=list;
    if(inp) inp.value=""; blockChanged(); saveSettings();
    var again=el((px||"")+"newblock"); if(again) again.focus();
  }
  function removeBlock(entry,opts){
    state.settings.retailer_blocklist=blocklist().filter(function(e){ return e!==entry; });
    blockChanged(); saveSettings();
    if(!(opts&&opts.quiet)) showToast("Unblocked "+entry,function(){ blockBrand(entry,{quiet:true}); });
  }
  // S2 (R12): ⋯ → "Block <brand>" — adds the normalized name (the judge's matcher), hides that brand's cards at once,
  // Undo restores. Already blocked → a no-op toast.
  function blockBrand(name,opts){
    var entry=normBrand(name); if(!entry) return;
    var list=blocklist().slice();
    if(list.indexOf(entry)>=0){ if(!(opts&&opts.quiet)) showToast(name+" is already blocked",null); return; }
    list.push(entry); state.settings.retailer_blocklist=list;
    blockChanged(); saveSettings();
    if(!(opts&&opts.quiet)) showToast("Blocked "+name+" — hidden from your feed",function(){ removeBlock(entry,{quiet:true}); });
  }
  function blockChanged(){ renderBlockList(); renderFeed(); renderFeedBadge(); syncSalesNav(); }
  // ---------- cash-like cards (arc cash-like-bonus-cards) ----------
  // The first edit writes the whole list (seed included) so the agent reads exactly what Mark sees; removing every store
  // stores [] (nothing cash-like), never "unset". The agent applies it on its next run.
  function addCash(){
    var inp=el("newcash"); var name=String(inp&&inp.value||"").replace(/\s+/g," ").trim().slice(0,60); if(!cashKey(name)) return;
    var list=cashLike().slice();
    if(list.some(function(e){ return cashKey(e)===cashKey(name); })){ showToast(name+" is already cash-like",null); if(inp) inp.value=""; return; }
    list.push(name); state.settings.cash_like_cards=list;
    if(inp) inp.value=""; renderCashList(); saveSettings();
    var again=el("newcash"); if(again) again.focus();
  }
  function removeCash(entry,opts){
    var before=cashLike().slice();
    state.settings.cash_like_cards=before.filter(function(e){ return e!==entry; });
    renderCashList(); saveSettings();
    var next=document.querySelector('#cashlist .fchip'); if(next) next.focus(); else { var nc=el("newcash"); if(nc) nc.focus(); }
    if(!(opts&&opts.quiet)) showToast(entry+" bonus cards now judged on the total",function(){ state.settings.cash_like_cards=before; renderCashList(); saveSettings(); });
  }
  // ---------- sale watch (Slice 6) ----------
  function addWatch(){
    var inp=el("newwatch"); var term=(inp&&inp.value||"").trim(); if(!term) return;
    if(watchTerms().length>=10) return; // cap so a tick can't fan out unboundedly
    var slug="watch-"+term.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
    // Inbox arc Slice 1: a term that differs only in spacing/hyphens/apostrophes is the same watch.
    var dup=watchTerms().some(function(w){ return compactBrand(w.title)===compactBrand(term); });
    if(dup||find(state.watch,slug)){ if(inp) inp.value=""; return; }
    // Inbox arc Slice 10: a new term goes to the BOTTOM of Mark's order (one past the last position).
    var maxPos=-1; watchTerms().forEach(function(w){ var p=watchPos(w); if(p!==Infinity&&p>maxPos) maxPos=p; });
    var row={page:PAGE,item_id:slug,title:term,status:"on",category:"watch",position:maxPos+1,extras:{min_pct:newWatchMin,note:""},created_at:new Date().toISOString(),updated_at:new Date().toISOString()};
    state.watch.push(row); if(inp) inp.value=""; newWatchMin=0; renderWatchList();
    setCyc(el("newwatchmin"),watchMinLabel(newWatchMin),"Minimum percent off for a new watch");
    withSave(api("press_tasks?on_conflict=page,item_id",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(row)}));
  }
  // A6: the per-watch minimum — Any → ≥5% … ≥50% → Any; writes extras.min_pct.
  function stepWatch(id,btn){
    var w=find(state.watch,id); if(!w) return; w.extras=w.extras||{};
    var v=nextIn(WATCH_CYCLE,Number(w.extras.min_pct)||0);
    w.extras.min_pct=v; setCyc(btn,watchMinLabel(v),"Minimum percent off for "+w.title);
    saveSoon(id,function(){ return withSave(patchTask(id,{extras:w.extras,updated_at:new Date().toISOString()})); });
  }
  // the add-row minimum for the NEXT watch (not yet persisted — applied on Watch).
  function stepNewWatch(btn){
    newWatchMin=nextIn(WATCH_CYCLE,Number(newWatchMin)||0);
    setCyc(btn,watchMinLabel(newWatchMin),"Minimum percent off for a new watch");
  }
  // Enhancements Slice 7 — click a watch's term to edit it inline. Enter or blur saves (press_tasks
  // title), Esc cancels; an empty term is never saved (the original stays).
  function editWatch(id){
    var w=find(state.watch,id); var btn=document.querySelector('[data-editwatch="'+id+'"]'); if(!w||!btn) return;
    var inp=document.createElement("input"); inp.type="text"; inp.className="wedit"; inp.value=w.title; inp.maxLength=80;
    inp.setAttribute("aria-label","Watch term"); var done=false;
    // polish Slice 5 (Eye): the inline edit says how to finish it.
    var hint=document.createElement("span"); hint.className="wedit-hint"; hint.id="wedit-hint-"+id; hint.textContent="Enter to save · Esc to cancel";
    inp.setAttribute("aria-describedby",hint.id);
    function finish(save){
      if(done) return; done=true;
      var v=(inp.value||"").trim();
      if(save&&v&&v!==w.title){ w.title=v; withSave(patchTask(id,{title:v,updated_at:new Date().toISOString()})); }
      else if(save&&!v){ sync("err","A watch term can’t be empty"); }
      renderWatchList();
      var nb=document.querySelector('[data-editwatch="'+id+'"]'); if(nb) nb.focus();
    }
    inp.addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); finish(true); } else if(e.key==="Escape"){ e.preventDefault(); finish(false); } });
    inp.addEventListener("blur",function(){ finish(true); });
    btn.replaceWith(inp); inp.insertAdjacentElement("afterend",hint); inp.focus(); inp.select();
  }
  function removeWatch(id){
    state.watch=watchTerms().filter(function(w){ return w.item_id!==id; });
    renderWatchList();
    withSave(api("press_tasks?page=eq."+PAGE+"&item_id=eq."+encodeURIComponent(id),{method:"DELETE",headers:{Prefer:"return=minimal"}}));
  }

  // ---------- Native Ledger S2 — navigation ----------
  // Four destinations (nav tabs) + the Rules segmented control. Old ids still route: "tab-sales" = the Sales & offers
  // segment, "tab-giftcards" = the Gift cards segment, "tab-rules" = the Rules destination (last segment remembered at
  // thrift:seg:rules). Opening the Feed is Mark "looking" — it clears the NEW count (Feed destination only).
  var DESTS=["feed","rules","sources","alerts"];
  var SEG_LS="thrift:seg:rules";
  function segPref(){ try{ return localStorage.getItem(SEG_LS)==="sales"?"sales":"giftcards"; }catch(e){ return "giftcards"; } }
  function selectSeg(seg,save){
    ["giftcards","sales"].forEach(function(n){ var t=el("tab-"+n), p=el("panel-"+n), on=n===seg;
      if(t){ t.setAttribute("aria-selected",String(on)); t.setAttribute("tabindex",on?"0":"-1"); } if(p) p.hidden=!on; });
    var tt=el("rules-title"); if(tt) tt.textContent=seg==="sales"?"Sales & offers":"Gift-card rules";
    if(save!==false){ try{ localStorage.setItem(SEG_LS,seg); }catch(e){} }
  }
  // opts.look = Mark tapped / keyed to the Feed himself. Only then is the feed "seen" — never on boot, a reload or a #hash
  // route (the cached rows are not even fresh then, and the stamp is a server row: D1 review 🔴).
  function selectTab(tabId,opts){
    var dest=tabId.replace(/^tab-/,"");
    if(dest==="sales"||dest==="giftcards"){ selectSeg(dest); dest="rules"; }
    else if(dest==="rules") selectSeg(segPref(),false);
    if(DESTS.indexOf(dest)<0) dest="feed";
    DESTS.forEach(function(name){
      var tab=el("tab-"+name), panel=el("panel-"+name), on=name===dest;
      tab.setAttribute("aria-selected",String(on)); tab.setAttribute("tabindex",on?"0":"-1"); panel.hidden=!on;
    });
    var h={feed:"#feed",rules:(segPref()==="sales"?"#sales":"#giftcards"),sources:"#sources",alerts:"#settings"}[dest];
    try{ if(location.hash!==h) history.replaceState(null,"",h); }catch(e){}
    if(dest==="feed"&&opts&&opts.look) markFeedSeen();
  }
  // deep links: #feed #rules #giftcards #sales #sources #settings (#alerts too)
  var HASH_TAB={feed:"tab-feed",rules:"tab-rules",giftcards:"tab-giftcards","gift-cards":"tab-giftcards",sales:"tab-sales",sources:"tab-sources",settings:"tab-alerts",alerts:"tab-alerts"};
  function routeHash(){ var k=String(location.hash||"").replace(/^#/,"").toLowerCase(); if(HASH_TAB[k]) selectTab(HASH_TAB[k]); }
  window.addEventListener("hashchange", routeHash);
  // keyboard: arrows move between the tabs of the nav (and of the segmented control)
  function tabKeys(order){ return function(ev){
    var i=order.indexOf(document.activeElement&&document.activeElement.id); if(i<0) return; var n=null;
    if(ev.key==="ArrowRight"||ev.key==="ArrowDown") n=order[(i+1)%order.length];
    else if(ev.key==="ArrowLeft"||ev.key==="ArrowUp") n=order[(i-1+order.length)%order.length];
    else if(ev.key==="Home") n=order[0]; else if(ev.key==="End") n=order[order.length-1];
    if(n){ ev.preventDefault(); el(n).focus(); selectTab(n,{look:true}); }
  }; }
  el("nav").addEventListener("keydown",tabKeys(["tab-feed","tab-rules","tab-sources","tab-alerts"]));
  document.querySelector(".segctl").addEventListener("keydown",tabKeys(["tab-giftcards","tab-sales"]));

  // ---------- boot (passkey-gated) ----------
  // The shared press passkey gate (inlined above) blocks the WHOLE app until the private-wing vault
  // session holds Card Scout's credentials. Card Scout's keyring entry is { sync_id, pass: SENTINEL }
  // — the wing seals an inert sentinel (see press index.html) so the shared gate's credsFor() is
  // satisfied. Mounted UNCONDITIONALLY (like fsa.html, NOT retirement's everEnrolled() conditional):
  // a fresh or locked browser sees only the gate and NEVER queries the DB. Do NOT edit gate.js.
  function boot(){
    loadLS();
    state.locked = !planId();
    renderAll();
    selectSeg(segPref(),false); routeHash();
    if(state.sources && state.sources.length){ sync(state.locked?"locked":"", state.locked?"Locked":"Cached"); }
    refresh();
  }
  function lockDown(){
    // D1 round 2: the session is already gone, so a pending save can no longer carry the sync_id — drop it and say so
    // (never a false "Saved").
    var lost=Object.keys(pendingSaves).length; Object.keys(pendingSaves).forEach(function(id){ clearTimeout(pendingSaves[id].t); delete pendingSaves[id]; });
    // Session lost (Lock now / TTL expiry): drop sensitive data from memory and the screen; the gate
    // re-mounts over the top. Deals are cleared; the page is back behind the passkey.
    state.deals = []; state.locked = true; stopOutlookPoll(); outlookFlow = null;
    renderAll();
    if(lost) sync("err","Not saved — locked");
  }
  if(window.PressGate && typeof PressGate.guard === "function"){
    // R2 (rename arc): "card-scout.html" is the vault KEYRING ID, not this file's name — kept so no re-enrollment.
    PressGate.guard({ page:"card-scout.html", onUnlock: boot, onLock: lockDown });
  } else {
    // The vendored gate is inlined first and its presence is fail-closed at release; if it is somehow
    // missing at runtime, fail SAFE — stay locked, never boot the app open.
    console.error("[card-scout] PressGate missing — refusing to boot unlocked.");
  }
  window.addEventListener("online", function(){ if(planId()) refresh(); });
})();
</script>
